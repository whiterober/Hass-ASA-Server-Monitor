// 读取 HA 前端 token（页面部署在 HA /local/ 同域时可用；HA 前端登录后存于 localStorage.hassTokens）
function lbHaToken(){
  try{
    var t = localStorage.getItem('hassTokens');
    if(!t) return null;
    var parsed = JSON.parse(t);
    // 兼容两种格式：数组 [{access_token}]（旧）与对象 {access_token}（新）
    if(Array.isArray(parsed) && parsed.length && parsed[0] && parsed[0].access_token) return parsed[0].access_token;
    if(parsed && parsed.access_token) return parsed.access_token;
    return null;
  }catch(e){ return null; }
}
// 手机 HA Companion App：通过官方 externalAuth bridge 获取 token（回调协议，非 Promise）
// V1: window.externalApp.getExternalAuth('{"callback":"externalAuthSetToken","force":false}') → 原生调 window.externalAuthSetToken(true, authJson)
// V2: window.externalAppV2.postMessage({type:'getExternalAuth', payload:{callback,force}}) → 同上回调
function lbAppToken(){
  return new Promise(function(resolve){
    try{
      var hasV1 = window.externalApp && typeof window.externalApp.getExternalAuth === 'function';
      var hasV2 = window.externalAppV2 && typeof window.externalAppV2.postMessage === 'function';
      if(!hasV1 && !hasV2) return resolve(null);
      // 安装回调：原生通过它返回 token（auth 可能是 JSON 字符串或对象）
      window.externalAuthSetToken = function(ok, auth){
        var t = null;
        if(ok && auth){
          if(typeof auth === 'string'){ try{ t = JSON.parse(auth); }catch(e){ t = null; } }
          else t = auth;
          resolve((t && t.access_token) || null);
        } else {
          resolve(null);
        }
        clearTimeout(lbAppToken._tm);
      };
      var cb = 'externalAuthSetToken';
      if(hasV2){
        window.externalAppV2.postMessage(JSON.stringify({ type:'getExternalAuth', payload:{ callback:cb, force:false } }));
      } else {
        window.externalApp.getExternalAuth(JSON.stringify({ callback:cb, force:false }));
      }
      // 超时兜底（原生无响应 → 继续 fallback）
      lbAppToken._tm = setTimeout(function(){ resolve(null); }, 6000);
    }catch(e){ resolve(null); }
  });
}
// 获取有效 HA token：手机 App 走 externalAuth bridge；浏览器读 localStorage（access_token 过期则用 refresh_token 换新并写回）
async function lbHaTokenRefresh(){
  try{
    var appTok = await lbAppToken();
    if(appTok) return appTok;
  }catch(e){}
  try{
    var raw = localStorage.getItem('hassTokens');
    if(!raw) return null;
    var t = JSON.parse(raw);
    if(Array.isArray(t)){ t = t[0] || null; }
    if(!t || !t.access_token) return null;
    // 未过期直接返回（提前 60s 刷新）
    if(!t.expires || Date.now() < (Number(t.expires) - 60000)) return t.access_token;
    if(!t.refresh_token) return null;
    var form = new URLSearchParams();
    form.set('grant_type', 'refresh_token');
    form.set('refresh_token', t.refresh_token);
    if(t.clientId) form.set('client_id', t.clientId);
    var res = await fetch('/auth/token', { method: 'POST', body: form });
    if(!res.ok) return null;
    var nt = await res.json();
    if(!nt.access_token) return null;
    t.access_token = nt.access_token;
    t.token_type = nt.token_type || 'Bearer';
    if(nt.refresh_token) t.refresh_token = nt.refresh_token;
    t.expires_in = nt.expires_in || 1800;
    t.expires = Date.now() + (nt.expires_in || 1800) * 1000;
    localStorage.setItem('hassTokens', JSON.stringify(t));
    return t.access_token;
  }catch(e){ return null; }
}

// 解析静态状态文件内容（AppDaemon 经 shell_command 写入的是 base64 编码 JSON；兼容纯 JSON）
function lbParseStatusFile(text){
  try{
    var s = String(text||'').trim();
    if(!s) return null;
    // 尝试直接 JSON
    try{ return JSON.parse(s); }catch(e){}
    // base64 解码后再 JSON
    try{
      var dec = decodeURIComponent(escape(atob(s)));
      return JSON.parse(dec);
    }catch(e2){}
    return null;
  }catch(e){ return null; }
}
// 免认证轮询 AppDaemon 写入的静态状态文件（手机 App 无 token 也能读）：精确判断 ok/cooldown/error
async function lbWaitStatusFile(abbr, oldTs){
  var deadline = Date.now() + 15000;
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, 800); });
    try{
      var sf = await fetch('/local/asa-data/refresh_status.json?cb=' + Date.now(), { cache: 'no-store' });
      if(sf.ok){
        var obj = lbParseStatusFile(await sf.text());
        if(!obj) continue;
        var attrs = obj.attributes || {};
        if(attrs.server === abbr && attrs.ts && attrs.ts !== oldTs){
          if(attrs.cooldown) return {cooldown:true, ok:false, ts:attrs.ts};
          if(attrs.ok) return {cooldown:false, ok:true, ts:attrs.ts};
          return {cooldown:false, ok:false, error: attrs.error || 'RCON failed', ts:attrs.ts};
        }
      }
    }catch(e){}
  }
  return {cooldown:false, ok:false, error:'timeout'};
}

    if(sf.ok){

      var attrs = (obj && obj.attributes) || {};
      if(attrs.server === abbr) return attrs.ts || null;
    }
  }catch(e){}
  return null;
}
// 触发：优先调 HA script.refresh_tamed（发事件）→ AppDaemon RCON；无 token（手机 App）走免认证 webhook
async function lbTrigger(abbr){
  var token = await lbHaTokenRefresh();
  if(!token){
    // 无 token（手机 App / 未登录浏览器）：走免认证 webhook → 事件 refresh_tamed_request → AppDaemon RCON
    try{
      // 触发前记录静态状态文件基线 ts（时效判断：只接受本次触发后的新结果）
      var baseTs = await lbGetStatusFile(abbr);
      var hw = await fetch('/api/webhook/refresh_tamed?server=' + encodeURIComponent(abbr), { method: 'POST' });
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      // 轮询免认证静态状态文件（AppDaemon 写入）：精确判断 ok/cooldown/error
      var st = await lbWaitStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 静态文件超时/无结果 → 仍按触发成功返回，交给 savedAt 兜底确认
      return {ok:true, server:abbr, webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  try{
    // 触发前记录 sensor 基线 ts（时效判断：只接受本次触发后的新结果）
    var baseTs = null;
    try{
      var b = await fetch('/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
      if(b.ok){
        var bj = await b.json();
        var ba = bj.attributes || {};
        if(ba.server === abbr) baseTs = ba.ts;
      }
    }catch(e){}
    var res = await fetch(LB.SVC_REFRESH, {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({server: abbr})
    });
    if(!res.ok) return {ok:false, server:abbr, error:'HTTP '+res.status};
    // 轮询 AppDaemon 写入的 RCON 结果（含 cooldown），最长 15s；只接受 ts 变化的本次结果
    var deadline = Date.now() + 15000;
    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 800); });
      var st;
      try{
        st = await fetch('/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
        if(st.ok){
          var obj = await st.json();
          var attrs = obj.attributes || {};
          if(attrs.server === abbr && attrs.ts !== baseTs){
            if(attrs.cooldown) return {ok:true, server:abbr, cooldown:true};
            if(attrs.ok) return {ok:true, server:abbr};
            return {ok:false, server:abbr, error: attrs.error || 'RCON failed'};
          }
        }
      }catch(e){}
    }
    // 超时未获取到本次状态 → 按成功让 savedAt 轮询确认兜底
    return {ok:true, server:abbr};
  }catch(e){
    return {ok:false, server:abbr, error:String(e)};
  }
}

  _bm[lbBreedStoreKey()] = LB.breedSel.slice();
  lbBreedSaveStore(_bm);
  lbRenderBreedBar();
}
function lbBreedToggle(){
  LB.breedResult = !LB.breedResult;
  lbRenderBreedBar();
  lbRenderBreedResult();
}
// 遗传属性点（完全复用现有 p 逻辑：statPoints 直接用；v6 缺失用 lbSolveStats 逆推，不做额外脑补）
function lbBreedPoint(r, i){
  var p = (r.statPoints && r.statPoints[i]) || 0;
  if(!p && r.cryoVersion===6){
    var sol = lbSolveStats(r);
    // v6 逆推：真实 statPoints 语义=遗传等级（阿紫验证），用 wildLevels 保持一致
    if(sol && sol.wildLevels) p = sol.wildLevels[i] || 0;
  }
  // 属性点包含变异（statMutations），显示与比较都用 遗传+变异
  var m = (r.statMutations && r.statMutations[i]) || 0;
  return (Number(p)||0) + (Number(m)||0);
}
// 该生物是否有属性点信息（可参与筛选）
function lbBreedable(r){
  var sum = function(a){ return a.reduce(function(x,y){ return x+(Number(y)||0); },0); };
  if(r.statPoints && sum(r.statPoints) > 0) return true;
  if(r.cryoVersion===6){
    var sol = lbSolveStats(r);
    return !!(sol && sol.statPoints && sum(sol.statPoints) > 0);
  }
  return false;
}
// 归属判断（与列表玩家过滤一致）：玩家携带按 playerName 精确匹配；cryo/tamed放出按 ownerTribeId 部落匹配
function lbIsMyRec(r, playerSet, player){
  if(!playerSet) return false;
  if(r.containerType==='player'){ return player ? String(r.playerName||'') === String(player) : false; }
  var tid = String(r.ownerTribeId||0);
  return !!playerSet[r.server+':'+tid];
}
// 外部生物归属名：玩家身上带的显示持有玩家名，其他显示部落名；containerTribe 无信息时 fallback 原部落 tribeId
function lbOwnerName(r){
  var data = LB._cache && LB._cache.data;
  var tb = (data && data.tribesByServer && data.tribesByServer[r.server]) || {};
  function tribeLabel(ts){
    if(!ts) return null;
    if(ts.name) return ts.name;
    if(ts.ownerName) return ts.ownerName;
    if(ts.members && ts.members.length) return ts.members[0];
    return null;
  }
  var ts = tb[r.containerTribe] || null;
  if(r.containerType==='player'){ // 在某玩家身上：优先精确玩家名 playerName（插件新字段）；fallback ownerName → members[0]，不显示部落名
    if(r.playerName) return r.playerName;
    if(ts){
      if(ts.ownerName) return ts.ownerName;
      if(ts.members && ts.members.length) return ts.members[0];
    }
    return '玩家#'+(r.containerTribe||'?');
  }
  var nm = tribeLabel(ts);
  if(nm) return nm;
  // containerTribe 无信息（如野放 containerTribe=0）：fallback 原部落 tribeId
  var tid = String(r.tribeId||0);
  if(tid && tid!=='0'){
    var nm2 = tribeLabel(tb[tid]);
    if(nm2) return nm2;
    // 无归属占位（tribeId=2000000000 特殊值，放生后部落已删除）→ 待认养
    if(r.containerType==='released' && r.tribeId===2000000000) return '待认养';
    if(r.containerType==='released') return '放出';
    return '部落#'+tid;
  }
  if(r.containerType==='released') return '放出';
  return '未知';
}
function lbRenderBreedResult(){
  var c = document.getElementById('lbBreedResult');
  if(!c) return;
  if(!LB.breedResult || !LB.curClass){ c.style.display='none'; c.innerHTML=''; return; }
  var data = LB._cache && LB._cache.data;
  var recs = (data && data.recs) || [];
  var cls = LB.curClass;
  var player = lbPlayer();
  var playerSet = player ? lbPlayerTribes(data.tribesByServer, player) : null;
  var myM=[], myF=[], extM=[], extF=[], v6fail=0, total=0;
  recs.forEach(function(r){
    if(r.dinoClass!==cls || r.isEmpty) return;
    total++;
    if(!lbBreedable(r)){ v6fail++; return; } // v6 无法逆推不计入
    var isMy = lbIsMyRec(r, playerSet, player);
    if(r.gender==='MALE'){ if(isMy) myM.push(r); else extM.push(r); }
    else if(r.gender==='FEMALE'){ if(isMy) myF.push(r); else extF.push(r); }
  });
  var myAll = myM.concat(myF);
  // 外部更高：每个选中属性取外部高于我的该属性最高值的最多 3 张（并列进榜都算，同一生物多属性进榜合并）
  function extChamps(arr){
    var out = [];
    LB.breedSel.forEach(function(k){
      var bi = LB_BREED_IDX[k];
      var myMax = null;
      myAll.forEach(function(r){ var v = lbBreedPoint(r, bi); if(myMax===null || v>myMax) myMax=v; });
      if(myMax===null) return;
      arr.map(function(r){ return {r:r, v:lbBreedPoint(r, bi)}; })
        .filter(function(x){ return x.v > myMax; })
        .sort(function(a,b){ return b.v-a.v; })
        .slice(0,3)
        .forEach(function(x){
          var ex = null;
          for(var i=0;i<out.length;i++){ if(out[i].r===x.r){ ex=out[i]; break; } }
          if(ex){ ex.attrs.push({k:k, v:x.v}); }
          else{ out.push({r:x.r, attrs:[{k:k, v:x.v}]}); }
        });
    });
    return out;
  }
  var extAll = extChamps(extM.concat(extF));
  LB._breedCands = []; // 候选 rec 索引映射（点击卡片弹浮窗用）
  // 我的分组：每个选中属性取该属性最高的生物；并列最高全部显示（同一生物多属性冠军合并显示）
  function myChamps(arr){
    var out = [];
    LB.breedSel.forEach(function(k){
      var bi = LB_BREED_IDX[k];
      var maxV = null;
      arr.forEach(function(r){
        var v = lbBreedPoint(r, bi);
        if(maxV===null || v>maxV) maxV = v;
      });
      if(maxV===null) return;
      arr.forEach(function(r){
        if(lbBreedPoint(r, bi) !== maxV) return;
        var ex = null;
        for(var i=0;i<out.length;i++){ if(out[i].r===r){ ex=out[i]; break; } }
        if(ex){ ex.attrs.push({k:k, v:maxV}); }
        else{ out.push({r:r, attrs:[{k:k, v:maxV}]}); }
      });
    });
    return out;
  }
  // 我的分组：公母混在一起，每个选中属性取该属性最高的生物（同一生物多属性冠军合并显示，有公有公、有母有母）
  var myAllChamp = myChamps(myAll);
  function card(it, tag, attrs){
    var r = it.r;
    var idx = LB._breedCands.length;
    LB._breedCands.push(r);
    var attrHtml;
    if(attrs){
      // 冠军属性：显示该生物代表属性的值（血最高显示血、攻最高显示攻）
      attrHtml = attrs.map(function(x){
        return '<span style="margin-right:6px;color:#a78bfa">'+LB_BREED_LABEL[x.k]+' <b style="color:#e0e0e0">'+x.v+'</b></span>';
      }).join('');
    } else {
      // 外部：只显示该卡数值最高的那个属性（并列全显示）
      var attrList = LB.breedSel.map(function(k){
        return {k:k, v:lbBreedPoint(r, LB_BREED_IDX[k])};
      }).sort(function(a,b){ return b.v-a.v; });
      var maxV = attrList.length ? attrList[0].v : null;
      attrHtml = attrList.filter(function(x){ return x.v===maxV; }).map(function(x){
        return '<span style="margin-right:6px;color:#a78bfa">'+LB_BREED_LABEL[x.k]+' <b style="color:#e0e0e0">'+x.v+'</b></span>';
      }).join('');
    }
    // 不显示种名（已是单物种筛选）
    return '<div class="lb-breed-card" onclick="lbBreedShowCard('+idx+')" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;padding:6px 10px;margin-bottom:6px;font-size:12px">'
      +'<div style="min-width:0">'
      +'<span style="color:'+(r.gender==='FEMALE'?'#f472b6':'#60a5fa')+'">'+(r.gender==='FEMALE'?'♀':'♂')+'</span> '
      +(r.name?'<b style="color:#fff">'+r.name+'</b> ':' ')
      +'<span style="background:#22223a;border-radius:2px;padding:0 6px;color:#ccc">Lv.'+r.level+'</span>'
      +'<br>'+attrHtml
      +'</div>'
      +'<div style="flex-shrink:0;font-size:11px;color:#999;text-align:right">'+tag+'</div>'
      +'</div>';
  }
  function myTag(r){ return lbContainerLabel(r); } // 我的不标「我的」，只标容器
  function extTag(r){
    if(r.containerType==='player'){ // 玩家身上携带：背包图标（mask 染橙）+ 玩家名（不显示地图）
      var burl = (LB_ICON_BY_NAME && LB_ICON_BY_NAME['HubInventoryIcon']) || '';
      var bag = burl
        ? '<span style="display:inline-block;width:12px;height:12px;background:#f59e0b;-webkit-mask-image:url(\''+burl+'\');mask-image:url(\''+burl+'\');-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;vertical-align:-1px;flex-shrink:0"></span>'
        : lbMdiSvg('mdi-bag-personal', 12);
      return '<span style="color:#f59e0b">'+bag+' '+lbOwnerName(r)+'</span>';
    }
    var mdi = LB_SERVER_MDI[r.server] || 'mdi-map';
    var name = lbOwnerName(r);
    // 部落名后标识部落长（ownerName）：如「基纽特战队 👑歌星星」；无部落/放生/部落#xxx 不加；皇冠+名字低可视
    var data = LB._cache && LB._cache.data;
    var tb = (data && data.tribesByServer && data.tribesByServer[r.server]) || {};
    var t = tb[r.containerTribe] || tb[r.tribeId] || null;
    var owner = (t && t.ownerName) ? t.ownerName : '';
    if(owner && owner !== name){ name += ' <span style="opacity:.55">'+lbMdiSvg('mdi-crown', 11)+' '+owner+'</span>'; }
    return '<span style="color:#f59e0b">'+lbMdiSvg(mdi, 12)+' '+name+'</span>';
  }
  var h = '';
  if(myAllChamp.length){
    var pn = lbPlayer() || '';
    h += '<div style="font-size:12px;color:#a78bfa;font-weight:600;margin-bottom:4px">'+(pn||'我的')+'</div>'
      + myAllChamp.map(function(it){ return card(it, myTag(it.r), it.attrs); }).join('');
  }
  if(extAll.length){
    h += '<div style="font-size:12px;color:#999;font-weight:600;margin:6px 0 4px">外部更高</div>'
      + extAll.map(function(it){ return card(it, extTag(it.r), it.attrs); }).join('');
  }
  if(v6fail>0){
    h += '<div style="margin-top:8px;padding:6px 10px;border-radius:6px;background:#2a1a1a;color:#f87171;font-size:11px">⚠️ '+v6fail+'/'+total+' 无法逆推 v6</div>';
  }
  if(!myAllChamp.length && !extAll.length){
    h = '<div style="text-align:center;padding:20px;color:#555">没有匹配的生物</div>';
  }
  c.innerHTML = h;
  c.style.display = 'block';
}
// 点击繁育候选卡片：弹浮窗显示完整生物卡片（与速查卡片一致，只含卡片本体）
function lbBreedShowCard(idx){
  var r = (LB._breedCands && LB._breedCands[idx]) || null;
  if(!r) return;
  var ov = document.getElementById('lbBreedOverlay');
  var body = document.getElementById('lbBreedOverlayBody');
  if(!ov || !body) return;
  body.innerHTML = lbDinoHTML(r);
  ov.style.display = 'block';
}
// 浮窗：点卡片以外的任何区域自动关闭
function lbBreedOverlayClick(e){
  if(!e.target || !e.target.closest || !e.target.closest('.lb-card')){
    document.getElementById('lbBreedOverlay').style.display = 'none';
  }
}
lbRenderBreedBar();
</script>
<!-- 解析结果浮窗 -->
<div id="previewOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7)" onclick="if(event.target===this)closePreviewOverlay()">
  <div id="previewPopup" style="position:absolute;inset:16px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0">
      <h2 style="font-size:14px;color:#999;margin:0">📋 解析结果 <span id="parseStatus"></span> <span id="solverTag" style="font-size:11px;color:#7c3aed"></span></h2>
      <svg onclick="closePreviewOverlay()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="cursor:pointer;flex-shrink:0"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <div id="previewPopupContent" style="flex:1;overflow-y:auto;padding:12px 16px 16px;font-size:13px"></div>
  </div>
</div>
<!-- 繁育栏：选中具体物种时显示（底部固定单行；6 属性顺序选种） -->
<div id="lbBreedBar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#16161f;border-top:1px solid #2a2a3a;padding:6px 10px;z-index:998">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="color:#7c3aed;font-size:13px;flex-shrink:0" title="繁育目标">🧬</span>
    <div id="lbBreedAttrs" style="display:flex;gap:4px;flex-shrink:0"></div>
    <span style="flex:1"></span>
    <button id="lbBreedBtn" onclick="lbBreedToggle()" style="flex-shrink:0;background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">选种</button>
  </div>
</div>
<!-- 繁育结果浮层（繁育栏上方） -->
<div id="lbBreedResult" style="display:none;position:fixed;bottom:40px;left:0;right:0;max-height:60vh;overflow-y:auto;background:#16161f;border-top:1px solid #2a2a3a;z-index:997;padding:8px 12px"></div>
<!-- 繁育候选详情浮窗（点击繁育卡片弹出，只显示完整生物卡片本体；点卡片外自动关闭） -->
<div id="lbBreedOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.7);overflow-y:auto;padding:80px 20px 20px" onclick="lbBreedOverlayClick(event)">
  <div id="lbBreedOverlayBody" style="max-width:520px;margin:0 auto"></div>
</div>
</body>
