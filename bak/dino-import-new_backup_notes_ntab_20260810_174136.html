<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikily 生物导入</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<style>
:root{
  --bg:#0f0f13;
  --card:#1a1a24;
  --text:#e0e0e0;
  --accent:#7c3aed;
  --border:#2a2a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f13;color:#e0e0e0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 0}
.header{text-align:center;margin-bottom:16px;flex-shrink:0}
.header h1{font-size:20px;color:#7c3aed;margin-bottom:4px}
.header p{font-size:12px;color:#666}
.card{background:#1a1a24;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #2a2a3a}
.card h2{font-size:14px;color:#999;margin-bottom:10px}
#mainUI{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;gap:12px}
#leftCol,#rightCol{display:flex;flex-direction:column;min-height:0}
#leftCol{flex:1}
#fileCard{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;margin-bottom:0}
#rightCol{flex-shrink:0}
@media (min-width:768px){
  #mainUI{flex-direction:row}
  #leftCol{flex:1;min-width:0;padding-bottom:16px}
  #rightCol{flex:1;overflow-y:auto;min-width:0}
  #rightCol .card:last-of-type{margin-bottom:0}
  #rightPlaceholder{display:flex}
}
@media (max-width:767px){
  body{padding-bottom:4px}
}
.file-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#333 transparent}
.file-list::-webkit-scrollbar{width:5px}
.file-list::-webkit-scrollbar-track{background:transparent}
.file-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.file-list::-webkit-scrollbar-thumb:hover{background:#555}
html{scrollbar-width:thin;scrollbar-color:#333 transparent}
html::-webkit-scrollbar{width:5px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
html::-webkit-scrollbar-thumb:hover{background:#555}
@media (pointer:coarse){html::-webkit-scrollbar,.file-list::-webkit-scrollbar{width:0}}
.parse-btn{display:none;width:22px;height:22px;border-radius:6px;flex-shrink:0;cursor:pointer;align-items:center;justify-content:center;margin-left:auto}
.parse-btn.ok{display:inline-flex;background:#1a3a1a;border:1px solid #2a5a2a}
.parse-btn.err{display:inline-flex;background:#3a1a1a;border:1px solid #5a2a2a}
.file-item.selected .parse-btn.ok,.file-item.selected .parse-btn.err{background:transparent;border-color:#fff4}
#previewPopup .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}
#previewPopup .row:last-child{border:none}
#previewPopup .label{color:#888}
#previewPopup .value{color:#e0e0e0;font-weight:500}
.file-group[open] > summary{border:1px solid #7c3aed}
.file-item{display:flex;flex-direction:column;cursor:pointer;border-radius:8px;padding:8px 10px;margin:3px 0;background:#22223a;transition:all .15s}
.file-item .fi-top{display:flex;align-items:center;font-size:13px}
.file-item:hover{background:#2d2d50}
.file-item.selected{background:#7c3aed;color:white}
.file-item.selected .fi-species,.file-item.selected .fi-name,.file-item.selected .fi-level,.file-item.selected .fi-size,.file-item.selected .file-name{color:#fff!important}
.file-item.selected .fi-sex{color:#fff!important}
.file-item.selected .fi-stage{background:#fff3!important;color:#fff!important;border-color:#fff6!important}
.file-item .icon{font-size:16px;margin-right:8px;flex-shrink:0}
.file-name{flex:1;font-size:12px;word-break:break-all;min-width:0}
.file-info{font-size:10px;color:#777;margin-top:2px}
.fi-species{color:#a78bfa;font-weight:600;margin-right:6px}
.fi-name{color:#ccc;margin-right:6px}
.fi-level{color:#ccc;margin-right:6px}
.fi-date{color:#666;margin-left:auto}
.fi-size{color:#888;margin-left:4px}
.fi-sep{color:#333;font-size:inherit}
.input-row{margin:6px 0}
.input-row input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#e0e0e0;font-size:13px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.btn-primary{background:#7c3aed;color:white;margin:12px 0 16px;flex-shrink:0}
@media (min-width:768px){.btn-primary{margin-top:auto}}
.btn-primary:hover{background:#6d28d9}
.btn-primary:disabled{background:#444;cursor:not-allowed}
.status{padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px}
.status.info{background:#1a1a3a;color:#7c3aed}
.status.success{background:#1a3a1a;color:#4ade80}
.status.error{background:#3a1a1a;color:#f87171}
.hint{font-size:11px;color:#666;margin-top:4px}
.cand-row{display:flex;align-items:center;padding:6px 8px;margin:2px 0;border-radius:6px;cursor:pointer;background:#1a1a2e;font-size:11px;gap:4px}
.cand-row:hover{background:#2a2a4e}
.cand-row.selected{background:#7c3aed;color:white}
.cand-row .cand-num{width:20px;text-align:center;color:#666;font-weight:600}
.cand-row.selected .cand-num{color:#ccc}
.cand-row .cand-stat{text-align:center;min-width:20px}
.cand-row .cand-stat .cw{color:#a78bfa;font-weight:600}
.cand-row .cand-stat .cm{font-weight:600;text-shadow:0 0 6px #f59e0b,0 0 12px #f59e0b40}
.cand-row.selected .cand-stat .cw{color:#fff}
.cand-row.selected .cand-stat .cm{text-shadow:0 0 6px #fbbf24,0 0 12px #fbbf2440}
.cand-row .cand-stat .cd{color:#666;font-size:10px}
.cand-row.selected .cand-stat .cd{color:#ccc}
.cand-row .cand-score{color:#555;font-size:10px;text-align:right;min-width:20px}
.cand-row.selected .cand-score{color:#ccc}
.cand-row.selected .cand-info{color:#ccc!important}
.mut-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;background:#1a1a2e;border:1px solid #2a2a3a;cursor:pointer;font-size:11px;color:#888;transition:all .15s;user-select:none}
.mut-chip:hover{background:#2a2a4e;color:#ccc}
.mut-chip.has-val{color:#a78bfa;border-color:#7c3aed33;background:#1a1a2e}
.mut-chip.editing{flex:1 0 100%;gap:8px;padding:8px 12px;background:#111;border:1px solid #7c3aed;color:#e0e0e0;cursor:default}
.mut-chip.editing input{flex:1;background:none;border:none;color:#e0e0e0;font-size:14px;outline:none;text-align:right;min-width:0}
.mut-chip.editing input::-webkit-outer-spin-button,.mut-chip.editing input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
</style>
</head>
<body>

<!-- Tab 导航 -->
<div class="tabbar">
  <div class="tab" id="tabBtn-import" onclick="switchTab('import')"><i class="mdi mdi-file-import"></i> 生物导入</div>
  <div class="tab active" id="tabBtn-latest" onclick="switchTab('latest')"><i class="mdi mdi-dna"></i> 生物速查</div>
  <div class="tab" id="tabBtn-settings" onclick="switchTab('settings')"><i class="mdi mdi-cog"></i> 设置</div>
</div>
<!-- 登录引导条（无 token 无法自动识别账号时显示） -->
<div id="lbLoginBar" style="display:none;margin-bottom:10px;padding:8px 12px;border-radius:8px;background:#1a1a24;border:1px solid #7c3aed55;color:#ccc;font-size:12px;align-items:center;flex-wrap:wrap"></div>
<style>
.tabbar{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
.tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;background:#1a1a24;border:1px solid #2a2a3a;color:#999;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;user-select:none}
.tab:hover{background:#22223a;color:#ccc}
.tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tab .mdi{font-size:16px;vertical-align:-2px;margin-right:4px}
.lb-tab{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #333;background:#1a1a24;color:#999;cursor:pointer;user-select:none;transition:all .15s}
.lb-tab:hover{background:#22223a;color:#ccc}
.lb-tab-on{background:#7c3aed22;border-color:#7c3aed;color:#a78bfa;font-weight:600}
/* 服务器 TAB（ASA 后台 server-tab 同款：纯图标 + active 紫高亮 + 数量角标；与选物种按钮统一高度 28px） */
.server-tab{padding:4px 8px;border-radius:6px;border:1px solid #333;cursor:pointer;font-size:14px;background:#1a1a24;color:#ccc;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;position:relative;height:28px}
.server-tab:hover{background:#22223a;color:#fff}
.server-tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.server-tab .mdi{font-size:15px;line-height:1}
.server-tab-cnt{position:absolute;top:-5px;right:-5px;background:#7c3aed;color:#fff;font-size:9px;border-radius:8px;padding:0 3px;line-height:13px;min-width:13px;text-align:center;font-style:normal;pointer-events:none}
.server-tab.active .server-tab-cnt{background:#fff;color:#7c3aed}
/* 物种选择按钮（更像按钮：hover 紫色高亮 + 下拉箭头） */
.lb-class-btn{display:inline-flex;align-items:center;gap:6px;background:#1a1a24;border:1px solid #333;border-radius:8px;color:#ccc;font-size:12px;padding:5px 24px 5px 12px;max-width:280px;min-width:120px;cursor:pointer;text-align:left;overflow:visible;transition:all .15s;user-select:none;position:relative;margin-right:12px;height:28px;flex-shrink:0}
.lb-class-btn:hover{background:#22223a;border-color:#7c3aed;color:#fff}
.lb-class-btn:active{transform:scale(.97)}
.lb-class-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#a78bfa}
.lb-class-ic{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:36px;height:36px;object-fit:contain;flex-shrink:0}
/* 生物卡片右侧高透物种图标（绝对定位，右缘超出被 overflow:hidden 裁切；filter 用 style 属性注入避免与定位样式冲突） */
.lb-card-ic{position:absolute;right:8px;top:10px;width:64px;height:64px;object-fit:contain;opacity:.14;pointer-events:none;z-index:0}
/* 生物卡片：PC 手型 + hover 紫色描边（可选中）；移动端禁选字 */
.lb-card{cursor:pointer}
.lb-card:hover{border-color:#7c3aed!important}
/* ID 小按钮：卡片右上角绝对定位，圆角描边低可视化，点击 toggle 显示 ID 浮窗（双端统一） */
.lb-id-btn{position:absolute;top:14px;right:8px;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:2px;border:1px solid #444;background:rgba(255,255,255,.05);color:#777;opacity:.6;cursor:pointer;z-index:2;flex-shrink:0;line-height:1;padding:0}
.lb-id-btn:hover{opacity:1;color:#a78bfa;border-color:#7c3aed}
.lb-id-btn.lb-active{opacity:1;color:#a78bfa;border-color:#7c3aed;background:rgba(124,58,237,.15)}
.lb-id-btn .mdi{font-size:12px}
/* 繁育结果卡片：容器图标固定尺寸（防崩，不依赖 .acc summary img） */
.lb-breed-card .lb-sum-ic{width:16px;height:16px;vertical-align:-3px;margin-right:3px;border-radius:3px;object-fit:contain}
.acc{border-radius:8px;margin-bottom:6px;background:transparent;overflow:hidden}
.acc summary{padding:8px 12px;cursor:pointer;font-size:13px;color:#ccc;user-select:none;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.acc summary:hover{background:#1d1d29;color:#fff}
.acc[open] summary{color:#fff;margin-bottom:6px;border-radius:8px;background:#7c3aed}
.acc-cnt{color:#666;font-size:11px}
.acc[open] summary .acc-cnt{color:#fff}
.acc summary .mdi{font-size:14px;vertical-align:-2px}
.acc summary img{width:22px;height:22px;vertical-align:-5px;margin-right:4px;border-radius:4px}
/* 属性行横滑：隐藏滚动条（去移动端箭头残留），触摸仍可滑动 */
.lb-stats-row{scrollbar-width:none;-ms-overflow-style:none}
.lb-stats-row::-webkit-scrollbar{display:none}
.lb-empty-ic{width:16px;height:16px;vertical-align:-3px;margin-right:4px;border-radius:3px}
/* 移动端：筛选栏物种按钮独占一行，tabs 强制换到第二行并自动换行（行距 12px，不影响筛选栏整体下边距） */
@media (max-width:768px){
  .lb-filter-bar{ row-gap:12px !important; }
  .lb-filter-bar #lbTabs{ flex-basis:100% !important; }
  .lb-card{-webkit-user-select:none;user-select:none}
}
/* 物种选择浮窗（ASA 后台选图同款 dark 样式） */
.lb-picker-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center}
.lb-picker-panel{background:#1a1a24;border:1px solid #333;border-radius:8px;width:90%;max-width:640px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.lb-picker-header{display:flex;gap:8px;padding:10px 12px;align-items:center;flex-shrink:0;border-bottom:1px solid #2a2a3a}
.lb-picker-header input{flex:1;margin:0;background:#15151f;border:1px solid #333;border-radius:6px;color:#ccc;font-size:12px;padding:6px 10px}
.lb-picker-close{width:28px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid #333;border-radius:4px;background:#15151f;color:#999;cursor:pointer;flex-shrink:0;font-size:13px}
.lb-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;padding:12px;overflow-y:auto}
.lb-picker-item{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border:2px solid transparent;border-radius:6px;cursor:pointer;transition:border .15s;text-align:center}
.lb-picker-item:hover{border-color:#333;background:#15151f}
.lb-picker-item.selected{border-color:#7c3aed;background:rgba(124,58,237,.12)}
.lb-picker-ic{width:48px;height:48px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.lb-picker-ic img{width:48px;height:48px;object-fit:contain}
.lb-picker-ic-none{font-size:20px;color:#555}
.lb-picker-item span{display:block;text-align:center;line-height:1.25;word-break:break-all;overflow:hidden;max-width:100%}
.lb-picker-name{font-size:12px;color:#ccc}
.lb-picker-cnt{font-style:normal;font-size:10px;color:#888}
.lb-picker-en{font-size:9px;color:#777}
.lb-picker-item.selected .lb-picker-name{color:#fff}
.lb-picker-item.selected .lb-picker-en{color:#a78bfa}
.lb-picker-item.selected .lb-picker-cnt{color:#a78bfa}
</style>

<!-- 全原生认证：浏览器自动管理 HTTP Basic Auth -->
<div id="mainUI" style="display:none">
  <div id="leftCol">
    <div class="card" id="fileCard">
      <h2>📂 可用文件 <button onclick="refreshFiles()" style="float:right;background:none;border:none;color:#999;padding:2px 4px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button></h2>
      <div class="file-list" id="fileList"><div style="text-align:center;padding:20px;color:#555">加载中...</div></div>
    </div>
  </div>
  <div id="rightCol">
    <div id="rightPlaceholder" style="flex:1;display:none;align-items:center;justify-content:center;opacity:0.06">
      <svg width="96" height="96" viewBox="0 0 24 24" fill="currentColor" style="color:#fff"><path d="M13 2V3H12V9H11V10H9V11H8V12H7V13H5V12H4V11H3V9H2V15H3V16H4V17H5V18H6V22H8V21H7V20H8V19H9V18H10V19H11V22H13V21H12V17H13V16H14V15H15V12H16V13H17V11H15V9H20V8H17V7H22V3H21V2M14 3H15V4H14Z"/></svg>
    </div>
    <div id="statusArea"></div>
    <div class="card" id="teCard" style="display:none">
      <h2>⚙️ 驯服有效性 (TE)</h2>
      <div id="teInputs" style="display:flex;gap:8px;align-items:center">
        <div style="flex:1;display:flex;align-items:center;gap:6px;background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px">
          <span style="color:#666;font-size:12px">TE</span>
          <input type="number" id="teMin" placeholder="最小" min="0" max="100" step="0.1" value="95" style="flex:1;background:none;border:none;color:#e0e0e0;font-size:14px;outline:none;-moz-appearance:textfield;text-align:center">
          <span style="color:#555">%</span>
        </div>
        <span style="color:#666">~</span>
        <div style="flex:1;display:flex;align-items:center;gap:6px;background:#111;border:1px solid #333;border-radius:8px;padding:8px 12px">
          <span style="color:#666;font-size:12px">TE</span>
          <input type="number" id="teMax" placeholder="最大" min="0" max="100" step="0.1" value="100" style="flex:1;background:none;border:none;color:#e0e0e0;font-size:14px;outline:none;-moz-appearance:textfield;text-align:center">
          <span style="color:#555">%</span>
        </div>
      </div>
      <div class="hint">已驯服生物用 TE 上限反推（属性由最终 TE 决定）。</div>
    </div>
    <div class="card" id="mutCard" style="display:none">
      <h2 id="mutTitle">🧬 变异 (Mutations)</h2>
      <div id="mutGrid" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"></div>
      <div class="hint">点击属性输入变异点数，游戏中 TEK 望远镜可查看</div>
    </div>
    <div class="card" id="candCard" style="display:none">
      <h2>🎯 候选分配方案 <span id="candCount" style="font-size:11px;color:#999"></span>
        <span style="float:right;font-size:11px;border:1px solid #333;border-radius:4px;overflow:hidden">
          <span id="btTamed" onclick="setBioType('tamed')" style="cursor:pointer;padding:1px 6px;display:inline-block" title="训（驯服）"><img id="btTamedIc" src="" style="width:11px;height:11px;object-fit:contain;vertical-align:-1px"></span>
          <span id="btBred" onclick="setBioType('bred')" style="cursor:pointer;padding:1px 6px;display:inline-block" title="繁（繁育）"><img id="btBredIc" src="" style="width:11px;height:11px;object-fit:contain;vertical-align:-1px"></span>
        </span>
      </h2>
      <div id="candList"></div>
    </div>
  </div>
</div>

<!-- Tab② 最新生物 -->
<div id="latestUI" style="display:flex;flex:1;flex-direction:column;min-height:0;gap:12px;overflow:hidden">
  <div class="card" style="position:relative;margin-bottom:0">
    <button id="lbRefreshBtn2" onclick="lbConfirmRefresh()" title="刷新低温仓数据" style="position:absolute;top:10px;right:10px;background:none;border:none;color:#999;padding:2px 4px;border-radius:6px;cursor:pointer;font-size:12px;line-height:1;opacity:.65"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg></button>
    <div class="lb-filter-bar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      <button id="lbClassBtn" class="lb-class-btn" onclick="lbOpenSpeciesPicker()" title="选择物种"><span class="lb-class-label">全部物种</span></button>
      <div id="lbTabs" style="display:flex;flex-wrap:wrap;gap:6px;flex:1 0 auto;min-width:0"></div>
    </div>
  </div>
  <div id="lbStatus" style="display:none;padding:8px 12px;border-radius:8px;font-size:12px;background:#1a1a3a;color:#7c3aed"></div>
  <div id="lbList" style="flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#333 transparent"></div>
</div>

<div id="settingsUI" style="display:none;flex:1;flex-direction:column;min-height:0;gap:12px;overflow:hidden">
  <div class="card">
    <div style="text-align:center;color:#666;font-size:13px;padding:24px 0;line-height:1.8">
      ⚙️ 刷新功能已移至<b style="color:#a78bfa">生物速查页右上角刷新按钮</b><br>
      <span style="font-size:12px;color:#555">支持刷新低温仓数据（全部服务器）与刷新 tamed 放出生物（多选服务器）</span>
    </div>

function findSpeciesByClass(dinoClass){

  for (var key0 in ASB_DB._byBp) {

// 查中文名：蓝图代码 → 中文名（提取括号前部分），无映射返回 null

// 中文同义词（显示名查不到时映射到已知 ZH_MAP 条目；Rubble Bear 是 Dire Bear 变体 → 恐熊；Woolly Rhino → woolly rhinoceros 披毛犀）
var LB_ZH_SYNONYM = { 'Rubble Bear': 'dire bear', 'Woolly Rhino': 'woolly rhinoceros' };
// 深度中文查询：同义词→原样→括号剥离→key 变体（去空格/连字符/下划线）→次词剥离（覆盖 ZH_MAP key 格式差异）
function lbZhDeep(eng){
  if(!eng) return '';
  if(LB_ZH_SYNONYM[eng]){ var sv=zhName(LB_ZH_SYNONYM[eng]); if(sv) return sv; }
  var v=zhName(eng); if(v) return v;
  var noBr=eng.replace(/\s*\(.*\)$/,'');
  if(noBr!==eng){ v=zhName(noBr); if(v) return v; }
  var norm=eng.replace(/[_\s-]/g,'');
  if(norm!==eng){ v=zhName(norm); if(v) return v; }
  var normBr=noBr.replace(/[_\s-]/g,'');
  if(normBr!==noBr && normBr!==norm){ v=zhName(normBr); if(v) return v; }
  var parts=eng.split(/\s+/);
  if(parts.length>1){
    var drop=parts.slice(0,-1).join(' ');
    v=zhName(drop); if(v) return v;
    var dropN=drop.replace(/[_\s-]/g,'');
    if(dropN!==drop){ v=zhName(dropN); if(v) return v; }
  }
  return '';
}
// 图标特例表：eng → 图标名（规范化匹配/包含匹配无法命中时的精确指定）
var LB_ICON_SPECIAL = {

};
function lbSpLabel(dinoClass) {

// 物种显示名拆分 {zh, eng}（浮窗两行标题：第一行中文、第二行英文小字）
// 次级种名映射（括号内英文 → 中文四季）：Drakeling (Spring) → 精灵龙 (春)
var LB_SUB_SPECIES = { 'Spring':'春', 'Summer':'夏', 'Autumn':'秋', 'Winter':'冬' };
function lbSpName(dinoClass){
  var sp=findSpeciesByClass(dinoClass);
  var eng=(sp&&sp.name)?sp.name:dinoClass;
  // 带括号次级种名：基础名中文 + 括号四季中文（如 Drakeling (Spring) → 精灵龙 (春)）
  var brMatch=eng.match(/\((.+)\)$/);
  if(brMatch && LB_SUB_SPECIES[brMatch[1]]){
    var baseNm=lbZhDeep(eng.replace(/\s*\(.*\)$/,''))||'';
    if(baseNm) return { zh: baseNm+' ('+LB_SUB_SPECIES[brMatch[1]]+')', eng: eng };
  }
  var zh=zhName(dinoClass)||zhName(eng)||'';

  if(!zh){
    if(LB_SPECIAL_NAMES[dinoClass]){
      var t=LB_SPECIAL_NAMES[dinoClass];
      var m=t.match(/^(.+?)\s*\((.+)\)$/);
      if(m) return {zh:m[1], eng:m[2]};
      return {zh:t, eng:''};
    }
    var st=lbStripPrefix(eng);
    if(st.prefixes.length && st.prefixes.every(function(p){ return !LB_PREFIX_ZH[p]; })){
      // 剥离词（如 brute 空值）：中文/英文都用主词（不显示前缀）
      finalEng=st.base;
      zh=zhName(st.base)||'';
    } else {
      zh = lbZhWithPrefix(eng) || lbZhDeep(eng) || ''; // 带前缀变体：拆前缀拼接；再深度查询（key 变体/括号/次词/同义词）
    }

}
// ===== 带前缀变体中文兑底（独立 JSON dino_prefix_zh.json 维护前缀映射） =====
var LB_PREFIX_ZH = null;
function lbLoadPrefixZh(){
  if(LB_PREFIX_ZH) return Promise.resolve(LB_PREFIX_ZH);
  return authFetch('/local/asa-data/dino_prefix_zh.json?t='+Date.now(), {}).then(function(r){return r.json();}).then(function(d){
    LB_PREFIX_ZH = d || {};

}
// ===== 颜色库 dino_colors.json（颜色 ID → HEX，生物卡片顶部色带用；ark.wiki.gg 公开表） =====
var LB_COLORS = null;
function lbLoadColors(){
  if(LB_COLORS) return Promise.resolve(LB_COLORS);
  return authFetch('/local/asa-data/dino_colors.json?t='+Date.now(), {}).then(function(r){return r.json();}).then(function(d){
    LB_COLORS = d || {};
    return LB_COLORS;

// colors ID → HEX（ID 0 未设置/未知 → 灰色）
function lbColorHex(id){

  return (c && c.hex) ? c.hex : '#3a3a4a';
}
// 拆前缀：返回 {prefixes:[小写前缀], base:基础英文名}（支持 R-/X- 与多重前缀；空值前缀如 brute 也剥离）
function lbStripPrefix(eng){
  var prefixes=[];
  var base=eng||'';
  if(!base) return {prefixes:prefixes, base:''};
  var rm=base.match(/^(R-|X-)(.+)$/);
  if(rm && (rm[1].toLowerCase() in LB_PREFIX_ZH)){ prefixes.push(rm[1].toLowerCase()); base=rm[2]; }
  var words=base.split(/\s+/);
  var i=0;
  while(i<words.length && (words[i].toLowerCase() in LB_PREFIX_ZH)){
    prefixes.push(words[i].toLowerCase());
    i++;
  }
  base=words.slice(i).join(' ');
  return {prefixes:prefixes, base:base};
}
// 变体英文名拆前缀 → 基础名查 ZH_MAP 中文 + 前缀中文拼接（支持 R- 与多重前缀）
function lbZhWithPrefix(eng){
  if(!eng || !LB_PREFIX_ZH) return '';
  var st=lbStripPrefix(eng);
  if(!st.base) return '';
  var prefixZh=st.prefixes.map(function(p){ return LB_PREFIX_ZH[p]||''; }).join('');
  var baseZh=lbZhDeep(st.base)||''; // 基础名用深度查询（如 Dung Beetle → dungbeetle → 蜣螂）
  if(!baseZh) return '';
  return prefixZh+baseZh;
}

// === ASB 公式移植自 ARKStatsExtractor Stats.cs CalculateValue ===
var STAT_IDX = {health:0, stamina:1, torpidity:2, oxygen:3, food:4, water:5, temperature:6, weight:7, melee_damage_multiplier:8, speed_multiplier:9, fortitude:10, crafting:11};
var IMPRINT_MULT_DEFAULT = [0.2,0,0.2,0,0.2,0.2,0,0.2,0.2,0.2,0,0];

function statPrecision(idx) { return (idx===8||idx===9||idx===11)?3:1; }

function displayedAberration(val, decimals, isExport) {
  if (isExport || val*(decimals===3?100:1) > 1e6) return Math.max(0.001, val*1.192e-7*20);
  return 0.06 * (decimals===3?0.01:1);
}

// 从 fullStatsRaw 构建 _stats（SpeciesStat 数组），懒加载
function ensureSpeciesStats(sp) {
  if (sp._stats) return;
  sp._stats = [];
  var fsr = sp.fullStatsRaw;
  var imp = sp.StatImprintMultipliers || IMPRINT_MULT_DEFAULT;
  sp._imprintMult = imp;
  sp._tamedHP = sp.TamedBaseHealthMultiplier || 1;
  for (var i = 0; i < 12; i++) {
    if (!fsr[i]) { sp._stats[i] = null; continue; }
    sp._stats[i] = {
      BaseValue: fsr[i][0], IncPerWildLevel: fsr[i][1],
      IncPerTamedLevel: fsr[i][2]||0, AddWhenTamed: fsr[i][3]||0, MultAffinity: fsr[i][4]||0,
      IncPerMutatedLevel: fsr[i][1], IncreaseStatAsPercentage: true, ValueCap: Infinity
    };
  }

  // ASA 近战统一修正：ASE→ASA（Add×0.14, Mult×0.44, Id×0.17）
  var ss8 = sp._stats[8];
  if (ss8) {
    ss8.IncPerTamedLevel *= 0.17;
    if (ss8.AddWhenTamed >= 0) {
      if (ss8.AddWhenTamed === 0.5) ss8.AddWhenTamed = 0.07;
      else if (ss8.AddWhenTamed === 1) ss8.AddWhenTamed = 0.14;
      else if (ss8.AddWhenTamed > 0) ss8.AddWhenTamed *= 0.14;
    }
    if (ss8.MultAffinity === 0.2) ss8.MultAffinity = 0.088;
    else if (ss8.MultAffinity === 0.4) ss8.MultAffinity = 0.176;
    else if (ss8.MultAffinity === 0 && sp.blueprintPath && /Gigant_Character_BP/i.test(sp.blueprintPath)) ss8.MultAffinity = 0.4;
    else if (ss8.MultAffinity > 0) ss8.MultAffinity *= 0.44;
  }
}

// 正向公式：等级 → 属性值（C# CalculateValue 直译）
function calcStatValue(sp, statIdx, lvWild, lvMut, lvDom, dom, tamingEff, imprintBonus) {
  ensureSpeciesStats(sp);
  var ss = sp._stats[statIdx];
  if (!ss) return 0;
  if (lvWild < 0 && ss.IncPerWildLevel !== 0) return -1;
  var add=0, domMult=1, imprintM=1, tamedHP=1;
  if (dom) {
    add = ss.AddWhenTamed;
    var da = ss.MultAffinity;
    if (da >= 0) da *= (tamingEff||0);
    domMult = (tamingEff >= 0) ? (1 + da) : 1;
    if (imprintBonus > 0 && sp._imprintMult[statIdx] !== 0)
      imprintM = 1 + sp._imprintMult[statIdx] * imprintBonus;
    if (statIdx === 0) tamedHP = sp._tamedHP;
  } else { lvDom = 0; }
  var wildInc = lvWild*ss.IncPerWildLevel + lvMut*ss.IncPerMutatedLevel;
  var domInc = lvDom*ss.IncPerTamedLevel;
  var result = ss.IncreaseStatAsPercentage
    ? (ss.BaseValue*(1+wildInc)*tamedHP*imprintM + add) * domMult * (1+domInc)
    : ((ss.BaseValue+wildInc)*tamedHP*imprintM + add) * domMult + domInc;
  if (result <= 0) return 0;
  return Math.min(result, ss.ValueCap);
}

// 计算 wild/dom levels（5属性 DP，用 ASB 真公式）
function solveLevels(species, statsByName, TE_min, TE_max, origin, charLevel, imprint) {
  var fsr = species.fullStatsRaw;
  if (!fsr || fsr.length < 10) return null;
  ensureSpeciesStats(species);
  var dom = (origin === 'tamed' || origin === 'bred');
  // 留痕加成属性（按 ASB 默认）
  var impStats = {health:true, food:true, weight:true, melee_damage_multiplier:true};
  
  // totalW：驯服/繁殖用眩晕反推（眩晕 IncPerTamedLevel=0，只含野生等级）
  var totalW = 0, totalDom = 0;
  if (dom && fsr[2]) {
    // 反向去除驯服加成：torpidity = (B×(1+totalW×Iw) + Add) × domMult × imprintM
    var torpVal = statsByName.torpidity;
    var torpB = fsr[2][0], torpIw = fsr[2][1], torpAdd = fsr[2][3]||0, torpMult = fsr[2][4]||0;
    var torpDomMult = (torpMult >= 0) ? (1 + torpMult * TE_max) : 1;
    var torpImprintM = 1;
    if ((imprint||0) > 0 && IMPRINT_MULT_DEFAULT[2] !== 0)
      torpImprintM = 1 + IMPRINT_MULT_DEFAULT[2] * (imprint||0);
    var preBonus = (torpVal / torpDomMult - torpAdd) / torpImprintM;
    totalW = Math.round((preBonus / torpB - 1) / torpIw);
    if (charLevel && charLevel > 0) totalDom = Math.max(0, charLevel - 1 - totalW);
  } else if (charLevel && charLevel > 1) {
    totalW = charLevel - 1;
  }
  console.log('solveLevels: totalW=' + totalW + ' totalDom=' + totalDom + ' charLevel=' + charLevel + ' dom=' + dom);
  
  var dpKeys = ['health','stamina','oxygen','weight','melee_damage_multiplier'];
  var allOptions = [];
  var maxW = Math.max(40, Math.round(totalW / 4));
  
  for (var ki = 0; ki < dpKeys.length; ki++) {
    var k = dpKeys[ki];
    var idx = STAT_IDX[k];
    var displayed = statsByName[k];
    if (displayed == null || !fsr[idx]) {
      allOptions.push([{w:0,d:0,diff:0}]);
      continue;
    }
    // 近战：.ini 存 bonus%，需要 +100 变总百分比
    var isMelee = (k === 'melee_damage_multiplier');
    var multiplier = isMelee ? (displayed + 100) / 100 : displayed;
    var tol = isMelee ? Math.max((imprint||0)>0?0.03:0.005, multiplier*0.0005) : Math.max(1.0, displayed*0.0006);
    
    var opts = [];
    // 检查 TE 区间内是否有匹配：v(TE) 单调，取两端
    function teRangeMatch(w, d) {
      var vHi = calcStatValue(species, idx, w, 0, d, dom && d>=0, TE_max, imprint||0);
      if (!dom || TE_min >= TE_max) return Math.abs((isMelee?vHi:vHi) - multiplier) < tol;
      var vLo = calcStatValue(species, idx, w, 0, d, true, TE_min, imprint||0);
      var vMin = Math.min(vHi, vLo), vMax = Math.max(vHi, vLo);
      return multiplier >= vMin - tol && multiplier <= vMax + tol;
    }
    for (var w = 0; w <= maxW; w++) {
      if (teRangeMatch(w, 0)) {
        var v = calcStatValue(species, idx, w, 0, 0, dom, TE_max, imprint||0);
        var diff = Math.abs((isMelee?v:v) - multiplier);
        opts.push({w:w, d:0, diff:diff});
      }
    }
    if (dom) {
      for (var w = 0; w <= maxW; w++) {
        for (var d = 1; d <= 255; d++) {
          if (teRangeMatch(w, d)) {
            var v = calcStatValue(species, idx, w, 0, d, true, TE_max, imprint||0);
            var diff = Math.abs((isMelee?v:v) - multiplier);
            if (w===0 && d>0 && totalW>50) diff += 2.0;
            opts.push({w:w, d:d, diff:diff});
          }
        }
      }
    }
    if (opts.length === 0) opts.push({w:0, d:0, diff:0});
    opts.sort(function(a,b){ return b.w-a.w || a.diff-b.diff; });
    allOptions.push(opts);
    console.log('  stat '+k+': multiplier='+multiplier.toFixed(4)+' options='+opts.length+' top='+JSON.stringify(opts[0]));
  }
  
  // DP 约束
  var MAX_S = totalW;
  var dp = {};
  dp[0] = {wl:{},dl:{},diff:0};
  for (var si = 0; si < allOptions.length; si++) {
    var k = dpKeys[si];
    var opts = allOptions[si];
    var ndp = {};
    for (var sStr in dp) {
      var s = parseInt(sStr);
      var prev = dp[sStr];
      for (var oi = 0; oi < opts.length; oi++) {
        var opt = opts[oi];
        var ns = s + opt.w;
        if (ns > MAX_S) continue;
        var nd = prev.diff + opt.diff;
        var nk = String(ns);
        if (!(nk in ndp) || nd < ndp[nk].diff) {
          var nwl={};for(var kk in prev.wl)nwl[kk]=prev.wl[kk];
          var ndl={};for(var kk in prev.dl)ndl[kk]=prev.dl[kk];
          nwl[k]=opt.w; ndl[k]=opt.d;
          ndp[nk]={wl:nwl,dl:ndl,diff:nd};
        }
      }
    }
    dp = ndp;
  }
  
  // 收集候选
  var avgW = totalW / 6;
  var candidates = [];
  for (var sStr in dp) {
    var s = parseInt(sStr);
    var cur = dp[sStr];
    var cand = {wildLevels:{},domLevels:{},sumW:s,diff:cur.diff};
    for (var ki = 0; ki < dpKeys.length; ki++) {
      var k = dpKeys[ki];
      cand.wildLevels[k]=cur.wl[k]||0;
      cand.domLevels[k]=cur.dl[k]||0;
    }
    cand.wildLevels.food = Math.max(0, totalW - s);
    cand.domLevels.food = 0;
    var knownDom = 0;
    for (var ki = 0; ki < dpKeys.length; ki++) knownDom += (cur.dl[dpKeys[ki]]||0);
    if (totalDom > knownDom) cand.domLevels.food = totalDom - knownDom;
    cand.wildLevels.torpidity=0; cand.domLevels.torpidity=0;
    cand.wildLevels.speed_multiplier=0; cand.domLevels.speed_multiplier=0;
    var balance=0, domStats=0, totalDomCand=0;
    var ak = dpKeys.concat(['food']);
    for (var kj=0;kj<ak.length;kj++){
      balance += Math.abs((cand.wildLevels[ak[kj]]||0)-avgW);
      if ((cand.domLevels[ak[kj]]||0)>0) domStats++;
      totalDomCand += (cand.domLevels[ak[kj]]||0);
    }
    // 食物值校验：不匹配则丢弃候选
    if (statsByName.food != null && fsr[4]) {
      var fv = calcStatValue(species, 4, cand.wildLevels.food, 0, cand.domLevels.food, dom, TE_max, imprint||0);
      var ftol = Math.max(1.0, statsByName.food * 0.0006);
      if (Math.abs(fv - statsByName.food) > ftol) continue;
    }
    cand.score = balance*0.3 + totalDomCand*4 + domStats*16 + cand.diff;
    candidates.push(cand);
  }
  candidates.sort(function(a,b){return a.score-b.score;});
  var topCandidates = candidates.slice(0,10);
  var result = topCandidates[0] || {wildLevels:{},domLevels:{},sumW:0,diff:0};
  result.candidates = topCandidates;
  result._totalFromTorp = totalW;  // torpidity 反推的总等级（含驯服奖励）
  result._totalDom = totalDom;
  console.log('DP: top='+topCandidates.length+' bestScore='+(topCandidates[0]?topCandidates[0].score:'?'));
  return result;
}

// 所有 NAS 请求使用 credentials: 'include'

// 统一 fetch 包装：绕过 Chrome 对 URL 凭据的 fetch() 限制
// ① 解析 URL 内嵌凭据（user:pass@）→ 生成 Authorization: Basic 头
// ② 剥离 URL 中的凭据（Chrome 禁止 fetch/XHR 携带 URL 凭据，会剥离导致 401）
function authFetch(url, opts) {
  opts = opts || {};
  var m = url.match(/^([a-z]+:\/\/)([^@\/]+)@/i);
  if (m) {
    var b64;
    try { b64 = btoa(decodeURIComponent(m[2])); } catch (e2) { b64 = btoa(m[2]); }
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Basic ' + b64;
    url = m[1] + url.slice(m[0].length);
  }
  opts.credentials = 'include';
  return fetch(url, opts).catch(function(e) {
    // Chrome 禁止从含凭据的 URL 构造 fetch 请求 → 降级到 XHR
    if (e.message && e.message.indexOf('credentials') !== -1) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open(opts.method || 'GET', url, true);
        xhr.withCredentials = true;
        if (opts.headers) {
          for (var k in opts.headers) { if (opts.headers.hasOwnProperty(k)) xhr.setRequestHeader(k, opts.headers[k]); }
        }
        xhr.responseType = opts._responseType || '';
        xhr.onload = function() {
          resolve({ status: xhr.status, ok: xhr.status>=200 && xhr.status<300,
            text: function(){ return Promise.resolve(xhr.responseText); },
            json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); },
            _xhr: xhr });
        };
        xhr.onerror = function(){ reject(new Error('XHR failed')); };
        xhr.send(opts.body || null);
      });
    }
    throw e;
  });
}

async function refreshFiles() {
  var list = document.getElementById('fileList');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">加载中...</div>';
  try {
    var body = '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:getcontentlength/><D:getlastmodified/><D:resourcetype/></D:prop></D:propfind>';
    var res = await authFetch(DINO_DATA, { method: 'PROPFIND', headers: { 'Depth': '1' }, body: body });
    if (res.status === 401) { document.getElementById('fileList').innerHTML = '<div style="text-align:center;padding:20px;color:#f87171">🔐 认证失败<br><small>请取消并刷新页面重新登录</small></div>'; return; }
    if (res.status !== 207) throw new Error('WebDAV ' + res.status);
    var xml = await res.text();
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    var resp = doc.getElementsByTagNameNS('DAV:', 'response');
    var files = [];
    for (var i = 0; i < resp.length; i++) {
      var r = resp[i];
      var href = (r.getElementsByTagNameNS('DAV:', 'href')[0] || {}).textContent || '';
      var size = (r.getElementsByTagNameNS('DAV:', 'getcontentlength')[0] || {}).textContent;
      var date = (r.getElementsByTagNameNS('DAV:', 'getlastmodified')[0] || {}).textContent;
      var rt = r.getElementsByTagNameNS('DAV:', 'resourcetype')[0];
      var isCol = rt && rt.getElementsByTagNameNS('DAV:', 'collection').length > 0;
      var name = decodeURIComponent(href.split('/').filter(Boolean).pop() || '');
      if (!name || isCol || !name.toLowerCase().endsWith('.ini')) continue;
      files.push({ name: name, size: parseInt(size) || 0, date: date || '' });
    }
    if (files.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">😕 没有 .ini 文件</div>'; return; }
    // 解析日期并排序（按时间倒序）
    files.forEach(function(f) {
      f._ts = f.date ? new Date(f.date).getTime() : 0;
    });
    files.sort(function(a, b) { return b._ts - a._ts; });
    // 按时间间隔分组（>10 分钟切新组）
    var groups = [];
    var cur = null;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!cur || (cur._lastTs && cur._lastTs - f._ts > 600000)) {
        cur = { files: [], _lastTs: 0 };
        groups.push(cur);
      }
      cur.files.push(f);
      cur._lastTs = Math.max(cur._lastTs, f._ts);
    }
    // 渲染分组
    var html = '';
    // 存储分组数据供删除使用
    window._fileGroups = groups;
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var first = g.files[0], last = g.files[g.files.length-1];
      var fmt = function(ts) { var d=new Date(ts); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
      var timeLabel = fmt(first._ts) + ' ~ ' + fmt(last._ts);
      var isLatest = gi === 0;
      var delBtn = isLatest ? '' : ' <button onclick="event.stopPropagation();deleteGroup(' + gi + ')" style="float:right;background:none;border:none;color:#ef4444;padding:2px 4px;border-radius:4px;font-size:10px;cursor:pointer;line-height:1" title="删除本组全部文件"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg></button>';
      html += '<details class="file-group" id="fg-' + gi + '"' + (isLatest ? ' open' : '') + ' ontoggle="if(this.open)closeOtherGroups(' + gi + ')"' + '>'
        + '<summary style="cursor:pointer;padding:6px 10px;background:#1e1e32;border-radius:8px;margin:6px 0;font-size:12px;color:#999;list-style:disc">'
        + timeLabel + ' <span style="opacity:.5">|</span> ' + g.files.length + ' 个文件' + delBtn + '</summary>';
      for (var fi = 0; fi < g.files.length; fi++) {
        var f = g.files[fi];
        var shortDate = f.date ? f.date.replace(/ GMT.*/, '').replace(/^\w+, /, '') : '';
        html += '<div class="file-item" id="fi-' + encodeURIComponent(f.name) + '" onclick="selectFile(\'' + escapeHtml(f.name) + '\',' + f.size + ')">'

async function deleteGroup(gi) {
  var g = window._fileGroups && window._fileGroups[gi];
  if (!g || !g.files || g.files.length === 0) return;
  if (!confirm('确认删除 ' + g.files.length + ' 个文件？\n此操作不可撤销。')) return;
  var ok = 0, fail = 0;
  for (var i = 0; i < g.files.length; i++) {
    try {
      var res = await authFetch(DINO_DATA + g.files[i].name, { method: 'DELETE' });
      if (res.ok || res.status === 204) ok++; else fail++;
    } catch(e) { fail++; }
  }
  // 移除 DOM
  var el = document.getElementById('fg-' + gi);
  if (el) el.remove();
  // 清理选中状态
  if (selectedFile && g.files.some(function(f){return f.name===selectedFile;})) {
    selectedFile = null; parsedData = null;
    document.getElementById('previewCard').style.display = 'none';
    showRightPlaceholder(true);
  }
  showStatus('info', '🗑 已删除 ' + ok + ' 个文件' + (fail > 0 ? '，' + fail + ' 个失败' : ''));
  setTimeout(function(){ showStatus('', ''); }, 3000);
}

// 异步加载文件头部元数据（物种/名称/等级）
async function loadFileMeta(filename) {
  try {
    var res = await authFetch(DINO_DATA + filename, {});
    if (!res.ok) return;
    var text = await res.text();
    var lines = text.split(/\r?\n/);
    var species = '', dinoBp = '', dinoName = '', level = '', sex = '', babyAge = -1, section = '';
    for (var i = 0; i < lines.length && i < 30; i++) {
      var l = lines[i].trim();
      var sec = l.match(/^\[(.+)\]$/);
      if (sec) { section = sec[1]; continue; }
      var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
      if (!m) continue;
      var k = m[1].trim(), v = m[2].trim();
      if (section === 'Dino Data') {
        if (k === 'DinoClass') { dinoBp = v; species = v.split('/').pop().split('.')[0].split('_')[0]; }
        else if (k === 'DinoNameTag' && v) dinoName = v;
        else if (k === 'TamedName' && v) dinoName = v;
        else if (k === 'CharacterLevel') level = v;
        else if (k === 'bIsFemale') sex = (v === 'True') ? 'F' : 'M';
        else if (k === 'BabyAge') babyAge = parseFloat(v);
        if (species && dinoName && level) break;
      }
    }
    var el = document.getElementById('fi-' + encodeURIComponent(filename));
    if (el) {
      var sp = el.querySelector('.fi-species');
      var nm = el.querySelector('.fi-name');
      var lv = el.querySelector('.fi-level');
      var sx = el.querySelector('.fi-sex');
      var sg = el.querySelector('.fi-stage');
      if (sp) {
        await ZH_READY;
        // 用 ASB 真实物种名替代蓝图代号
        var engName = species;
        if (dinoBp) { var asbSp = findSpecies(dinoBp); if (asbSp && asbSp.name) engName = asbSp.name; }
        var zh = zhName(species) || zhName(engName);
        sp.textContent = zh ? zh + ' (' + engName + ')' : engName;
      }
      if (nm) nm.textContent = dinoName || '-';
      if (lv) lv.textContent = level ? 'Lv.' + level : '';
      if (sx) {
        sx.textContent = sex === 'F' ? '♀' : (sex === 'M' ? '♂' : '');
        sx.style.color = sex === 'F' ? '#f472b6' : '#60a5fa';
      }
      if (sg && babyAge >= 0) {
        var stage, sc;
        if (babyAge < 0.1) { stage = '婴儿'; sc = '#4ade80'; }
        else if (babyAge < 0.5) { stage = '幼崽'; sc = '#facc15'; }
        else if (babyAge < 1.0) { stage = '青年'; sc = '#fb923c'; }
        else { stage = ''; sc = ''; }
        if (stage) { sg.textContent = stage; sg.style.background = sc+'22'; sg.style.color = sc; sg.style.border = '1px solid '+sc+'44'; }
        else { sg.style.display = 'none'; }
      }
    }
  } catch(e) { /* skip */ }
}

function findColorId(r, g, b) {
  var best = 0, bestD = Infinity;
  for (var i = 0; i < ARK_COLORS.length; i++) {
    var c = ARK_COLORS[i];
    var dr = r - c[1], dg = g - c[2], db = b - c[3];
    var d = dr*dr + dg*dg + db*db;
    if (d < bestD) { bestD = d; best = c[0]; }
  }
  return best;
}

    setParseBtn(selectedFile, null); // 隐藏按钮
    selectedFile = null; parsedData = null;
    document.getElementById('teCard').style.display = 'none';
    document.getElementById('mutCard').style.display = 'none';
    document.getElementById('candCard').style.display = 'none';
    showRightPlaceholder(true);
    document.getElementById('statusArea').style.display = 'none';
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    closePreviewOverlay();
    return;
  }
  var items = document.querySelectorAll('.file-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
  // 隐藏上一个文件的按钮
  if (selectedFile) setParseBtn(selectedFile, null);
  var el = document.getElementById('fi-' + encodeURIComponent(name));
  if (el) el.classList.add('selected');
  selectedFile = name;
  
  // 显示加载态按钮
  setParseBtn(name, 'loading');
  showStatus('info', '');
  try {
    var res = await authFetch(DINO_DATA + name, {});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsedData = parseIni(await res.text(), name);
    showRightPlaceholder(false);
    var matched = parsedData.blueprint ? true : false;
    setParseBtn(name, matched ? 'ok' : 'err');
    // 自动判断训/繁
    var isBred = isBredDino(parsedData);
    setBioType(isBred ? 'bred' : 'tamed');
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    renderMutGrid();
    // 更新变异标题
    var totalMut = (parsedData.matMutations||0) + (parsedData.patMutations||0);
    var mutTitle = document.getElementById('mutTitle');
    if (mutTitle) {
      mutTitle.innerHTML = '🧬 变异 (Mutations)';
      if (totalMut > 0) mutTitle.innerHTML += ' <span style="font-size:11px;color:#888">母' + (parsedData.matMutations||0) + '/父' + (parsedData.patMutations||0) + '=Σ' + totalMut + '</span>';
    }
    // 重置 TE 输入框
    document.getElementById('teMin').value = isBred ? '100' : '95';
    document.getElementById('teMax').value = '100';
    showStatus('info', '');
    document.getElementById('statusArea').style.display = 'none';
    showCandidates(parsedData);
  } catch (e) {
    setParseBtn(name, 'err');
    document.getElementById('statusArea').style.display = '';
    showStatus('error', '❌ ' + e.message); parsedData = null; showRightPlaceholder(true); }
}

function parseIni(t, fn) {
  var r = { stats: [], _filename: fn, colors: [], ancestors: [] };
  var section = '';
  var statMap = {
    '生命值':'health', '耐力':'stamina', '氧气':'oxygen', '氧氣':'oxygen',
    '食物':'food', '负重':'weight', '重量':'weight',
    '近战伤害':'melee_damage_multiplier', '移动速度':'speed_multiplier',
    '眩暈':'torpidity', '眩晕':'torpidity',
    '水':'water', '溫度':'temperature', '温度':'temperature',
    '抗性':'fortitude', '制作技能':'crafting'
  };
  
  t.split(/\r?\n/).forEach(function(l) {
    l = l.trim();
    if (!l || l[0] === ';') return;
    
    var sec = l.match(/^\[(.+)\]$/);
    if (sec) { section = sec[1]; return; }
    
    var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
    if (!m) return;
    var k = m[1].trim(), v = m[2].trim();
    
    if (section === 'Dino Data') {
      if (k === 'DinoID1') r.dinoId1 = v;
      else if (k === 'DinoID2') r.dinoId2 = v;
      else if (k === 'DinoClass') { r.dinoClassFull = v; var parts = v.split('/').pop().split('.'); r.blueprint = parts.length > 1 ? parts[1] : parts[0]; }
      else if (k === 'DinoNameTag') r.nameTag = v;
      else if (k === 'CharacterLevel') r.level = parseInt(v) || 0;
      else if (k === 'bIsFemale') r.sex = (v === 'True') ? 'female' : 'male';
      else if (k === 'bNeutered') r.isNeutered = (v === 'True');
      else if (k === 'TamerString') r.tamer = v || null;
      else if (k === 'TamedName' && v) r.name = v;
      else if (k === 'ImprinterName' && v) r.imprinter = v;
      else if (k === 'RandomMutationsMale') r.patMutations = parseInt(v) || 0;
      else if (k === 'RandomMutationsFemale') r.matMutations = parseInt(v) || 0;
      else if (k === 'DinoImprintingQuality') r.imprint = parseFloat(v);
      else if (k === 'BabyAge') r.babyAge = parseFloat(v);
    }
    
    if (section === 'Max Character Status Values') {
      var mapped = statMap[k];
      if (mapped) {
        r.statsByName = r.statsByName || {};
        var val = parseFloat(v) || 0;
        if (mapped === 'melee_damage_multiplier') val = val * 100;
        r.statsByName[mapped] = val;
      }
    }
    
    if (section === 'Colorization') {
      var cm = k.match(/^ColorSet\[(\d+)\]$/);
      if (cm) {
        var cv = v.match(/R=([\d.]+).*?G=([\d.]+).*?B=([\d.]+).*?A=([\d.]+)/);
        if (cv) r.colors[parseInt(cm[1])] = { r:parseFloat(cv[1]), g:parseFloat(cv[2]), b:parseFloat(cv[3]), a:parseFloat(cv[4]) };
      }
    }
    
    if (section === 'Dino Ancestry') {
      if (k === 'DinoAncestorsCount') r.ancestorCount = parseInt(v) || 0;
      else if (k === 'DinoAncestorsMale') r.ancestorMale = parseInt(v) || 0;
    }
    
    if (section === 'DinoAncestors' || section === 'DinoAncestorsMale') {
      if (v) r.ancestors.push({ type: section, data: v });
    }
  });
  
  if (r.statsByName) {
    var sv = ['health','stamina','oxygen','food','weight','melee_damage_multiplier','speed_multiplier'];
    for (var i = 0; i < sv.length; i++) r.stats[i] = r.statsByName[sv[i]] || 0;
  }
  return r;
}

var selectedCandidate = null;

function showCandidates(d) {
  if (!ASB_DB || !d.dinoClassFull || !d.statsByName) { document.getElementById('candCard').style.display = 'none'; return; }
  var bp = d.dinoClassFull.replace(/_C$/,'');
  var sp = findSpecies(bp);
  if (!sp || !sp.fullStatsRaw) { document.getElementById('candCard').style.display = 'none'; return; }
  var ctype = d.imprinter ? 'bred' : (d.tamer ? 'tamed' : 'tamed');
  var teMin = 100, teMax = 100;
  if (ctype === 'tamed') {
    teMin = parseFloat(document.getElementById('teMin').value)||95;
    teMax = parseFloat(document.getElementById('teMax').value)||100;
  }
  var lvls = solveLevels(sp, d.statsByName, teMin/100, teMax/100, ctype, d.level, d.imprint);
  if (!lvls || !lvls.candidates) { document.getElementById('candCard').style.display = 'none'; return; }
  
  var cands = lvls.candidates;
  var totalFromTorp = lvls._totalFromTorp || 0;
  var isBred = _bioType === 'bred';
  // 按 TE 拆分：野 = total/(1+TE/2), 奖 = total-野, 加 = charLevel-1-total
  var teSplit = (teMax/100) / 2;
  var wildBase = Math.round(totalFromTorp / (1 + teSplit));
  var bonusBase = totalFromTorp - wildBase;
  var xpBase = Math.max(0, (d.level||1) - 1 - totalFromTorp);
  var keys = ['health','stamina','oxygen','food','weight','melee_damage_multiplier'];
  var abbr = ['血','耐','氧','食','重','攻'];
  var h = '<div class="cand-row" style="background:#111;color:#666;font-size:10px;cursor:default">';
  h += '<span class="cand-num">#</span>';
  for (var ki = 0; ki < keys.length; ki++) h += '<span class="cand-stat">' + abbr[ki] + '</span>';
  if (isBred) {
    h += '<span style="display:inline-flex;gap:4px;margin-left:auto"><span class="cand-score">Σ承</span><span class="cand-score">Σ加</span></span><span style="width:13px;margin-left:2px"></span></div>';
  } else {
    h += '<span style="display:inline-flex;gap:4px;margin-left:auto"><span class="cand-score">Σ野</span><span class="cand-score">Σ奖</span><span class="cand-score">Σ加</span></span><span style="width:13px;margin-left:2px"></span></div>';
  }
  for (var ci = 0; ci < cands.length; ci++) {
    var c = cands[ci];
    h += '<div class="cand-row" onclick="selectCandidate(' + ci + ')" id="candRow' + ci + '">';
    h += '<span class="cand-num">#' + (ci+1) + '</span>';
    for (var kj = 0; kj < keys.length; kj++) {
      var k = keys[kj];
      var mutCls = (_mutValues[k] > 0) ? 'cm' : 'cw';
      h += '<span class="cand-stat"><span class="' + mutCls + '">' + (c.wildLevels[k]||0) + '</span>';
      if (c.domLevels[k]) h += '<span class="cd">+' + c.domLevels[k] + '</span>';
      h += '</span>';
    }
    if (isBred) {
      h += '<span style="display:inline-flex;gap:4px;margin-left:auto">'
        + '<span class="cand-score">Σ' + (totalFromTorp+1) + '</span>'
        + '<span class="cand-score">Σ' + xpBase + '</span></span>'
        + '<span class="cand-info" onclick="event.stopPropagation();toggleLevelInfo(event,' + (d.level||0) + ',1,' + totalFromTorp + ',0,' + xpBase + ',true)" style="cursor:pointer;color:#666;line-height:0;margin-left:2px" title="等级构成"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg></span></div>';
    } else {
      h += '<span style="display:inline-flex;gap:4px;margin-left:auto">'
        + '<span class="cand-score">Σ' + (wildBase+1) + '</span>'
        + '<span class="cand-score">Σ' + bonusBase + '</span>'
        + '<span class="cand-score">Σ' + xpBase + '</span></span>'
        + '<span class="cand-info" onclick="event.stopPropagation();toggleLevelInfo(event,' + (d.level||0) + ',1,' + wildBase + ',' + bonusBase + ',' + xpBase + ',false)" style="cursor:pointer;color:#666;line-height:0;margin-left:2px" title="等级构成"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg></span></div>';
    }
  }
  document.getElementById('candList').innerHTML = h;
  document.getElementById('candCount').textContent = '(' + cands.length + '个)';
  document.getElementById('candCard').style.display = '';
  parsedData._candidates = cands;
  selectedCandidate = cands[0];
  selectCandidate(0);
}

  var h = '';

    h += '<span class="mut-chip editing">'
      + '<span style="font-size:11px;color:#888;flex-shrink:0">' + _mutLabels[_editingKey] + '</span>'

      + '<svg onclick="confirmMutEdit(\'' + _editingKey + '\')" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" style="cursor:pointer;flex-shrink:0"><path d="M5 13l4 4L19 7"/></svg>'
      + '<svg onclick="cancelMutEdit()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="3" style="cursor:pointer;flex-shrink:0"><path d="M18 6L6 18M6 6l12 12"/></svg>'
      + '</span>';

        + _mutLabels[k]

        + '</span>';
    }
  }
  grid.innerHTML = h;
  if (_editingKey) {
    var inp = document.getElementById('mutEditInp');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function startMutEdit(key) {
  _editingKey = key;
  renderMutGrid();
}

function confirmMutEdit(key) {
  var inp = document.getElementById('mutEditInp');
  if (inp) {
    var v = parseInt(inp.value) || 0;
    _mutValues[key] = Math.max(0, Math.min(255, v));

function renderPreviewContent(d) {
  var statLabels = {
    'health':'生命','stamina':'耐力','oxygen':'氧气','food':'食物','weight':'负重',
    'melee_damage_multiplier':'近战伤害','speed_multiplier':'移动速度','torpidity':'眩晕','water':'水',
    'temperature':'温度','fortitude':'抗性','crafting':'制作技能'
  };
  var h = '';
  var rows = [];
  rows.push(['文件', d._filename]);
  rows.push(['物种', d.blueprint||'?']);
  rows.push(['名称', d.name||d.nameTag||'-']);
  rows.push(['等级', d.level||'?']);
  rows.push(['性别', d.sex==='female'?'♀':'♂' + (d.isNeutered?' (已绝育)':'')]);
  if (d.imprinter) rows.push(['留痕人', d.imprinter]);
  if (typeof d.imprint === 'number') rows.push(['留痕度', (d.imprint*100).toFixed(1) + '%']);
  if (typeof d.babyAge === 'number') rows.push(['幼崽成长', (d.babyAge*100).toFixed(1) + '%']);
  if (d.tamer) rows.push(['驯服人', d.tamer]);
  rows.push(['突变(母/父)', (d.matMutations||0) + ' / ' + (d.patMutations||0)]);
  if (d.dinoId1 || d.dinoId2) rows.push(['Dino ID', (d.dinoId1||'?') + '/' + (d.dinoId2||'?')]);
  
  if (d.statsByName) {
    rows.push(['── 属性值 ──', '']);
    var order = ['health','stamina','torpidity','oxygen','food','water','temperature','weight','melee_damage_multiplier','speed_multiplier','fortitude','crafting'];
    for (var i = 0; i < order.length; i++) {
      var v = d.statsByName[order[i]];
      if (typeof v === 'number') rows.push([statLabels[order[i]]||order[i], v.toFixed(1)]);
    }
  }
  
  if (d.colors && d.colors.length > 0) {
    rows.push(['── 颜色区域 ──', '']);
    for (var i = 0; i < d.colors.length; i++) {
      if (d.colors[i]) {
        var c = d.colors[i];
        var cid = findColorId(c.r, c.g, c.b);
        rows.push(['Region ' + i, 'R:'+(c.r*255).toFixed(0)+' G:'+(c.g*255).toFixed(0)+' B:'+(c.b*255).toFixed(0)+' → ID:'+cid]);
      }
    }
  }
  
  if (d.ancestorCount > 0) {
    rows.push(['── 祖先 ──', '数量:' + d.ancestorCount + ' 雄性:' + (d.ancestorMale||0)]);
    for (var i = 0; i < d.ancestors.length; i++) {
      rows.push(['', d.ancestors[i].data]);
    }
  }
  
  for (var i = 0; i < rows.length; i++) {
    h += '<div class="row"><span class="label">' + escapeHtml(String(rows[i][0])) + '</span><span class="value">' + escapeHtml(String(rows[i][1])) + '</span></div>';
  }
  
  var isBred = isBredDino(d);
  setBioType(isBred ? 'bred' : 'tamed');
  
  var tag = document.getElementById('solverTag');
  if (ASB_DB && d.dinoClassFull) {
      var bp = d.dinoClassFull.replace(/_C$/,'');
      var sp = findSpecies(bp);
      tag.textContent = (sp && sp.name) ? ' [' + sp.name + ']' : ' [未匹配]';
  } else { tag.textContent = ''; }
  
  var matched = d.blueprint ? true : false;
  document.getElementById('parseStatus').innerHTML = matched
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" style="vertical-align:middle"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="3" style="vertical-align:middle"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  document.getElementById('previewPopupContent').innerHTML = h;
  
  // 刷新变异显示
  renderMutGrid();
  
  var totalMut = (parsedData.matMutations||0) + (parsedData.patMutations||0);
  var mutTitle = document.getElementById('mutTitle');
  if (mutTitle) {
    mutTitle.innerHTML = '🧬 变异 (Mutations)';
    if (totalMut > 0) mutTitle.innerHTML += ' <span style="font-size:11px;color:#888">母' + (parsedData.matMutations||0) + '/父' + (parsedData.patMutations||0) + '=Σ' + totalMut + '</span>';
  }
  document.getElementById('mutCard').style.display = isMutVisible(d) ? '' : 'none';
}

function showStatus(t, m) { document.getElementById('statusArea').innerHTML = '<div class="status ' + t + '">' + m + '</div>'; }
function formatSize(b) { return b < 1024 ? b + ' B' : (b/1024).toFixed(1) + ' KB'; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
// 判断是否繁育：留痕度>0 / 有祖先 / ImprinterName非空 / BabyAge是幼崽
function isBredDino(d) {
  if (!d) return false;
  if (typeof d.imprint === 'number' && d.imprint > 0) return true;
  if (d.ancestorCount > 0) return true;
  if (d.imprinter) return true;             // 留痕人非空 = 已留痕 = 繁育
  if (typeof d.babyAge === 'number' && d.babyAge > 0 && d.babyAge < 1) return true; // 幼崽只能来自繁育
  return false;
}
// 速查版训/繁判断（适配速查字段：imprintingQuality/ancestors/imprinter/babyAge）；实锤=繁，排除法判训=非实锤（标绿）
function lbIsBred(r){
  if(!r) return false;
  if(typeof r.imprintingQuality==='number' && r.imprintingQuality>0) return true;
  if(r.ancestors && r.ancestors.length>0) return true;
  if(r.imprinter) return true;
  if(typeof r.babyAge==='number' && r.babyAge>0 && r.babyAge<1) return true;
  return false;
}
// 变异模块可见：繁育 且 突变计数器>0（C=0 时无突变，隐藏）
function isMutVisible(d) {
  if (!isBredDino(d)) return false;
  return ((d.matMutations||0) + (d.patMutations||0)) > 0;
}

// 启动时异步获取当前登录 HA 账号的显示名（作为 player），存入 LB.autoPlayer；失败/未登录则留空
function lbInitPlayer(){
  return new Promise(function(resolve){
    try{
      lbHaTokenRefresh().then(function(token){
        if(!token){
          // 无 token（无法自动识别账号）：标记需要登录，显示登录引导
          LB._needLogin = true;
          resolve(); return;
        }
        var proto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
        var ws;
        try{ ws = new WebSocket(proto + location.host + '/api/websocket'); }
        catch(e){ LB._needLogin = true; resolve(); return; }
        var done = false;
        var tm = setTimeout(function(){ if(!done){ done = true; try{ ws.close(); }catch(e){} resolve(); } }, 6000);
        ws.onmessage = function(ev){
          try{
            var msg = JSON.parse(ev.data);
            if(msg.type === 'auth_required'){ ws.send(JSON.stringify({type:'auth', access_token: token})); }
            else if(msg.type === 'auth_ok'){ ws.send(JSON.stringify({id: 1, type: 'auth/current_user'})); }
            else if(msg.id === 1 && msg.result && msg.result.name){
              done = true; clearTimeout(tm);
              LB.autoPlayer = msg.result.name;
              try{ ws.close(); }catch(e){}
              resolve();
            }
          }catch(e){}
        };
        ws.onerror = function(){ if(!done){ done = true; clearTimeout(tm); try{ ws.close(); }catch(e){} resolve(); } };
        ws.onclose = function(){ if(!done){ done = true; clearTimeout(tm); resolve(); } };
      }).catch(function(){ LB._needLogin = true; resolve(); });
    }catch(e){ LB._needLogin = true; resolve(); }
  });
}

// 加载 + 归一化（cryo∪tamed，跨服去重：同一 dinoId 只保留一条，优先 sortWorldSec 大的）
async function lbLoad(servers){
  var recs=[], recMap={}, tribesByServer={}, worldNowByServer={};
  function lbAddRec(rec){
    // 空球无 dinoId，用 podId 作唯一 key；有生物用 dinoId1_dinoId2 跨服去重
    var key = rec.isEmpty ? ('empty_'+(rec.podId||rec.containerId||'empty')) : ((rec.dinoId1||'') + '_' + (rec.dinoId2||''));
    var old = recMap[key];
    if(!old || (rec.sortWorldSec||0) > (old.sortWorldSec||0)) recMap[key] = rec;
  }
  for(var i=0;i<servers.length;i++){
    var abbr=servers[i], s=LB.SERVERS.find(function(x){return x.abbr===abbr;}); if(!s) continue;
    var cryo=null, tamed=null;
    try{ cryo = await authFetch(DINO_JSON+abbr+'_cryo.json?cb='+Date.now(),{}).then(function(r){return r.json();}); }catch(e){ cryo=null; }
    try{ tamed = await authFetch(DINO_JSON+abbr+'_tamed.json?cb='+Date.now(),{}).then(function(r){return r.json();}); }catch(e){ tamed=null; }
    if(cryo){
      tribesByServer[abbr] = cryo.tribes||{};
      worldNowByServer[abbr] = cryo.worldSecondsNow||0;
      (cryo.cryopod||[]).forEach(function(p){
        var isEmpty = !p.dinoId1;
        // 空球容器类型推断（containerClass → containerType），便于归入对应容器
        var ct = p.containerType || '';
        if(isEmpty){
          var cc = p.containerClass || '';
          if(cc.indexOf('CryoFridge')>=0) ct = 'fridge';
          else if(cc.indexOf('PrimalInventory1')>=0) ct = 'player';
          else if(cc.indexOf('TekReplicator')>=0) ct = 'replicator';
          else ct = ct || 'other';
        }
        recs.push({ src:'cryo', server:abbr, isEmpty:isEmpty, podId:p.podInstanceId, dinoId1:p.dinoId1||'', dinoId2:p.dinoId2||'', dinoClass:p.dinoClass||'',
          name:p.name||'', level:p.level||0, gender:p.gender||'', babyAge:p.babyAge, isBaby:p.isBaby,
          tribeId:p.tribeId, statValues:p.statValues||[], statPoints:p.statPoints||[], statMutations:p.statMutations||[],
          imprintingQuality:p.imprintingQuality, randomMutationsMale:p.randomMutationsMale, randomMutationsFemale:p.randomMutationsFemale, ancestors:p.ancestors||[],
          colors:p.colors||'', saddle:p.saddle||'', cryoVersion:p.cryoVersion,
          sortWorldSec:p.packedAtWorldSec||0, srcWorld:'packed', absMs:p.downloadedAtMs||0,
          containerId:p.containerId, containerType:ct, containerName:p.containerName||'', containerClass:p.containerClass||'', containerTribe:p.containerTribe,
          ownerTribeId:p.containerTribe||0, playerName:p.playerName||'' });
        lbAddRec(recs[recs.length-1]);
      });
    }
    if(tamed){
      (tamed.dinos||[]).forEach(function(d){
        var ws = d.downloadedAtWorldSec || d.tamedAtWorldSec || 0;
        recs.push({ src:'tamed', server:abbr, dinoId1:d.dinoId1, dinoId2:d.dinoId2, dinoClass:d.dinoClass||'',
          name:d.name||'', level:d.level||0, gender:d.gender||'', babyAge:d.babyAge, isBaby:d.isBaby,
          tribeId:d.tribeId, statValues:d.statValues||[], statPoints:d.statPoints||[], statMutations:d.statMutations||[],
          imprintingQuality:d.imprintingQuality, randomMutationsMale:d.randomMutationsMale, randomMutationsFemale:d.randomMutationsFemale, ancestors:d.ancestors||[],
          colors:d.colors||'', saddle:d.saddle||'', cryoVersion:0,
          sortWorldSec:ws, srcWorld:(d.downloadedAtWorldSec?'downloaded':(d.tamedAtWorldSec?'tamed':'')), absMs:0,
          containerId:'', containerType:'released', containerName:'放出', containerClass:'', containerTribe:0,
          ownerTribeId:d.tribeId||0 });
        lbAddRec(recs[recs.length-1]);
      });
    }
  }
  recs = Object.values(recMap);
  return {recs:recs, tribesByServer:tribesByServer, worldNowByServer:worldNowByServer};
}

// 玩家所属部落集合（members 匹配，跨服）
function lbPlayerTribes(tribesByServer, player){
  var set={};
  Object.keys(tribesByServer).forEach(function(abbr){
    var tribes=tribesByServer[abbr]||{};
    Object.keys(tribes).forEach(function(tid){
      var t=tribes[tid];
      if(t && Array.isArray(t.members) && t.members.indexOf(player)>=0) set[abbr+':'+tid]=1;
    });
  });
  return set;
}
// 统一玩家过滤：玩家携带（身上背的）按 playerName 精确匹配当前玩家；容器/放出按部落 members 匹配
// 修复：同部落成员（如 Ali 和嘎巴丸同属基纽特战队）不再互相误认玩家携带数据
function lbIsPlayerRec(r, playerSet, player){
  if(!playerSet || !player) return true;
  if(r.containerType==='player'){ return String(r.playerName||'') === String(player); }
  return !!playerSet[r.server+':'+String(r.ownerTribeId||0)];
}

// 时间分组：0=最近30天 1=更早 2=时间未知
// 规则：球内按收纳时间(packedAtWorldSec)、放出按下载/驯养时间(downloadedAtWorldSec||tamedAtWorldSec)，均为世界秒
//  有 worldSecondsNow(wn) 且 sortWorldSec>0 → 世界秒差值 ≤ 30 游戏天
//  无 wn 但有 sortWorldSec>0 → fallback 墙钟 absMs ≤ 30 墙钟天
//  sortWorldSec=0（收纳/驯养时间未知）→ 未知组
function lbTimeGroup(rec, worldNowByServer){
  var wn = worldNowByServer[rec.server] || 0;
  if(rec.sortWorldSec>0 && wn>0){
    var diff = wn - rec.sortWorldSec;
    if(diff<0) return 2;                       // 回档/异常
    return diff<=LB.DAY30 ? 0 : 1;
  }
  if(rec.sortWorldSec>0 && rec.absMs >= LB.ASA_LAUNCH_MS){
    return (Date.now()-rec.absMs <= LB.DAY30*1000) ? 0 : 1;
  }
  return 2;  // 收纳/驯养时间未知
}

// 无属性值时复用生物导入算法（calcStatValue）计算最终属性值
function lbCalcStat(r, i){
  try{
    var sp = findSpeciesByClass(r.dinoClass);
    if(!sp) return null;
    var lvMut = (r.statMutations && r.statMutations[i]) || 0;
    var lvDom = (r.statPoints && r.statPoints[i]) || 0;
    var v = calcStatValue(sp, i, 0, lvMut, lvDom, true, 1, 0);
    if (!(v > 0)) return null;
    var d = statPrecision(i)===3 ? 1000 : 100;
    return Math.round(v * d) / d;
  }catch(e){ return null; }
}
// v6 旧球 statPoints 缺失 → 枚举逆推（复用 solveLevels，繁殖优先；返回 {statPoints, wildLevels, guessed:true} 或 null）
var LB_SOLVE_CACHE = {};
var LB_SOLVE_STORE_KEY = 'lbSolveCache_v1';
function lbSolveLoadStore(){ try{ return JSON.parse(localStorage.getItem(LB_SOLVE_STORE_KEY)||'{}'); }catch(e){ return {}; } }
function lbSolveSaveStore(store){ try{ localStorage.setItem(LB_SOLVE_STORE_KEY, JSON.stringify(store)); }catch(e){} }
function lbSolveStats(r){
  if(r._solved !== undefined) return r._solved;
  r._solved = null;
  var sv = r.statValues || [];

var LB_IDB_NAME = 'dinoImportDB', LB_IDB_STORE = 'lbCache';
function lbCacheOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    var req = indexedDB.open(LB_IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(LB_IDB_STORE)) db.createObjectStore(LB_IDB_STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function lbCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('latest');
      get.onsuccess = function(){ resolve(get.result || null); };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbCacheSet(data){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ data: data, ts: Date.now() }, 'latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
function lbCacheClear(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).delete('latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}

  var name = tzh || r.containerType; // JSON 无中文 → 回退英文类型名（不脑补）
  if(r.containerType!=='display' && r.containerType!=='stand' && r.containerType!=='released' && r.containerType!=='player'){
    var id = r.containerId || '';
    name += ' #' + (id.length>6 ? id.slice(-6) : id);
  }
  return '<span class="acc-title">'+icon+' '+name+'</span>';
}
function lbView(){
  var list=document.getElementById('lbList'), status=document.getElementById('lbStatus');
  if(!list) return;
  var player=lbPlayer();
  var classFilter=LB.curClass||'';
  // 1. 内存缓存命中：直接渲染（会话内快速）
  if(LB._cache && LB._cache.data){
    lbRenderView(LB._cache.data, player, classFilter);
    return;
  }
  // 2. IndexedDB 缓存（刷新页面后秒开）
  lbCacheGet().then(function(cache){
    if(cache && cache.data && cache.data.recs && cache.data.recs.length){
      LB._cache = { data: cache.data, ts: cache.ts || Date.now() };
      lbRenderView(cache.data, player, classFilter);
      return;
    }
    // 3. 无缓存 → 重新加载
    var sel=LB.SERVERS.map(function(s){return s.abbr;});
    list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 加载数据中...</div>';
    lbLoad(sel).then(function(data){
      LB._cache={ data:data, ts:Date.now() };
      lbCacheSet(data); // 写入 IndexedDB
      lbRenderView(data, player, classFilter);
    }).catch(function(e){
      list.innerHTML='<div style="text-align:center;padding:30px;color:#f87171">❌ 加载失败：'+e+'</div>';
      if(status){ status.textContent='❌ 加载失败'; }
    });
  });
}
function lbRenderView(data, player, classFilter){
  var list=document.getElementById('lbList'), status=document.getElementById('lbStatus');
  LB.curClass = classFilter || ''; // 物种名仅在「全部物种」模式显示（LB.curClass 为空）
  lbRenderBreedBar(); // 繁育栏：选中具体物种才显示
  // 物种按钮文字（中文优先：类名→英文名两级查，回退英文）
  var clsBtn=document.getElementById('lbClassBtn');
  if(clsBtn){
    // 按钮图标：仅选中具体物种时显示；全部物种不显示图标
    var icHtml='';
    if(LB.curClass){
      var icon=lbIconForDinoClass(LB.curClass);
      if(icon) icHtml='<img class="lb-class-ic" src="'+icon+'"'+lbIconFilterStyle(icon,'biology')+'>';
    }
    if(LB.curClass){
      var nm2=lbSpName(LB.curClass);
      clsBtn.innerHTML = icHtml + '<span class="lb-class-label">'+(nm2.zh || nm2.eng)+'</span>';
    } else {
      clsBtn.innerHTML = icHtml + '<span class="lb-class-label">全部物种</span>';
    }
  }
  var playerSet = player ? lbPlayerTribes(data.tribesByServer, player) : null;
  // 先按玩家过滤收集可见生物（物种浮窗只显示玩家实际拥有的物种）
  var visible=[];
  data.recs.forEach(function(r){
    if(playerSet){ if(!lbIsPlayerRec(r, playerSet, player)) return; }
    visible.push(r);
  });
  var byServer={}, playerCarried=[];
  visible.forEach(function(r){
    if(classFilter && r.dinoClass!==classFilter) return;
    if(r.containerType==='player'){ playerCarried.push(r); return; } // 玩家背包（PrimalInventory1）独立成玩家组
    (byServer[r.server]=byServer[r.server]||[]).push(r);
  });
  // 排序：有世界秒按世界秒降序；无世界秒排最后，内部按墙钟降序
  function cmp(a,b){
    var ta=a.sortWorldSec||0, tb=b.sortWorldSec||0;
    if(ta && tb) return tb-ta;
    if(ta && !tb) return -1;
    if(!ta && tb) return 1;
    return (b.absMs||0)-(a.absMs||0);
  }
  // 卡片按种名拼音排序（忽略前缀，与物种浮窗统一：lbSortKey 主词中文 → 完整中文）
  var lbCollSp = new Intl.Collator('zh-Hans-CN');
  function cmpSp(a,b){
    var r=lbCollSp.compare(lbSortKey(a.dinoClass),lbSortKey(b.dinoClass));
    if(r) return r;
    return lbCollSp.compare(lbSpName(a.dinoClass).zh||'',lbSpName(b.dinoClass).zh||'');
  }
// 空球行 HTML：低温仓图标 + 文字（宽度与卡片一致：margin 仅上下 8px）
function lbEmptyRowHtml(n){
  var ic = (LB_ICON_BY_NAME && LB_ICON_BY_NAME['Cryopod']) ? '<img src="'+LB_ICON_BY_NAME['Cryopod']+'" class="lb-empty-ic">' : '';
  return '<div style="display:flex;align-items:center;background:#15151f;border:1px dashed #333;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:#888">'+ic+' ×'+n+'</div>';

  // 当前 tab 无内容时自动切到第一个有内容的组（避免空白页）
  var hasContent = function(t){ return t==='player' ? playerCarried.length>0 : ((byServer[t]||[]).length>0); };
  if(!LB.tab) LB.tab='player';

      if(ta===undefined) ta=5;
      if(tb===undefined) tb=5;
      if(ta!==tb) return ta-tb;
      return a.localeCompare(b);
    }).forEach(function(k){
      var list=contGroups[k];
      var neArr=list.filter(function(r){return !r.isEmpty;});
      var ecnt=list.length - neArr.length;

      h+='<details class="acc" onclick="lbAccOnly(this)"><summary>'+lbContainerLabel(list[0])+' <span class="acc-cnt">'+neArr.length+(ecnt>0?'<span style="opacity:.5">|</span>'+ecnt:'')+(v6cnt>0?'<span style="opacity:.5">|</span><span style="color:#ef4444">'+v6cnt+'</span>':'')+'</span></summary>'+body+'</details>';
    });
    total=arr2.filter(function(r){return !r.isEmpty;}).length;
    var ts=LB.SERVERS.find(function(x){return x.abbr===LB.tab;});
    tabLabel=(ts ? ((ts.icon||'')+' '+ts.name).trim() : LB.tab);
  }
  if(!h) h='<div style="text-align:center;padding:30px;color:#555">😕 没有匹配的生物'+(player?'（玩家 '+player+'）':'')+'</div>';
  list.innerHTML=h;

}
// 手风琴互斥：展开当前容器时收起同组其他容器（同时只能展开一个）
function lbAccOnly(el){
  if(!el || !el.parentNode) return;
  var kids=el.parentNode.children;

  }
}

// tamed 刷新执行（从浮窗按钮调用）：多选服务器串行触发 RCON + 进度条
async function lbRefreshTamed(btn){
  var sel=lbSelectedServers();
  if(!sel.length){ alert('请至少选择一个服务器（tamed 刷新需要指定范围）'); return; }
  // 定位浮窗内进度区（lbProgBar 的父容器的父容器 = 进度外层 div）
  var all=btn.closest('.lb-confirm-overlay').querySelectorAll('div');
  var progEl=null;
  for(var i=0;i<all.length;i++){ if(all[i].id==='lbProgBar'){ progEl=all[i].parentElement.parentElement; break; } }
  if(progEl) progEl.style.display='block';
  var bar=document.getElementById('lbProgBar'), txt=document.getElementById('lbProgText'), legend=document.getElementById('lbProgLegend');
  var noToken = !(await lbHaTokenRefresh());
  btn.disabled=true;
  // 分段进度条：每台一格（进行中紫 / 成功绿 / 失败红 / 跳过橙）
  bar.innerHTML = sel.map(function(){ return '<div style="flex:1;border-radius:2px;background:#333;transition:background .3s"></div>'; }).join('');
  var segs = bar.children;
  if(legend) legend.innerHTML = '<span><span style="color:#7c3aed">■</span> 进行中</span><span><span style="color:#22c55e">■</span> 成功</span><span><span style="color:#ef4444">■</span> 失败</span><span><span style="color:#f59e0b">■</span> 跳过/冷却</span>';
  var ok=0, fail=0;
  for(var i=0;i<sel.length;i++){
    var abbr=sel[i];
    segs[i].style.background = '#7c3aed'; // 进行中
    txt.textContent='正在刷新 '+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）'+(noToken?' [webhook]':'');
    var oldMarker = await lbGetSavedAt(abbr);
    var r;
    try{ r = await lbTrigger(abbr); }catch(e){ r={ok:false,error:String(e)}; }
    var done = false, skipped = false;
    if(r && r.ok){
      if(r.cooldown){ skipped = true; }
      else { done = await lbWaitTamed(abbr, oldMarker); }
    }
    if(done){ ok++; segs[i].style.background='#22c55e'; }
    else if(skipped){ fail++; segs[i].style.background='#f59e0b'; }
    else { fail++; segs[i].style.background='#ef4444'; }
    txt.textContent=(done?'✅ ':(skipped?'⏭ ':'❌ '))+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）';
  }
  txt.textContent='✅ 已刷新 '+ok+' 台，失败/跳过 '+fail+' 台'+(noToken?'（webhook 模式）':'');
  btn.disabled=false;
  LB._cache=null;   // 清速查缓存，刷新后强制重新加载
  lbCacheClear();   // 清 IndexedDB 缓存
  await lbView();
  setTimeout(function(){ if(progEl) progEl.style.display='none'; }, 4000);
}

var LB_ICON_BY_NAME = null; // 图标索引 {name:url}（biology + units）
var LB_ICON_CAT = null;     // 图标分类 {url:cat}（反色按实际分类查）
var LB_ANTI = null; // 反色预设 {categories:{},files:{}}（icon_anti_color.json）
// 加载反色预设（ASA 后台 loadAntiColorPresets 同款数据源，本页用异步 fetch）
function lbLoadAntiColors(){
  if(LB_ANTI) return Promise.resolve(LB_ANTI);
  return authFetch('/local/asa-data/icon_anti_color.json?t='+Date.now(), {}).then(function(r){return r.json();}).then(function(d){
    LB_ANTI = (d && d.categories) ? d : {categories:{},files:{}};
    return LB_ANTI;
  }).catch(function(){ LB_ANTI = {categories:{},files:{}}; return LB_ANTI; });
}
// 查询反色预设（ASA 后台 getAntiColorPreset 同款：files[url] 优先 → categories[cat] 兜底）
function lbAntiPreset(url, cat){
  var p = LB_ANTI || {categories:{},files:{}};
  if(p.files && p.files[url]) return p.files[url].original;
  if(p.categories && p.categories[cat]) return p.categories[cat].original;
  return null;
}
// dark 主题下 preset==='dark' 的图标需要反色（本页固定 dark，theme='dark'；按图标实际分类查预设）
function lbIconFilterStyle(url, cat){
  var c = (LB_ICON_CAT && LB_ICON_CAT[url]) || cat || 'biology';
  return (lbAntiPreset(url,c)==='dark') ? ' style="filter:invert(1)"' : '';
}
function lbLoadIconList(){
  if(LB_ICON_BY_NAME) return Promise.resolve(LB_ICON_BY_NAME);
  return authFetch('/local/asa-data/icons2.json?t='+Date.now(), {}).then(function(r){return r.json();}).then(function(d){
    var by={}, cats={};
    // 额外收录的非 biology/units 精选图标（如「全部物种」的 HubTameIcon，GUI 分类；以及手风琴 summary 容器图标 facility/skins/GUI）
    var extra={'HubTameIcon':1, 'Cryofridge':1, 'Display_Case':1, 'HUD_CryoHospital_Icon':1, 'HUD_PetDisplayStand_Wall_Thatch_Icon':1, 'Tek_Replicator':1, 'SmallStorage_Icon':1, 'RW_Tracking_dino':1, 'Cryopod':1, 'RW_Store_chibi':1, 'RW_equip_saddle':1, 'TEK_Icon':1, 'RW_Garage_roof_show':1, 'HubInventoryIcon':1, 'RW_wants_to_cuddle':1, 'Feeding_Trough':1};
    (d||[]).forEach(function(it){

function lbIconForDinoClass(dinoClass){
  if(!dinoClass || !LB_ICON_BY_NAME) return '';
  var sp=findSpeciesByClass(dinoClass);
  var eng=(sp&&sp.name)?sp.name:dinoClass;
  // 特殊名（载具/新生物等显示名覆盖）：用特殊名里的英文匹配图标（如 Train_Character_C → Train → Train_Engine）
  if(LB_SPECIAL_NAMES[dinoClass]){
    var sm=LB_SPECIAL_NAMES[dinoClass].match(/\((.+)\)$/);
    if(sm) eng=sm[1];
  }
  // 图标特例表（精确指定：火车头/木筏/摩托艇/碎石熊等）
  var spName=LB_ICON_SPECIAL[eng];
  if(spName && LB_ICON_BY_NAME[spName]) return LB_ICON_BY_NAME[spName];
  if(LB_ICON_BY_NAME[eng]) return LB_ICON_BY_NAME[eng];
  // biology 命名习惯：空格→下划线（Terror_Bird/Snow_Owl/Dung_Beetle）
  var engU=eng.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[engU]) return LB_ICON_BY_NAME[engU];
  // 主词（拆前缀后）匹配 + 下划线
  var st=lbStripPrefix(eng);
  var base=st.base || eng;
  if(LB_ICON_BY_NAME[base]) return LB_ICON_BY_NAME[base];
  var baseU=base.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[baseU]) return LB_ICON_BY_NAME[baseU];
  // 括号主名（如 Drakeling (Spring) → Drakeling，避免包含匹配误配 Dragon）
  var baseMain=base.replace(/\s*\(.*\)$/,'');
  if(baseMain && baseMain!==base){
    if(LB_ICON_BY_NAME[baseMain]) return LB_ICON_BY_NAME[baseMain];
    var mainU=baseMain.replace(/ /g,'_');
    if(LB_ICON_BY_NAME[mainU]) return LB_ICON_BY_NAME[mainU];
  }
  // 头图兜底（biology 命名：RaptorHead/DodoHead/KairukuHead；Rex 特殊 TRexHead；GigantoraptorHead_Icon）
  var heads=[baseU+'Head', 'T'+baseU+'Head', baseU+'Head_Icon'];
  for(var hi=0; hi<heads.length; hi++){
    if(LB_ICON_BY_NAME[heads[hi]]) return LB_ICON_BY_NAME[heads[hi]];
  }
  var c=dinoClass.replace(/_C$/,'');
  for(var k in LB_ICON_BY_NAME){
    if(k.indexOf(c)>=0 || c.indexOf(k)>=0) return LB_ICON_BY_NAME[k];
  }
  // 规范化匹配：去下划线/连字符/空格小写（SIR-5rM8→Unassembled_Sir_5rM8、Reaper King→Reaper、Train→Train_Engine、Sloop→HUD_TOF_Sloop_Icon）
  var engNorm=(eng||'').replace(/[_\-\s]/g,'').toLowerCase();
  if(engNorm){
    for(var k2 in LB_ICON_BY_NAME){
      var kNorm=k2.replace(/[_\-\s]/g,'').toLowerCase();
      if(kNorm.indexOf(engNorm)>=0 || engNorm.indexOf(kNorm)>=0) return LB_ICON_BY_NAME[k2];
    }
  }
  return '';
}
