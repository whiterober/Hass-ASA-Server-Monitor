// v1299：诊断入口（iPad/Safari 无法执行 javascript: 书签时的替代方案）
//   自动：数据就绪后检测「玩家携带 已装球 同 dinoId 重复」，有重复才弹框（无重复不打扰）
//   手动：?diag=dup / ?diag=rec 强制弹框；?diag=off 关闭自动检测
(function(){
  try{
    var q = '';
    try{ q = String(location.search || ''); }catch(e){}
    var mm = /[?&]diag=([a-z]+)/i.exec(q);
    var mode = mm ? mm[1].toLowerCase() : 'auto';
    if(mode === 'off') return;

    var box = null;
    function ensureBox(){
      if(box && box.parentNode) return box;
      box = document.createElement('div');
      box.id = 'lbDiagBox';
      box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:2147483647;background:#0b0b0b;color:#22ff88;border:1px solid #22ff88;border-radius:10px;padding:10px 12px;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;max-height:78vh;overflow:auto;font-family:ui-monospace,Menlo,monospace';
      box.onclick = function(){ try{ box.remove(); box = null; }catch(e){} };
      try{ document.body.appendChild(box); }catch(e){}
      return box;
    }

    var t0 = Date.now();
    var timer = setInterval(function(){
      var d = (window.LB && LB._cache) ? LB._cache.data : null;
      if(!d || !Array.isArray(d.recs) || !d.recs.length){
        if(Date.now() - t0 > 180000){
          clearInterval(timer);
          if(mode !== 'auto'){ ensureBox().textContent = '诊断超时：数据未就绪'; }
        }
        return;
      }
      clearInterval(timer);

      var all = d.recs || [];
      var pl = all.filter(function(r){ return String(r.containerType || '') === 'player'; });
      var pf = pl.filter(function(r){ return !r.isEmpty; });
      var c = {}, order = [];
      pf.forEach(function(r){
        var k = String(r.dinoId1 == null ? '' : r.dinoId1) + '_' + String(r.dinoId2 == null ? '' : r.dinoId2);
        if(!c[k]){ c[k] = []; order.push(k); }
        c[k].push(r);
      });
      var dup = order.filter(function(k){ return c[k].length > 1; });

      if(mode === 'auto' && !dup.length) return;   // 无重复不打扰

      var out = [];
      out.push('诊断 ver=' + (window.LB_VERSION || '?') + '  recs=' + all.length);
      out.push('player 全部=' + pl.length + '  已装球=' + pf.length + '  空球=' + (pl.length - pf.length));
      out.push('同 dinoId 重复组=' + dup.length + '  (0 = 无重复)');
      dup.slice(0, 8).forEach(function(k){
        out.push('■ ' + k + '  x' + c[k].length);
        c[k].forEach(function(r, i){
          out.push('   [' + i + '] src=' + (r.src || '?') + ' sv=' + (r.server || '?') + ' lv=' + (r.level || 0)
            + ' w=' + (r.sortWorldSec || 0) + ' cid=' + String(r.containerId || '').slice(0, 12)
            + ' cls=' + String(r.dinoClass || '').slice(0, 24) + ' pod=' + (r.podId || ''));
        });
      });
      var c2 = {}, o2 = [];
      pf.forEach(function(r){
        var k2 = String(r.dinoClass || '') + '|' + String(r.level || 0) + '|' + String(r.podId || '');
        if(!c2[k2]){ c2[k2] = []; o2.push(k2); }
        c2[k2].push(r);
      });
      var dup2 = o2.filter(function(k){ return c2[k].length > 1; });
      out.push('');
      out.push('同(种|等级|pod) 重复组=' + dup2.length);
      dup2.slice(0, 5).forEach(function(k){
        out.push('□ ' + k + '  x' + c2[k].length + '  dinoIds=' + c2[k].map(function(r){ return r.dinoId1 + '_' + r.dinoId2; }).slice(0, 5).join(','));
      });
      if(mode === 'rec'){
        var byType = {};
        all.forEach(function(r){ var tt = String(r.containerType || '∅'); byType[tt] = (byType[tt] || 0) + 1; });
        out.push('');
        out.push('containerType 分布：');
        Object.keys(byType).sort(function(a, b){ return byType[b] - byType[a]; }).slice(0, 12).forEach(function(k){ out.push('   ' + k + ' = ' + byType[k]); });
      }
      out.push('');
      out.push('（点击本框关闭）');
      ensureBox().textContent = out.join('\n');
    }, 400);
  }catch(e){}
})();
</script>
