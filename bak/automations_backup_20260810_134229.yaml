- id: ark_server_theme_switcher
  alias: ARK服务器主题切换器
  description: 根据选择的服务器自动切换主题
  triggers:
  - entity_id: input_text.selected_server
    trigger: state
  conditions: []
  actions:
  - data:
      message: 'ARK主题切换器触发，当前服务器: {{ states(''input_text.selected_server'') }}'
      level: info
    action: system_log.write
  - choose:
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Isl
      sequence:
      - data:
          name: ark_isl
        action: frontend.set_theme
      - data:
          message: 切换到孤岛主题
          level: info
        action: system_log.write
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Sco
      sequence:
      - data:
          name: ark_sco
        action: frontend.set_theme
      - data:
          message: 切换到焦土主题
          level: info
        action: system_log.write
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Cen
      sequence:
      - data:
          name: ark_cen
        action: frontend.set_theme
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Abe
      sequence:
      - data:
          name: ark_abe
        action: frontend.set_theme
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Ext
      sequence:
      - data:
          name: ark_ext
        action: frontend.set_theme
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Ast
      sequence:
      - data:
          name: ark_ast
        action: frontend.set_theme
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Rag
      sequence:
      - data:
          name: ark_rag
        action: frontend.set_theme
    - conditions:
      - condition: state
        entity_id: input_text.selected_server
        state: Bob
      sequence:
      - data:
          name: ark_bob
        action: frontend.set_theme
    default:
    - data:
        name: ark_survival_ascended
      action: frontend.set_theme
    - data:
        message: 切换到默认ARK主题
        level: info
      action: system_log.write
    enabled: true
  mode: single
