- id: '1753677362447'
  alias: 同步电视开关
  description: 当电视状态变化时，同步开关状态
  triggers:
  - entity_id:
    - media_player.sony_bravia_tv
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: media_player.sony_bravia_tv
        state: 'on'
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.tvpower
        data: {}
    - conditions:
      - condition: state
        entity_id: media_player.tv
        state: 'off'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.tvpower
        data: {}
  mode: single
- id: '1753691219437'
  alias: ASA Server Status Event Handler
  triggers:
  - event_type: asa_server_status_update
    trigger: event
  actions:
  - data:
      entity_id: '{{ trigger.event.data.entity_id }}'
      value: '{{ trigger.event.data.content }}'
    action: input_text.set_value
  - data:
      title: ASA Server Status Updated
      message: Server status updated at {{ trigger.event.data.timestamp }}
      notification_id: asa_status_update
    action: persistent_notification.create
