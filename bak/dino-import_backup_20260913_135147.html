// v935：容器聚合（与 lbBuildSettlements 聚合段同步；供增量刷统计复用）
function lbAggContainers(recs){
  var ctn = {};
  (recs||[]).forEach(function(r){
    if(!r) return;
    if(lbContainerTypeOf(r)==='player') return;
    var cid, tid;
    if(lbContainerTypeOf(r)==='released'){
      cid = 'rel_'+(r.dinoId1||'')+'_'+(r.dinoId2||'');
      tid = r.tribeId||r.containerTribe||0;
    } else {
      cid = r.containerId || ('noid_'+(lbContainerTypeOf(r)||''));
      tid = r.containerTribe||r.tribeId||0;
    }
    var c = ctn[cid] = ctn[cid] || { id:cid, type:lbContainerTypeOf(r), x:r.containerX||0, y:r.containerY||0, z:r.containerZ||0, tribeId:tid, count:0, imps:{}, impEos:{}, keys:[] };
    if(r.src !== 'facility') c.count++;
    if(!r.isEmpty && r.imprinterEosId) c.impEos[r.imprinterEosId] = (c.impEos[r.imprinterEosId]||0)+1;
    else if(!r.isEmpty && r.imprinterName) c.imps[r.imprinterName] = (c.imps[r.imprinterName]||0)+1;
    if(!r.isEmpty) c.keys.push(String(r.dinoId1||'')+'_'+String(r.dinoId2||''));
  });
  return ctn;
}
// v935：容器结构指纹（posCtn 级：cid|坐标|部落 去重 + FNV）——仅球内容变化时指纹不变 → 跳过重建只刷统计
function lbSettlePosFingerprint(recs, structures){
  var seen = {}, n = 0, h1 = 2166136261;
  (recs||[]).forEach(function(r){
    if(!r) return;
    if(lbContainerTypeOf(r)==='player') return;
    var x = Number(r.containerX)||0, y = Number(r.containerY)||0;
    if(!x && !y) return;
    var t = lbContainerTypeOf(r);
    var cid = (t==='released') ? ('rel_'+(r.dinoId1||'')+'_'+(r.dinoId2||'')) : (r.containerId || ('noid_'+t));
    var k = cid + '|' + Math.round(x) + '|' + Math.round(y) + '|' + (r.tribeId||r.containerTribe||0);
    if(seen[k]) return; seen[k]=1; n++;
    for(var i=0;i<k.length;i++){ h1 ^= k.charCodeAt(i); h1 = (h1*16777619)>>>0; }
  });
  // ===== v20260912-1018：并入「参与聚落算法的建筑」指纹 =====
  // 为什么必须并入：原指纹只吃 recs（容器/球），而 床/棺材/睡眠舱、墓碑/木牌 只存在于 structures
  // （不生成 rec）→ 游戏里新盖床 / 新立墓碑 / 给设施改名时指纹不变 → 跳过重建 →
  // 聚落中心、聚落名称、乃至「本该成立的新聚落」永久滞后。
  // 纳入范围（仅参与聚落算法的）：床类 ∪ 墓碑/木牌类 ∪ 任何带自定义 name 的设施
  //   - 床类 → 决定聚落是否成立（lbClusterHasBed）、聚落中心（床纳入中心）、bedOwner 归属
  //   - 墓碑/木牌 与 带 name 设施 → 决定聚落命名（lbSettlementBuildingName / sNameOf）
  //   注：炮塔/冰箱等设施由后端统一生成 facility rec（已含在 recs 指纹内），此处不重复计入
  var sn = 0;
  (structures||[]).forEach(function(s){
    if(!s) return;
    var c = String(s.class||'');
    if(!s.name && !LB_BED_RE.test(c) && !LB_SIGN_RE.test(c)) return;

// v603：判断蛋容器是否为孵化器（Egg Incubator / Embryo Incubator 胚胎培养器）——仅孵化器/培养器显示槽位徽章；
//       Oviraptor/Refrigerator/IMPRINT 等容器 slotIndex 是物品栏索引非孵化槽
// v605：纳入 Embryo Incubator（StructureBP_EmbryoIncubator_C，胚胎培养器）——胚胎培养器内胚胎 slotIndex 0~N 为真培养槽
function lbIsEggIncubator(r){
  if(!r) return false;
  var c = String(r.containerClass||'') + '|' + String(r.containerName||'');
  return /EggIncubator/i.test(c) || /Egg Incubator/i.test(c) || /EmbryoIncubator/i.test(c) || /Embryo Incubator/i.test(c);
}
// v500：蛋记录图标——eggs 分类图标（<物种英文名>_Egg，如 Brontosaurus_Egg）；无则兜底生物头像
// v600：优先用 dinoClass 生成候选——ASB 里 BogSpider 的 name 是 Bloodstalker（命名歧义），
//      用 dinoClass（BogSpider）才能命中 Item_BogSpiderEgg_Icon；sp.name 仅作补充候选
function lbEggIcon(r){
  if(!LB_ICON_BY_NAME) return '';
  var dc = String(r.dinoClass||'');
  var sp = findSpeciesByClass(r.dinoClass);
  var nm = (sp && sp.name) ? sp.name : r.dinoClass;
  var cands = [];
  // ① dinoClass 派生（如 BogSpider → Item_BogSpiderEgg_Icon / BogSpider_Egg）
  cands.push('Item_' + dc.replace(/[ _]/g,'') + 'Egg_Icon', dc + '_Egg', dc.replace(/ /g,'_') + '_Egg');
  // ② name 派生（补充；name 可能与 dinoClass 不同导致歧义，放后面）
  if(nm !== dc){
    var base = String(nm).replace(/_Fertilized/g,'');
    cands.push('Item_' + nm.replace(/ /g,'') + 'Egg_Icon', nm + '_Egg', nm.replace(/ /g,'_') + '_Egg');
    if(base!==nm){ cands.push('Item_' + base.replace(/ /g,'') + 'Egg_Icon', base + '_Egg', base.replace(/ /g,'_') + '_Egg'); }
  }
  for(var i=0;i<cands.length;i++){
    if(LB_ICON_BY_NAME[cands[i]]) return LB_ICON_BY_NAME[cands[i]];
  }
  return lbIconForDinoClass(r.dinoClass) || '';
}
// v500：加载各服蛋数据（<server>_eggs.json.gz，gzip 解压）→ 转换 rec 兼容结构（source:'egg'），存 LB._eggCache
// v527：蛋 IndexedDB 持久缓存（key 'eggs'，对齐 tamed 模式——刷新秒开 + HEAD 增量，不再每次全量下载）
function lbEggCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('eggs');
      get.onsuccess = function(){ resolve(get.result || null); };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbEggCacheSet(cache, lm){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ cache: cache, lm: lm||{}, ts: Date.now() }, 'eggs');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
// v527：后台 HEAD 增量检查——对比缓存 Last-Modified，有变化的服才重拉
async function lbEggHeadCheck(servers, oldLm){
  // v951：Bob（俱乐部）黑名单服——主数据 lbLoad 已统一剔除，蛋数据这里也对齐（Bob 无蛋导出，避免每次必 404）
  servers = (servers||[]).filter(function(s){ return s !== 'Bob'; });
  if(!servers.length) return;
  var changed = [];
  try{
    await Promise.all(servers.map(function(abbr){
      var ac = new AbortController();
      var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 10000); // v951：10s 超时——后端偶发挂起不再拖住增量检查
      return fetch(DINO_JSON + abbr + '_eggs.json.gz', { method:'HEAD', cache:'no-store', signal: ac.signal })
        .then(function(r){
          clearTimeout(_t);
          var lm = (r.headers.get('Last-Modified') || '').trim();
          if(lm && (!oldLm[abbr] || String(oldLm[abbr]).trim() !== lm)) changed.push(abbr);
          return lm;
        }).catch(function(){ try{ clearTimeout(_t); }catch(e2){} return ''; });
    }));
  }catch(e){}
  if(changed.length) lbLoadEggs(changed, true); // 变化服强制重拉
}
async function lbLoadEggs(servers, force){
  // v951：Bob（俱乐部）黑名单服——对齐主数据 lbLoad（Bob 无蛋导出，避免每次刷新必 404 刷屏）
  servers = (servers||[]).filter(function(s){ return s !== 'Bob'; });
  if(!servers || !servers.length) return {};
  // v527：非强制时优先 IndexedDB 蛋缓存（刷新秒开），后台 HEAD 增量检查（未变化不重拉，对齐 tamed）
  if(!force && !LB._eggCache){
    try{
      var _idb = await lbEggCacheGet();
      if(_idb && _idb.cache && Object.keys(_idb.cache).length){
        LB._eggCache = _idb.cache;
        LB._eggLm = LB._eggLm || (_idb.lm||{}); // v656：Last-Modified 表跨会话保留（供 HEAD 增量对比）
        lbEggMergeToView();
        setTimeout(function(){ lbEggHeadCheck(servers, LB._eggLm||{}); }, 300);
        return LB._eggCache;
      }
    }catch(e){}
  }
  var lm = {};
  // v528：首次/强制拉取提示（避免「干等初始化」无反馈）
  try{ lbToast('正在下载蛋数据…'); }catch(e){}
  return Promise.all(servers.map(function(abbr){
    var _ac = new AbortController();
    var _tm = setTimeout(function(){ try{ _ac.abort(); }catch(e){} }, 20000); // v951：20s 下载超时——后端 CORS/重建偶发不挂死加载；失败该服跳过其余继续
    return authFetch(DINO_JSON + abbr + '_eggs.json.gz?cb=' + Date.now(), { signal: _ac.signal }).then(function(r){
      clearTimeout(_tm);
      try{ lm[abbr] = (r.headers.get('Last-Modified') || '').trim(); }catch(e){}
      if(!r.ok) return {server:abbr, eggs:[]};
      return r.arrayBuffer();
    }).then(function(buf){
      if(!buf || !buf.byteLength) return {server:abbr, eggs:[]};
      var u8 = new Uint8Array(buf);
      var parse = (u8[0]===0x1f && u8[1]===0x8b)
        ? new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function(d){
            return JSON.parse(lbJsonFix(new TextDecoder().decode(d)));
          })
        : Promise.resolve(JSON.parse(lbJsonFix(new TextDecoder().decode(u8))));
      return parse.then(function(j){
        var list = (j && Array.isArray(j.eggs)) ? j.eggs : [];
        // v586：记录文件级 worldSecondsNow（248M 基准，与 nextSpoilingTime/creationTime 同基准）——真实腐化剩余 = nextSpoilingTime − worldSecondsNow
        if(!LB._eggWorldByServer) LB._eggWorldByServer = {};
        LB._eggWorldByServer[abbr] = (j && typeof j.worldSecondsNow==='number' && isFinite(j.worldSecondsNow)) ? j.worldSecondsNow : null;
        return {server:abbr, eggs: list.map(function(e){ return lbEggToRec(e, abbr); })};
      });
    }).catch(function(){ try{ clearTimeout(_tm); }catch(e){} return {server:abbr, eggs:[]}; });
  })).then(function(results){
    // v656：部分服强制重拉（HEAD 增量/单服刷新）时合并进现有缓存，禁止整体覆盖——否则其余服的蛋被清空，
    //      recs 蛋层按 eggCache 重建（v646）→ 该服野生蛋/巢蛋消失（如熔岩龙 Gen 蛋丢失）。首次全量拉时 cache 为空等效全量。
    var cache = LB._eggCache || {};
    var merged = LB._eggLm || {};
    results.forEach(function(r){ cache[r.server] = r.eggs; if(lm[r.server]!==undefined) merged[r.server] = lm[r.server]; });
    LB._eggCache = cache;
    LB._eggLm = merged;
    // v501：并入 recs 并无感重渲染（聚落详情/容器即可看到蛋与胚胎）
    lbEggMergeToView();
    lbEggCacheSet(cache, merged); // v527：写入 IndexedDB 持久缓存
    return cache;
  });
}
// v501：把已缓存的蛋/胚胎并入 data.recs（按 key 去重），无感重渲染
// v587：合并时更新已有蛋 rec 的实时字段（后端/eggprobe 刷新后腐化/孵化值变化不再被固化旧值）
function lbEggMergeToView(){
  var data = LB._cache && LB._cache.data;
  if(!data || !data.recs || !LB._eggCache) return;
  // v646：先移除 recs 中全部旧蛋（含历史重复残留：此前多轮并入累积的 source='wild' 重复），再按 eggCache 去重全量重建蛋层
  var removed = 0;
  var _oldRecs = data.recs;
  data.recs = _oldRecs.filter(function(r){ if(r && (r._isEgg || r.source==='egg'||r.source==='embryo')){ removed++; return false; } return true; });
  var byId = {};
  var added = 0;
  Object.keys(LB._eggCache).forEach(function(abbr){
    (LB._eggCache[abbr]||[]).forEach(function(e){
      if(e && e.dinoId1 && !byId[e.dinoId1]) byId[e.dinoId1] = e;
    });
  });
  Object.keys(byId).forEach(function(k){ data.recs.push(byId[k]); added++; });
  if(!added && !removed) return;
  // v550 蛋变化不重建 + v551：仅当聚落构建未含蛋容器（蛋后到，如手动刷新页面）才重建一次（data 级）；
  // v607：蛋/胚胎永不触发聚落全量重建——蛋容器真实ID(eggprobe) 与设施哈希ID(facility) 本就两套体系，
  //      重建对蛋容器归属无效却造成全服重建风暴（Ast 543 蛋实测 204s 卡死→请求超时误报 RangeError）。
  //      蛋/胚胎归属改由 lbSettlementOf 容器坐标动态匹配（新增蛋 rec 直接并入，无需重建）。
  if(!data._eggInSettles && !data._eggBuiltOnce){
    data._eggBuiltOnce = true;
    if(data._settlements) delete data._settlements;

    .replace(/\{属性值\}|<属性值>|\{v\}/g, val)
    .replace(/\{zh\}/g, zh)
    .replace(/\{lv\}/g, d.lv)
    .replace(/\{sex\}/g, sex)

}

// IndexedDB 速查缓存持久化（刷新页面后秒开，避免重新加载 10 台 JSON）
var LB_IDB_NAME = 'dinoImportDB', LB_IDB_STORE = 'lbCache';
function lbCacheOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    var _done = false;
    var _fin = function(fn, v){ if(!_done){ _done = true; try{ fn(v); }catch(e){} } };
    // v921：IndexedDB 打开 3s 超时兑底——DB 损坏/锁（多标签/僵尸删除）导致 open 永不回调时，走网络下载不再永久「正在初始化」
    var _timer = setTimeout(function(){ _fin(reject, new Error('idb timeout')); }, 3000);
    var req = indexedDB.open(LB_IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(LB_IDB_STORE)) db.createObjectStore(LB_IDB_STORE);
    };
    req.onsuccess = function(){
      clearTimeout(_timer);
      if(_done){ try{ req.result && req.result.close(); }catch(e2){} return; } // 超时后迟到的打开：关闭防连接泄漏
      _fin(resolve, req.result);
    };
    req.onerror = function(){ clearTimeout(_timer); _fin(reject, req.error); };
  });
}
function lbCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('latest');
      get.onsuccess = function(){
        var v = get.result || null;
        // 版本校验：旧结构（无 _schemaVer===3 / 无 players / rec 无 containerOwnerPid）→ 判失效
        if(v && v.data){
          var d = v.data;
          // v931：_settlements 随缓存持久化（缓存命中跳过 80s 重建）；仅聚落算法版本不符时剔除强制重建
          if(d._settleVer !== LB_SETTLE_VER && d._settlements) delete d._settlements;
          var okVer = d._schemaVer === LB_SCHEMA_VER; // v971：改用常量（原写死 13，v966 升至 14 后恒失效 → 每次切 Tab 重下）
          var okPlayers = Array.isArray(d.players);
          var okPid = true;
          var okRoles = true;
          if(okPlayers && Array.isArray(d.recs)){
            var pc = d.recs.filter(function(r){ return lbContainerTypeOf(r)==='player' && !r.isEmpty; })[0];
            if(pc && pc.containerOwnerPid === undefined && pc.containerOwnerPid === null) okPid = false;
          }
          // v212：缓存数据自愈——players 全无角色映射（roles 空，旧格式缓存）→ 判失效自动重下
          if(okPlayers && d.players.length){
            okRoles = d.players.some(function(pl){ return pl && pl.roles && Object.keys(pl.roles).length; });
          }
          if(!okVer || !okPlayers || !okPid || !okRoles){ resolve(null); return; }
        }
        resolve(v);
      };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbCacheSet(data){
  // v931：_settlements 随缓存持久化（不再剔除；蛋 v607 起坐标动态匹配不需重建，_eggBuiltOnce 保留防重复重建）
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ data: data, ts: Date.now() }, 'latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
function lbCacheClear(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).delete('latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}

// v822：容器内容类别注册表（可扩展体系）——容器 vs 设施动态分流的"有内容"判定统一走此表
// 每项 { key, label, detect(cg, ctx) }：cg=该容器组 rec 数组；ctx={scanners(基因枪基因成员), geneSlotShow}
// detect 返回该组是否含此类内容 → 命中任一类别 = 有内容 = 容器手风琴；全不命中 = 纯空 = 设施 chips
// 新增内容类别（如蓝图）：在此追加一条即可，渲染判定自动纳入（无需改分流代码）
var LB_CONTENT_KINDS = [
  { key:'ball', label:'低温球',
    // 低温仓球（非空 rec）；空球也算（空球容器显示空球行，v202 语义）
    detect:function(cg){ return cg.some(function(r){ return !r.isEmpty || (r.isEmpty && r.src!=='facility'); }); } },
  { key:'gene', label:'基因枪',
    // 容器内基因枪（scanner 同容器且含基因）；v957：同容器判定走 lbSameContainer（containerId 或坐标）
    detect:function(cg, ctx){
      if(!ctx || !ctx.scanners || !cg || !cg.length) return false;
      return ctx.scanners.some(function(m){ return lbSameContainer(cg[0], m.item) && (m.item.slots||[]).some(ctx.geneSlotShow); });
    } },
  // v968：库存物品三类（item.json.gz 离线索引，全设施通用）——判定走 kind 细分 / type 粗分类（见 item.gz 文档 §5.1）
  { key:'resource',  label:'资源', detect:function(cg){ return lbGroupInvHas(cg, 'resource'); } },
  { key:'ammo',      label:'弹药', detect:function(cg){ return lbGroupInvHas(cg, 'ammo'); } },
  { key:'blueprint', label:'蓝图', detect:function(cg, ctx){ return lbGroupInvHas(cg, 'blueprint', ctx); } }
];
// v968：取容器组库存条目（cg[0] 提供 server/containerId/class/坐标；数据源 LB._cache.data.itemsByServer[server]）
// v972：支持多容器合并取件——泰克专储同聚落合并后，一个组可能代表多个柜子（按 containerId|key|class 去重汇总）
function lbGroupItems(cg){
  if(!cg || !cg.length) return [];
  // v996：放出 = 野外放养生物的虚拟容器（containerId 为空，坐标仅代表生物位置）——无真实库存。
  //   若照常按坐标查库存，会误取到生物附近的真实容器（冰箱/箱子）的物品 —— 用户实测「放出组里出现资源/弹药」
  if(String((cg[0] || {}).containerType || '') === 'released') return [];
  if(cg.length === 1){
    var r0 = cg[0], l0 = null;
    try{ l0 = lbItemsOfContainer(String(r0.server || (LB.tab||'')), r0.containerId, r0.containerClass, r0.containerX, r0.containerY); }catch(e){ l0 = null; }
    return l0 || [];
  }
  var seen = {}, out = [];
  for(var i=0;i<cg.length;i++){
    var r = cg[i], l = null;
    try{ l = lbItemsOfContainer(String(r.server || (LB.tab||'')), r.containerId, r.containerClass, r.containerX, r.containerY); }catch(e){ l = null; }
    if(!l) continue;
    for(var j=0;j<l.length;j++){
      var it = l[j]; if(!it) continue;
      var kk = String(it.containerId||'') + '|' + String(it.key||'') + '|' + String(it['class']||'');
      if(seen[kk]) continue;
      seen[kk] = 1; out.push(it);
    }
  }
  return out;
}
// v972：泰克专储判定（containerType='dedicated' 或类名含 DedicatedStorage）
function lbIsDedicatedStorage(r){
  if(!r) return false;
  if(String(r.containerType||'') === 'dedicated') return true;
  return /DedicatedStorage/i.test(String(r.containerClass||''));
}
// v997：可合并设施判定——同聚落内「同类型」合并为一行（泰克专储 + 炮台类 + 立式火把 + 特斯拉电塔）
// 用户确认：发电机（泰克发电机/发电机）**不合并**，故不入白名单
// v999 根因修正：白名单原按「容器背包类名」枚举（Turret/HeavyTurret/TurretTek…），但聚落 rec 实际带的是
//   **世界结构类名**（StructureTurretBaseBP_C_x / StructureTurretBaseBP_Heavy_C_x）→ 枚举永不命中 → 炮台不合并。
//   改为按「族」判定（含 Turret / Torch / TeslaCoil），两套类名一并覆盖；发电机不含这三个词，天然排除。
var LB_MERGE_FAC_RE = /Turret|Torch|TeslaCoil/i;
function lbIsMergeableFacility(r){
  if(!r) return false;
  if(lbIsDedicatedStorage(r)) return true;
  return LB_MERGE_FAC_RE.test(String(r.containerClass||''));
}
// v975：制造设施判定（泰克复制器 / 铁匠台 / 机床）——其蓝图若与本聚落书柜重复（书柜远程分享）则不显示
function lbIsCraftStation(r){
  if(!r) return false;
  var c = String(r.containerClass||'');
  return /TekReplicator/i.test(c) || /AnvilBench|Smithy/i.test(c) || /Fabricator/i.test(c);
}
// v989：蓝图判定统一以数据权威字段 isBlueprint 为准——
// v975 及以前用 it.type==='blueprint'，而后端 type 按类别粗分（弹药蓝图 type='ammo'、资源蓝图 type='resource'、
// 均带 isBlueprint=1）→ 这些蓝图被当成实物渲染，quantity 恒为 0 → 界面显示「· 0」且丢失「蓝图」标签（890 条实测）。
function lbIsBp(it){
  if(!it) return false;
  return Number(it.isBlueprint) === 1 || it.type === 'blueprint';
}
// v989：无内容条目——实物且 quantity<=0（存档空槽残留，实测 Ext 服 41 条），不参与渲染与计数
// v990：蓝图改按「品质」判定——rated=0 / rating=-1 = 游戏固定配方（非玩家物品；
//   实测 Ext 服 4 个互不相关部落的 TekReplicator 共享完全相同的 32 个基名，各出现 1 次）→ 视为无内容。
//   L3640 数据契约原写「blueprint 类已按 rated=1 过滤」，但过滤条件绑定了 type==='blueprint'，
//   而固定配方 type='ammo'/'resource' → 890 条漏网（与 v989 同一错误模式的第二处）。
// v20260912-1020：固定配方蓝图（游戏自带、非玩家物品）判定 —— 统一判据
//   背景：v990 注释已写明「rated=0 / rating=-1」两个条件，但代码只实现了 rated；
//   而固定配方在数据里的真实形态是 rated:1 + rating:-1 + qidx:-1
//   （实测 Ast/Isl 服 ScoutRemote：TekReplicator 内 {rated:1,rating:-1,qidx:-1}，
//     而书柜 LibraryStorage 内 {rated:1,rating:725,qidx:5}）
//   → 单看 rated 必然漏，实测全库漏网 7384 条 / 117 种（复制器/铁匠台内那批资源与弹药固定配方）
function lbIsFixedRecipeBp(it){
  if(!it) return true;
  if(!Number(it.rated)) return true;          // rated=0：无品质
  return Number(it.rating) === -1;            // rating=-1：固定配方
}
function lbIsEmptyItem(it){
  if(!it) return true;
  if(lbIsBp(it)) return lbIsFixedRecipeBp(it);   // v20260912-1020：补全 rating===-1
  return (Number(it.quantity) || 0) <= 0;
}
// v975：物品归一基名（跨容器比对同一蓝图用；与 lbInvListHtml 聚合键同源）
function lbBaseOfItem(it){
  if(!it) return '';
  var raw = String(it['class']||'');
  try{ var m = lbItemMeta(raw); if(m && m.base) return m.base; }catch(e){}
  return raw.replace(/_C_\d+$/,'');
}
// v975：本聚落书柜（Bookshelf / ASA 实为 LibraryStorage）内的蓝图基名集合——制造设施去重的比对基准
// v989 根因修复：v975 写成 /Bookshelf/，而 ASA 书柜类名是 LibraryStorage → 从未命中 → 去重永远被跳过（复制器/铁匠台/机床重复显示书柜蓝图）
function lbShelfBpSet(grp){
  var s = {};
  (grp||[]).forEach(function(r){
    if(!/Bookshelf|LibraryStorage|Library_Storage/i.test(String((r&&r.containerClass)||''))) return;
    lbGroupItems([r]).forEach(function(it){
      if(lbIsBp(it)){ var b = lbBaseOfItem(it); if(b) s[b] = 1; }   // v989：以 isBlueprint 为准（弹药/资源蓝图同样入集）
    });
  });
  return s;
}
// v968：容器组是否含指定类别（blueprint 走 type 粗分类；其余走 kind 细分）
// v975：blueprint 增加「书柜分享去重」——制造设施中与本聚落书柜重复的蓝图不计入内容
function lbGroupInvHas(cg, k, ctx){
  var l = lbGroupItems(cg);
  var shelf = (ctx && ctx.shelfBp) || null;
  var craft = !!(cg && cg.length && lbIsCraftStation(cg[0]));
  var skip = (k === 'blueprint' && shelf && craft) ? shelf : null;
  for(var i=0;i<l.length;i++){
    var it = l[i]; if(!it) continue;
    if(lbIsEmptyItem(it)) continue;  // v993：与计数/渲染同标准 —— 0 数量实物与固定配方蓝图都不算内容（空容器得以下沉设施 chips）
    if(k==='blueprint'){
      if(!lbIsBp(it)) continue;                                     // v989：以 isBlueprint 为准
      if(lbIsFixedRecipeBp(it)) continue;                           // v20260912-1020：固定配方(rated=0 或 rating=-1)不计入内容
      if(skip){ var b = lbBaseOfItem(it); if(b && skip[b]) continue; }
      return true;
    } else if(it.kind===k) return true;
  }
  return false;
}
// v968：数量缩写（1234 → 1.2k；用于摘要标注）
function lbFmtQty(n){
  n = Number(n)||0;
  if(n >= 1000000) return (Math.round(n/100000)/10) + 'M';
  if(n >= 10000) return (Math.round(n/1000)) + 'k';
  return String(n);
}
// v968：按 kind/type 聚合数量（专储一柜一条=总量；普通容器同基名多条 sum——两种语义统一求和即正确）
function lbInvAgg(items){
  var g = {};
  for(var i=0;i<items.length;i++){
    var it = items[i]; if(!it) continue;
    if(lbIsEmptyItem(it)) continue;                                 // v989：数量<=0 的实物（存档空槽残留）不计数
    var k = lbIsBp(it) ? 'blueprint' : (it.kind || 'other');        // v989：以 isBlueprint 为准
    // v999：计数口径改「组数」——每条记录 = 1 堆 = 1 组（原为数量求和，会显示 47979 这种总量）
    g[k] = (g[k]||0) + 1;
  }
  return g;
}
// v968：摘要行计数标注（资源⛏N｜弹药➤N｜蓝图📘N）
// v991：①去掉三色着色（统一继承 .acc-cnt 灰，对齐球基因风格）②弹药图标 ➤ → ◎（箭头不合适）
//       ③withSep 由调用方按「前面是否已有内容」决定，消除孤立分隔线
function lbInvCountMark(items, withSep){
  if(!items || !items.length) return '';
  var g = lbInvAgg(items), o = '';
  if(g.resource)  o += '◆'+lbFmtQty(g.resource);   // v993：⛏ 是铁锹 emoji，易误读为工具 → 换纯符号
  if(g.ammo)      o += '◎'+lbFmtQty(g.ammo);
  if(g.blueprint) o += '▤'+lbFmtQty(g.blueprint);  // v993：📘 是蓝书 emoji（自带固有色，CSS 去不掉）→ 换纯符号
  if(!o) return '';
  return (withSep ? '<span style="opacity:.5">|</span>' : '') + o;
}
// v968：容器物品清单块（图标 + 中文 + ×数量；按数量降序；图标走 P3 物品表 → WebP 缩略图）
function lbInvListHtml(items, opts){
  if(!items || !items.length) return '';
  // v1014：个体自定义名——低可视化写在每个物品徽章**内部**（不另套外层块）
  var _nm = (opts && opts.name) ? String(opts.name) : '';
  // v970：聚合键改用「归一基名」——普通容器逐堆明细的 class 带实例后缀（_C_<ID>），
  // 用完整 class 聚合会导致同种物品每堆各占一行且组数恒为 1（v969 缺陷）；加 meta 缓存避免重复计算
  var agg = {}, order = [], metaCache = {};
  function metaOf(raw){
    if(metaCache[raw] === undefined){
      var mm = null;
      try{ mm = lbItemMeta(raw); }catch(e){ mm = null; }
      metaCache[raw] = mm || {base:raw.replace(/_C_\d+$/,''), zh:'', en:'', icon:''};
    }
    return metaCache[raw];
  }
  for(var i=0;i<items.length;i++){
    var it = items[i]; if(!it) continue;
    if(lbIsEmptyItem(it)) continue;                                 // v989：数量<=0 的实物（存档空槽残留）不渲染
    var raw = String(it['class']||'');
    var m0 = metaOf(raw);
    var key = m0.base || raw.replace(/_C_\d+$/,'');
    if(!agg[key]){ agg[key] = {cls:key, qty:0, n:0, isBp:lbIsBp(it), zh:m0.zh, en:m0.en, icon:m0.icon}; order.push(key); }
    var a = agg[key];
    a.n++;
    if(!a.zh && m0.zh) a.zh = m0.zh;
    if(!a.icon && m0.icon) a.icon = m0.icon;
    var q0 = Number(it.quantity)||0;
    if(a.isBp && !q0) q0 = 1;
    a.qty += q0;
  }
  var rows = order.map(function(c){ return agg[c]; });
  rows.sort(function(a,b){ if(b.qty !== a.qty) return b.qty - a.qty; return a.cls.localeCompare(b.cls); });
  // v1016：inline 模式——不返回外层 flex div，由调用方把所有个体的徽章拼进**同一个**容器
  //   （v1014 每个个体各调一次 → 各返回一个块级 div → 实测每个个体/徒章强制换行）
  var _inline = !!(opts && opts.inline);
  var o = _inline ? '' : '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px">';
  for(var j=0;j<rows.length;j++){
    var r = rows[j];
    var url = (r.icon && LB_ITEM_ICON_URL) ? (LB_ITEM_ICON_URL[r.icon]||'') : '';
    var label = r.zh || r.en || r.cls.replace(/^PrimalItem[A-Za-z]*_?/,'');
    o += '<span style="display:inline-flex;align-items:center;gap:4px;background:#1a1a24;border:1px solid '+(r.isBp?'#3b4a6b':'#2a2a3a')+';border-radius:8px;padding:3px 7px;font-size:12px" title="'+r.cls+'">'
      + (_nm ? '<span style="color:#64748b;font-size:10px">'+_nm+'</span>' : '')
      + (url ? '<img src="'+url+'" style="width:16px;height:16px;object-fit:contain"'+lbIconFilterStyle(url)+'>' : '')
      + '<span style="color:#cbd5e1">'+label+'</span>'
      + '<span style="color:#475569;font-size:10px">·</span>'
      + (r.n > 1 ? '<span style="color:#94a3b8;font-size:11px">'+r.n+'组</span><span style="color:#475569;font-size:10px">·</span>' : '')   // v1000：还原 v996 前写法（仅 >1 时显示「N组 ·」，其后固定显示总数量）
      + '<span style="color:#64748b">'+lbFmtQty(r.qty)+'</span>'
      + (r.isBp ? '<span style="color:#93c5fd;font-size:10px">蓝图</span>' : '')
      + '</span>';
  }
  return _inline ? o : (o + '</div>');
}
// v957：同容器双 ID 通道判定——设施扫描 rec 与库存扫描设备（基因枪）的 containerId 来自不同上报通道
//（如 rec=StorageBox_Huge_C_* / 枪=PrimalInventoryBP_StorageBox_Huge_C*），仅比 containerId 会误判；
// 坐标相同（round 后一致）即同一容器。0,0 未定位容器不参与坐标匹配。
function lbSameContainer(rec, dev){
  if(!rec || !dev) return false;
  if(rec.containerId && dev.containerId && rec.containerId===dev.containerId) return true;
  var rx = Math.round(Number(rec.containerX)||0), ry = Math.round(Number(rec.containerY)||0);
  var dx = Math.round(Number(dev.containerX)||0), dy = Math.round(Number(dev.containerY)||0);
  if(!(rx||ry) || !(dx||dy)) return false;
  return rx===dx && ry===dy;
}
// v822：遍历 LB_CONTENT_KINDS 判定容器组是否有内容（命中任一类别返回 true）
function lbGroupHasContent(cg, ctx){
  for(var i=0;i<LB_CONTENT_KINDS.length;i++){
    try{ if(LB_CONTENT_KINDS[i].detect(cg, ctx)) return true; }catch(e){}
  }
  return false;
}
// v821：设施/容器 class 归一基名——去前缀（PrimalInventoryBP_/PrimalItemStructure_/StructureBP_/Structure_/BP_/PrimalInventory_）与 _C 后缀/_C_ID
// 例：CryoFridge_C_2146704821 → CryoFridge；PrimalInventoryBP_CryoFridge_C1 → CryoFridge；StructureBP_SteampunkClock_C_xxx → SteampunkClock
// 纯动态重构基础：cryo.facilities class（真实路径含ID）与 cryo 球 rec 的 containerClass（PrimalInventoryBP_..._C1）统一到同一基名 → 物理容器身份一致
function lbFacBase(c){
  var s = String(c||'');
  s = s.replace(/^PrimalItemStructure_/,'').replace(/^PrimalInventoryBP_/,'').replace(/^PrimalInventory_/,'').replace(/^StructureBP_/,'').replace(/^Structure_/,'').replace(/^BP_/,'');
  s = s.replace(/_C\d*$/,'').replace(/_C_\d+$/,'');
  return s;
}
// v1050：容器合并「区域粒度」公共键——楼层桶(z/50) + 平面粗格(x,y/3000)
//   统一口径：同层同块 → 合并成一行；跨层 / 相距 >30 米 → 仍分开
function lbContGeo(r){
  var _x = Number(r.containerX!=null?r.containerX:(r.x||0))||0;
  var _y = Number(r.containerY!=null?r.containerY:(r.y||0))||0;
  var _z = Number(r.containerZ!=null?r.containerZ:(r.z||0))||0;
  return (Math.round(_z/50)*50) + '|' + Math.round(_x/3000) + ',' + Math.round(_y/3000);
}
// v1051：平面粗格（不含 z）——用于「z 天然散布」的放出/玩家容器合并（同片区域 → 一组）
function lbContCell(r){
  var _x = Number(r.containerX!=null?r.containerX:(r.x||0))||0;
  var _y = Number(r.containerY!=null?r.containerY:(r.y||0))||0;
  return Math.round(_x/3000) + ',' + Math.round(_y/3000);
}
// 容器 key：display/stand 未命名可合并（无 ID）；命名容器按名合并；
// v1050：**全部容器合并组**统一「区域粒度」（用户要求：tek箱子/炮台/火把/放出 等与展示柜同口径）
//   原实现的两处偏差：物理容器按 baseClass+**精确坐标**（同区几十个箱子各占一行）、
//   released/player 按 containerId（released 的 id 为空 ⇒ 全服并成 1 组）——均不符合「按区域合并」
function lbContainerKey(r){
  var t = lbContainerTypeOf(r); // v190：合并键用统一派生类型
  if(t==='display' || t==='stand'){
    var hasName = r.containerName && r.containerName!=='?' && r.containerName!=='';
    if(hasName) return (r.server||'?')+'|'+t+'|'+r.containerName;
    // v1048 根因修复：无自定义名时**必须带坐标**——原实现只按 server|type|名 合并，
    //   导致同服所有展示柜/展示台被并为 1 组（实测 Isl 展示柜 103 个跨 4 个 z、93 个位置合成一组）
    //   ⇒ 组归属取首条坐标 ⇒ 整组被塞进首条所在的那一层（用户实测：柜里的生物散落在不同楼层却同区显示）
    // v1049：分组粒度 =「楼层桶(z/50) + 平面粗格(x,y/3000)」
    //   用户要求「同一区域的展示柜要合并成一行」——精确坐标会让同区几十个柜子各占一行；
    //   改为按楼层与平面粗格合并：同层同块 → 一行；跨层 / 相距 >30 米 → 仍分开（保 v1048 的跨层修复）
    // v1061：未命名展示柜/展台 → **聚落级 + 类名**（不再按几何网格分组）
    //   根因：几何网格(3000)会把同一区域切成 2 组（实测 📍Uncommon 出现「展示柜 ×26」与「×2」两行）；
    //   区域粒度改由渲染前的 _areaIdxOf 分桶统一提供（同区域 → 同一桶 → 一行）
    return (r.server||'?')+'|'+t+'|'+lbFacBase(r.containerClass||'');
  }
  if(t!=='released' && t!=='player'){
    var _fb = lbFacBase(r.containerClass||'');

function lbDlProgUpdate(done,total,active){
  var bar=document.getElementById('lbDlBar'), txt=document.getElementById('lbDlText'), act=document.getElementById('lbDlActive');
  if(!bar) return;
  if(bar.children.length!==total){
    bar.innerHTML='';
    for(var i=0;i<total;i++){
      var seg=document.createElement('div');
      seg.style.cssText='flex:1;border-radius:2px;background:#333;transition:background .3s';
      bar.appendChild(seg);
    }
  }
  var segs=bar.children;
  for(var i=0;i<total;i++){
    if(i<done) segs[i].style.background='#22c55e';
    else if(i===done && done<total) segs[i].style.background='#7c3aed';
    else segs[i].style.background='#333';
  }
  if(txt) txt.textContent = '下载数据 '+done+'/'+total+' ...';

// 聚落聚合：中心地图距离 <3% 的聚落合并为一组（聚合大框），返回簇数组
// v183 阶段2：删除 lbSettleGeneMatch（基因成员已统一归属到 LB._geneGroups，按钮 hasGene 直接查成员）
function lbClusterSettles(settleGroups, cls){
  var curPid = lbCurPid();
  var data = LB._cache && LB._cache.data;
  var playerSet = curPid ? lbPlayerTribes((data&&data.tribesByServer)||{}, curPid) : null;
  function my(m){ return playerSet ? lbMemberIsMy(m, playerSet, curPid) : true; }
  var items = [];
  Object.keys(settleGroups).forEach(function(key){
    var grp = settleGroups[key]; // 生物数组（纯基因聚落为空数组）
    var garr = (LB._geneGroups && LB._geneGroups[key]) || []; // v183：基因成员（统一归属）
    // v177：匹配子集（聚落按钮结构不变，内容按物种过滤）
    // v575：lbSpeciesMatch 同时匹配该物种的蛋/胚胎（蛋 dinoClass=物种英文名）
    var fgrp = cls ? grp.filter(function(r){ return lbSpeciesMatch(r, cls); }) : grp;
    // v183 匹配基因成员（统一过滤 my+lbMemberMatch），替代 lbSettleGeneMatch
    var fgenes = garr.filter(function(m){ return my(m) && (cls ? lbMemberMatch(m, cls) : true); });
    var hasGene = fgenes.length>0;
    // v194：纯基因聚落（无生物）——有我的基因设备（含床支撑的基因实验室/主宅）即显示；全部物种也显示（替代 v184 仅选物种规则）
    if(!fgrp.length && !hasGene) return;
    // v183：聚落归属——优先生物 rec，纯基因聚落用基因成员 settle
    var base = fgrp[0] || grp[0];
    var s = base ? lbSettlementOf(base) : (garr[0] ? garr[0].settle : null);
    var center = null, map = null;
    if(s && !s.scattered){
      var st = lbFindSettlementObj(s);
      if(st && st.center){
        map = lbMapForServer(s.server, st.center.z);
        if(map){
          var p = lbWorldToPx(st.center.x, st.center.y, map);
          center = {x:p.x, y:p.y};
        }
      }
    }
    var mRel = fgrp.filter(function(r){return !r.isEmpty && lbContainerTypeOf(r)==='released';}).length;
    var mPod = fgrp.filter(function(r){return !r.isEmpty && lbContainerTypeOf(r)!=='released';}).length;
    var cnt = mRel + mPod;
    // v183：grp 用全量（名称/地图/离散点），genes 携带基因成员；计数用匹配子集（mRel/mPod）
    items.push({key:key, grp:grp, genes:garr, fgenes:fgenes, settle:s, center:center, map:map, cnt:cnt, mRel:mRel, mPod:mPod, hasGene:hasGene});
  });
  // 贪心聚类：与簇内首个聚落中心地图距离 <3（0~100 坐标）合并
  var clusters = [];
  items.forEach(function(item){
    if(!item.center){ clusters.push([item]); return; }
    var placed = false;
    for(var i=0;i<clusters.length;i++){
      var ref = clusters[i][0].center;
      if(ref && Math.hypot(item.center.x-ref.x, item.center.y-ref.y) < 3){
        clusters[i].push(item); placed = true; break;
      }
    }
    if(!placed) clusters.push([item]);
  });
  clusters.forEach(function(c){ c.sort(function(a,b){ return b.cnt-a.cnt; }); });

    var am = a[0].map?1:0, bm = b[0].map?1:0;
    if(am!==bm) return bm-am;
    return b[0].cnt - a[0].cnt;
  });
  return clusters;
}

// v827：聚落双区 JS/flex 分列瀑布流（列间高度完全独立、互不影响）
// 原理：settle-wrap 内直接子卡（聚合框 .settle-cluster / 单卡 .settle-btn）按容器宽重排成 N 个 .lb-col 列（每列独立 flex column，列宽=卡宽固定），卡贪心放最矮列 → 无 grid 行高互相拉伸
function lbSettleWaterfall(){
  var winW = window.innerWidth || document.documentElement.clientWidth;
  if(winW <= 640) return; // 移动端保留 CSS grid（lbSettleWaterfall 不执行）
  var list = document.getElementById('lbList');
  if(!list) return;
  var defs = [['settle-wrap-cluster', 430], ['settle-wrap-scattered', 225], ['settle-wrap-single', 126]];
  for(var di=0; di<defs.length; di++){
    var sel = '.'+defs[di][0], cardW = defs[di][1];
    var wraps = list.querySelectorAll(sel);
    for(var wi=0; wi<wraps.length; wi++){
      var wrap = wraps[wi];
      // v938：跳过已隐藏的 wrap（聚落详情打开时 lbOpenSettle 设 display:none）——否则 500ms 延迟重排会把详情下隐藏的聚落列表复活，与详情上下并存
      if(wrap.style.display === 'none') continue;
      // 还原：若已有 .lb-col 结构，先取回其中卡
      var cards = [];
      var prevCols = wrap.querySelectorAll(':scope > .lb-col');
      if(prevCols.length){
        prevCols.forEach(function(c){ Array.prototype.forEach.call(c.children, function(x){ cards.push(x); }); });
      } else {
        Array.prototype.forEach.call(wrap.children, function(x){ cards.push(x); });
      }
      if(!cards.length) continue;
      var gap = 8;
      // 容器宽（先设 block 使卡各自真实高度，供分列高度估计）
      wrap.style.display = 'block';
      cards.forEach(function(c){ wrap.appendChild(c); });
      var avail = wrap.clientWidth || (wrap.parentNode ? wrap.parentNode.clientWidth : list.clientWidth);
      if(!avail || avail <= 0){ continue; }
      // 测量各卡独立高度（block 纵向排布，无行拉伸）
      var hs = cards.map(function(c){ return c.getBoundingClientRect().height || 0; });
      var n = Math.max(1, Math.floor((avail + gap) / (cardW + gap)));
      if(cards.length < n) n = Math.max(1, cards.length);
      // 已是相同列数 → 直接转回列结构跳过（防抖动/闪烁）
      var sameCols = prevCols.length === n;
      // 重建为 flex row + N 列
      wrap.innerHTML = '';
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'row';
      wrap.style.alignItems = 'flex-start';
      wrap.style.gap = gap + 'px';
      wrap.style.flexWrap = 'nowrap';
      var cols = [], colH = [];
      for(var i=0; i<n; i++){
        var col = document.createElement('div');
        col.className = 'lb-col';
        col.style.width = cardW + 'px';
        col.style.maxWidth = cardW + 'px';
        col.style.minWidth = cardW + 'px';
        wrap.appendChild(col);
        cols.push(col); colH.push(0);
      }
      // 贪心：每卡放当前最矮列
      for(var ci=0; ci<cards.length; ci++){
        var mi = 0;
        for(var j=1; j<n; j++) if(colH[j] < colH[mi]) mi = j;
        cols[mi].appendChild(cards[ci]);
        colH[mi] += (hs[ci] || 40) + gap;
      }
    }
  }
}

function lbFacilityIconFind(en){

  if(!e) return '';
  var sp = LB_FACILITY_ICON_SPECIAL[e] || LB_FACILITY_ICON_SPECIAL[e.replace(/^Furniture_/,'')];
  if(sp && LB_ICON_BY_NAME[sp]) return sp;
  if(LB_ICON_BY_NAME[e]) return e;
  var eU = e.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[eU]) return eU;
  if(LB_ICON_BY_NAME[e+'_Icon']) return e+'_Icon';
  // 变体裁剪重试（_Large/_Small/_Tek/_Hide/_Balloon/_Barrel/_SM/_Metal/_ToF... 与 Furniture_/BP 前缀尾缀）
  var core = e.replace(/^Furniture_/,'').replace(/_(Large|Medium|Small|Tek|Hide|Balloon|Barrel|SM|Standing|Flower|Metal|ToF|Modern|Simple|ChristmasGift_WW)$/,'').replace(/BP$/,'');
  if(core !== e && core){

  var toks = core.split(/_|(?=[A-Z])/);

    var w = toks[t];

    if(LB_ICON_BY_NAME[w]) return w;
    if(LB_ICON_BY_NAME[w+'_Icon']) return w+'_Icon';
  }

  var enN = core.replace(/[_-\s]/g,'').toLowerCase();

// ① z 分层：base 创建后不再更新 ⇒ 新层 base 必更高 ⇒ 「低于本区基准者绝不并入」（用户第 3 点）
function lbFacLayerize(items, tol){

function lbFacSplitAreas(layerItems, epsXY, minPts){

  }

    var arr = [];
    for(var i=0;i<clu.length;i++){
      var p = clu[i];
      var idx = (p && p._i !== undefined) ? p._i : i;
      if(layerItems[idx]) arr.push(layerItems[idx]);

    if(arr.length) out.push({ items: arr });
  });

  //   实测工作間 17 台孤立空调整批消失（v1054 时只 2 条恰好落在簇内才显示）；归入最近簇可同时保证「不丢点 + 不增区域数」
  var _used = {};

  for(var _li2 = 0; _li2 < layerItems.length; _li2++){ if(!_used[_li2]) _left.push(layerItems[_li2]); }
  _left.forEach(function(it){
    var _bx = Number(it.x)||0, _by = Number(it.y)||0;
    var _bc = null, _bd = Infinity;
    for(var _ci = 0; _ci < out.length; _ci++){
      var _arr = out[_ci].items;
      for(var _ai = 0; _ai < _arr.length; _ai++){

  });

}

function lbCryoBaseUrl(abbr){ return DINO_JSON + abbr + '_cryo.json'; }
function lbCryoLM(abbr){

async function lbTriggerSaveWorld(abbr){
  try{
    var ac = new AbortController();
    var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 20000);
    var r;
    try{ r = await fetch(LB_API + '/api/save_world?server=' + encodeURIComponent(abbr), { method: 'POST', signal: ac.signal }); }
    catch(e){ return false; }

    return !!(r && r.ok);
  }catch(e){ return false; }

// 等 cryo.json.gz Last-Modified 变化（相对触发前基线）；超时 40s（最慢 Isl ≤30s）
async function lbWaitCryoUpdated(abbr, oldLm){
  var deadline = Date.now() + 40000;
  var wait = LB.POLL_MS || 400, step = 0, fails = 0;
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, wait); });
    var now = await lbCryoLM(abbr);
    if(now && now !== LB_LM_404 && now !== oldLm) return true;
    if(oldLm === LB_LM_404 && now && now !== LB_LM_404) return true; // 之前文件缺失→现在出现
    // v988：指数退避（400→800→1600→3000 封顶），探测失败再额外加倍
    //      原 400ms 固定轮询：10 台并发 × 40 秒 ≈ 1000~2000 个 HEAD/次刷新 → 后端线程爆炸退出
    step++;
    fails = now ? 0 : (fails + 1);
    wait = Math.min(3000, (LB.POLL_MS || 400) * Math.pow(2, Math.min(step, 3)));
    if(fails) wait = Math.min(3000, wait * Math.pow(2, Math.min(fails, 2)));
  }
  return false;
}
// v985：已移除 lbWithTimeout —— 它与「lbFetchOnce 内部超时 60s」冲突（单台 3 个文件 × 60s 会超过 90s 而被误杀）；
//       单台耗时由 lbFetchDataJson(90s) 与各文件自身超时兜底。
// 单台增量加载并合并进缓存（先到先加载）：lbLoad([abbr]) 只返回该台 recs → 与旧缓存合并替换该台
async function lbLoadOneServer(abbr){
  try{
    var oldData = (LB._cache && LB._cache.data) || null;
    if(!oldData || !Array.isArray(oldData.recs)) return;
    var d = await lbLoad([abbr], oldData, null);
    if(!d || !Array.isArray(d.recs)) return; // 被新下载取代
    var out = {
      recs: oldData.recs.filter(function(r){ return r.server !== abbr; }).concat(d.recs),
      tribesByServer: Object.assign({}, oldData.tribesByServer || {}),
      worldNowByServer: Object.assign({}, oldData.worldNowByServer || {}),
      players: oldData.players || [],
      structures: oldData.structures || [],
      facilityStructs: oldData.facilityStructs || [],
      geneDevices: oldData.geneDevices || {},
      itemsByServer: Object.assign({}, oldData.itemsByServer || {}), // v971：补字段（原先漏掉 → 单服刷新后物品索引整体丢失，容器查不到物品）
      playersByServer: Object.assign({}, oldData.playersByServer || {}), // v1040：角色→服映射集合（同 itemsByServer，防单服刷新丢失）
      _schemaVer: oldData._schemaVer || LB_SCHEMA_VER
    };
    if(d.itemsByServer && d.itemsByServer[abbr]) out.itemsByServer[abbr] = d.itemsByServer[abbr]; // v971
    if(d.tribesByServer && d.tribesByServer[abbr]) out.tribesByServer[abbr] = d.tribesByServer[abbr];
    if(d.worldNowByServer && d.worldNowByServer[abbr] !== undefined) out.worldNowByServer[abbr] = d.worldNowByServer[abbr];
    if(d.playersByServer && d.playersByServer[abbr]) out.playersByServer[abbr] = d.playersByServer[abbr]; // v1040
    var pm = {};
    (oldData.players || []).forEach(function(p){ if(p && p.eosId) pm[p.eosId] = p; });
    (d.players || []).forEach(function(p){
      if(!p || !p.eosId) return;
      var _o = pm[p.eosId];
      // v1040：合并而非覆盖 —— 单服刷新只带回该服角色信息，直接覆盖会抹掉其它角色的「角色→服」映射与角色名（同「复用路径丢弃字段」缺陷类）
      if(_o){
        var _ps = {};
        Object.keys(p.pidSrv || {}).forEach(function(k){ _ps[k] = p.pidSrv[k]; });
        Object.keys(_o.pidSrv || {}).forEach(function(k){ if(_ps[k] === undefined) _ps[k] = _o.pidSrv[k]; });
        p.pidSrv = _ps;
        var _rl = {};
        Object.keys(p.roles || {}).forEach(function(k){ _rl[k] = p.roles[k]; });
        Object.keys(_o.roles || {}).forEach(function(k){ if(_rl[k] === undefined) _rl[k] = _o.roles[k]; });
        p.roles = _rl;
      }
      pm[p.eosId] = p;
    });
    out.players = Object.keys(pm).map(function(k){ return pm[k]; });
    if(d.structures && d.structures.length) out.structures = (oldData.structures || []).filter(function(s){ return s.server !== abbr; }).concat(d.structures);
    if(d.facilityStructs && d.facilityStructs.length) out.facilityStructs = (oldData.facilityStructs || []).filter(function(s){ return s.server !== abbr; }).concat(d.facilityStructs); // v820
    if(d.geneDevices && d.geneDevices[abbr]) out.geneDevices[abbr] = d.geneDevices[abbr];
    out._lm = Object.assign({}, oldData._lm || {});
    if(d._lm && d._lm[abbr]) out._lm[abbr] = d._lm[abbr];
    LB._cache = { data: out, ts: Date.now() };
    try{ lbCacheSet(out); }catch(e){}
    lbRenderView(out, lbPlayer(), LB.curClass || '');
  }catch(e){}
}
// tamed 刷新执行（从浮窗按钮调用）：多选服务器串行触发 RCON + 进度条
async function lbRefreshTamed(btn){

    var segs = bar.children;
    if(legend) legend.innerHTML = '<span><span style="color:#7c3aed">■</span> 进行中</span><span><span style="color:#38bdf8">■</span> 存档落盘</span><span><span style="color:#22c55e">■</span> 成功</span><span><span style="color:#ef4444">■</span> 失败</span><span><span style="color:#f59e0b">■</span> 跳过/冷却</span>'; // v629：蓝=SaveWorld 存档已落盘
    var ok=0, fail=0;

      }));
      // 0b. 并行触发 SaveWorld
      await Promise.all(sel.map(function(abbr){ return lbTriggerSaveWorld(abbr); }));
      // 0c. 逐台等 cryo 更新（40s 超时）；哪台先更新就先加载哪台（串行队列，防 lbLoad _seq 互斥作废）
      var loadChain = Promise.resolve();
      var _svDone = 0, _loadDone = 0, _loadTotal = 0;
      // v979：阶段 0 心跳计时——让「慢」与「死」可区分（文案 2s 内未变则附上已用时）
      var _hbStart = Date.now();
      var _hb = setInterval(function(){
        var el = document.getElementById('lbProgText');
        if(!el){ clearInterval(_hb); return; }
        var t = (el.textContent || '').replace(/（已用 \d+s[^）]*）/, '');
        if(t.indexOf('存档已落盘') >= 0 || t.indexOf('加载 ') === 0){

      }, 2000);

                return lbLoadOneServer(abbr); // v985：去掉 90s 外层超时（与 60s 内层冲突）
              });
            } else {

          });
        }));
        await loadChain;
      }finally{
        clearInterval(_hb);
      }
      if(_svDone) txt.textContent = '✅ 存档完成（'+_svDone+'/'+sel.length+'），开始刷新已放出…';
    }
    // 2026-08-28 优化：恢复并行刷新——后端已改为每台写独立状态文件 refresh_status_{abbr}.json，
    // 彻底解决单文件 refresh_status.json 并发覆盖根因（之前并行全失败）。并行触发所有服务器
    // （后端线程池 6 并发 RCON），各自等待独立状态文件 + tamed savedAt，总耗时 ≈ 单台而非 4×。
    // 2026-08-28 修复：savedAt 基线必须在「触发前」读取——RCON 触发快（实测 3.2s 内 tamed 已更新），

      return lbGetSavedAt(abbr).then(function(m){ markers[abbr] = m; })
        .catch(function(){ markers[abbr] = ''; });
    }));

    var results = await Promise.all(sel.map(function(abbr, i){

      return lbTrigger(abbr).then(function(r){ return {abbr:abbr, idx:i, r:r}; })

    }));
    // ③ 并行等待各自 tamed savedAt 确认（用触发前基线，互不干扰）
    var waits = await Promise.all(results.map(function(item){
      var abbr = item.abbr, r = item.r || {};
      if(r.cooldown){ return {abbr:abbr, idx:item.idx, skipped:true, done:false}; }
      if(!r.ok){ return {abbr:abbr, idx:item.idx, skipped:false, done:false}; }
      var oldMarker = markers[abbr] || '';
      return lbWaitTamed(abbr, oldMarker).then(function(done){ return {abbr:abbr, idx:item.idx, skipped:false, done:done}; });
    }));
    // ④ 汇总更新进度条
    for(var i=0;i<waits.length;i++){
      var w = waits[i];
      if(w.done){ ok++; segs[w.idx].style.background='#22c55e'; }
      else if(w.skipped){ fail++; segs[w.idx].style.background='#f59e0b'; }
      else { fail++; segs[w.idx].style.background='#ef4444'; }
      txt.textContent=(w.done?'✅ ':(w.skipped?'⏭ ':'❌ '))+LB.servName(w.abbr)+'（'+(w.idx+1)+'/'+sel.length+'）';
    }
    txt.textContent='✅ 已刷新 '+ok+' 台，失败/跳过 '+fail+' 台'+(noToken?'（webhook 模式）':'');

    // v602：全部成功后 1s 直接关闭浮窗——不再依赖蛋刷新 finally（后端 EggProbe 可能卡，finally 迟迟不触发导致浮窗残留）
    if(ok === sel.length && fail === 0){
      setTimeout(function(){
        var o=document.querySelector('.lb-confirm-overlay');
        if(o) o.remove();
      }, 1000);
    }
    lbReloadIncremental(); // 增量重载（并行 + 未变化文件复用）
    // v525：选中服务器同步刷新蛋信息（后端 EggProbe 实时刷全图蛋 → 重拉 egg 数据）
    // v542：EggProbe 必须延迟——同服 ArkTamedDinos 导出 tamed.json 期间并发 EggProbe RCON 会竞争游戏存档，
    // 打断导出导致 tamed.json 只生成部分数据（Ext 实测 150/557）→ 前端重载后放出生物骤减 → 小聚落消失

// _lm 格式：{ abbr:{cryo:'...', tamed:'...'}, ... }；不存在的文件为 LB_LM_404('__404__') 跳过
// 显示格式：今天 HH:MM / 之前 MM-DD HH:MM；无数据隐藏
function lbUpdateDataTime(){

function lbSilentRefresh(){

  var sel = LB.SERVERS.map(function(s){ return s.abbr; });

    if(LB._eggCache){

      data.recs.forEach(function(r){ if(r._isEgg || r.source==='egg'||r.source==='embryo') _existE[r.dinoId1]=1; }); // v645：识别补 _isEgg（wild 蛋去重）
      Object.keys(LB._eggCache).forEach(function(abbr){

      if(data._settlements) delete data._settlements; // v932：设施数据变化（_lm 变）→ 删聚落强制重建（持久化后不残留旧聚落）

// 增量重载：读 IndexedDB 旧缓存 → lbLoad 并行+Last-Modified 判断（未变化文件复用旧数据）→ 更新缓存渲染
function lbReloadIncremental(){
  var list=document.getElementById('lbList');
  if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 加载数据中...</div>';
  var sel=LB.SERVERS.map(function(s){return s.abbr;});
  // 旧数据源：内存缓存优先，否则 IndexedDB
  var oldPromise = LB._cache && LB._cache.data
    ? Promise.resolve(LB._cache.data)
    : lbCacheGet().then(function(c){ return (c && c.data) ? c.data : null; });
  oldPromise.then(function(oldData){
    lbLoad(sel, oldData, function(p){ // v207：刷新也显示下载进度（分段条）
      if(list){
        if(p.phase==='head') list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 检查数据更新...</div>';
        else { if(!document.getElementById('lbDlBar')) list.innerHTML=lbDlProgHtml(p.total); lbDlProgUpdate(p.done,p.total,p.active); }
      }
    }).then(function(data){
      if(!data) return; // v215：被新下载取代，跳过
      // v549：重载时先并入已有蛋缓存——聚落构建直接含蛋容器（避免蛋后到触发全量重建卡顿；刷新不再卡）
      if(LB._eggCache){
        var _existE = {};
        data.recs.forEach(function(r){ if(r._isEgg || r.source==='egg'||r.source==='embryo') _existE[r.dinoId1]=1; }); // v645：识别补 _isEgg（wild 蛋去重）
        Object.keys(LB._eggCache).forEach(function(abbr){
          (LB._eggCache[abbr]||[]).forEach(function(e){
            if(e.dinoId1 && !_existE[e.dinoId1]){ data.recs.push(e); _existE[e.dinoId1]=1; }
          });
        });
      }
      LB._cache={ data:data, ts:Date.now() };
      LB._prevSettles = (oldData && oldData._settlements) ? oldData._settlements : null; // v935：暂存旧聚落供 ensure 指纹对比
      // v932：手动刷新按 _lm 变化判断——有设施变化才删聚落重建（无变化复用缓存聚落，不白跑 80s）
      var _oldLm2 = (oldData && oldData._lm) ? oldData._lm : {};
      var _newLm2 = data._lm || {};
      if(JSON.stringify(_oldLm2) !== JSON.stringify(_newLm2) && data._settlements) delete data._settlements;
      lbCacheSet(data);
      lbRenderView(data, lbPlayer(), LB.curClass||'');
      // v500：后台加载蛋数据（阶段一：仅缓存，展示 tab 后续接入）
      lbLoadEggs(LB.SERVERS.map(function(s){ return s.abbr; })).catch(function(){});
    }).catch(function(e){
      if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#f87171">❌ 加载失败：'+e+'</div>';
    });
  });
}

    function pickerItemHtml(k, withCnt){

      var nm=lbSpName(k);

      s+=(icon?'<div class="lb-picker-ic"><img src="'+icon+'" loading="lazy"'+lbIconFilterStyle(icon,'biology')+' onerror="this.hidden=true"></div>':'<div class="lb-picker-ic lb-picker-ic-none">?</div>');
      s+='<span class="lb-picker-name">'+nm.zh+(withCnt?' <em class="lb-picker-cnt">'+cnt+'</em>':'')+'</span>';
      if(nm.eng) s+='<span class="lb-picker-en">'+nm.eng+'</span>';
      s+='</div>';

    keys.forEach(function(k){

      if(LB_EXTRA_FORCE.indexOf(k)>=0){ extraCnt++; extraKeys.push(k); return; }
      if(classMap[k]) return; // 普通物种有库存已在主网格
      if(lbIsSpecialCls(k)) return; // v230：特殊生物进变体折叠区（lbSpecial 段收集）
      if(seenCls[k]) return; // v240：按类名去重

        var _spE=findSpeciesByClass(k);

        var _nmE=(_spE&&_spE.name)||'';
        if(/Corrupt|Revenant|Enraged|Corrupted/i.test(_bpE+' '+_nmE)) return; // 腐化系

        if(/\/Missions\/|MissionVariants/i.test(_bpE)) return; // v266：任务怪不显示（狩猎等，用户 2026-08-24）
        extraCnt++; extraKeys.push(k);

    var specSeen={}, specKeys=[];

      if(specSeen[k]) return; // v239：去重标准=类名（用户确认，同英文名不同类名变体全显示）
      specSeen[k]=1;
      specKeys.push(k);

    LB._specialHtml = null;
    LB._extraHtml = null;

// v864：任一折叠展开 → 已驯收缩 30vh、非已驯折叠区占满剩余高度；全收起恢复已驯占满
function lbPickerExtraSync(){
  var dets = document.querySelectorAll('.lb-picker-extra details');
  var any = false;
  for(var i=0;i<dets.length;i++){ if(dets[i].open){ any = true; break; } }
  var ex = document.querySelector('.lb-picker-extra');
  var g = document.getElementById('lbPickerGrid');
  if(ex) ex.classList.toggle('lb-extra-open', any);
  if(g) g.classList.toggle('lb-picker-grid-shrink', any);
  lbPickerFitScroll();
}
// v865：内容不满的滚动容器收紧到「内容恰好高度」——刚好无滚动条、不留大空白；内容超限才保持滚动
function lbPickerFitScroll(){
  var els=[];
  var g=document.getElementById('lbPickerGrid'); if(g) els.push(g);
  var ex=document.querySelector('.lb-picker-extra'); if(ex) els.push(ex);
  els.forEach(function(el){
    var prev=el.style.maxHeight;
    el.style.maxHeight='';                       // 先放开量自然内容高
    var sh=el.scrollHeight, ch=el.clientHeight;
    if(sh>0 && sh < ch - 1){ el.style.maxHeight = sh+'px'; }  // 内容不满 → 高度=内容（不撑出空白/滚动条）
    else el.style.maxHeight = prev;
  });
}

// v867：隐藏无可见结果的二级分组标题（跨列 head/分隔，其后到下一 head 之间无可见 item 则隐藏）
function lbPickerHideEmptySections(gridEl){
  var kids = Array.prototype.slice.call(gridEl.children||[]);
  for(var i=0;i<kids.length;i++){
    var k=kids[i];
    if(k.classList && k.classList.contains('lb-picker-item')) continue;
    if(k.getAttribute('data-cls')) continue;
    if((k.getAttribute('style')||'').indexOf('grid-column:1/-1')<0) continue; // 仅跨列标题/分隔线
    var any=false;
    for(var j=i+1;j<kids.length;j++){
      var s=kids[j];
      if(s.classList && s.classList.contains('lb-picker-item')){
        if(s.style.display!=='none'){ any=true; break; }

      } else { break; } // 遇到下一标题/分隔

  }
}

// 读取 HA 前端 token（页面部署在 HA /local/ 同域时可用；HA 前端登录后存于 localStorage.hassTokens）
function lbHaToken(){
  try{
    var t = localStorage.getItem('hassTokens');
    if(!t) return null;
    var parsed = JSON.parse(t);
    // 兼容两种格式：数组 [{access_token}]（旧）与对象 {access_token}（新）
    if(Array.isArray(parsed) && parsed.length && parsed[0] && parsed[0].access_token) return parsed[0].access_token;
    if(parsed && parsed.access_token) return parsed.access_token;
    return null;
  }catch(e){ return null; }
}
// 手机 HA Companion App：通过官方 externalAuth bridge 获取 token（回调协议，非 Promise）
// V1: window.externalApp.getExternalAuth('{"callback":"externalAuthSetToken","force":false}') → 原生调 window.externalAuthSetToken(true, authJson)
// V2: window.externalAppV2.postMessage({type:'getExternalAuth', payload:{callback,force}}) → 同上回调
function lbAppToken(){
  return new Promise(function(resolve){
    // 关键：iframe 内（self!==top）bridge 消息必然被 V2 origin 校验丢弃（!isMainFrame），
    // 直接返回 null 跳过，避免白等 6s 超时（App 内 Lovelace iframe 场景 12s 无提示空窗的根因）
    try{ if(window.self !== window.top) return resolve(null); }catch(e){}
    try{
      var hasV1 = window.externalApp && typeof window.externalApp.getExternalAuth === 'function';
      var hasV2 = window.externalAppV2 && typeof window.externalAppV2.postMessage === 'function';
      if(!hasV1 && !hasV2) return resolve(null);
      // 安装回调：原生通过它返回 token（auth 可能是 JSON 字符串或对象）
      window.externalAuthSetToken = function(ok, auth){
        var t = null;
        if(ok && auth){
          if(typeof auth === 'string'){ try{ t = JSON.parse(auth); }catch(e){ t = null; } }
          else t = auth;
          resolve((t && t.access_token) || null);
        } else {
          resolve(null);
        }
        clearTimeout(lbAppToken._tm);
      };
      var cb = 'externalAuthSetToken';
      if(hasV2){
        window.externalAppV2.postMessage(JSON.stringify({ type:'getExternalAuth', payload:{ callback:cb, force:false } }));
      } else {
        window.externalApp.getExternalAuth(JSON.stringify({ callback:cb, force:false }));
      }
      // 超时兜底（原生无响应 → 继续 fallback）
      lbAppToken._tm = setTimeout(function(){ resolve(null); }, 6000);
    }catch(e){ resolve(null); }
  });
}
// 同源 iframe 读取父框架 token：页面若嵌入 Lovelace iframe（与顶层同源），
// 顶层 HA 前端在 App 内能通过 externalAuth 拿到 token（存在 window.hassConnection → {auth, conn}），
// 同源 iframe 可直接访问 window.parent.hassConnection 读取 auth.accessToken
// 作用域：仅本页被 iframe 嵌入时尝试；直接顶层打开时 window.parent===window 自动跳过
function lbParentToken(){
  return new Promise(function(resolve){
    try{
      var p = window.parent;
      if(!p || p === window || !p.hassConnection || typeof p.hassConnection.then !== 'function'){
        return resolve(null);
      }
      var done = false;
      var tm = setTimeout(function(){ if(!done){ done = true; resolve(null); } }, 5000);
      p.hassConnection.then(function(conn){
        if(done) return;
        done = true; clearTimeout(tm);
        var auth = conn && conn.auth;
        var t = (auth && auth.accessToken) || (auth && auth.data && auth.data.access_token) || null;
        resolve(t || null);
      }).catch(function(){
        if(done) return;
        done = true; clearTimeout(tm);
        resolve(null);
      });
    }catch(e){ resolve(null); }
  });
}
// 获取有效 HA token：手机 App 走 externalAuth bridge；iframe 嵌入读父框架 token；浏览器读 localStorage（access_token 过期则用 refresh_token 换新并写回）
async function lbHaTokenRefresh(){
  try{
    var appTok = await lbAppToken();
    if(appTok) return appTok;
  }catch(e){}
  try{
    var parentTok = await lbParentToken();
    if(parentTok) return parentTok;
  }catch(e){}
  try{
    var raw = localStorage.getItem('hassTokens');
    if(!raw) return null;
    var t = JSON.parse(raw);
    if(Array.isArray(t)){ t = t[0] || null; }
    if(!t || !t.access_token) return null;
    // 未过期直接返回（提前 60s 刷新）
    if(!t.expires || Date.now() < (Number(t.expires) - 60000)) return t.access_token;
    if(!t.refresh_token) return null;
    var form = new URLSearchParams();
    form.set('grant_type', 'refresh_token');
    form.set('refresh_token', t.refresh_token);
    if(t.clientId) form.set('client_id', t.clientId);
    var res = await fetch('/auth/token', { method: 'POST', body: form });
    if(!res.ok) return null;
    var nt = await res.json();
    if(!nt.access_token) return null;
    t.access_token = nt.access_token;
    t.token_type = nt.token_type || 'Bearer';
    if(nt.refresh_token) t.refresh_token = nt.refresh_token;
    t.expires_in = nt.expires_in || 1800;
    t.expires = Date.now() + (nt.expires_in || 1800) * 1000;
    localStorage.setItem('hassTokens', JSON.stringify(t));
    return t.access_token;
  }catch(e){ return null; }
}

// 触发后前端自轮询：savedAt 变化即确认 tamed 已更新（间隔 POLL_MS，超时 POLL_TIMEOUT）
// v988：指数退避（400→800→1600→3000 封顶）——原固定 400ms 轮询在 10 台并发下每次刷新向后端打上千个请求，
//       导致后端线程爆炸退出（cloudflared 报 actively refused → 502）
async function lbWaitTamed(abbr, oldMarker){
  var deadline = Date.now() + LB.POLL_TIMEOUT;
  var wait = LB.POLL_MS, step = 0;
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, wait); });
    var now = await lbGetSavedAt(abbr);
    if(now && now !== oldMarker) return true;
    step++;
    wait = Math.min(3000, LB.POLL_MS * Math.pow(2, Math.min(step, 3)));
  }
  return false;
}
// 解析静态状态文件内容（AppDaemon 经 shell_command 写入的是 base64 编码 JSON；兼容纯 JSON）
function lbParseStatusFile(text){
  try{
    var s = String(text||'').trim();
    if(!s) return null;
    // 尝试直接 JSON
    try{ return JSON.parse(s); }catch(e){}
    // base64 解码后再 JSON
    try{
      var dec = decodeURIComponent(escape(atob(s)));
      return JSON.parse(dec);
    }catch(e2){}
    return null;
  }catch(e){ return null; }
}
// 免认证轮询 AppDaemon 写入的静态状态文件（手机 App 无 token 也能读）：精确判断 ok/cooldown/error
// 2026-08-28 优化：新架构读每台独立状态文件 refresh_status_{abbr}.json（后端同时写单文件+独立文件，
// 独立文件保证多台并行时互不覆盖——单文件并发覆盖是之前并行全失败的根因）
async function lbWaitStatusFile(abbr, oldTs){
  var deadline = Date.now() + 15000;
  // 新架构：独立文件路径；旧架构：单文件（兼容）
  var sfPath = (LB_ARCH === 'new')
    ? (LB_STATUS + '/refresh_status_' + abbr + '.json?cb=' + Date.now())
    : (LB_STATUS + '/refresh_status.json?cb=' + Date.now());
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, 300); }); // 2026-08-28 提速：800ms→300ms，后端 RCON 已修复快返回，减少前端等待
    try{
      var sf = await fetch(sfPath, { cache: 'no-store' });
      if(sf.ok){
        var obj = lbParseStatusFile(await sf.text());
        if(!obj) continue;
        var attrs = obj.attributes || {};
        if(attrs.server === abbr && attrs.ts && attrs.ts !== oldTs){
          if(attrs.cooldown) return {cooldown:true, ok:false, ts:attrs.ts};
          if(attrs.ok) return {cooldown:false, ok:true, ts:attrs.ts};
          return {cooldown:false, ok:false, error: attrs.error || 'RCON failed', ts:attrs.ts};
        }
      }
    }catch(e){}
  }
  return {cooldown:false, ok:false, error:'timeout'};
}

// 触发：优先调 HA script.refresh_tamed（发事件）→ AppDaemon RCON；无 token（手机 App）走免认证 webhook
// 2026-08-28 修复：新架构（LB_ARCH==='new'）完全脱离 HA，无 HA token → 直接走 webhook 接口（后端无需认证）；fetch 加 AbortController 超时防永久卡
async function lbTrigger(abbr){
  if(LB_ARCH === 'new'){
    // 新架构：直接走免认证 webhook（data.whiterober.ccwu.cc/api/webhook/refresh_tamed，无需 token）
    try{
      var baseTs = await lbGetStatusFile(abbr);
      var ac = new AbortController();
      var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 20000); // 20s 超时：后端 RCON 同步阻塞时不再永久挂起
      var hw;
      try{ hw = await fetch(LB_API + '/api/webhook/refresh_tamed?server=' + encodeURIComponent(abbr), { method: 'POST', signal: ac.signal }); }
      catch(e){ return {ok:false, server:abbr, error:'timeout'}; }
      finally{ clearTimeout(_t); }
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      var st = await lbWaitStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 静态文件超时/无结果 → 仍按触发成功返回，交给 savedAt 兜底确认
      return {ok:true, server:abbr, webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  var token = await lbHaTokenRefresh();
  if(!token){
    // 无 token（手机 App / 未登录浏览器）：走免认证 webhook → 事件 refresh_tamed_request → AppDaemon RCON
    try{
      // 触发前记录静态状态文件基线 ts（时效判断：只接受本次触发后的新结果）
      var baseTs = await lbGetStatusFile(abbr);
      var hw = await fetch(LB_API + '/api/webhook/refresh_tamed?server=' + encodeURIComponent(abbr), { method: 'POST' });
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      // 轮询免认证静态状态文件（AppDaemon 写入）：精确判断 ok/cooldown/error
      var st = await lbWaitStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 静态文件超时/无结果 → 仍按触发成功返回，交给 savedAt 兜底确认
      return {ok:true, server:abbr, webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  try{
    // 触发前记录 sensor 基线 ts（时效判断：只接受本次触发后的新结果）
    var baseTs = null;
    try{
      var b = await fetch(LB_API + '/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
      if(b.ok){
        var bj = await b.json();
        var ba = bj.attributes || {};
        if(ba.server === abbr) baseTs = ba.ts;
      }
    }catch(e){}
    var res = await fetch(LB.SVC_REFRESH, {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({server: abbr})
    });
    if(!res.ok) return {ok:false, server:abbr, error:'HTTP '+res.status};
    // 轮询 AppDaemon 写入的 RCON 结果（含 cooldown），最长 15s；只接受 ts 变化的本次结果
    var deadline = Date.now() + 15000;
    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 800); });
      var st;
      try{
        st = await fetch(LB_API + '/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
        if(st.ok){
          var obj = await st.json();
          var attrs = obj.attributes || {};
          if(attrs.server === abbr && attrs.ts !== baseTs){
            if(attrs.cooldown) return {ok:true, server:abbr, cooldown:true};
            if(attrs.ok) return {ok:true, server:abbr};
            return {ok:false, server:abbr, error: attrs.error || 'RCON failed'};
          }
        }
      }catch(e){}
    }
    // 超时未获取到本次状态 → 按成功让 savedAt 轮询确认兜底
    return {ok:true, server:abbr};
  }catch(e){
    return {ok:false, server:abbr, error:String(e)};
  }
}

async function lbWildTrigger(abbr, species){

      var hw;

      catch(e){ return {ok:false, server:abbr, error:'timeout'}; }
      finally{ clearTimeout(_t); }
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      var st = await lbWaitWildStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 状态超时/无结果：直接跳过该服（不再乐观等文件 30s；2026-08-12 用户确认，服务器重启时快速跳过）
      return {ok:false, server:abbr, error: st.error || 'timeout', webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  var token = await lbHaTokenRefresh();
  if(!token){
    try{
      var baseTs = await lbGetWildStatusFile(abbr);
      var hw = await fetch(LB_API + '/api/webhook/search_wild?server=' + encodeURIComponent(abbr) + '&species=' + encodeURIComponent(species), { method: 'POST' });
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      var st = await lbWaitWildStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 状态超时/无结果：直接跳过该服（不再乐观等文件 30s；2026-08-12 用户确认，服务器重启时快速跳过）

    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  try{
    var baseTs = null;
    try{
      var b = await fetch(LB_API + '/api/states/sensor.search_wild_status', { headers: { 'Authorization': 'Bearer ' + token } });
      if(b.ok){
        var bj = await b.json();
        var ba = bj.attributes || {};
        if(ba.server === abbr) baseTs = ba.ts;
      }
    }catch(e){}
    var res = await fetch(LB.SVC_WILD, {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({server: abbr, species: species})
    });
    if(!res.ok) return {ok:false, server:abbr, error:'HTTP '+res.status};
    var deadline = Date.now() + 15000;
    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 300); }); // 2026-08-28 提速：800ms→300ms（对齐 tamed）
      var st;
      try{
        st = await fetch(LB_API + '/api/states/sensor.search_wild_status', { headers: { 'Authorization': 'Bearer ' + token } });
        if(st.ok){

          var attrs = obj.attributes || {};

            if(attrs.ok) return {ok:true, server:abbr};

          }
        }
      }catch(e){}
    }

async function lbWaitWild(abbr, species, oldMarker){

  while(Date.now() < deadline){

// 找距离玩家最近的野生龙（欧氏距离 x/y/z；服务器维度加权：玩家所在服优先）
async function lbNearestWild(pos, excludeId){
  var cls = LB.curClass;
  var wc = (LB._wildCache && LB._wildCache[cls]) || null;
  if(!wc) return null;
  var species = cls.replace(/_C$/,'');
  var best = null, bestDist = Infinity;
  var servers = [pos.server].concat(LB.SERVERS.map(function(s){ return s.abbr; }));
  var tried = {};
  for(var i=0;i<servers.length;i++){
    var abbr = servers[i];
    if(abbr==='Bob' || tried[abbr]) continue;
    tried[abbr] = true;
    var ent = wc[abbr];
    if(!ent || !Array.isArray(ent.dinos)) continue;
    // 玩家不在该服时，该服候选仅用于兜底（权重放大：非所在服距离 +1e9）
    var off = (abbr === pos.server) ? 0 : 1e9;
    for(var j=0;j<ent.dinos.length;j++){
      var w = ent.dinos[j];
      if(w.dinoClass !== cls) continue;
      if(!w.id1 && !w.id2) continue;
      if(excludeId && String(w.id1)+'_'+String(w.id2) === excludeId) continue; // v315：排除已死/当前目标（旧缓存仍含死目标）
      if(!lbTrackableWild(w)) continue; // v782：剔除未成年/无坐标（追踪最近不应选中分布地图上没有的幼龙）
      var dx = Number(w.x||0) - pos.x, dy = Number(w.y||0) - pos.y, dz = Number(w.z||0) - pos.z;
      var d = Math.sqrt(dx*dx + dy*dy + dz*dz) + off;
      if(d < bestDist){ bestDist = d; best = w; }
    }
  }
  return best;
}

async function lbTrackLoc(server, x, y, z){

  try{
    var baseTs = null;
    try{
      var b = await fetch(LB_API + '/api/states/sensor.track_dino_status', { headers: isNew ? {} : { 'Authorization': 'Bearer ' + token } });
      if(b.ok){ var bj = await b.json(); var ba = bj.attributes || {}; if(ba.server === server) baseTs = ba.ts; }
    }catch(e){}
    var ac = new AbortController();
    var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 20000);
    var res;

        method:'POST', signal: ac.signal,

      });
    }catch(e){ return false; }

    if(!res.ok) return false;

    }
    return false;
  }catch(e){ return false; }
}

function lbFmtTs(ts){
  if(!ts) return '-';
  var d = new Date(Number(ts));
  if(isNaN(d.getTime())) return '-';
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours())+':'+pad(d.getMinutes());
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  return sameDay ? hm : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
}

function lbSettleSameBatchColor(r, Z){
  var zv = Number(Z);
  if(!isFinite(zv)) return 'rgba(148,163,184,.9)';
  var zs = [];
  try{ (LB._settleBioMap||[]).forEach(function(x){ var v = Number(x && x.containerZ); if(isFinite(v)) zs.push(v); }); }catch(e){}
  try{ (LB._settleFacMap||[]).forEach(function(g){ ((g && g.items)||[]).forEach(function(it){ var v = Number(it && it.z); if(isFinite(v)) zs.push(v); }); }); }catch(e){}
  if(zs.length){
    zs.sort(function(a,b){ return a-b; });
    var _lo = zs[0], _hi = zs[zs.length-1];
    return (_hi > _lo) ? lbZHeat(zv, _lo, _hi) : lbZHeat(_lo, _lo, _hi);
  }
  var _b = null;
  try{ _b = lbSettleBand(String((r && r.server) || LB.tab || '')); }catch(e){ _b = null; }
  if(_b && _b[1] > _b[0]) return lbZHeat(zv, _b[0], _b[1]);
  if(_b && _b[1] === _b[0]) return lbZHeat(_b[0], _b[0], _b[1]);
  return '#fbbf24';
}

// v959：离散聚落设施 chips 单击——地图浮窗（与 lbOpenBioMap 同款界面；单设施标 1 点，×N 合并项标多点）
function lbOpenFacMap(k){

  if(!g) return;

  var body = document.getElementById('lbBreedOverlayBody');

  var items = (g.items || []).filter(function(it){ return it && isFinite(Number(it.x)) && isFinite(Number(it.y)) && (Number(it.x)!==0 || Number(it.y)!==0); });
  var h = '';
  h += '<div style="font-weight:bold;font-size:14px;color:#fff;text-align:center;margin-bottom:8px">'+(g.label || '设施')
    + (g.en ? ' <span style="opacity:.55;font-size:10px;font-weight:normal">'+g.en+'</span>' : '')
    + (items.length > 1 ? ' <span style="color:#a78bfa;font-size:12px">×'+items.length+'</span>' : '') + '</div>';
  if(items.length){
    var it0 = items[0];
    var map0 = lbMapForServer(it0.server || LB.tab, isFinite(Number(it0.z)) ? Number(it0.z) : undefined);
    if(map0){

      if(items.length <= 1){
        h += '<div style="font-weight:bold;font-size:13px;color:#fff;text-align:center;margin-bottom:8px">'+lat0+' '+lon0+'</div>';
      }
      // v960：点色=页面通用海拔色——优先本批设施 z 带（同批无级渐变，与离散聚落卡片一致 v760）；
      // 单点/退化批带走该服通用 z 带（lbSettleBand，同普通聚落单点着色 v774）；无带时取带中档保有色。
      var _zs = items.map(function(it){ return Number(it.z); }).filter(function(v){ return isFinite(v); }).sort(function(a,b){ return a-b; });
      var _zlo = _zs.length ? _zs[0] : null, _zhi = _zs.length ? _zs[_zs.length-1] : null;
      function _facDot(it){
        var zv = Number(it.z);
        if(!isFinite(zv)) return 'rgba(148,163,184,.9)'; // 无 z：中性灰（无从着色）
        if(_zlo !== null && _zhi !== null && _zhi > _zlo) return lbZHeat(zv, _zlo, _zhi); // 多点：本批同色渐变
        var _b = null;
        try{ _b = lbSettleBand(String(it.server || LB.tab || '')); }catch(e){ _b = null; } // 单点/退化：该服通用 z 带
        if(_b && _b[1] > _b[0]) return lbZHeat(zv, _b[0], _b[1]);
        if(_b && _b[1] === _b[0]) return lbZHeat(_b[0], _b[0], _b[1]); // 退化带：取中档保有色
        return '#fbbf24'; // 极端兜底（该服无带坐标数据）
      }
      var imgName = map0.img.replace(/_s$/,'');
      h += '<div class="lb-fac-map" style="position:relative;border-radius:10px;overflow:hidden;line-height:0;border:1px solid #2a2a3a">'
        + '<img src="'+LB_MAP_BASE+imgName+LB_MAP_EXT+'" style="width:100%;height:auto;display:block">';
      // v961：多点时每点旁加坐标徽章（LL），自动避让（按 y 排序，过近则逐级下移；百分比碰撞检测）
      var _dots = items.map(function(it){
        var p = lbWorldToPx(Number(it.x), Number(it.y), map0);
        var _lat = (Number(it.y)/map0.multLat + map0.shiftLat).toFixed(2);
        var _lon = (Number(it.x)/map0.multLon + map0.shiftLon).toFixed(2);
        return { it: it, p: p, lat: _lat, lon: _lon, dy: 0 };
      });
      if(_dots.length > 1){
        _dots.sort(function(a,b){ return a.p.y - b.p.y; });
        var _placed = [];
        _dots.forEach(function(d){
          var dy = 0, guard = 0;
          while(guard++ < 40){
            var clash = _placed.some(function(q){ return Math.abs(q.x - d.p.x) < 6.5 && Math.abs(q.y - (d.p.y + dy)) < 4.2; });
            if(!clash) break;

      _dots.forEach(function(d){

          + _badge
          + '</div>';
      });
      h += '</div>';
    } else {
      h += '<div style="color:#666;font-size:12px;text-align:center;padding:20px">该服务器无地图</div>';
    }
  } else {
    h += '<div style="color:#666;font-size:12px;text-align:center;padding:20px">无坐标</div>';
  }
  body.innerHTML = h;
  ov.style.display = 'block';
}
// v963：设施点位点击——默认不显示徽章，点某点才显示该点「坐标+海拔」（再点收起；点其他点自动切换）

// 拉取所有服联盟文件（缓存；force 强制重拉——地图信息刷新按钮用，补回拉取失败/缺失的服）
async function lbLoadAlliances(force){
  if(LB._alliancesByServer && !force) return LB._alliancesByServer;
  var map = {};
  var tasks = (LB.SERVERS||[]).filter(function(s){ return s.abbr!=='Bob'; }).map(function(s){
    return fetch(DINO_JSON + s.abbr + '_alliances.json?cb=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && Array.isArray(j.alliances)) map[s.abbr] = j; })
      .catch(function(){});
  });
  await Promise.all(tasks);
  LB._alliancesByServer = map;
  return map;
}

// v532：触发所有服 ListPlayers（原生 RCON 在线玩家）→ 拉 {abbr}_online.json

// 当前角色所在联盟（默认选中）
function lbMyAlliance(){
  var data = LB._cache && LB._cache.data;
  if(!data || !data.tribesByServer) return null;
  var mine = lbPlayerTribes(data.tribesByServer, LB.curPid);
  var keys = Object.keys(mine);
  for(var i=0;i<keys.length;i++){
    var k = keys[i]; var p = k.indexOf(':'); if(p<0) continue;
    var t = data.tribesByServer[k.slice(0,p)] && data.tribesByServer[k.slice(0,p)][k.slice(p+1)];
    if(t && Array.isArray(t.alliances) && t.alliances.length) return t.alliances[0];
  }
  return null;
}

// 收集联盟成员（联盟id → 各服部落 members 角色，按 pid 去重）
function lbCollectAllianceMembers(alliId){
  var data = LB._cache && LB._cache.data;
  var out = {};
  var map = LB._alliancesByServer || {};
  Object.keys(map).forEach(function(abbr){
    var j = map[abbr];
    (j.alliances||[]).forEach(function(a){
      if(String(a.id)!==String(alliId)) return;
      (a.members||[]).forEach(function(tid){
        var t = data && data.tribesByServer && data.tribesByServer[abbr] && data.tribesByServer[abbr][String(tid)];
        if(!t || !Array.isArray(t.members)) return;
        t.members.forEach(function(m){
          if(!m || m.pid===undefined || m.pid===null) return;
          var key = String(m.pid);
          if(!out[key]) out[key] = { pid:m.pid, name:m.name||'', eosId:m.eosId||'', tribes:[], alliName:a.name||'' }; // v566：记录成员来源联盟名（跨服收集时每页显示各自联盟）
          if(out[key].tribes.indexOf(abbr+':'+tid)<0) out[key].tribes.push(abbr+':'+tid);
        });
      });
    });
  });
  return Object.keys(out).map(function(k){ return out[k]; });
}

// pid → eosId（data.players roles 反查）
function lbPidToEos(pid){
  var data = LB._cache && LB._cache.data;
  if(!data || !Array.isArray(data.players)) return null;
  var s = String(pid);
  for(var i=0;i<data.players.length;i++){
    var pl = data.players[i];
    if(pl && pl.roles && typeof pl.roles==='object' && pl.roles[s]!==undefined) return pl.eosId;
  }
  return null;
}

// v532：只查在线成员——ListPlayers 已给出每成员所在服，仅对该服查 1 次 PlayerPos；离线直接跳过
async function lbAlliancePosQuery(members, online, token, onProgress){
  var eosToSrv = {};
  Object.keys(online).forEach(function(abbr){
    (online[abbr].players||[]).forEach(function(p){
      if(p && p.eosId && !eosToSrv[p.eosId]) eosToSrv[p.eosId] = abbr;
    });
  });
  var results = [];
  for(var i=0;i<members.length;i++){
    if(LB._alliCancel) break;
    var m = members[i];
    if(onProgress) onProgress({done:i, total:members.length, cur:m.name||('#'+m.pid)});
    var eos = m.eosId || lbPidToEos(m.pid);
    if(!eos){ results.push({pid:m.pid, name:m.name, pos:null, reason:'no_eos', alliName:m.alliName||''}); continue; }
    var srv = eosToSrv[eos];
    if(!srv){ results.push({pid:m.pid, name:m.name, pos:null, reason:'offline', alliName:m.alliName||''}); continue; } // 不在线：跳过
    var pos = await lbQueryPlayerPos(srv, token, eos);
    results.push({pid:m.pid, name:m.name, pos:pos, reason: pos?'found':'offline', alliName:m.alliName||''});
  }
  return results;
}

    + '<span onclick="event.stopPropagation();lbAllianceClose()" title="关闭" style="cursor:pointer;color:#aaa;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;height:22px;width:22px"><svg viewBox="5 5 14 14" style="width:22px;height:22px;display:block;fill:currentColor"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></svg></span>'

  var list = '';

  if(offline.length) list += '<div style="font-size:12px;color:#94a3b8;margin-top:8px;text-align:center">离线：'+offline.map(function(r){return escapeHtml(r.name||r.pid);}).join('、')+'</div>';
  body.innerHTML = head
    + '<div onclick="event.stopPropagation()" style="position:relative">'
    + '<button onclick="event.stopPropagation();lbWildDistScrollBy(-1)" title="上一张" style="position:fixed;left:0;top:0;bottom:0;width:44px;z-index:20;background:transparent;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:30px;line-height:1;opacity:.5">‹</button>'
    + '<div id="lbWildDistScroll" class="lb-wild-dist-scroll" style="display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch">'
    + pages.map(function(p){ return p.replace('style="flex:0 0 100%', 'style="scroll-snap-align:start;flex:0 0 100%'); }).join('')
    + '</div>'
    + '<button onclick="event.stopPropagation();lbWildDistScrollBy(1)" title="下一张" style="position:fixed;right:0;top:0;bottom:0;width:44px;z-index:20;background:transparent;border:none;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:30px;line-height:1;opacity:.5">›</button>'

  var _hs = document.getElementById('lbWildDistScroll');
  var _ht = document.getElementById('lbAlliHeadTxt');
  function lbAlliHeadUpd(){
    if(!_hs || !_ht || !pageMeta.length) return;
    var idx = Math.round(_hs.scrollLeft / _hs.clientWidth);
    if(idx < 0) idx = 0;
    if(idx >= pageMeta.length) idx = pageMeta.length - 1;
    var m = pageMeta[idx];
    _ht.textContent = '📌 '+(m.alliName || alli.name || '联盟')+' · '+LB.servName(m.abbr)+'（'+m.n+' 人）'; // v566：联盟名也随页切换（每页成员实际联盟）

    if(_bp) _bp.style.opacity = (idx<=0) ? '0' : '.5';
    if(_bn) _bn.style.opacity = (idx>=pageMeta.length-1) ? '0' : '.5';
  }
  if(LB._alliHeadUpd && _hs) _hs.removeEventListener('scroll', LB._alliHeadUpd);
  LB._alliHeadUpd = lbAlliHeadUpd;
  if(_hs) _hs.addEventListener('scroll', lbAlliHeadUpd);
  lbAlliHeadUpd();
  LB._alliLastPageMeta = pageMeta; // v565：供 lbAllianceServerMap 创建 track 时挂载（轮询只刷当前页）
  // v568：进入自动滚动到点击服所在页（不重排页序；滚动触发 scroll → head/翻页按钮联动更新）
  if(focusAbbr && pageMeta.length>1){

    for(var i=0;i<pageMeta.length;i++){ if(pageMeta[i].abbr===focusAbbr){ _fi=i; break; } }

  }
