/* #lbList 隐藏原生滚动条（v363 方案B：滚动条不占内容宽度；overlay 已废弃回退 auto，故用隐藏方案） */

.file-item.selected .fi-species,.file-item.selected .fi-name,.file-item.selected .fi-level,.file-item.selected .fi-size,.file-item.selected .file-name{color:#fff!important}

.cand-row .cand-num{width:20px;text-align:center;color:#666;font-weight:600}
.cand-row.selected .cand-num{color:#ccc}
.cand-row .cand-stat{text-align:center;min-width:20px}
.cand-row .cand-stat .cw{color:#a78bfa;font-weight:600}
.cand-row .cand-stat .cm{font-weight:600;text-shadow:0 0 6px #f59e0b,0 0 12px #f59e0b40}
.cand-row.selected .cand-stat .cw{color:#fff}
.cand-row.selected .cand-stat .cm{text-shadow:0 0 6px #fbbf24,0 0 12px #fbbf2440}
.cand-row .cand-stat .cd{color:#666;font-size:10px}
.cand-row.selected .cand-stat .cd{color:#ccc}
.cand-row .cand-score{color:#555;font-size:10px;text-align:right;min-width:20px}
.cand-row.selected .cand-score{color:#ccc}
.cand-row.selected .cand-info{color:#ccc!important}
.mut-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;background:#1a1a2e;border:1px solid #2a2a3a;cursor:pointer;font-size:11px;color:#888;transition:all .15s;user-select:none}
.mut-chip:hover{background:#2a2a4e;color:#ccc}
.mut-chip.has-val{color:#c4b5fd;border-color:#7c3aed;background:#2e1065;font-weight:600} // v165：选中增强——深紫底+实色紫边框+淡紫加粗（原来边框 33 透明度几乎不可见）
.mut-chip.editing{flex:1 0 100%;gap:8px;padding:8px 12px;background:#111;border:1px solid #7c3aed;color:#e0e0e0;cursor:default}
.mut-chip.editing input{flex:1;background:none;border:none;color:#e0e0e0;font-size:14px;outline:none;text-align:right;min-width:0}
.mut-chip.editing input::-webkit-outer-spin-button,.mut-chip.editing input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* v166：移动端繁育栏两行布局——行1=属性+基因按钮（居中），行2=操作按钮（刷新野生+取消，居中）；桌面端不受影响 */
@media (max-width: 560px){
  #lbBreedBar > div{flex-wrap:wrap;justify-content:center;row-gap:6px}
  #lbBreedAttrs{flex-wrap:wrap;justify-content:center}
  #lbBreedGeneBtn{margin-left:4px}
  #lbBreedActions{flex:1 1 100%;justify-content:center}
  #lbBreedBar > div > span[style*="flex:1"]{display:none}
  /* v326：移动端刷新野生内联区——确认搜索按钮和进度条另起一行（父容器 flex-wrap:wrap 下 flex-basis:100% 换行）；按钮整行居中 */
  /* v328：进度条 flex-basis 加 !important（内联 flex:1 shorthand 含 flex-basis:0%，优先级高于外部 CSS，导致换行失效） */
  /* v439：移动端——服务器多选独占一行（flex-basis:100%），分布地图+刷新野生共享下一行（flex:1 平分），进度条再另起一行 */
  #lbWildInline #lbServersWild{flex-basis:100%!important;flex-grow:0!important}
  #lbWildInline #lbWildGoBtn{flex:1;display:flex;justify-content:center;align-items:center}
  #lbWildInline #lbWildDistBtn{flex:1;display:flex;justify-content:center;align-items:center}
  #lbWildInline #lbWildProgWrap{flex-basis:100%!important;flex-grow:0!important}
}
/* v329：刷新野生按钮与进度条占位高度对齐（按钮原 29px、进度条 35px 高度差导致切换抖动；通用规则 PC+移动端都生效） */
#lbWildInline #lbWildGoBtn{height:35px}
#lbWildInline #lbWildDistBtn{height:35px} /* v419：分布地图按钮与刷新野生等高 */
#lbWildInline #lbWildProgWrap{min-height:35px}
/* v560：联盟位置查询 loading 改屏幕中间滚动圈（无需文字） */
@keyframes lbSpin{to{transform:rotate(360deg)}}
.lb-spin{width:38px;height:38px;border:4px solid rgba(124,58,237,.18);border-top-color:#7c3aed;border-radius:50%;animation:lbSpin .7s linear infinite;display:inline-block}
/* v421：分布地图滚动容器——隐藏横向滚动条（Firefox scrollbar-width + Webkit 伪元素） */
.lb-wild-dist-scroll{scrollbar-width:none;-ms-overflow-style:none}
.lb-wild-dist-scroll::-webkit-scrollbar{display:none}
</style>

<style>
.tabbar{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
.tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;background:#1a1a24;border:1px solid #2a2a3a;color:#999;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;user-select:none}

.lb-tab{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #333;background:#1a1a24;color:#999;cursor:pointer;user-select:none;transition:all .15s}
.lb-tab:hover{background:#22223a;color:#ccc}
.lb-tab-on{background:#7c3aed22;border-color:#7c3aed;color:#a78bfa;font-weight:600}
/* 服务器 TAB（ASA 后台 server-tab 同款：纯图标 + active 紫高亮 + 数量角标；与选物种按钮统一高度 28px） */
.server-tab{padding:4px 8px;border-radius:6px;border:1px solid #333;cursor:pointer;font-size:14px;background:#1a1a24;color:#ccc;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;position:relative;height:28px}

/* v178：胶囊内基因字符图标（✦ 四角星，略小不撑高） */

/* 物种选择按钮（更像按钮：hover 紫色高亮 + 下拉箭头） */
.lb-class-btn{display:inline-flex;align-items:center;gap:6px;background:#1a1a24;border:1px solid #333;border-radius:8px;color:#ccc;font-size:12px;padding:5px 24px 5px 12px;max-width:280px;min-width:120px;cursor:pointer;text-align:left;overflow:visible;transition:all .15s;user-select:none;position:relative;margin-right:12px;height:28px;flex-shrink:0}

.lb-class-ic{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:36px;height:36px;object-fit:contain;flex-shrink:0}
/* 生物卡片右侧高透物种图标（绝对定位，右缘超出被 overflow:hidden 裁切；filter 用 style 属性注入避免与定位样式冲突） */

.lb-tpl-details > summary{list-style:none;cursor:pointer;user-select:none;font-size:12px;color:#a78bfa;font-weight:600}

/* 聚落视图：v830 三区 JS/flex 分列瀑布流（列间高度完全独立、互不影响）
   - 容器三组：聚合框集合(.settle-wrap-cluster) / 离散集合(.settle-wrap-scattered) / 单聚落集合(.settle-wrap-single)
   - 渲染完成后 lbSettleWaterfall() 将子卡按固定列宽分入 .lb-col（每列独立 flex column），列数随容器宽自动、窗口变窄自动减列
   - v827：聚合框地图固定方形 211（=6 按钮列高，任何按钮数严禁变化，>6 自然撑高外框）
   - v828：单聚落卡三段式=标题(tent+名称)在地图上方、地图固定 112×112、数据行在地图下方右对齐；卡宽 124
   - v830：离散卡 236=112×2+6+6、完整大地图（非 1/4）、数据与标题同行右对齐（不放地图下方） */
.settle-wrap-cluster,.settle-wrap-scattered,.settle-wrap-single{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:10px}

var LB_FSBC_CACHE = {};
function findSpeciesByClass(dinoClass){
  if(!ASB_DB || !ASB_DB._byBp || !dinoClass) return null;
  if(LB_FSBC_CACHE[dinoClass] !== undefined) return LB_FSBC_CACHE[dinoClass];
  var c = dinoClass.replace(/_C$/, '');
  var direct = ASB_DB._byBp[dinoClass] || ASB_DB._byBp[c];
  var out = direct || null;
  if(!out){
    // 第一优先：精确蓝图节点（路径段 `/名.` 后跟点号，排除 _Gauntlet/_Aberrant/_Corrupt 等变体路径）
    // 修复：Bigfoot_Character_BP_C 实为 Gigantopithecus（巨猿），之前被 .Bigfoot_Character_BP 前缀误配到 Gauntlet→Yeti
    for (var key0 in ASB_DB._byBp) {
      if (key0.indexOf('/' + c + '.') >= 0){ out = ASB_DB._byBp[key0]; break; }

    if(!out){

        if (key.indexOf('.' + c) >= 0){ out = ASB_DB._byBp[key]; break; }

        if (key2.indexOf('/' + c) >= 0 || key2.indexOf(c) >= 0){ out = ASB_DB._byBp[key2]; break; }
      }

  return out;
}

// v576：ASB name 是完整名（如 Carcharodontosaurus）而蛋 dinoClass 是短名（Carcha）——改用 findSpeciesByClass 归一为同一 ASB 物种对象比较
function lbSpeciesMatch(r, cls){
  if(!cls) return true;
  if(r.dinoClass === cls) return true;
  // v756-P1b2：条件放宽含 _isEgg —— 恐爪龙等 Val/Gen 巢蛋走 source='wild' 通道（v755 只认 egg/embryo 漏 27 只）；成年野生 dinoClass 含 _Character_BP 被正则排除，零回归
  if((r._isEgg || r.source==='egg' || r.source==='embryo') && !/Character_BP|Char_BP/.test(String(r.dinoClass||''))){
    var _c1 = String(r.dinoClass).split('_Character_BP')[0].toLowerCase();
    var _c2 = String(cls).split('_Character_BP')[0].toLowerCase();
    if(_c1 && _c2 && (_c1===_c2 || _c2.indexOf(_c1)>=0 || _c1.indexOf(_c2)>=0)) return true;
  }
  var a = findSpeciesByClass(r.dinoClass);
  if(!a && (r.source==='egg'||r.source==='embryo') && /_(XSmall|Small|Medium|Large)$/.test(r.dinoClass||'')){
    // v593：蛋品质变体（风行蜥 Maelizard_Small 等）→ 去品质后缀再查（兜底）
    a = findSpeciesByClass(String(r.dinoClass).replace(/_(XSmall|Small|Medium|Large)$/,''));
  }
  var b = findSpeciesByClass(cls);
  return !!(a && b && a === b);
}

// 查中文名：蓝图代码 → 中文名（提取括号前部分），无映射返回 null
function zhName(engCode) {
  if (!engCode) return null;
  var v = ZH_MAP[engCode.toLowerCase()] || '';
  if (!v) return null;
  var m = v.match(/^(.+?)[\[\(（]/);
  return m ? m[1] : v;
}

  sp._imprintMult = imp;
  sp._tamedHP = sp.TamedBaseHealthMultiplier || 1;
  for (var i = 0; i < 12; i++) {
    if (!fsr[i]) { sp._stats[i] = null; continue; }
    sp._stats[i] = {
      BaseValue: fsr[i][0], IncPerWildLevel: fsr[i][1],
      IncPerTamedLevel: fsr[i][2]||0, AddWhenTamed: fsr[i][3]||0, MultAffinity: fsr[i][4]||0,
      IncPerMutatedLevel: fsr[i][1], IncreaseStatAsPercentage: true, ValueCap: Infinity
    };
  }

  // ASA 近战统一修正：ASE→ASA（Add×0.14, Mult×0.44, Id×0.17）
  var ss8 = sp._stats[8];
  if (ss8) {
    ss8.IncPerTamedLevel *= 0.17;
    if (ss8.AddWhenTamed >= 0) {
      if (ss8.AddWhenTamed === 0.5) ss8.AddWhenTamed = 0.07;
      else if (ss8.AddWhenTamed === 1) ss8.AddWhenTamed = 0.14;
      else if (ss8.AddWhenTamed > 0) ss8.AddWhenTamed *= 0.14;
    }
    if (ss8.MultAffinity === 0.2) ss8.MultAffinity = 0.088;
    else if (ss8.MultAffinity === 0.4) ss8.MultAffinity = 0.176;
    else if (ss8.MultAffinity === 0 && sp.blueprintPath && /Gigant_Character_BP/i.test(sp.blueprintPath)) ss8.MultAffinity = 0.4;
    else if (ss8.MultAffinity > 0) ss8.MultAffinity *= 0.44;
  }
}

// 正向公式：等级 → 属性值（C# CalculateValue 直译）
function calcStatValue(sp, statIdx, lvWild, lvMut, lvDom, dom, tamingEff, imprintBonus) {
  ensureSpeciesStats(sp);
  var ss = sp._stats[statIdx];
  if (!ss) return 0;
  if (lvWild < 0 && ss.IncPerWildLevel !== 0) return -1;
  var add=0, domMult=1, imprintM=1, tamedHP=1;
  if (dom) {
    add = ss.AddWhenTamed;
    var da = ss.MultAffinity;
    if (da >= 0) da *= (tamingEff||0);
    domMult = (tamingEff >= 0) ? (1 + da) : 1;
    if (imprintBonus > 0 && sp._imprintMult[statIdx] !== 0)
      imprintM = 1 + sp._imprintMult[statIdx] * imprintBonus;
    if (statIdx === 0) tamedHP = sp._tamedHP;
  } else { lvDom = 0; }
  var wildInc = lvWild*ss.IncPerWildLevel + lvMut*ss.IncPerMutatedLevel;
  var domInc = lvDom*ss.IncPerTamedLevel;
  var result = ss.IncreaseStatAsPercentage
    ? (ss.BaseValue*(1+wildInc)*tamedHP*imprintM + add) * domMult * (1+domInc)
    : ((ss.BaseValue+wildInc)*tamedHP*imprintM + add) * domMult + domInc;
  if (result <= 0) return 0;
  return Math.min(result, ss.ValueCap);
}

// 计算 wild/dom levels（5属性 DP，用 ASB 真公式）
function solveLevels(species, statsByName, TE_min, TE_max, origin, charLevel, imprint) {
  var fsr = species.fullStatsRaw;
  if (!fsr || fsr.length < 10) return null;
  ensureSpeciesStats(species);
  var dom = (origin === 'tamed' || origin === 'bred');
  // 留痕加成属性（按 ASB 默认）
  var impStats = {health:true, food:true, weight:true, melee_damage_multiplier:true};
  
  // totalW 候选：眩晕反推优先；低温仓眩晕含加成矛盾（totalW>level）时枚举（2026-08-13）
  var baseTotalW = 0, baseTotalDom = 0;
  var totalWCands = [];
  if (dom && fsr[2]) {
    // 反向去除驯服加成：torpidity = (B×(1+totalW×Iw) + Add) × domMult × imprintM
    var torpVal = statsByName.torpidity;
    var torpB = fsr[2][0], torpIw = fsr[2][1], torpAdd = fsr[2][3]||0, torpMult = fsr[2][4]||0;
    var torpDomMult = (torpMult >= 0) ? (1 + torpMult * TE_max) : 1;
    var torpImprintM = 1;
    if ((imprint||0) > 0 && IMPRINT_MULT_DEFAULT[2] !== 0)
      torpImprintM = 1 + IMPRINT_MULT_DEFAULT[2] * (imprint||0);
    var preBonus = (torpVal / torpDomMult - torpAdd) / torpImprintM;
    baseTotalW = Math.round((preBonus / torpB - 1) / torpIw);
    baseTotalDom = Math.max(0, (charLevel||0) - 1 - baseTotalW);
    totalWCands.push({tw: baseTotalW, td: baseTotalDom});
    if (baseTotalW > (charLevel||0) - 1) {
      // 眩晕含加成（数据矛盾）：枚举 totalW（步长 2 覆盖全范围，上限 60 次）
      var lvTop = Math.max(0, (charLevel||1) - 1);
      var tries = 0;
      for (var fw = lvTop; fw >= 0 && tries < 60; fw -= 2, tries++) {
        totalWCands.push({tw: fw, td: Math.max(0, (charLevel||1) - 1 - fw)});
      }
    }
  } else if (charLevel && charLevel > 1) {
    baseTotalW = charLevel - 1;
    totalWCands.push({tw: baseTotalW, td: 0});
  }
  
  // DP 求解（参数化 tw/td，支持多次尝试）
  function runDP(tw, td){
    var dpKeys = ['health','stamina','oxygen','weight','melee_damage_multiplier'];
    var allOptions = [];
    // 2026-08-13 放宽：tw/4 上限卡死高属性龙（Carcha 攻需 wild55>52）；改 tw 后 73%→93%，17.6ms/球可接受
    var maxW = Math.max(40, tw);
    
    for (var ki = 0; ki < dpKeys.length; ki++) {
      var k = dpKeys[ki];
      var idx = STAT_IDX[k];
      var displayed = statsByName[k];
      if (displayed == null || !fsr[idx]) {
        allOptions.push([{w:0,d:0,diff:0}]);
        continue;
      }
      // 近战：.ini 存 bonus%，需要 +100 变总百分比
      var isMelee = (k === 'melee_damage_multiplier');
      var multiplier = isMelee ? (displayed + 100) / 100 : displayed;
      var tol = isMelee ? Math.max((imprint||0)>0?0.03:0.005, multiplier*0.0005) : Math.max(1.0, displayed*0.0006);
      
      var opts = [];
      // 检查 TE 区间内是否有匹配：v(TE) 单调，取两端
      function teRangeMatch(w, d) {
        var vHi = calcStatValue(species, idx, w, 0, d, dom && d>=0, TE_max, imprint||0);
        if (!dom || TE_min >= TE_max) return Math.abs((isMelee?vHi:vHi) - multiplier) < tol;
        var vLo = calcStatValue(species, idx, w, 0, d, true, TE_min, imprint||0);
        var vMin = Math.min(vHi, vLo), vMax = Math.max(vHi, vLo);
        return multiplier >= vMin - tol && multiplier <= vMax + tol;
      }
      for (var w = 0; w <= maxW; w++) {
        if (teRangeMatch(w, 0)) {
          var v = calcStatValue(species, idx, w, 0, 0, dom, TE_max, imprint||0);
          var diff = Math.abs((isMelee?v:v) - multiplier);
          opts.push({w:w, d:0, diff:diff});
        }
      }
      if (dom) {
        // 2026-08-13 性能优化：dom 循环 d 1..255 暴力遍历 → 数学反推 + 局部扫描 ±3
        var ss = species._stats[idx];
        var domMult2 = (ss.MultAffinity>=0) ? (1+ss.MultAffinity*TE_max) : 1;
        var imprintM2 = 1;
        if ((imprint||0) > 0 && species._imprintMult && species._imprintMult[idx] !== 0)
          imprintM2 = 1 + species._imprintMult[idx]*(imprint||0);
        var tamedHP2 = (idx===0) ? (species._tamedHP||1) : 1;
        for (var w = 0; w <= maxW; w++) {
          if (!(ss.IncPerTamedLevel > 0)) continue;
          var basePart = (ss.BaseValue*(1+w*ss.IncPerWildLevel)*tamedHP2*imprintM2 + (ss.AddWhenTamed||0)) * domMult2;
          if (!(basePart > 0)) continue;
          var dFloat = ss.IncreaseStatAsPercentage
            ? (multiplier/basePart - 1)/ss.IncPerTamedLevel
            : (multiplier - basePart)/ss.IncPerTamedLevel;
          if (!(dFloat >= -0.5 && dFloat <= 256)) continue;
          var d0 = Math.max(0, Math.round(dFloat));
          for (var dd = Math.max(0,d0-3); dd <= d0+3; dd++) {
            if (dd === 0) continue;
            if (teRangeMatch(w, dd)) {
              var v = calcStatValue(species, idx, w, 0, dd, true, TE_max, imprint||0);
              var diff = Math.abs((isMelee?v:v) - multiplier);
              if (w===0 && dd>0 && tw>50) diff += 2.0;
              opts.push({w:w, d:dd, diff:diff});
            }
          }
        }
      }
      if (opts.length === 0) opts.push({w:0, d:0, diff:9999}); // 无匹配兜底（diff 大，避免假解）
      opts.sort(function(a,b){ return b.w-a.w || a.diff-b.diff; });
      allOptions.push(opts);
    }
    
    // DP 约束
    var MAX_S = tw;
    var dp = {};
    dp[0] = {wl:{},dl:{},diff:0};
    for (var si = 0; si < allOptions.length; si++) {
      var k = dpKeys[si];
      var opts = allOptions[si];
      var ndp = {};
      for (var sStr in dp) {
        var s = parseInt(sStr);
        var prev = dp[sStr];
        for (var oi = 0; oi < opts.length; oi++) {
          var opt = opts[oi];
          var ns = s + opt.w;
          if (ns > MAX_S) continue;
          var nd = prev.diff + opt.diff;
          var nk = String(ns);
          if (!(nk in ndp) || nd < ndp[nk].diff) {
            var nwl={};for(var kk in prev.wl)nwl[kk]=prev.wl[kk];
            var ndl={};for(var kk in prev.dl)ndl[kk]=prev.dl[kk];
            nwl[k]=opt.w; ndl[k]=opt.d;
            ndp[nk]={wl:nwl,dl:ndl,diff:nd};
          }
        }
      }
      dp = ndp;
    }
    
    // 收集候选
    var avgW = tw / 6;
    var candidates = [];
    for (var sStr in dp) {
      var s = parseInt(sStr);
      var cur = dp[sStr];
      var cand = {wildLevels:{},domLevels:{},sumW:s,diff:cur.diff};
      for (var ki = 0; ki < dpKeys.length; ki++) {
        var k = dpKeys[ki];
        cand.wildLevels[k]=cur.wl[k]||0;
        cand.domLevels[k]=cur.dl[k]||0;
      }
      cand.wildLevels.food = Math.max(0, tw - s);
      cand.domLevels.food = 0;
      var knownDom = 0;
      for (var ki = 0; ki < dpKeys.length; ki++) knownDom += (cur.dl[dpKeys[ki]]||0);
      if (td > knownDom) cand.domLevels.food = td - knownDom;
      cand.wildLevels.torpidity=0; cand.domLevels.torpidity=0;
      cand.wildLevels.speed_multiplier=0; cand.domLevels.speed_multiplier=0;
      var balance=0, domStats=0, totalDomCand=0;
      var ak = dpKeys.concat(['food']);
      for (var kj=0;kj<ak.length;kj++){
        balance += Math.abs((cand.wildLevels[ak[kj]]||0)-avgW);
        if ((cand.domLevels[ak[kj]]||0)>0) domStats++;
        totalDomCand += (cand.domLevels[ak[kj]]||0);
      }
      // 食物值校验：不匹配则丢弃候选
      if (statsByName.food != null && fsr[4]) {
        var fv = calcStatValue(species, 4, cand.wildLevels.food, 0, cand.domLevels.food, dom, TE_max, imprint||0);
        var ftol = Math.max(1.0, statsByName.food * 0.0006);
        if (Math.abs(fv - statsByName.food) > ftol) continue;
      }
      cand.score = balance*0.3 + totalDomCand*4 + domStats*16 + cand.diff;
      candidates.push(cand);
    }
    candidates.sort(function(a,b){return a.score-b.score;});
    return candidates.slice(0,10);
  }
  
  // 主流程：遍历 totalW 候选，取最优有解
  var topCandidates = [];
  var best = null, bestTw = 0, bestTd = 0;
  for (var ci = 0; ci < totalWCands.length; ci++) {
    var cands = runDP(totalWCands[ci].tw, totalWCands[ci].td);
    if (cands && cands.length && cands[0].diff < 1000) { // diff<1000 才视为真解（拒绝无匹配假解）
      if (!best || cands[0].score < best.score) {
        best = cands[0];
        bestTw = totalWCands[ci].tw;
        bestTd = totalWCands[ci].td;
        topCandidates = cands;
      }
    }
  }
  var result = best || {wildLevels:{},domLevels:{},sumW:0,diff:0};
  result.candidates = topCandidates;
  result._totalFromTorp = baseTotalW;  // torpidity 反推的总等级（含驯服奖励）
  result._totalDom = baseTotalDom;
  result._fallback = (baseTotalW > (charLevel||0) - 1); // 是否走了眩晕矛盾枚举
  return result;
}

function lbRetryable(method){ method = String(method || 'GET').toUpperCase(); return method === 'GET' || method === 'HEAD'; }
function lbFetchOnce(url, opts, extSignal, ms){
  var ac = new AbortController();
  // v985：60s —— 实测该链路延迟上限 13.4s，原 10s 会把「慢」判成「失败」→ 反而丢数据
  var to = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, ms || 60000);
  if(extSignal){
    try{
      if(extSignal.aborted){ clearTimeout(to); return Promise.reject(new Error('aborted')); }
      extSignal.addEventListener('abort', function(){ try{ ac.abort(); }catch(e){} });
    }catch(e){}
  }

  for(var k in opts){ if(opts.hasOwnProperty(k) && k !== '_noRetry' && k !== '_retryMs') o[k] = opts[k]; }

    clearTimeout(to);
    if(r.status >= 500) throw new Error('HTTP ' + r.status);
    return r;
  }).catch(function(e){ clearTimeout(to); throw e; });
}
function lbFetchRetry(url, opts){
  opts = opts || {};
  if(opts._noRetry || !lbRetryable(opts.method)) return fetch(url, opts);
  var extSignal = opts.signal || null;
  return lbFetchOnce(url, opts, extSignal, opts._retryMs).catch(function(e){
    if(extSignal && extSignal.aborted) throw e;
    if(e && (e.name === 'AbortError' || e.message === 'aborted')) throw e;
    return new Promise(function(res){ setTimeout(res, 500); }).then(function(){
      return lbFetchOnce(url, opts, extSignal, opts._retryMs);
    });
  });
}
function authFetch(url, opts) {
  opts = opts || {};
  var m = url.match(/^([a-z]+:\/\/)([^@\/]+)@/i);
  if (m) {
    var b64;
    try { b64 = btoa(decodeURIComponent(m[2])); } catch (e2) { b64 = btoa(m[2]); }
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Basic ' + b64;
    url = m[1] + url.slice(m[0].length);
  }
  opts.credentials = 'include';
  return lbFetchRetry(url, opts).catch(function(e) {
    // Chrome 禁止从含凭据的 URL 构造 fetch 请求 → 降级到 XHR
    if (e.message && e.message.indexOf('credentials') !== -1) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open(opts.method || 'GET', url, true);
        xhr.withCredentials = true;
        if (opts.headers) {
          for (var k in opts.headers) { if (opts.headers.hasOwnProperty(k)) xhr.setRequestHeader(k, opts.headers[k]); }
        }
        xhr.responseType = opts._responseType || '';
        xhr.onload = function() {

            text: function(){ return Promise.resolve(xhr.responseText); },
            json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); },
            _xhr: xhr });
        };
        xhr.onerror = function(){ reject(new Error('XHR failed')); };
        xhr.send(opts.body || null);

  });
}

    list.innerHTML = html;
    files.forEach(function(f) { loadFileMeta(f.name); });
  } catch (e) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171">❌ ' + escapeHtml(e.message) + '<br><small>请确认已连接 NAS 局域网</small></div>'; }
}

// 删除分组内所有文件
async function deleteGroup(gi) {
  var g = window._fileGroups && window._fileGroups[gi];
  if (!g || !g.files || g.files.length === 0) return;
  if (!confirm('确认删除 ' + g.files.length + ' 个文件？\n此操作不可撤销。')) return;
  var ok = 0, fail = 0;
  for (var i = 0; i < g.files.length; i++) {
    try {
      var res = await authFetch(DINO_DATA + g.files[i].name, { method: 'DELETE' });
      if (res.ok || res.status === 204) ok++; else fail++;
    } catch(e) { fail++; }
  }
  // 移除 DOM
  var el = document.getElementById('fg-' + gi);
  if (el) el.remove();
  // 清理选中状态
  if (selectedFile && g.files.some(function(f){return f.name===selectedFile;})) {
    selectedFile = null; parsedData = null;
    document.getElementById('previewCard').style.display = 'none';
    showRightPlaceholder(true);
  }
  showStatus('info', '🗑 已删除 ' + ok + ' 个文件' + (fail > 0 ? '，' + fail + ' 个失败' : ''));
  setTimeout(function(){ showStatus('', ''); }, 3000);
}

// 异步加载文件头部元数据（物种/名称/等级）
async function loadFileMeta(filename) {
  try {
    var res = await authFetch(DINO_DATA + filename, {});
    if (!res.ok) return;
    var text = await res.text();
    var lines = text.split(/\r?\n/);
    var species = '', dinoBp = '', dinoName = '', level = '', sex = '', babyAge = -1, section = '';
    for (var i = 0; i < lines.length && i < 30; i++) {
      var l = lines[i].trim();
      var sec = l.match(/^\[(.+)\]$/);
      if (sec) { section = sec[1]; continue; }
      var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
      if (!m) continue;
      var k = m[1].trim(), v = m[2].trim();
      if (section === 'Dino Data') {
        if (k === 'DinoClass') { dinoBp = v; species = v.split('/').pop().split('.')[0].split('_')[0]; }
        else if (k === 'DinoNameTag' && v) dinoName = v;
        else if (k === 'TamedName' && v) dinoName = v;
        else if (k === 'CharacterLevel') level = v;
        else if (k === 'bIsFemale') sex = (v === 'True') ? 'F' : 'M';
        else if (k === 'BabyAge') babyAge = parseFloat(v);
        if (species && dinoName && level) break;
      }
    }
    var el = document.getElementById('fi-' + encodeURIComponent(filename));
    if (el) {
      var sp = el.querySelector('.fi-species');
      var nm = el.querySelector('.fi-name');
      var lv = el.querySelector('.fi-level');
      var sx = el.querySelector('.fi-sex');
      var sg = el.querySelector('.fi-stage');
      if (sp) {
        await ZH_READY;
        // 用 ASB 真实物种名替代蓝图代号
        var engName = species;
        if (dinoBp) { var asbSp = findSpecies(dinoBp); if (asbSp && asbSp.name) engName = asbSp.name; }
        var zh = zhName(species) || zhName(engName);
        sp.textContent = zh ? zh + ' (' + engName + ')' : engName;
      }
      if (nm) nm.textContent = dinoName || '-';
      if (lv) lv.textContent = level ? 'Lv.' + level : '';
      if (sx) {
        sx.textContent = sex === 'F' ? '♀' : (sex === 'M' ? '♂' : '');
        sx.style.color = sex === 'F' ? '#f472b6' : '#60a5fa';
      }
      if (sg && babyAge >= 0) {
        var stage, sc;
        if (babyAge < 0.1) { stage = '婴儿'; sc = '#4ade80'; }
        else if (babyAge < 0.5) { stage = '幼崽'; sc = '#facc15'; }
        else if (babyAge < 1.0) { stage = '青年'; sc = '#fb923c'; }
        else { stage = ''; sc = ''; }
        if (stage) { sg.textContent = stage; sg.style.background = sc+'22'; sg.style.color = sc; sg.style.border = '1px solid '+sc+'44'; }
        else { sg.style.display = 'none'; }
      }
    }
  } catch(e) { /* skip */ }
}

function findColorId(r, g, b) {
  var best = 0, bestD = Infinity;
  for (var i = 0; i < ARK_COLORS.length; i++) {
    var c = ARK_COLORS[i];
    var dr = r - c[1], dg = g - c[2], db = b - c[3];
    var d = dr*dr + dg*dg + db*db;
    if (d < bestD) { bestD = d; best = c[0]; }
  }
  return best;
}

async function selectFile(name) {
  // 点击已选中项 → 取消选中
  if (selectedFile === name) {
    var items = document.querySelectorAll('.file-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
    setParseBtn(selectedFile, null); // 隐藏按钮
    selectedFile = null; parsedData = null;
    document.getElementById('teCard').style.display = 'none';
    document.getElementById('mutCard').style.display = 'none';
    document.getElementById('candCard').style.display = 'none';
    showRightPlaceholder(true);
    document.getElementById('statusArea').style.display = 'none';
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    closePreviewOverlay();
    return;
  }
  var items = document.querySelectorAll('.file-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
  // 隐藏上一个文件的按钮
  if (selectedFile) setParseBtn(selectedFile, null);
  var el = document.getElementById('fi-' + encodeURIComponent(name));
  if (el) el.classList.add('selected');
  selectedFile = name;
  
  // 显示加载态按钮
  setParseBtn(name, 'loading');
  showStatus('info', '');
  try {
    var res = await authFetch(DINO_DATA + name, {});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsedData = parseIni(await res.text(), name);
    showRightPlaceholder(false);
    var matched = parsedData.blueprint ? true : false;
    setParseBtn(name, matched ? 'ok' : 'err');
    // 自动判断训/繁
    var isBred = isBredDino(parsedData);
    setBioType(isBred ? 'bred' : 'tamed');
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    renderMutGrid();
    // 更新变异标题
    var totalMut = (parsedData.matMutations||0) + (parsedData.patMutations||0);
    var mutTitle = document.getElementById('mutTitle');
    if (mutTitle) {
      mutTitle.innerHTML = '🧬 变异 (Mutations)';
      if (totalMut > 0) mutTitle.innerHTML += ' <span style="font-size:11px;color:#888">母' + (parsedData.matMutations||0) + '/父' + (parsedData.patMutations||0) + '=Σ' + totalMut + '</span>';
    }
    // 重置 TE 输入框
    document.getElementById('teMin').value = isBred ? '100' : '95';
    document.getElementById('teMax').value = '100';
    showStatus('info', '');
    document.getElementById('statusArea').style.display = 'none';
    showCandidates(parsedData);
  } catch (e) {
    setParseBtn(name, 'err');
    document.getElementById('statusArea').style.display = '';
    showStatus('error', '❌ ' + e.message); parsedData = null; showRightPlaceholder(true); }
}

function parseIni(t, fn) {
  var r = { stats: [], _filename: fn, colors: [], ancestors: [] };
  var section = '';
  var statMap = {
    '生命值':'health', '耐力':'stamina', '氧气':'oxygen', '氧氣':'oxygen',
    '食物':'food', '负重':'weight', '重量':'weight',
    '近战伤害':'melee_damage_multiplier', '移动速度':'speed_multiplier',
    '眩暈':'torpidity', '眩晕':'torpidity',
    '水':'water', '溫度':'temperature', '温度':'temperature',
    '抗性':'fortitude', '制作技能':'crafting'
  };
  
  t.split(/\r?\n/).forEach(function(l) {
    l = l.trim();
    if (!l || l[0] === ';') return;
    
    var sec = l.match(/^\[(.+)\]$/);
    if (sec) { section = sec[1]; return; }
    
    var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
    if (!m) return;
    var k = m[1].trim(), v = m[2].trim();
    
    if (section === 'Dino Data') {
      if (k === 'DinoID1') r.dinoId1 = v;
      else if (k === 'DinoID2') r.dinoId2 = v;
      else if (k === 'DinoClass') { r.dinoClassFull = v; var parts = v.split('/').pop().split('.'); r.blueprint = parts.length > 1 ? parts[1] : parts[0]; }
      else if (k === 'DinoNameTag') r.nameTag = v;
      else if (k === 'CharacterLevel') r.level = parseInt(v) || 0;
      else if (k === 'bIsFemale') r.sex = (v === 'True') ? 'female' : 'male';
      else if (k === 'bNeutered') r.isNeutered = (v === 'True');
      else if (k === 'TamerString') r.tamer = v || null;
      else if (k === 'TamedName' && v) r.name = v;
      else if (k === 'ImprinterName' && v) r.imprinter = v;
      else if (k === 'RandomMutationsMale') r.patMutations = parseInt(v) || 0;
      else if (k === 'RandomMutationsFemale') r.matMutations = parseInt(v) || 0;
      else if (k === 'DinoImprintingQuality') r.imprint = parseFloat(v);
      else if (k === 'BabyAge') r.babyAge = parseFloat(v);
    }
    
    if (section === 'Max Character Status Values') {
      var mapped = statMap[k];
      if (mapped) {
        r.statsByName = r.statsByName || {};
        var val = parseFloat(v) || 0;
        if (mapped === 'melee_damage_multiplier') val = val * 100;
        r.statsByName[mapped] = val;
      }
    }
    
    if (section === 'Colorization') {
      var cm = k.match(/^ColorSet\[(\d+)\]$/);
      if (cm) {
        var cv = v.match(/R=([\d.]+).*?G=([\d.]+).*?B=([\d.]+).*?A=([\d.]+)/);
        if (cv) r.colors[parseInt(cm[1])] = { r:parseFloat(cv[1]), g:parseFloat(cv[2]), b:parseFloat(cv[3]), a:parseFloat(cv[4]) };
      }
    }
    
    if (section === 'Dino Ancestry') {
      if (k === 'DinoAncestorsCount') r.ancestorCount = parseInt(v) || 0;
      else if (k === 'DinoAncestorsMale') r.ancestorMale = parseInt(v) || 0;
    }
    
    if (section === 'DinoAncestors' || section === 'DinoAncestorsMale') {
      if (v) r.ancestors.push({ type: section, data: v });
    }
  });
  
  if (r.statsByName) {
    var sv = ['health','stamina','oxygen','food','weight','melee_damage_multiplier','speed_multiplier'];
    for (var i = 0; i < sv.length; i++) r.stats[i] = r.statsByName[sv[i]] || 0;
  }
  return r;
}

var selectedCandidate = null;

function showCandidates(d) {
  if (!ASB_DB || !d.dinoClassFull || !d.statsByName) { document.getElementById('candCard').style.display = 'none'; return; }
  var bp = d.dinoClassFull.replace(/_C$/,'');
  var sp = findSpecies(bp);
  if (!sp || !sp.fullStatsRaw) { document.getElementById('candCard').style.display = 'none'; return; }
  var ctype = d.imprinter ? 'bred' : (d.tamer ? 'tamed' : 'tamed');
  var teMin = 100, teMax = 100;
  if (ctype === 'tamed') {
    teMin = parseFloat(document.getElementById('teMin').value)||95;
    teMax = parseFloat(document.getElementById('teMax').value)||100;
  }
  var lvls = solveLevels(sp, d.statsByName, teMin/100, teMax/100, ctype, d.level, d.imprint);
  if (!lvls || !lvls.candidates) { document.getElementById('candCard').style.display = 'none'; return; }
  
  var cands = lvls.candidates;
  var totalFromTorp = lvls._totalFromTorp || 0;
  var isBred = _bioType === 'bred';
  // 按 TE 拆分：野 = total/(1+TE/2), 奖 = total-野, 加 = charLevel-1-total
  var teSplit = (teMax/100) / 2;
  var wildBase = Math.round(totalFromTorp / (1 + teSplit));
  var bonusBase = totalFromTorp - wildBase;
  var xpBase = Math.max(0, (d.level||1) - 1 - totalFromTorp);
  var keys = ['health','stamina','oxygen','food','weight','melee_damage_multiplier'];

      + '</span>';

    for (var ki = 0; ki < keys.length; ki++) {
      var k = keys[ki];
      var v = _mutValues[k] || 0;
      var cls = v > 0 ? 'mut-chip has-val' : 'mut-chip';

  if (_editingKey) {

  }

function startMutEdit(key) {

function confirmMutEdit(key) {

function renderPreviewContent(d) {
  var statLabels = {
    'health':'生命','stamina':'耐力','oxygen':'氧气','food':'食物','weight':'负重',
    'melee_damage_multiplier':'近战伤害','speed_multiplier':'移动速度','torpidity':'眩晕','water':'水',

  };

  rows.push(['名称', d.name||d.nameTag||'-']);
  rows.push(['等级', d.level||'?']);
  rows.push(['性别', d.sex==='female'?'♀':'♂' + (d.isNeutered?' (已绝育)':'')]);

  if (typeof d.babyAge === 'number') rows.push(['幼崽成长', (d.babyAge*100).toFixed(1) + '%']);
  if (d.tamer) rows.push(['驯服人', d.tamer]);

  if (d.dinoId1 || d.dinoId2) rows.push(['Dino ID', (d.dinoId1||'?') + '/' + (d.dinoId2||'?')]);
  
  if (d.statsByName) {
    rows.push(['── 属性值 ──', '']);
    var order = ['health','stamina','torpidity','oxygen','food','water','temperature','weight','melee_damage_multiplier','speed_multiplier','fortitude','crafting'];
    for (var i = 0; i < order.length; i++) {
      var v = d.statsByName[order[i]];
      if (typeof v === 'number') rows.push([statLabels[order[i]]||order[i], v.toFixed(1)]);
    }
  }
  
  if (d.colors && d.colors.length > 0) {
    rows.push(['── 颜色区域 ──', '']);
    for (var i = 0; i < d.colors.length; i++) {
      if (d.colors[i]) {
        var c = d.colors[i];
        var cid = findColorId(c.r, c.g, c.b);
        rows.push(['Region ' + i, 'R:'+(c.r*255).toFixed(0)+' G:'+(c.g*255).toFixed(0)+' B:'+(c.b*255).toFixed(0)+' → ID:'+cid]);
      }
    }
  }
  
  if (d.ancestorCount > 0) {
    rows.push(['── 祖先 ──', '数量:' + d.ancestorCount + ' 雄性:' + (d.ancestorMale||0)]);
    for (var i = 0; i < d.ancestors.length; i++) {
      rows.push(['', d.ancestors[i].data]);
    }
  }
  
  for (var i = 0; i < rows.length; i++) {
    h += '<div class="row"><span class="label">' + escapeHtml(String(rows[i][0])) + '</span><span class="value">' + escapeHtml(String(rows[i][1])) + '</span></div>';
  }
  
  var isBred = isBredDino(d);
  setBioType(isBred ? 'bred' : 'tamed');
  
  var tag = document.getElementById('solverTag');
  if (ASB_DB && d.dinoClassFull) {
      var bp = d.dinoClassFull.replace(/_C$/,'');
      var sp = findSpecies(bp);
      tag.textContent = (sp && sp.name) ? ' [' + sp.name + ']' : ' [未匹配]';
  } else { tag.textContent = ''; }
  
  var matched = d.blueprint ? true : false;
  document.getElementById('parseStatus').innerHTML = matched
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" style="vertical-align:middle"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="3" style="vertical-align:middle"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  document.getElementById('previewPopupContent').innerHTML = h;
  
  // 刷新变异显示
  renderMutGrid();

function showStatus(t, m) { document.getElementById('statusArea').innerHTML = '<div class="status ' + t + '">' + m + '</div>'; }
function formatSize(b) { return b < 1024 ? b + ' B' : (b/1024).toFixed(1) + ' KB'; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
// v476：HTML 属性值转义（innerHTML 序列化不转义引号，escapeHtml 不能用于属性；JSON 进属性必须用本函数）
function lbAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// 判断是否繁育：留痕度>0 / 有祖先 / ImprinterName非空 / BabyAge是幼崽
function isBredDino(d) {
  if (!d) return false;
  if (typeof d.imprint === 'number' && d.imprint > 0) return true;
  if (d.ancestorCount > 0) return true;
  if (d.imprinter) return true;             // 留痕人非空 = 已留痕 = 繁育
  if (typeof d.babyAge === 'number' && d.babyAge > 0 && d.babyAge < 1) return true; // 幼崽只能来自繁育
  return false;
}
// 速查版训/繁判断（适配速查字段：imprintingQuality/ancestors/imprinter/babyAge）；实锤=繁，排除法判训=非实锤（标绿）
function lbIsBred(r){
  if(!r) return false;
  if(typeof r.imprintingQuality==='number' && r.imprintingQuality>0) return true;
  if(r.ancestors && r.ancestors.length>0) return true;
  if(r.imprinter) return true;
  if(typeof r.babyAge==='number' && r.babyAge>0 && r.babyAge<1) return true;
  return false;
}
// 变异模块可见：繁育 且 突变计数器>0（C=0 时无突变，隐藏）
function isMutVisible(d) {
  if (!isBredDino(d)) return false;
  return ((d.matMutations||0) + (d.patMutations||0)) > 0;
}

function toggleLevelInfo(e, total, base, wild, bonus, xp, isBred) {
  var old = document.getElementById('levelInfo');
  if (old) { old.remove(); return; }
  var pop = document.createElement('div');
  pop.id = 'levelInfo';
  pop.style.cssText = 'position:fixed;z-index:9999;background:#1a1a24;border:1px solid #333;border-radius:8px;padding:10px 14px;font-size:11px;line-height:1.8;color:#ccc;box-shadow:0 4px 16px rgba(0,0,0,.5);min-width:160px';
  var x = Math.min(e.clientX, window.innerWidth - 180);
  pop.style.left = x + 'px';
  pop.style.top = (e.clientY - 10) + 'px';
  var pctW = total > 1 ? ((wild/(total-1))*100).toFixed(0) : 0;
  var pctB = total > 1 ? ((bonus/(total-1))*100).toFixed(0) : 0;
  var pctX = total > 1 ? ((xp/(total-1))*100).toFixed(0) : 0;
  var html = '<div style="font-weight:600;color:#fff;margin-bottom:4px">等级构成 Lv.' + total + '</div>'
    + '<div>底  Lv.<b>' + base + '</b></div>';
  if (isBred) {
    html += '<div style="color:#a78bfa">承  Lv.<b>' + wild + '</b> (' + pctW + '%)</div>';
  } else {
    html += '<div style="color:#a78bfa">野  Lv.<b>' + wild + '</b> (' + pctW + '%)</div>'
      + '<div style="color:#60a5fa">奖  Lv.<b>' + bonus + '</b> (' + pctB + '%)</div>';
  }
  html += '<div style="color:#facc15">加  Lv.<b>' + xp + '</b> (' + pctX + '%)</div>'
    + '<div style="border-top:1px solid #333;margin-top:4px;padding-top:4px;color:#666;font-size:10px">' + (isBred ? '承=可继承 | 加=XP加点' : '野=可继承 | 奖=驯服奖励 | 加=XP加点') + '</div>';
  pop.innerHTML = html;
  document.body.appendChild(pop);
  setTimeout(function(){
    var fn = function(ev){ if(ev.target!==pop&&!pop.contains(ev.target)){pop.remove();document.removeEventListener('click',fn);} };
    document.addEventListener('click', fn);
  }, 50);
}

// 预取单个资源：Image 预加载（跨域无 CORS 限制，直接进浏览器 HTTP 缓存），onload/onerror 完成回调驱动真实进度（v312）
// v977：链路抖动重试 —— onerror 后 600ms 重试 1 次（HTTP/2 连接瞬时中断可自愈），二次失败才计失败
function lbPrefetchOne(url){
  if(!url) return Promise.resolve(false);
  return new Promise(function(res){
    var _done = false;
    var _fin = function(v){ if(!_done){ _done = true; res(v); } };
    var _timer = null;
    var _load = function(attempt){
      _timer = setTimeout(function(){ _fin(false); }, 15000); // 15s 超时防慢资源卡住并发池
      try{
        var im = new Image();
        im.onload = function(){ clearTimeout(_timer); _fin(true); };
        im.onerror = function(){
          clearTimeout(_timer);
          if(attempt < 2){ setTimeout(function(){ _load(attempt + 1); }, 600); }
          else { _fin(false); }
        };
        im.src = url;
      }catch(e){ clearTimeout(_timer); _fin(false); }
    };
    _load(1);
  });
}

// 页面内 data-lbasset 图片：Cache 命中 → 替换为本地 blob（秒开/离线）
function lbUpgradeAssets(){
  try{
    var imgs = document.querySelectorAll('img[data-lbasset]');
    Array.prototype.forEach.call(imgs, function(img){
      if(img._lbDone) return; img._lbDone = true;
      var url = img.getAttribute('data-lbasset');
      if(!url) return;
      lbAssetCache().then(function(cache){
        if(!cache) return;
        cache.match(url).then(function(hit){
          if(!hit) return;
          hit.blob().then(function(b){
            if(b && img.isConnected){ img.src = URL.createObjectURL(b); }
          });
        });
      });
    });
  }catch(e){}
}

// UE 坐标 → 地图像素百分比（clamp 0-100；按图片实际坐标范围归一化，无配置默认 0~100 全图）
// 2026-08-12：y 方向北在下；图片范围（lon/lat 边界）由 LB_MAP_INFO 配置（点击地标实测）
function lbWorldToPx(x, y, map){
  var lon = Number(x)/map.multLon + map.shiftLon;
  var lat = Number(y)/map.multLat + map.shiftLat;
  var lo0 = (map.lonMin!==undefined?map.lonMin:0), lo1 = (map.lonMax!==undefined?map.lonMax:100);
  var la0 = (map.latMin!==undefined?map.latMin:0), la1 = (map.latMax!==undefined?map.latMax:100);
  var px = Math.max(0, Math.min(100, (lon-lo0)/(lo1-lo0)*100));
  var py = Math.max(0, Math.min(100, (lat-la0)/(la1-la0)*100));
  return {x:px, y:py};
}

function lbServerAdminTribes(server){

  var arr = Object.keys(map).map(function(k){ return map[k]; });
  arr.sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||''), 'zh'); });

function lbSrvResultZh(t){

    [/online/i, '在线'],

// v472：结构化返回集成解读——后端 result 为 JSON，逐字段转成玩家可读中文（不显示原始 JSON）
function lbSrvInterpret(r){
  if(!r || typeof r !== 'object') return '';
  var parts = [];
  if(r.tribeMode) parts.push('部落为单位');
  if(r.target !== undefined && r.target !== null && r.target !== '') parts.push('目标 ' + r.target);
  // 死亡包/尸体/墓碑（MoveDeathBag 类）
  var found = [];
  if(r.bagCount !== undefined) found.push('死亡包 ' + r.bagCount + ' 个');
  if(r.corpseCount !== undefined) found.push('尸体 ' + r.corpseCount + ' 具');
  if(r.tombCount !== undefined) found.push('墓碑 ' + r.tombCount + ' 座');
  if(found.length) parts.push('找到：' + found.join('、'));
  var proc = [];
  if(r.bagsMoved !== undefined) proc.push('转移死亡包 ' + r.bagsMoved + ' 个');
  if(r.corpsesMoved !== undefined) proc.push('转移尸体 ' + r.corpsesMoved + ' 具');
  if(r.refreshedInPlace !== undefined) proc.push('原地刷新 ' + r.refreshedInPlace + ' 个');
  if(r.skippedNearTomb !== undefined) proc.push('墓碑旁跳过 ' + r.skippedNearTomb + ' 个');
  if(r.emptySkipped !== undefined) proc.push('空包跳过 ' + r.emptySkipped + ' 个');
  if(proc.length) parts.push('处理：' + proc.join('、'));
  // 低温仓 pending（MoveAllPendings 类）
  var pen = [];
  if(r.pendingConsumed !== undefined) pen.push('已恢复低温仓 ' + r.pendingConsumed + ' 个');
  if(r.remaining !== undefined) pen.push('剩余 ' + r.remaining + ' 个');
  if(pen.length) parts.push('恢复：' + pen.join('、'));
  if(r.failed !== undefined && Number(r.failed) > 0) parts.push('失败 ' + r.failed + ' 个');
  if(Array.isArray(r.moved) && r.moved.length) parts.push('已转移明细 ' + r.moved.length + ' 项');
  return parts.join('；');
}

    if(!LB._identityRetried){

        if(!ok){

          // 等 3s 后重新解析（此时新下载大概率已完成并更新 LB._cache；若仍无该玩家名则数据完整后才弹错）
          setTimeout(function(){ lbResolveIdentity(); }, 3000);

            }
          } else lbIdentityError(name);
        }
      });
      return true;
    }

    return true;
  }

  if(LB.playerRoles.length === 0 && !LB._identityRetried){

    lbForceReload().then(function(ok){
      if(!ok){
        // 2026-08-28 修复：同「匹配失败」——强制刷新被新下载取代时不立即弹错，等数据下载完再判断
        setTimeout(function(){ lbResolveIdentity(); }, 3000);

      var d2 = LB._cache && LB._cache.data;
      if(d2 && Array.isArray(d2.players)){

  }

  var saved = null;

// 启动时异步获取当前登录 HA 账号的显示名（作为 player），存入 LB.autoPlayer；失败/未登录则留空
function lbInitPlayer(){
  return new Promise(function(resolve){
    // 双架构：新架构（dino.whiterober.ccwu.cc 独立后端）→ 用独立登录（localStorage.dinoAuth），不再连 HA websocket
    if(LB_ARCH === 'new'){
      var auth = null;
      try{ auth = JSON.parse(localStorage.getItem('dinoAuth') || 'null'); }catch(e){}
      if(auth && auth.nick){
        LB.autoPlayer = auth.nick;   // 昵称（匹配 players[].name → eosId）
        resolve(); return;
      }
      LB._needLogin = true;
      resolve(); return;
    }
    try{
      lbHaTokenRefresh().then(function(token){
        if(!token){
          // 无 token（无法自动识别账号）：标记需要登录，显示登录引导
          LB._needLogin = true;
          resolve(); return;
        }
        LB._tok = token; // 缓存 token 供 lbLoadThemes 等复用（避免重复 lbHaTokenRefresh 再次卡 6s）
        var proto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
        var ws;
        try{ ws = new WebSocket(proto + location.host + '/api/websocket'); }
        catch(e){ LB._needLogin = true; resolve(); return; }
        var done = false;
        var tm = setTimeout(function(){ if(!done){ done = true; try{ ws.close(); }catch(e){} resolve(); } }, 6000);
        ws.onmessage = function(ev){
          try{
            var msg = JSON.parse(ev.data);
            if(msg.type === 'auth_required'){ ws.send(JSON.stringify({type:'auth', access_token: token})); }
            else if(msg.type === 'auth_ok'){ ws.send(JSON.stringify({id: 1, type: 'auth/current_user'})); }
            else if(msg.id === 1 && msg.result && msg.result.name){
              done = true; clearTimeout(tm);
              LB.autoPlayer = msg.result.name;
              try{ ws.close(); }catch(e){}
              resolve();
            }
          }catch(e){}
        };
        ws.onerror = function(){ if(!done){ done = true; clearTimeout(tm); try{ ws.close(); }catch(e){} resolve(); } };
        ws.onclose = function(){ if(!done){ done = true; clearTimeout(tm); resolve(); } };
      }).catch(function(){ LB._needLogin = true; resolve(); });
    }catch(e){ LB._needLogin = true; resolve(); }
  });
}

// 提交独立登录
function lbDoLogin(){
  var u = document.getElementById('lbLoginUser');
  var p = document.getElementById('lbLoginPwd');
  var msg = document.getElementById('lbLoginMsg');
  if(!u || !p || !msg) return;
  var username = (u.value||'').trim();
  var password = (p.value||'').trim();
  if(!username || !password){ msg.textContent='请输入账号和密码'; return; }
  var btn = null;
  var btns = document.querySelectorAll('.lb-picker-overlay button');
  for(var i=0;i<btns.length;i++){ if(String(btns[i].getAttribute('onclick')||'').indexOf('lbDoLogin')>=0){ btn=btns[i]; break; } }
  if(btn){ btn.disabled=true; btn.textContent='登录中…'; }
  // v977：登录加 15s 超时 —— 链路中断（net::ERR_HTTP2_PING_FAILED）时 fetch 会永久挂起，此前一直停在「登录中…」
  var _ac = new AbortController();
  var _to = setTimeout(function(){ try{ _ac.abort(); }catch(e){} }, 15000);
  var _clr = function(){ try{ clearTimeout(_to); }catch(e){} };
  fetch(LB_API + '/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    signal: _ac.signal,
    body: JSON.stringify({ username: username, password: password })
  }).then(function(r){ return r.json().then(function(j){ _clr(); return j; }); }).then(function(j){
    if(j && j.ok){
      try{ localStorage.setItem('dinoAuth', JSON.stringify({ user: username, nick: j.nick, at: Date.now() })); }catch(e){}
      location.reload();
    } else {
      if(msg) msg.textContent = '登录失败：账号或密码错误';
      if(btn){ btn.disabled=false; btn.textContent='重试'; }
    }
  }).catch(function(e){
    _clr();
    var _tmo = !!(e && e.name === 'AbortError');
    if(msg) msg.textContent = _tmo ? '登录超时：网络连接中断（链路抖动），请点「重试」' : '登录失败：网络错误，请点「重试」';
    if(btn){ btn.disabled=false; btn.textContent='重试'; }
  });
}

// 长按轻量刷新：仅该服 tamed 重导 + eggs 重扫（复用 lbTrigger/lbWaitTamed/lbLoadOneServer/lbEggProbe）
async function lbRefreshTamedEggs(abbr){
  if(LB._tamedRefreshing){ lbToast('已有刷新进行中，请稍候'); return; }
  LB._tamedRefreshing = true;
  LB._tamedRefreshingAt = Date.now();
  var ov = document.querySelector('.lb-confirm-overlay');
  var progEl = null;
  if(ov){ var all=ov.querySelectorAll('div'); for(var i=0;i<all.length;i++){ if(all[i].id==='lbProgBar'){ progEl=all[i].parentElement.parentElement; break; } } }
  if(progEl) progEl.style.display='block';
  var bar=document.getElementById('lbProgBar'), txt=document.getElementById('lbProgText');
  function segCol(c){ if(bar && bar.firstChild) bar.firstChild.style.background=c; }
  try{
    var noToken = (LB_ARCH !== 'new') && !(await lbHaTokenRefresh());
    if(bar) bar.innerHTML = '<div style="flex:1;border-radius:2px;background:#333;transition:background .3s"></div>'; // 单段进度
    segCol('#7c3aed');
    if(txt) txt.textContent = '正在刷新 '+LB.servName(abbr)+'（已放出）…'+(noToken?' [webhook]':'');
    // ① savedAt 基线（触发前）
    var oldMarker = await lbGetSavedAt(abbr);
    // ② RCON 重导 tamed（ArkTamedDinos）
    var r = await lbTrigger(abbr).catch(function(e){ return {ok:false, error:String(e)}; });
    var done = false;
    if(r && !r.ok){ segCol('#ef4444'); if(txt) txt.textContent='❌ '+LB.servName(abbr)+' 触发失败'; }
    else if(r && r.cooldown){ segCol('#f59e0b'); if(txt) txt.textContent='⏭ '+LB.servName(abbr)+' RCON 冷却中，稍后再试'; }
    else {
      done = await lbWaitTamed(abbr, oldMarker);
      if(done){
        segCol('#22c55e');
        if(txt) txt.textContent = '✅ '+LB.servName(abbr)+' 已放出已更新，增量加载…';
        // ③ 增量拉该服合并缓存并渲染（cryo 未变自动复用，只更新 tamed）
        await lbLoadOneServer(abbr).catch(function(){});
      } else {
        segCol('#ef4444'); if(txt) txt.textContent='❌ '+LB.servName(abbr)+' tamed 落盘超时';
      }
    }
    // ④ 延迟 5s（v542：EggProbe 与 tamed 导出竞争会打断导出）→ 刷蛋并强制重拉 eggs
    if(done){
      try{
        if(txt) txt.textContent = '⏳ 等待导出稳定后扫蛋…';
        await new Promise(function(res){ setTimeout(res, 5000); });
        if(txt) txt.textContent = '正在刷新 '+LB.servName(abbr)+'（蛋）…';
        await lbEggProbe([abbr]);
        segCol('#22c55e');
        if(txt) txt.textContent = '✅ '+LB.servName(abbr)+' 已放出+蛋 已更新';
      }catch(e){}
    }
    setTimeout(function(){ if(progEl) progEl.style.display='none'; }, 4000);
    setTimeout(function(){ var o=document.querySelector('.lb-confirm-overlay'); if(o) o.remove(); }, 1200); // 完成后自动关浮窗
  } finally {
    LB._tamedRefreshing = false;
    if(LB._srvPressAbbr){ var el2=document.querySelector('#lbServers .server-tab[data-abbr="'+LB._srvPressAbbr+'"]'); if(el2) el2.style.boxShadow=''; }
    LB._srvPressAbbr = null;
    LB._srvLongPress = false;
  }
}

// 获取文件 Last-Modified（HEAD 轻量请求，毫秒级；失败返回 null，文件不存在(404)返回 '__404__'）
// 用 XHR 直接实现（fetch HEAD 并发易 ERR_ABORTED）；Basic Auth 从 URL 内嵌凭据取
var LB_LM_404 = '__404__';
function lbHeadLm(url){
  return new Promise(function(resolve){
    var m = url.match(/^([a-z]+:\/\/)([^@\/]+)@/i);
    var cleanUrl = url;
    var auth = null;
    if(m){
      var b64;
      try{ b64 = btoa(decodeURIComponent(m[2])); }catch(e2){ b64 = btoa(m[2]); }
      auth = 'Basic ' + b64;
      cleanUrl = m[1] + url.slice(m[0].length);
    }
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', cleanUrl, true);
    if(auth) xhr.setRequestHeader('Authorization', auth);
    xhr.timeout = 8000;
    xhr.onload = function(){
      var lm = null;
      try{ lm = xhr.getResponseHeader('Last-Modified') || null; }catch(e){}
      if(xhr.status === 404) lm = LB_LM_404; // 文件不存在（如非 Isl 的 tamed.json）
      resolve(lm);
    };
    xhr.onerror = function(){ resolve(null); };
    xhr.ontimeout = function(){ resolve(null); };
    try{ xhr.send(null); }catch(e){ resolve(null); }
  });
}

// 自动解压：gzip magic 检测 → DecompressionStream('gzip')；nginx 动态 gzip 由浏览器自动解压
// v951：全链 25s 超时（AbortController）——后端 CORS/重建偶发挂起不再让 lbLoad 永久停在「检查数据更新/资源加载中」
function lbFetchDataJson(base, gzUrl){
  var _ac = new AbortController();
  // v985：90s —— 必须大于 lbFetchOnce 的 60s，否则外层先 abort、内层超时白设
  var _tm = setTimeout(function(){ try{ _ac.abort(); }catch(e){} }, 90000);
  var _opts = function(){ return { signal: _ac.signal }; };
  function _clr(){ try{ clearTimeout(_tm); }catch(e){} }
  return authFetch(gzUrl, _opts()).then(function(res){
    if(res.ok){
      return res.arrayBuffer().then(function(buf){
        var u8 = new Uint8Array(buf);
        if(u8.length>2 && u8[0]===0x1f && u8[1]===0x8b){ // gzip magic
          if(typeof DecompressionStream !== 'undefined'){
            var stream = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
            return new Response(stream).text().then(function(t){ _clr(); return JSON.parse(t); });
          }
          // 极老浏览器无 DecompressionStream → 回退请求 .json（nginx 动态 gzip）
          return authFetch(base, _opts()).then(function(r2){ _clr(); return r2.ok ? r2.json() : null; });
        }
        _clr();
        return JSON.parse(new TextDecoder().decode(buf));
      });
    }
    if(res.status === 404){
      // 回退 .json
      return authFetch(base, _opts()).then(function(r2){
        _clr();
        if(!r2.ok) return null;
        var enc = (r2.headers.get('content-encoding')||'').toLowerCase();
        if(enc.indexOf('gzip')>=0) return r2.json(); // nginx 动态 gzip，浏览器自动解压
        return r2.arrayBuffer().then(function(b2){ return JSON.parse(new TextDecoder().decode(b2)); });
      });
    }
    _clr();
    return null;
  }).catch(function(){ try{ _clr(); }catch(e){} return null; });
}

// v211：HEAD 探测 .gz 优先（后端 zlib 改造后可能只输出 .json.gz 不保留明文 .json），404 回退 .json；返回 {lm, ext}
// v910：tryGz=false 跳过 .gz 探测——tamed 固定明文 .json（物理服务器从不 gz 化），直接 HEAD .json，省 1 次必 404 的 HEAD/服；若未来 tamed 改 gz 需改回 true
function lbHeadPick(base, tryGz){
  if(tryGz === false){
    return lbHeadLm(base+'?cb='+Date.now()).then(function(lm){
      return { lm: lm, ext: (lm===LB_LM_404) ? null : '' };
    });
  }
  return lbHeadLm(base+'.gz?cb='+Date.now()).then(function(lm){
    if(lm !== LB_LM_404) return { lm: lm, ext: '.gz' };
    return lbHeadLm(base+'?cb='+Date.now()).then(function(lm2){
      return { lm: lm2, ext: (lm2===LB_LM_404) ? null : '' };
    });
  });
}

  data.recs.forEach(function(r){ if(r.server) servers[r.server]=1; });
  Object.keys(servers).forEach(function(abbr){
    LB._bd('bs:srv', abbr); // v920：每服处理前打点（卡死可定位到服）
    var recs = data.recs.filter(function(r){ return r.server===abbr; });
    // 1. 容器聚合：containerId → {x,y,type,tribeId,球数,印痕者集合,dinoKeys}
    var ctn = {};
    recs.forEach(function(r){
      if(lbContainerTypeOf(r)==='player') return; // 排除玩家背包（不算聚落）；空球也参与容器坐标聚合（byContainer 归属用）
      var cid, tid;
      if(lbContainerTypeOf(r)==='released'){
        // 放出：无真实容器（野外放养），按生物个体坐标聚类；部落用生物自身 tribeId（避免共享 noid_released 容器错冠名）
        cid = 'rel_'+(r.dinoId1||'')+'_'+(r.dinoId2||'');
        tid = r.tribeId||r.containerTribe||0;
      } else {
        cid = r.containerId || ('noid_'+(lbContainerTypeOf(r)||''));
        tid = r.containerTribe||r.tribeId||0;
      }
      var c = ctn[cid] = ctn[cid] || { id:cid, type:lbContainerTypeOf(r), x:r.containerX||0, y:r.containerY||0, z:r.containerZ||0,
        tribeId:tid, count:0, imps:{}, impEos:{}, keys:[] };
      if(r.src !== 'facility') c.count++; // v202：facility 空容器 rec 不算球数（容器是空的，无球；cryo 空球仍计）
      // v318：印痕者按 eosId 优先计数（重名安全）；无 eosId 才按 name（仅兜底）
      if(!r.isEmpty && r.imprinterEosId) c.impEos[r.imprinterEosId] = (c.impEos[r.imprinterEosId]||0)+1;
      else if(!r.isEmpty && r.imprinterName) c.imps[r.imprinterName] = (c.imps[r.imprinterName]||0)+1;
      if(!r.isEmpty) c.keys.push(String(r.dinoId1||'')+'_'+String(r.dinoId2||'')); // 空球无 dinoId，仅建 byContainer
    });
    lbSettlePhase(abbr + ':聚合完成');
    // 2. 排除无坐标容器
    var posCtn = Object.keys(ctn).map(function(k){ return ctn[k]; }).filter(function(c){
      return c.type !== 'player' && (Number(c.x)!==0 || Number(c.y)!==0);
    });
    // 3. 按 tribeId 分组 → 组内 DBSCAN（大簇 radius>eps 后处理拆分，避免 released 桥接分离基地）
    var byTribe = {};
    posCtn.forEach(function(c){ var t=String(c.tribeId||0); (byTribe[t]=byTribe[t]||[]).push(c); });
    var settlements = [];
    var scatteredCtn = [];
    Object.keys(byTribe).forEach(function(tid){
      var grp = byTribe[tid];
      var clusters = lbDbscan(grp, LB_SETTLE_EPS, 1);
      // 本部落床池（床消费唯一化 2026-08-12：一张床只能归属一个聚落）
      // v20260912：走 structsByTribe 索引（原每部落全量扫 52 万条 structures）
      var beds = (structsByTribe[String(tid)] || []).filter(function(s){ return LB_BED_RE.test(s.class||''); });
      // 候选子簇（原 lbClusterHasBed 为真的簇拆分而来）
      var cands = [];
      clusters.forEach(function(clu, ci){
        // 聚落成立：簇内有床/棺材/睡眠舱建筑（不再校验容器数量）；无建筑 → 离散
        if(lbClusterHasBed(data, clu)){
          // radius>切割阈值的大簇：单链接最大间隙拆分（桥接的分离基地各自成聚落）；切割阈值独立（LB_SPLIT_EPS），不随聚类 eps 放大
          var subs = lbSplitOversize(clu, LB_SPLIT_EPS);
          subs.forEach(function(sub, si){
            var cx=0, cy=0;
            sub.forEach(function(c){ cx+=Number(c.x); cy+=Number(c.y); });
            cands.push({ sub:sub, cx:cx/sub.length, cy:cy/sub.length, owned:0, ci:ci, si:si });
          });
        } else {
          // 无床/棺材/睡眠舱的簇 → 离散
          clu.forEach(function(c){ c._scattered = true; });
          clu.forEach(function(c){ scatteredCtn.push(c); });
        }
      });
      // 床消费（2026-08-12 修正）：大簇优先（容器数降序），子簇占用"距其中心 ≤LB_SETTLE_EPS 的全部未占用床"；
      // 一张床只能归属一个聚落（被大簇吸走后小簇不可复用），避免同一床支撑多个聚落成立/命名
      cands.sort(function(a,b){ return b.sub.length - a.sub.length; });
      var used = {};
      cands.forEach(function(ca){
        var cnt = 0;
        beds.forEach(function(b, bi){
          if(used[bi]) return;
          var dd = Math.sqrt(Math.pow(ca.cx-Number(b.x),2)+Math.pow(ca.cy-Number(b.y),2));
          if(dd <= LB_SETTLE_EPS){ used[bi]=1; cnt++; }
        });
        ca.owned = cnt;
      });
      cands.forEach(function(ca){
        if(ca.owned > 0){
          // 有专属床 → 聚落
          settlements.push(lbFinalizeSettlement(data, abbr, tid, abbr+'_'+tid+'_'+(ca.ci+1)+'_'+(ca.si+1), ca.sub));
        } else {
          // 无专属床：含真实建筑容器 或 纯 released >2 → 保留聚落；纯 released ≤2 → 离散（走吸收）
          var hasReal = ca.sub.some(function(c){ return c.type !== 'released'; });
          if(hasReal || ca.sub.length > 2){
            settlements.push(lbFinalizeSettlement(data, abbr, tid, abbr+'_'+tid+'_'+(ca.ci+1)+'_'+(ca.si+1), ca.sub));
          } else {
            ca.sub.forEach(function(c){ c._scattered = true; });
            ca.sub.forEach(function(c){ scatteredCtn.push(c); });
          }
        }
      });
    });
    lbSettlePhase(abbr + ':聚类+聚落成立完成(n=' + settlements.length + ')');
    // 4. 离散兜底：posCtn 中未被任何 settlement 覆盖的容器 → scattered（_scattered 防重复）
    var covered = {};
    settlements.forEach(function(s){ (s.containers||[]).forEach(function(c){ covered[c.id]=1; }); });
    posCtn.forEach(function(c){ if(!c._scattered && !covered[c.id]){ c._scattered=true; scatteredCtn.push(c); } });
    // 4.5 离散吸收（2026-08-12）：同部落离散容器若离最近聚落中心 ≤ 吸收阈值 → 归入该聚落（防近主聚落的离散被误切/误分）
    var ABSORB_EPS = 20000; // 吸收阈值（2026-08-12 放宽到 20000：聚类 8000 边缘的离散也吸收）
    var keepScattered = [];
    scatteredCtn.forEach(function(c){
      var bestS=null, bd=Infinity;
      settlements.forEach(function(s){
        if(Number(s.tribeId)!==Number(c.tribeId)) return;
        var d = Math.sqrt(Math.pow(Number(c.x)-s.center.x,2)+Math.pow(Number(c.y)-s.center.y,2));
        if(d<bd){ bd=d; bestS=s; }
      });
      if(bestS && bd <= ABSORB_EPS){
        bestS.containers.push(c);
        c._absorbed = true;
        bestS._absorbed = true;
      } else {
        keepScattered.push(c);
      }
    });
    scatteredCtn = keepScattered;
    // 吸收后重算受影响聚落 center（标注更准）
    settlements.forEach(function(s){
      if(!s._absorbed || !s.containers || !s.containers.length) return;
      var nx=0, ny=0;
      s.containers.forEach(function(cc){ nx+=Number(cc.x); ny+=Number(cc.y); });
      s.center.x = nx/s.containers.length;
      s.center.y = ny/s.containers.length;
    });
    // v194/v196 床纳入聚落中心：床=主宅标志；容器稀少/放养龙远离主宅时中心偏移修复（海潮厅 case）
    // v196/v199 一致化：床建唯一 key（class+tribeId+x+y+z）；v199 修复：床归属最近聚落（原大聚落优先会抢走其他聚落床，如龙舍被 My DOG 抢走）
    var BED_CENTER_EPS = LB_SETTLE_EPS * 1.5;
    var bedKey = function(b){ return (b.class||'')+'|'+(b.tribeId||0)+'|'+Math.round(Number(b.x))+'|'+Math.round(Number(b.y))+'|'+Math.round(Number(b.z)||0); };
    // 按部落分组聚落
    var tribeSettles = {};
    settlements.forEach(function(s){ var t=String(s.tribeId||0); (tribeSettles[t]=tribeSettles[t]||[]).push(s); });
    // 每张床归属同部落最近聚落（≤BED_CENTER_EPS）；bedOwner: bedKey -> {setId, bed}
    var bedOwner = {};
    Object.keys(structsByTribe).forEach(function(t){
      var tSettles = tribeSettles[t] || [];
      if(!tSettles.length) return;
      (structsByTribe[t]||[]).forEach(function(b){
        if(!LB_BED_RE.test(b.class||'')) return;
        var best=null, bd=Infinity;
        for(var i=0;i<tSettles.length;i++){
          var s0=tSettles[i];
          var dd = Math.sqrt(Math.pow(Number(b.x)-s0.center.x,2)+Math.pow(Number(b.y)-s0.center.y,2));
          if(dd<bd){ bd=dd; best=s0; }
        }
        if(best && bd<=BED_CENTER_EPS) bedOwner[bedKey(b)] = { setId:best.id, bed:b };
      });
    });
    // 聚落纳入归属床 + 重算中心（含床）
    var sBedById = {};
    Object.keys(bedOwner).forEach(function(bk){
      var o = bedOwner[bk];
      (sBedById[o.setId]=sBedById[o.setId]||[]).push(o.bed);
    });
    settlements.forEach(function(s){
      var nearBeds = sBedById[s.id] || [];
      if(nearBeds.length){
        nearBeds.forEach(function(b){ b._bk = bedKey(b); }); // 记录床 key（byBed 映射用）
        var nx = Number(s.center.x)*s.containers.length, ny = Number(s.center.y)*s.containers.length, nz = Number(s.center.z||0)*s.containers.length;
        var tot = s.containers.length;
        nearBeds.forEach(function(b){ nx+=Number(b.x); ny+=Number(b.y); nz+=(b.z!==undefined&&b.z!==null)?Number(b.z):0; });
        tot += nearBeds.length;
        s.center.x = nx/tot; s.center.y = ny/tot; s.center.z = nz/tot;
        s.beds = nearBeds; // 聚落床列表（详情显示 + byBed 映射）
      }
    });
    // v198/v200 命名设施统一最近归属：墓碑/牌子/M床/其他带名 每设施只归属同部落最近聚落（对齐床 v199 规则；替代 v198 大聚落优先）
    var _signRe = /Gravestone|Sign_Large_Metal|Sign_Large_Wood|MetalSign_Large|WoodSign_Large/i;
    var nameOwner = {}; // structKey -> setId（所有带名结构最近归属）
    Object.keys(structsByTribe).forEach(function(t){
      var tSettles = tribeSettles[t] || [];
      if(!tSettles.length) return;
      (structsByTribe[t]||[]).forEach(function(st){
        if(!st.name) return;
        var best=null, bd=Infinity;
        for(var i=0;i<tSettles.length;i++){
          var s0=tSettles[i];
          var dd = Math.sqrt(Math.pow(Number(st.x)-s0.center.x,2)+Math.pow(Number(st.y)-s0.center.y,2));
          if(dd<bd){ bd=dd; best=s0; }
        }
        if(best) nameOwner[(st.class||'')+'|'+Math.round(Number(st.x))+'|'+Math.round(Number(st.y))] = { id:best.id, st:st }; // v20260912：同时存设施引用供逆映射
      });
    });
    // v200 命名：只取归属本聚落的最近命名设施（墓碑优先→M床→任意）；无则冠名/S编号
    // v20260912：预建「聚落 → 归属设施」逆映射（原 sNameOf 每个聚落都全量遍历该部落建筑 ×3）
    var _ownBySet = {};
    Object.keys(nameOwner).forEach(function(k){
      var o = nameOwner[k];
      if(!o || !o.st) return;
      (_ownBySet[o.id] = _ownBySet[o.id] || []).push(o.st);
    });
    var sNameOf = function(s){
      var own = _ownBySet[s.id] || [];
      if(!own.length) return null;
      function nearest(t){
        var best=null, bd=Infinity;
        t.forEach(function(st){
          var dd = Math.sqrt(Math.pow(Number(st.x)-s.center.x,2)+Math.pow(Number(st.y)-s.center.y,2));
          if(dd<bd){ bd=dd; best=st; }
        });
        return best;
      }
      // v1035：统一为「四档优先级」，与 lbSettlementBuildingName 保持一致。
      //   原为旧三档「① 墓碑+广告牌【混合】→ ② 名字以 M 结尾(僵尸条件) → ③ 其余」⇒ 墓碑混在第①档、抢在床之前 ⇒ 聚落名被墓碑占据（用户实测 "My DOG"）。
      //   而 v1027 修好的 lbSettlementBuildingName（四档）只被 lbFinalizeSettlement 调用，全量重建走的是本函数 ⇒ v1027 在此路径完全不生效（"改了没用"的真因）。
      //   候选范围仍保留 own（归属本聚落的设施），比「全部落」更精确，语义不变。
      function _pick(re){
        var t = own.filter(function(st){ return st && st.name && re.test(String(st.class||'')); });
        return t.length ? nearest(t) : null;
      }
      var g1 = _pick(/Sign_Large_Metal|Sign_Large_Wood|MetalSign_Large|WoodSign_Large/i); // ① 大型广告牌
      if(g1) return g1.name;
      var g2 = _pick(LB_BED_RE);                                                           // ② 床/棺/睡眠舱
      if(g2) return g2.name;
      var g3 = _pick(/Gravestone/i);                                                       // ③ 墓碑（降级至广告牌与床之后）
      if(g3) return g3.name;
      var g4 = _pick(/./);                                                                 // ④ 其余带名字者
      if(g4) return g4.name;
      return null;
    };
    settlements.forEach(function(s){
      var nbName = sNameOf(s);
      if(nbName){ s.name = nbName; }
      else { s.name = (s.owners && s.owners.length) ? s.owners.map(function(m){ return m.name; }).join('、') : ('S'+String(s.id).split('_').pop()); }
    });
    // v194 基因设备归属映射：基因台/枪按坐标归属聚落（同部落 ≤ ABSORB_EPS）——消除运行时独立匹配（海潮厅根因）
    var gdEnt = (data.geneDevices && data.geneDevices[abbr]) || null;
    var geneDevs = [];
    if(gdEnt){
      (gdEnt.infusers||[]).forEach(function(d){ if(d && d.key) geneDevs.push(d); });
      (gdEnt.scanners||[]).forEach(function(d){ if(d && d.key && lbContainerTypeOf(d)!=='player') geneDevs.push(d); });
    }
    geneDevs.forEach(function(d){
      var gx = (d.containerX!==undefined && Number(d.containerX)!==0) ? Number(d.containerX) : Number(d.x);
      var gy = (d.containerY!==undefined && Number(d.containerY)!==0) ? Number(d.containerY) : Number(d.y);
      var gt = Number(d.containerTribe||d.tribeId||0);
      var best=null, bd=Infinity;
      settlements.forEach(function(s){
        if(Number(s.tribeId)!==gt) return;
        var dist=Math.sqrt(Math.pow(gx-s.center.x,2)+Math.pow(gy-s.center.y,2));
        if(dist<bd){ bd=dist; best=s; }
      });
      if(best && bd<=ABSORB_EPS){
        byGeneDevice[abbr+'_'+d.key] = { setId:best.id, scattered:false, server:abbr, tribeId:Number(best.tribeId) };
        (best.geneKeys=best.geneKeys||[]).push(d.key);
      } else {
        byGeneDevice[abbr+'_'+d.key] = { setId:'scattered', scattered:true, server:abbr, tribeId:gt };
      }
    });
    // v194/v196 床归属映射（详情显示 + 未来扩展；v196 用统一床 key，与基因设备/容器同构）
    settlements.forEach(function(s){
      (s.beds||[]).forEach(function(b){
        byBed[abbr+'_'+(b._bk||bedKey(b))] = { setId:s.id, scattered:false, server:abbr, tribeId:Number(s.tribeId) };
      });
    });
    lbSettlePhase(abbr + ':床/命名归属完成');
    // v821 设施唯一归属：structures(床/墓碑/棺材等) 同部落最近聚落（设施 rec 已统一进容器体系，不再需要独立归属通道）
    // 每设施消费唯一化（与 bedOwner 同模式）；装饰（灯/椅/牌/画）不参与归属 → 存 s.facilityList（设施区显示）
    var _facDecorRe = /Lamp|Light|Chair|Seat|WoodBench|Stool|Sign_Large_Metal|WoodSign|MetalSign|Sign_Small_Wood|Sign_Small_Metal|HangingSign|Sign_Large_Wood|MetalSign_Large|WoodSign_Large|Painting|DrawingSheet|Poster|Canvas|Mirror|Decor|Display_Box|Snowman|ChristmasTree|Pumpkin|Wreath/i; // v914：+Decor（装饰箱）v927：+Snowman/ChristmasTree v20260912-1022：Bench→WoodBench（同源误伤修复）v1036：+6 个标牌类（标识牌不进 facilityList；墓碑 StructureBP_Gravestone 不在内，保留显示）v1068：+Pumpkin/Wreath（同源同步）
    var _facDecorKeepRe = /LightningRod|AnvilBench|ChemBench|Warbench/i; // v20260912-1022：生产设施豁免
    var _facCands = (Array.isArray(data.structures)?data.structures:[]); // v821：facilityStructs 已弃用（已放置设施统一生成 facility rec，经容器聚合自动入聚落）
    // v20260912：去掉 52 万条数组复制（原 forEach push 深复制一遍，纯浪费内存与时间）
    var _facOwner = {}; // class|tribeId|x|y -> {setId, st}
    _facCands.forEach(function(st){
      if(!st || !(Number(st.x)||Number(st.y))) return;
      if(!st.tribeId) return;
      if(_facDecorRe.test(String(st.class||'')) && !_facDecorKeepRe.test(String(st.class||''))) return; // 装饰排除（生产设施豁免）
      var tSettles = tribeSettles[String(st.tribeId)] || [];
      if(!tSettles.length) return;
      var best=null, bd=Infinity;
      for(var i=0;i<tSettles.length;i++){
        var s0=tSettles[i];
        var dd=Math.sqrt(Math.pow(Number(st.x)-s0.center.x,2)+Math.pow(Number(st.y)-s0.center.y,2));
        if(dd<bd){ bd=dd; best=s0; }
      }
      // 阈值对齐离散吸收（20000），保证远距设施不误挂；床已在 s.beds，避免重复挂 bed 类（详情显示用 s.beds + facilityList）
      if(best && bd<=ABSORB_EPS && !LB_BED_RE.test(String(st.class||''))){
        _facOwner[(st.class||'')+'|'+(st.tribeId||0)+'|'+Math.round(Number(st.x))+'|'+Math.round(Number(st.y))] = { setId:best.id, st:st };
      }
    });
    var sFacById = {};
    Object.keys(_facOwner).forEach(function(fk){ var o=_facOwner[fk]; (sFacById[o.setId]=sFacById[o.setId]||[]).push(o.st); });
    settlements.forEach(function(s){ if(sFacById[s.id]) s.facilityList = sFacById[s.id]; });
    // 5. 建立 dinoKey 映射
    settlements.forEach(function(s){
      (s.containers||[]).forEach(function(c){
        var d = Math.sqrt(Math.pow(Number(c.x)-s.center.x,2)+Math.pow(Number(c.y)-s.center.y,2));
        c.keys.forEach(function(k){ byDinoKey[abbr+'_'+k] = { setId:s.id, dist:Math.round(d), server:abbr, tribeId:Number(tidOf(s)), scattered:false }; });
      });
    });
    scatteredCtn.forEach(function(c){
      c.keys.forEach(function(k){ byDinoKey[abbr+'_'+k] = { setId:'scattered', dist:0, server:abbr, tribeId:c.tribeId, scattered:true }; });
    });
    // 5b. 建立 byContainer 映射（空球无 dinoId 无法建 byDinoKey → 按容器坐标归属聚落；排除 noid_/rel_ 合成 id）
    settlements.forEach(function(s){
      (s.containers||[]).forEach(function(c){
        if(c.id && c.id.indexOf('noid_')!==0 && c.id.indexOf('rel_')!==0){
          byContainer[abbr+'_'+c.id] = { setId:s.id, scattered:false, server:abbr, tribeId:Number(tidOf(s)) };
        }
      });
    });
    scatteredCtn.forEach(function(c){
      if(c.id && c.id.indexOf('noid_')!==0 && c.id.indexOf('rel_')!==0){
        byContainer[abbr+'_'+c.id] = { setId:'scattered', scattered:true, server:abbr, tribeId:c.tribeId };
      }
    });
    byServer[abbr] = { settlements:settlements, scattered:scatteredCtn.length };
  });
  return { byServer:byServer, byDinoKey:byDinoKey, byContainer:byContainer, byGeneDevice:byGeneDevice, byBed:byBed, buildAt:Date.now() };
}
function tidOf(s){ return s && s.tribeId; }
// 簇半径：到簇中心（均值）的最大距离
function lbClusterRadius(pts){
  if(!pts || !pts.length) return 0;
  var cx=0, cy=0;
  pts.forEach(function(p){ cx+=Number(p.x); cy+=Number(p.y); });
  cx/=pts.length; cy/=pts.length;
  var mr=0;
  pts.forEach(function(p){
    var d=Math.sqrt(Math.pow(Number(p.x)-cx,2)+Math.pow(Number(p.y)-cy,2));
    if(d>mr) mr=d;
  });
  return mr;
}
// 大簇后处理拆分：radius>eps 的簇按单链接最大间隙（MST 最长边）递归切断，直到子簇 radius<=eps
function lbSplitOversize(pts, eps){
  function split(arr){
    if(arr.length<=1) return [arr];
    if(lbClusterRadius(arr) <= eps) return [arr];
    var n=arr.length;
    // Prim 求 MST
    var key=new Array(n), parentArr=new Array(n), mstSet=new Array(n);
    for(var i=0;i<n;i++){ key[i]=Infinity; mstSet[i]=false; }
    key[0]=0; parentArr[0]=-1;
    for(var c=0;c<n-1;c++){
      var u=-1, minK=Infinity;
      for(var j=0;j<n;j++){ if(!mstSet[j] && key[j]<minK){ minK=key[j]; u=j; } }
      if(u<0) break;
      mstSet[u]=true;
      for(var v=0;v<n;v++){
        if(!mstSet[v]){
          var d=Math.sqrt(Math.pow(Number(arr[u].x)-Number(arr[v].x),2)+Math.pow(Number(arr[u].y)-Number(arr[v].y),2));
          if(d<key[v]){ key[v]=d; parentArr[v]=u; }
        }
      }
    }
    // 找 MST 最长边（最可能的桥接）
    var maxE=-1, uu=-1, vv=-1;
    for(var v=1;v<n;v++){
      var u=parentArr[v];
      if(u<0) continue;
      var d=Math.sqrt(Math.pow(Number(arr[u].x)-Number(arr[v].x),2)+Math.pow(Number(arr[u].y)-Number(arr[v].y),2));
      if(d>maxE){ maxE=d; uu=u; vv=v; }
    }
    if(uu<0 || vv<0) return [arr];
    // 去掉最长边 → BFS 分 2 个连通分量
    var adj={};
    for(var v=1;v<n;v++){
      var u=parentArr[v];
      if(u<0) continue;
      if((u===uu&&v===vv)||(u===vv&&v===uu)) continue;
      (adj[u]=adj[u]||[]).push(v);
      (adj[v]=adj[v]||[]).push(u);
    }
    var visited={};
    function collect(start){
      var out=[], stack=[start];
      visited[start]=1;
      while(stack.length){
        var cur=stack.pop(); out.push(arr[cur]);
        (adj[cur]||[]).forEach(function(nb){ if(!visited[nb]){ visited[nb]=1; stack.push(nb); } });
      }
      return out;
    }
    var c1=collect(0), c2=[];
    for(var i=0;i<n;i++){ if(!visited[i]){ c2=collect(i); break; } }
    var res=[];
    if(c1.length) split(c1).forEach(function(x){ res.push(x); });
    if(c2.length) split(c2).forEach(function(x){ res.push(x); });
    return res;
  }
  return split(pts);
}
// DBSCAN（eps 距离阈值，minPts=1 即单点也成簇；按 x/y 平面距离；标准密度可达递归扩展）
// v201 性能修复（切换地图卡 8.6s 根因）：空间网格索引（cell=eps）——邻域查询只查 3×3 格
// 数学保证不漏点：两点距离 ≤eps 必在同一或相邻 cell（3×3 覆盖对角线 2.83eps）；复杂度 O(n²) → O(n)
// queue 用头指针替代 shift()（避免数组头部移除 O(n)）；语义与原实现完全一致
function lbDbscan(pts, eps, minPts){
  var clusters = [], visited = {};
  var n = pts.length;
  var cellSize = eps > 0 ? eps : 1;
  var cell = {};
  for(var i=0;i<n;i++){
    var k = Math.floor(Number(pts[i].x)/cellSize)+','+Math.floor(Number(pts[i].y)/cellSize);
    (cell[k]=cell[k]||[]).push(i);
  }
  var eps2 = eps*eps;
  function regionIdx(i){
    var out=[];
    var gx = Math.floor(Number(pts[i].x)/cellSize), gy = Math.floor(Number(pts[i].y)/cellSize);
    for(var dx=-1;dx<=1;dx++){
      for(var dy=-1;dy<=1;dy++){
        var c = cell[(gx+dx)+','+(gy+dy)];
        if(!c) continue;
        for(var m=0;m<c.length;m++){
          var j=c[m];
          if(j===i) continue;
          var dx2=Number(pts[i].x)-Number(pts[j].x), dy2=Number(pts[i].y)-Number(pts[j].y);
          if(dx2*dx2+dy2*dy2 <= eps2) out.push(j);
        }
      }
    }
    return out;
  }
  for(var i=0;i<n;i++){
    if(visited[i]) continue;
    visited[i]=1;
    var clu=[i], queue=regionIdx(i), head=0;
    while(head<queue.length){
      var q=queue[head++];
      if(visited[q]) continue;
      visited[q]=1;
      clu.push(q);
      regionIdx(q).forEach(function(j){ if(!visited[j]) queue.push(j); });
    }
    clusters.push(clu.map(function(idx){ return pts[idx]; }));
  }
  return clusters;
}
// 取数组中距中心最近的建筑（返回其 name）
function lbNearestStructure(arr, cx, cy){
  var best=null, bd=Infinity;
  arr.forEach(function(s){
    var d = Math.sqrt(Math.pow(Number(s.x)-cx,2)+Math.pow(Number(s.y)-cy,2));
    if(d < bd){ bd=d; best=s; }
  });
  return best ? best.name : null;
}
// 聚落建筑命名优先级（v1027 修订）：①大型广告牌(Sign_Large_Metal/Wood，含旧词序)自定义名(同组取距center最近) → ②床/棺材/睡眠舱(按类名 LB_BED_RE 判定，v1027 起不再要求名字以 M 结尾) → ③墓碑(Gravestone，v1027 起降级到广告牌与床之后) → ④其余带自定义名者；无则 null
function lbSettlementBuildingName(data, abbr, tid, cx, cy){
  // v20260912：走 structsByTribe 索引（原每聚落全量扫 52 万条 → O(聚落数×52万)）
  var pool = (LB_STRUCTS_BY_TRIBE && LB_STRUCTS_BY_TRIBE[String(tid)]) || null;
  if(!pool){
    var sts = (data && Array.isArray(data.structures)) ? data.structures : [];
    if(!sts.length) return null;
    pool = sts.filter(function(s){ return Number(s.tribeId) === Number(tid); });
  }
  var cands = pool.filter(function(s){ return !!s.name; });
  if(!cands.length) return null;
  var billboard = cands.filter(function(s){ return /Sign_Large_Metal|Sign_Large_Wood|MetalSign_Large|WoodSign_Large/i.test(s.class||''); });
  if(billboard.length) return lbNearestStructure(billboard, cx, cy);
  var beds = cands.filter(function(s){ return LB_BED_RE.test(s.class||''); });
  if(beds.length) return lbNearestStructure(beds, cx, cy);
  var tomb = cands.filter(function(s){ return /Gravestone/i.test(s.class||''); });
  if(tomb.length) return lbNearestStructure(tomb, cx, cy);
  return lbNearestStructure(cands, cx, cy);
}
// 聚落收尾：计算 center/radius/容器数/球数 + 冠名（§8）
function lbFinalizeSettlement(data, abbr, tid, sid, containers){
  var cx=0, cy=0, cz=0, pods=0;
  var allImps = {}, allImpEos = {};
  containers.forEach(function(c){
    cx+=Number(c.x); cy+=Number(c.y); cz+=(c.z!==undefined&&c.z!==null)?Number(c.z):0; pods+=c.count;
    Object.keys(c.imps).forEach(function(n){ allImps[n]=(allImps[n]||0)+c.imps[n]; });
    Object.keys(c.impEos||{}).forEach(function(e){ allImpEos[e]=(allImpEos[e]||0)+c.impEos[e]; });
  });
  cx/=containers.length; cy/=containers.length; cz/=containers.length;
  var maxR=0;
  containers.forEach(function(c){
    var d=Math.sqrt(Math.pow(Number(c.x)-cx,2)+Math.pow(Number(c.y)-cy,2));
    if(d>maxR) maxR=d;
  });
  // 冠名：印痕者 → pid 反查（§8.1）→ 本部落过滤（§8.2）→ 前3名（§8.3）
  var tribe = (data.tribesByServer && data.tribesByServer[abbr] && data.tribesByServer[abbr][tid]) || null;
  var memberPids = {};
  var memberNames = {};
  if(tribe && Array.isArray(tribe.members)){
    tribe.members.forEach(function(m){ if(m && m.pid!==undefined){ memberPids[String(m.pid)]=m.name||''; memberNames[m.name]=String(m.pid); } });
  }
  // 印痕者计数按 pid（v318：eosId 反查优先=重名安全；name 仅对无 eosId 的兜底）
  var pidCount = {};
  Object.keys(allImpEos).forEach(function(eos){
    var pid = lbResolveImprinterPidByEos(data, eos, memberPids);
    if(pid!==null){ pidCount[pid]=(pidCount[pid]||0)+allImpEos[eos]; }
  });
  Object.keys(allImps).forEach(function(nm){
    var pid = lbResolveImprinterPid(data, nm, abbr, memberPids, memberNames);
    if(pid!==null){ pidCount[pid]=(pidCount[pid]||0)+allImps[nm]; }
  });
  // §8.3 前3名 + 5%/100 规则（2026-08-13 阈值 50→100）
  var ranked = Object.keys(pidCount).map(function(pid){ return {pid:pid, name:(memberPids[pid]||lbCharName(Number(pid))||('#'+pid)), cnt:pidCount[pid]}; })
    .sort(function(a,b){ return b.cnt-a.cnt; });
  var top = ranked.slice(0,3);
  var first = ranked.length ? ranked[0].cnt : 0;
  var members = top.filter(function(x){
    if(x.cnt < first*0.05 && x.cnt < 100) return false; // <5% 且 <100 剔除
    return true;
  });
  // 无成员回退 S 编号
  // 聚落命名（2026-08-12）：优先聚落内建筑名（床/棺材/睡眠舱，M 结尾→最近带名字）；无则回退冠名/S编号
  var bName = lbSettlementBuildingName(data, abbr, Number(tid), cx, cy);
  var name = bName || (members.length ? members.map(function(m){ return m.name; }).join('、') : ('S'+String(sid).split('_').pop()));
  return { id:sid, tribeId:Number(tid), tribeName:(tribe&&tribe.name)||'', center:{x:cx,y:cy,z:cz}, radius:maxR,
    containers:containers, pods:pods, owners:members, name:name };
}
// §8.1 印痕者反查 pid：imprinterName 匹配 players.characterName（+EosId 区分重名）；未反查到用部落成员名兜底
function lbResolveImprinterPid(data, name, abbr, memberPids, memberNames){
  if(!name) return null;
  var pl = (data && data.players) || [];
  // 先按 characterName 精确匹配（可能多角色重名 → 需配合部落过滤）
  var candidates = pl.filter(function(ent){ return ent.roles && Object.keys(ent.roles).some(function(pid){ return ent.roles[pid]===name; }); });
  for(var i=0;i<candidates.length;i++){
    var ent = candidates[i];
    var pids = Object.keys(ent.roles).filter(function(pid){ return ent.roles[pid]===name; });
    for(var j=0;j<pids.length;j++){
      if(memberPids[pids[j]]!==undefined) return Number(pids[j]); // 命中本部落成员 pid
    }
  }
  // §8.2 兜底：名字 ∈ 部落成员名 → 用其 pid
  if(memberNames[name]!==undefined) return Number(memberNames[name]);
  return null;
}
// v318：印痕者反查 pid（按 eosId 优先，重名安全；符合「只用 pid/eosId 判定」）
function lbResolveImprinterPidByEos(data, eosId, memberPids){
  if(!eosId) return null;
  var pl = (data && data.players) || [];
  for(var i=0;i<pl.length;i++){
    var ent = pl[i];
    if(ent && ent.eosId && String(ent.eosId) === String(eosId)){
      var pids = Object.keys(ent.roles||{});
      for(var j=0;j<pids.length;j++){
        if(memberPids[pids[j]]!==undefined) return Number(pids[j]);
      }
      return null;
    }
  }
  return null;
}
// 幂等构建聚落：data._settlements 不存在则计算并缓存（会话内复用；数据变化由 _schemaVer/缓存失效触发重算）

function lbSettlePhase(tag){

    var now = Date.now();
    if(!LB._spT0){ LB._spT0 = now; LB._spLog = []; LB._spLog.push(['bs:start', 0]); }
    LB._spLog.push([String(tag), now - LB._spT0]);
    try{ localStorage.setItem('dino_settletiming', JSON.stringify(LB._spLog.slice(-80))); }catch(e2){}
    var el = document.getElementById('lbSettleBuildPhase');
    if(el) el.textContent = String(tag);
  }catch(e){}
}
