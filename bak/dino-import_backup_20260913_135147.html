// 入口：拉联盟 → 浮窗列联盟按钮 → 选择后查询渲染
async function lbOpenAlliancePos(){
  // v536：先关闭选择生存者浮窗（.lb-picker-overlay），避免两浮窗重叠
  var _rp = document.querySelector('.lb-picker-overlay'); if(_rp) _rp.remove();
  var ov = document.getElementById('lbBreedOverlay');
  var body = document.getElementById('lbBreedOverlayBody');
  if(!ov || !body) return;
  // v537：先显示 loading，再异步拉联盟/在线数据
  body.innerHTML = '<div onclick="event.stopPropagation()" style="display:flex;align-items:center;justify-content:center;min-height:52vh;text-align:center" id="lbAlliProg"><span class="lb-spin"></span></div>';
  ov.style.display = 'block';
  LB._alliModal = true; // v617：地图信息=联盟地图模态（点遮罩不关闭，点 ✕ 才关）
  var map = await lbLoadAlliances();
  // v614：联盟文件拉取偶发失败（CORS/网络）会缺服 → 覆盖不足时自动强制重拉一次（补回联盟创始部落所有者名/成员）
  if(map && Object.keys(map).length < 8){ map = await lbLoadAlliances(true); }
  var online = await lbLoadOnline(true);
  var data = LB._cache && LB._cache.data;
  var mine = (data && data.tribesByServer) ? lbPlayerTribes(data.tribesByServer, LB.curPid) : {};
  // v537：eosId → 所在服（一个角色只可能在一个服在线，跨服取首个）
  var eosToSrv = {};
  Object.keys(online).forEach(function(abbr){
    (online[abbr].players||[]).forEach(function(p){ if(p && p.eosId && !eosToSrv[p.eosId]) eosToSrv[p.eosId]=abbr; });
  });
  // v534：按自助配置地图过滤（lbOwnedMaps）
  var srvList = lbOwnedMaps();
  var rows = srvList.map(function(abbr){
    var tbs = (data && data.tribesByServer && data.tribesByServer[abbr]) || {};
    // v635：多联盟支持（A 方案）——收集当前角色在该服全部部落所属的全部联盟（按 id 去重），不再只取 alliances[0]
    var alliMap = {};
    Object.keys(tbs).forEach(function(tid){
      if(!mine[abbr+':'+tid]) return;
      var t = tbs[tid];
      if(!t || !Array.isArray(t.alliances)) return;
      t.alliances.forEach(function(a){ if(a && a.id!==undefined && a.id!==null && !lbAlliBlocked(a)) alliMap[String(a.id)] = a; }); // v637：联盟黑名单过滤
    });
    var alliList = Object.keys(alliMap).map(function(k){ return alliMap[k]; });
    var srvOn = !!(online[abbr] && online[abbr].ok === true); // v570：服务器状态（后端 RCON 失败写 ok=false）
    var s = LB.SERVERS.find(function(x){ return x.abbr===abbr; });
    var sname = s ? s.name : abbr;
    var mdi = LB_SERVER_MDI[abbr] || ''; // v556：地图图标复用选地图的 mdi（LB_SERVER_MDI）
    var j = map[abbr];
    // v615：只显示地图图标不显示地图名（用户 2026-09-02）；无 mdi 图标时兜底显示服名文字
    var h = '<div style="padding:8px 0' + (alliList.length ? ';border-bottom:1px solid #24243a' : '') + '">'
      + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#fff;font-weight:bold">'+(mdi?'<i class="mdi '+mdi+'" style="font-size:15px;vertical-align:-2px" title="'+escapeHtml(sname)+'"></i>':' '+(s?escapeHtml(sname):''))
      + '<span style="font-size:11px;font-weight:normal;color:'+(srvOn?'#4ade80':'#f87171')+'">'+(srvOn?'🟢 在线':'⭕ 离线')+'</span>' // v570：服务器状态
      + '</div>';
    // 无联盟：仅服状态行
    if(!alliList.length){ h += '</div>'; return h; }
    // v635：每联盟一个小节（盟名 + 盟主 + 本服在线成员 + 分布按钮）
    h += alliList.map(function(alli){
      // 盟主 = admins[0] 部落的所有者角色名
      var founderName = '';
      var aObj = null;
      if(j){ (j.alliances||[]).forEach(function(a){ if(String(a.id)===String(alli.id)) aObj=a; }); }
      var admins = (aObj && aObj.admins) || [];
      if(admins.length){
        var ft = tbs[String(admins[0])];
        if(ft && ft.ownerName) founderName = ft.ownerName;
      }
      var onlineBtns = '';
      // v570：离线服不显示成员（联盟/盟主信息保留）
      if(srvOn){
        // 该联盟「本服在线」成员（eosToSrv[eos]===abbr；v537：一个角色只在所在服出现）
        var mems = lbCollectAllianceMembers(alli.id);
        var btns = [];
        mems.forEach(function(m){
          var eos = m.eosId || lbPidToEos(m.pid);
          if(eos && eosToSrv[eos] === abbr) btns.push(m);
        });
        // v556：在线成员名单（写清谁在线）+ 地图按钮（点→该服全部在线成员标同一张图）
        var _names = btns.map(function(m){ return escapeHtml(m.name||m.pid); }).join('、');
        onlineBtns = (_names ? '<div style="margin-top:4px;font-size:11px;color:#4ade80">🟢 在线：'+_names+'</div>' : '')
          + (btns.length ? '<button onclick="event.stopPropagation();lbAllianceServerMap(\''+abbr+'\',\''+String(alli.id)+'\',\''+(alli.name||('联盟#'+alli.id)).replace(/'/g,"\\'")+'\')" style="margin-top:4px;padding:4px 12px;border:none;border-radius:6px;background:#7c3aed;color:#fff;font-size:11px;cursor:pointer">🗺 成员分布</button>' : '');
      }
      return '<div style="margin:4px 0 2px 16px;padding-left:10px;border-left:2px solid #2a2a3a">'
        + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:#fff;font-weight:bold">'
        + '<span style="color:#a78bfa">'+escapeHtml(alli.name||('联盟#'+alli.id))+'</span>'
        + (founderName ? '<span style="font-size:11px;color:#888;font-weight:normal">盟主 '+escapeHtml(founderName)+'</span>' : '')
        + '</div>'
        + '<div style="margin-top:2px">'+onlineBtns+'</div>'
        + '</div>';
    }).join('');
    h += '</div>';
    return h;
  }).join('');
  body.innerHTML = '<div onclick="event.stopPropagation()" style="font-weight:bold;font-size:14px;color:#fff;text-align:center;margin-bottom:8px">📌 地图信息'
    + '<span onclick="event.stopPropagation()" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;display:inline-flex;align-items:center;gap:32px;color:#aaa">' // v636/v638：刷新+关闭 作为整体水平居中（间距 10→32px）
    + '<span onclick="event.stopPropagation();lbMapInfoRefresh()" title="刷新地图状态" style="cursor:pointer;color:#aaa;font-size:22px;line-height:1;display:inline-flex;align-items:center;height:22px"><svg viewBox="3.5 3.5 17 17" style="width:22px;height:22px;display:block;fill:currentColor"><path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/></svg></span>'
    + '<span onclick="event.stopPropagation();lbAllianceClose()" title="关闭" style="cursor:pointer;color:#aaa;font-size:22px;line-height:1;display:inline-flex;align-items:center;justify-content:center;height:22px;width:22px"><svg viewBox="5 5 14 14" style="width:22px;height:22px;display:block;fill:currentColor"><path d="M19,6.41L17.59,5 12,10.59 6.41,5 5,6.41 10.59,12 5,17.59 6.41,19 12,13.41 17.59,19 19,17.59 13.41,12z"/></svg></span>'
    + '</span>'
    + '</div>'
    + '<div onclick="event.stopPropagation()" style="padding:0 12px 20px;max-height:70vh;overflow-y:auto;width:fit-content;max-width:100%;margin:0 auto">'+rows+'</div>'; // v615：列表宽度自适应内容 + 整体横向居中
  ov.style.display = 'block';
}

// v556：单服地图——该服全部在线成员批量查位置，标在同一张图（复用 lbAlliancePosRender 多成员渲染）
async function lbAllianceServerMap(abbr, alliId, alliName){
  var ov = document.getElementById('lbBreedOverlay');
  var body = document.getElementById('lbBreedOverlayBody');
  if(!ov || !body) return;
  var token = (LB_ARCH === 'new') ? 'new' : await lbHaTokenRefresh();
  if(!token){ lbToast('未登录'); return; }
  LB._alliCancel = false;
  var online = LB._onlineByServer || {};
  var eosToSrv = {};
  Object.keys(online).forEach(function(a){
    (online[a].players||[]).forEach(function(p){ if(p && p.eosId && !eosToSrv[p.eosId]) eosToSrv[p.eosId]=a; });
  });
  // v567：收集当前玩家所有联盟的在线成员（跨服去重）——点任一服按钮都能翻页查看全部在线成员分布
  var _d = LB._cache && LB._cache.data;
  var _mine = _d ? lbPlayerTribes(_d.tribesByServer, LB.curPid) : {};
  var _alliIds = {};
  Object.keys(_mine).forEach(function(k){
    var _sp = k.split(':');
    var _t = _d.tribesByServer[_sp[0]] && _d.tribesByServer[_sp[0]][_sp[1]];
    // v635：多联盟（A 方案）——收集当前玩家全部部落所属全部联盟，不再只取 alliances[0]
    if(_t && Array.isArray(_t.alliances)) _t.alliances.forEach(function(a){ if(a && a.id!==undefined && a.id!==null && !lbAlliBlocked(a)) _alliIds[String(a.id)]=1; }); // v637：联盟黑名单过滤
  });
  var members = [];
  Object.keys(_alliIds).forEach(function(aid){
    lbCollectAllianceMembers(aid).forEach(function(m){
      if(!members.some(function(x){ return String(x.pid)===String(m.pid); })) members.push(m);
    });
  });
  members = members.filter(function(m){
    var eos = m.eosId || lbPidToEos(m.pid);
    return eos && eosToSrv[eos]; // 在线过滤
  });
  // v567：每个在线成员补充其在线服实际联盟名（head 每页显示该服联盟）
  members.forEach(function(m){
    var eos = m.eosId || lbPidToEos(m.pid);
    var srv = eosToSrv[eos];
    if(!srv) return;
    var _tbs = _d && _d.tribesByServer && _d.tribesByServer[srv];
    if(!_tbs) return;
    Object.keys(_tbs).forEach(function(tid){
      var _t = _tbs[tid];
      if(!_t || !Array.isArray(_t.members)) return;
      var _has = _t.members.some(function(mm){ return String(mm.pid)===String(m.pid); });
      if(_has && Array.isArray(_t.alliances) && _t.alliances.length) m.alliName = _t.alliances[0].name || m.alliName;
    });
  });
  if(!members.length){ lbToast('联盟无在线成员'); return; }
  body.innerHTML = '<div onclick="event.stopPropagation()" style="display:flex;align-items:center;justify-content:center;min-height:52vh;text-align:center" id="lbAlliProg"><span class="lb-spin"></span></div>';
  ov.style.display = 'block';
  LB._alliModal = true; // v617：地图信息/成员分布打开=联盟地图模态（点遮罩不关闭）
  var progEl = document.getElementById('lbAlliProg');
  var results = await lbAlliancePosQuery(members, online, token, function(pg){});
  if(LB._alliCancel){ if(progEl) progEl.innerHTML='已取消'; return; }
  LB._alliLastSrv = { abbr:abbr, alliId:alliId, alliName:alliName }; // v568：供 🔄 重新拉在线按钮
  lbAlliancePosRender({id:alliId, name:alliName}, results, abbr); // v568：focusAbbr 进入自动滚到点击服页
  // v558：成员分布 1s 实时更新（每成员所在服查 1 次 PlayerPos，busy 防并发）
  lbAllianceMapTrackStop(); // v559：修正调用名（原 LB._alliMapTrackStop 未定义抛错 → 轮询未启动）
  var eosById = {};
  members.forEach(function(m){ eosById[String(m.pid)] = m.eosId || lbPidToEos(m.pid); });
  LB._alliMapTrack = { abbr:abbr, token:token, eosById:eosById, results:results, busy:false, timer:null, pages:(LB._alliLastPageMeta||null) };
  LB._alliMapTrack.timer = setInterval(lbAllianceMapTick, 1000);
}

// v558：成员分布 1s 实时轮询——并行查所有在线成员位置（各所在服 1 次），更新点元素 left/top
// v565：只刷当前可见页成员（翻到哪页刷哪页），其余页不查询；关闭时 lbAllianceClose → lbAllianceMapTrackStop 清 timer 绝对停止
function lbAllianceMapTick(){
  var t = LB._alliMapTrack;
  if(!t || t.busy) return;
  t.busy = true;
  var curPids = null;
  if(t.pages && t.pages.length){
    var _s = document.getElementById('lbWildDistScroll');
    if(_s){
      var _idx = Math.round(_s.scrollLeft / _s.clientWidth);
      if(_idx < 0) _idx = 0;
      if(_idx >= t.pages.length) _idx = t.pages.length - 1;
      var _pg = t.pages[_idx];
      if(_pg && _pg.pids){ curPids = {}; _pg.pids.forEach(function(pid){ curPids[pid]=1; }); }
    }
  }
  var tasks = [];
  (t.results||[]).forEach(function(r){
    if(!r.pos) return;
    var eos = t.eosById[String(r.pid)];
    if(!eos) return;
    if(curPids && !curPids[String(r.pid)]) return; // v565：只刷当前页成员
    tasks.push(lbQueryPlayerPos(r.pos.server, t.token, eos).then(function(pos){
      var dot = document.getElementById('lbAlliDot_'+r.pid);
      if(!pos){
        // v568：下线/传图 → 标记置灰 + 名字标签标 ⏻（恢复后自动还原）
        if(dot){
          dot.style.opacity = '0.3';
          dot.style.filter = 'grayscale(1)';
          var _nt = dot.querySelector('.lb-alli-ntag');
          if(_nt && _nt.getAttribute('data-off')!=='1'){ _nt.setAttribute('data-off','1'); _nt.textContent = _nt.textContent.replace(/\s*⏻\s*$/,'') + ' ⏻'; }
        }
        return;
      }
      if(dot){
        dot.style.opacity = '';
        dot.style.filter = '';
        var _nt2 = dot.querySelector('.lb-alli-ntag');
        if(_nt2){ _nt2.removeAttribute('data-off'); _nt2.textContent = _nt2.textContent.replace(/\s*⏻\s*$/,''); }
      }
      var map = lbMapForServer(pos.server, pos.z);
      if(!map) return;
      var p = lbWorldToPx(Number(pos.x), Number(pos.y), map);
      dot.style.left = p.x.toFixed(2)+'%';
      dot.style.top = p.y.toFixed(2)+'%';
    }).catch(function(){}));
  });
  Promise.all(tasks).then(function(){ t.busy = false; });
}
function lbAllianceMapTrackStop(){
  if(LB._alliMapTrack){
    if(LB._alliMapTrack.timer) clearInterval(LB._alliMapTrack.timer);
    LB._alliMapTrack = null;

}

// v534：按 pid 找成员 eosId（部落 members 优先，players 反查兜底）
function lbFindMemberEos(pid){
  var data = LB._cache && LB._cache.data;
  var s = String(pid), found = null;
  if(data && data.tribesByServer){
    Object.keys(data.tribesByServer).forEach(function(abbr){
      var tbs = data.tribesByServer[abbr]||{};
      Object.keys(tbs).forEach(function(tid){
        var t = tbs[tid]; if(!t || !Array.isArray(t.members)) return;
        t.members.forEach(function(m){
          if(m && String(m.pid)===s && m.eosId && !found) found = m.eosId;
        });
      });
    });
  }
  if(found) return found;
  return lbPidToEos(pid);
}
