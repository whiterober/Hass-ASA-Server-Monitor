// DBSCAN（eps 距离阈值，minPts=1 即单点也成簇；按 x/y 平面距离；标准密度可达递归扩展）
function lbDbscan(pts, eps, minPts){
  var clusters = [], visited = {};
  function dist(a,b){ return Math.sqrt(Math.pow(Number(a.x)-Number(b.x),2)+Math.pow(Number(a.y)-Number(b.y),2)); }
  function regionIdx(i){
    var out=[];
    for(var j=0;j<pts.length;j++){ if(j!==i && dist(pts[i],pts[j])<=eps) out.push(j); }
    return out;
  }
  for(var i=0;i<pts.length;i++){
    if(visited[i]) continue;
    visited[i]=1;
    var clu=[i], queue=regionIdx(i);
    while(queue.length){
      var q=queue.shift();
      if(visited[q]) continue;
      visited[q]=1;
      clu.push(q);
      regionIdx(q).forEach(function(j){ if(!visited[j]) queue.push(j); });
    }
    clusters.push(clu.map(function(idx){ return pts[idx]; }));
  }
  return clusters;
}
// 取数组中距中心最近的建筑（返回其 name）
function lbNearestStructure(arr, cx, cy){
  var best=null, bd=Infinity;
  arr.forEach(function(s){
    var d = Math.sqrt(Math.pow(Number(s.x)-cx,2)+Math.pow(Number(s.y)-cy,2));
    if(d < bd){ bd=d; best=s; }
  });
  return best ? best.name : null;
}
// 聚落建筑命名优先级（2026-08-12）：①墓碑/木牌/金属牌(Gravestone/WoodSign_Large/MetalSign_Large)自定义名(同组取距center最近) → ②床/棺材/睡眠舱 name 以大写 M 结尾(取最近) → ③床/棺材/睡眠舱最近带名字；无则 null
function lbSettlementBuildingName(data, abbr, tid, cx, cy){
  var sts = (data && Array.isArray(data.structures)) ? data.structures : [];
  if(!sts.length) return null;
  var cands = sts.filter(function(s){ return Number(s.tribeId) === Number(tid) && s.name; });
  if(!cands.length) return null;
  var sign = cands.filter(function(s){ return /Gravestone|WoodSign_Large|MetalSign_Large/i.test(s.class||''); });
  if(sign.length) return lbNearestStructure(sign, cx, cy);
  var mEnd = cands.filter(function(s){ return /M$/.test(s.name.trim()); });
  if(mEnd.length) return lbNearestStructure(mEnd, cx, cy);
  return lbNearestStructure(cands, cx, cy);
}
// 聚落收尾：计算 center/radius/容器数/球数 + 冠名（§8）
function lbFinalizeSettlement(data, abbr, tid, sid, containers){
  var cx=0, cy=0, cz=0, pods=0;
  var allImps = {};
  containers.forEach(function(c){
    cx+=Number(c.x); cy+=Number(c.y); cz+=(c.z!==undefined&&c.z!==null)?Number(c.z):0; pods+=c.count;
    Object.keys(c.imps).forEach(function(n){ allImps[n]=(allImps[n]||0)+c.imps[n]; });
  });
  cx/=containers.length; cy/=containers.length; cz/=containers.length;
  var maxR=0;
  containers.forEach(function(c){
    var d=Math.sqrt(Math.pow(Number(c.x)-cx,2)+Math.pow(Number(c.y)-cy,2));
    if(d>maxR) maxR=d;
  });
  // 冠名：印痕者 → pid 反查（§8.1）→ 本部落过滤（§8.2）→ 前3名（§8.3）
  var tribe = (data.tribesByServer && data.tribesByServer[abbr] && data.tribesByServer[abbr][tid]) || null;
  var memberPids = {};
  var memberNames = {};
  if(tribe && Array.isArray(tribe.members)){
    tribe.members.forEach(function(m){ if(m && m.pid!==undefined){ memberPids[String(m.pid)]=m.name||''; memberNames[m.name]=String(m.pid); } });
  }
  // 印痕者计数按 pid（§8.1 反查）
  var pidCount = {};
  Object.keys(allImps).forEach(function(nm){
    var pid = lbResolveImprinterPid(data, nm, abbr, memberPids, memberNames);
    if(pid!==null){ pidCount[pid]=(pidCount[pid]||0)+allImps[nm]; }
  });
  // §8.3 前3名 + 5%/100 规则（2026-08-13 阈值 50→100）
  var ranked = Object.keys(pidCount).map(function(pid){ return {pid:pid, name:(memberPids[pid]||lbCharName(Number(pid))||('#'+pid)), cnt:pidCount[pid]}; })
    .sort(function(a,b){ return b.cnt-a.cnt; });
  var top = ranked.slice(0,3);
  var first = ranked.length ? ranked[0].cnt : 0;
  var members = top.filter(function(x){
    if(x.cnt < first*0.05 && x.cnt < 100) return false; // <5% 且 <100 剔除
    return true;
  });
  // 无成员回退 S 编号
  // 聚落命名（2026-08-12）：优先聚落内建筑名（床/棺材/睡眠舱，M 结尾→最近带名字）；无则回退冠名/S编号
  var bName = lbSettlementBuildingName(data, abbr, Number(tid), cx, cy);
  var name = bName || (members.length ? members.map(function(m){ return m.name; }).join('、') : ('S'+String(sid).split('_').pop()));
  return { id:sid, tribeId:Number(tid), tribeName:(tribe&&tribe.name)||'', center:{x:cx,y:cy,z:cz}, radius:maxR,
    containers:containers, pods:pods, owners:members, name:name };
}
// §8.1 印痕者反查 pid：imprinterName 匹配 players.characterName（+EosId 区分重名）；未反查到用部落成员名兜底
function lbResolveImprinterPid(data, name, abbr, memberPids, memberNames){
  if(!name) return null;
  var pl = (data && data.players) || [];
  // 先按 characterName 精确匹配（可能多角色重名 → 需配合部落过滤）
  var candidates = pl.filter(function(ent){ return ent.roles && Object.keys(ent.roles).some(function(pid){ return ent.roles[pid]===name; }); });
  for(var i=0;i<candidates.length;i++){
    var ent = candidates[i];
    var pids = Object.keys(ent.roles).filter(function(pid){ return ent.roles[pid]===name; });
    for(var j=0;j<pids.length;j++){
      if(memberPids[pids[j]]!==undefined) return Number(pids[j]); // 命中本部落成员 pid
    }
  }
  // §8.2 兜底：名字 ∈ 部落成员名 → 用其 pid
  if(memberNames[name]!==undefined) return Number(memberNames[name]);
  return null;
}

function lbIsPlayerRec(r, playerSet, curPid){

// 核心归属：非离散看聚落冠名成员（owners[].pid 含 curPid）；离散看部落成员（playerSet）
function lbIsMyBySettlement(r, playerSet, curPid){
  if(!playerSet || !curPid) return false;
  var s = lbSettlementOf(r);
  var tribeKey = r.server + ':' + String(r.ownerTribeId||0);
  if(s){
    if(s.scattered){
      // 离散：仅限无留痕者（imprinterName 空）的生物归属全部落成员；有留痕者的按留痕者本人判定（§8.1 反查）
      if(r.imprinterName){
        var dt = LB._cache && LB._cache.data;
        var tr = (dt && dt.tribesByServer && dt.tribesByServer[r.server] && dt.tribesByServer[r.server][r.ownerTribeId]) || null;
        var mps={}, mns={};
        if(tr && Array.isArray(tr.members)){
          tr.members.forEach(function(m){ if(m && m.pid!==undefined){ mps[String(m.pid)]=m.name||''; mns[m.name]=String(m.pid); } });
        }
        var ip = lbResolveImprinterPid(dt, r.imprinterName, r.server, mps, mns);
        if(ip !== null) return String(ip) === String(curPid);
        return false; // 有留痕者但反查不到 → 非我的
      }
      return !!playerSet[tribeKey];
    }
    // 非离散：聚落冠名成员含 curPid → 我的
    var st = lbFindSettlementObj(s);
    if(st && Array.isArray(st.owners) && st.owners.length){
      for(var i=0;i<st.owners.length;i++){
        if(String(st.owners[i].pid) === String(curPid)) return true;
      }
      // 冠名即归属：聚落有冠名成员但不含我 → 不是我的（不回退部落，避免他人聚落误判为我的）
      return false;
    }
    // 聚落无冠名成员（回退 S 编号）：回退部落判定
    return !!playerSet[tribeKey];
  }
  // 无聚落数据：回退部落判定
  return !!playerSet[tribeKey];
}
// 从 settlements 结果查找聚落对象（byServer[server].settlements[] 按 id）

// 时间分组：0=最近30天 1=更早 2=时间未知
// 规则：球内按收纳时间(packedAtWorldSec)、放出按下载/驯养时间(downloadedAtWorldSec||tamedAtWorldSec)，均为世界秒
//  有 worldSecondsNow(wn) 且 sortWorldSec>0 → 世界秒差值 ≤ 30 游戏天
//  无 wn 但有 sortWorldSec>0 → fallback 墙钟 absMs ≤ 30 墙钟天
//  sortWorldSec=0（收纳/驯养时间未知）→ 未知组
function lbTimeGroup(rec, worldNowByServer){
  var wn = worldNowByServer[rec.server] || 0;
  if(rec.sortWorldSec>0 && wn>0){
    var diff = wn - rec.sortWorldSec;
    if(diff<0) return 2;                       // 回档/异常
    return diff<=LB.DAY30 ? 0 : 1;
  }
  if(rec.sortWorldSec>0 && rec.absMs >= LB.ASA_LAUNCH_MS){
    return (Date.now()-rec.absMs <= LB.DAY30*1000) ? 0 : 1;
  }
  return 2;  // 收纳/驯养时间未知
}

  for(var ii=0; ii<imprints.length; ii++){

// IndexedDB 速查缓存持久化（刷新页面后秒开，避免重新加载 10 台 JSON）
var LB_IDB_NAME = 'dinoImportDB', LB_IDB_STORE = 'lbCache';
function lbCacheOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    var req = indexedDB.open(LB_IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(LB_IDB_STORE)) db.createObjectStore(LB_IDB_STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function lbCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('latest');
      get.onsuccess = function(){
        var v = get.result || null;
        // 版本校验：旧结构（无 _schemaVer===3 / 无 players / rec 无 containerOwnerPid）→ 判失效
        if(v && v.data){
          var d = v.data;
          // 派生数据不持久化：剔除 _settlements，每次加载用当前算法重建
          if(d._settlements) delete d._settlements;
          var okVer = d._schemaVer === 7; // v136：基因槽位新增 dinoClass，旧缓存(6)判失效强制重拉
          var okPlayers = Array.isArray(d.players);
          var okPid = true;
          if(okPlayers && Array.isArray(d.recs)){
            var pc = d.recs.filter(function(r){ return r.containerType==='player' && !r.isEmpty; })[0];
            if(pc && pc.containerOwnerPid === undefined && pc.containerOwnerPid === null) okPid = false;
          }
          if(!okVer || !okPlayers || !okPid){ resolve(null); return; }
        }
        resolve(v);
      };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbCacheSet(data){
  // 派生数据不持久化：剔除 _settlements
  if(data && data._settlements) delete data._settlements;
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ data: data, ts: Date.now() }, 'latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
function lbCacheClear(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).delete('latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}

    if(emptyCnt>0) plan.push({t:'empty', html:lbEmptyRowHtml(emptyCnt)});
    if(sumHtml) plan.push({t:'close', html:'</details>'});
    total+=recs.length;
  }
  if(LB.tab==='player'){
    if(playerCarried.length){
      playerCarried.sort(cmpSp);
      var peArr=playerCarried.filter(function(r){return !r.isEmpty;});
      var peCnt=playerCarried.length - peArr.length;
      lbPushPlan('', peArr, peCnt);
    }
    // v134：玩家背包基因枪（当前玩家的 geneScanner）
    var curPid2 = lbCurPid();
    var myScanners = [];
    Object.keys(LB._geneDevices||{}).forEach(function(abbr){
      (LB._geneDevices[abbr].scanners||[]).forEach(function(d){
        if(d.containerType==='player' && String(d.containerOwnerPid)===String(curPid2)) myScanners.push(d);
      });
    });
    if(myScanners.length){
      var scnHtml = myScanners.map(function(d){
        var sl=(d.slots||[]).filter(function(s){ return s.trait; });
        var genes = sl.length ? sl.map(function(s){ return lbGeneTagHtml(s.trait,s.level,s.species); }).join('') : '<span style="color:#666">无基因</span>';
        return '<div style="font-size:12px;padding:8px 10px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;margin-bottom:6px">'+lbGeneDevIcon('基因枪')+'<b style="color:#c4b5fd">基因枪</b>'+(d.playerName?' · '+d.playerName:'')+'<div style="margin-top:4px">'+genes+'</div></div>';
      }).join('');
      plan.push({t:'raw', html:scnHtml});
    }
    tabLabel='🎒 玩家携带';
  } else {
    var arr2=byServer[LB.tab]||[];
    arr2.sort(cmpSp);
    // 按聚落分组成大按钮（点击展开该聚落内按容器分组的容器手风琴）
    var settleGroups={};
    arr2.forEach(function(r){
      var s = lbSettlementOf(r);
      var sk = !s ? 'nosettle' : (s.scattered ? 'scattered' : s.setId);
      var key = LB.tab+'|'+sk;
      (settleGroups[key]=settleGroups[key]||[]).push(r);
    });
    LB._settleGroups = settleGroups; // 供聚落按钮点击懒加载容器手风琴
    plan.push({t:'settle', html:'<div class="settle-wrap">'});
    // 聚落聚合：中心地图距离 <3% 的聚落合并成聚合大框（共享地图+圆形区域），被合并聚落右侧竖排
    var clusters = lbClusterSettles(settleGroups);
    clusters.forEach(function(clu){
      plan.push({t:'settle', html:lbSettleClusterHtml(clu)});
    });
    plan.push({t:'settle', html:'</div>'});
    // 聚落详情子页面（点击聚落进入，返回按钮恢复列表）
    plan.push({t:'settle', html:'<div class="settle-detail" id="lbSettleDetail" style="display:none"><button class="settle-back" onclick="lbBackSettle()">← 返回聚落列表</button><div id="lbSettleBody"></div></div>'});
    var ts=LB.SERVERS.find(function(x){return x.abbr===LB.tab;});
    tabLabel=(ts ? ((ts.icon||'')+' '+ts.name).trim() : LB.tab);
  }
  if(!plan.length){
    list.innerHTML='<div style="text-align:center;padding:30px;color:#555">😕 没有匹配的生物'+(player?'（玩家 '+player+'）':'')+'</div>';
    if(status) status.style.display='none';
    lbUpdateDataTime(); // 无匹配也更新已放出数据时间显示
    return;
  }
  // 每次渲染先显示「⏳ 渲染中... 已渲染 X/Y 条」反馈（解决有缓存时直接渲染无提示问题）
  list.innerHTML='<div id="lbRenderTip" style="text-align:center;padding:30px;color:#555">⏳ 渲染中... <span id="lbRenderProg" style="color:#888"></span></div>';
  if(!LB._renderSeq) LB._renderSeq=0;
  var mySeq=++LB._renderSeq;
  var i=0, done=0, buf=[];
  // 分块生成+插入（每批 150 条生成后让出主线程+更新进度，UI 不冻结）；
  // 全部生成完一次性 insertAdjacentHTML 插入（只布局一次，避免每批插入触发多次重排）
  (function lbRenderNext(){
    if(mySeq!==LB._renderSeq) return; // 已被更新的渲染取代（切服务器/切tab/刷新）
    if(i>=plan.length){
      list.insertAdjacentHTML('beforeend', buf.join(''));
      buf=null;
      var tip=document.getElementById('lbRenderTip');
      if(tip) tip.parentNode.removeChild(tip); // 移除整个渲染中提示（含进度 span）
      if(status) status.style.display='none'; // 渲染完成：隐藏状态栏
      lbUpdateDataTime(); // 更新已放出数据时间显示（刷新按钮左侧）
      return;
    }
    var it=plan[i++];
    if(it.t==='cards'){ done+=it.recs.length; buf.push(it.recs.map(lbDinoHTML).join('')); }
    else if(it.html) buf.push(it.html);
    var prog=document.getElementById('lbRenderProg');
    if(prog) prog.textContent='已渲染 '+done+'/'+total+' 条';
    setTimeout(lbRenderNext, 0); // 让出主线程，浏览器可绘制
  })();
}
// 聚落聚合：中心地图距离 <3% 的聚落合并为一组（聚合大框），返回簇数组
function lbClusterSettles(settleGroups){
  var items = [];
  Object.keys(settleGroups).forEach(function(key){
    var grp = settleGroups[key];
    var r0 = grp[0];
    var s = lbSettlementOf(r0);
    var center = null, map = null;
    if(s && !s.scattered){
      var st = lbFindSettlementObj(s);
      if(st && st.center){
        map = lbMapForServer(r0.server, st.center.z);
        if(map){
          var p = lbWorldToPx(st.center.x, st.center.y, map);
          center = {x:p.x, y:p.y};
        }
      }
    }
    var cnt = grp.filter(function(r){return !r.isEmpty;}).length;
    items.push({key:key, grp:grp, center:center, map:map, cnt:cnt});
  });
  // 贪心聚类：与簇内首个聚落中心地图距离 <3（0~100 坐标）合并
  var clusters = [];
  items.forEach(function(item){
    if(!item.center){ clusters.push([item]); return; }
    var placed = false;
    for(var i=0;i<clusters.length;i++){
      var ref = clusters[i][0].center;
      if(ref && Math.hypot(item.center.x-ref.x, item.center.y-ref.y) < 3){
        clusters[i].push(item); placed = true; break;
      }
    }
    if(!placed) clusters.push([item]);
  });
  clusters.forEach(function(c){ c.sort(function(a,b){ return b.cnt-a.cnt; }); });
  clusters.sort(function(a,b){
    var am = a[0].map?1:0, bm = b[0].map?1:0;
    if(am!==bm) return bm-am;
    return b[0].cnt - a[0].cnt;
  });
  return clusters;
}
// 聚落名
function lbSettleNameOf(grp){
  var s = lbSettlementOf(grp[0]);
  if(!s || s.scattered) return '';
  var st = lbFindSettlementObj(s);
  return (st && st.name) ? st.name : (s.setId.split('_').pop() || s.setId);
}
// 聚合块 HTML：单聚落 → 原按钮；多聚落 → 整体外框（共享地图+圆形区域+信息 | 右侧竖排各聚落按钮）
function lbSettleClusterHtml(clu){
  if(clu.length === 1) return lbSettleBtnHtml(clu[0].grp, clu[0].key);
  var main = clu[0];
  var h = '<div class="settle-cluster">';
  h += '<div class="settle-cluster-main">';
  if(main.map && main.center){
    // 圈动态计算：中心=各子聚落单点(共享图换算)平均，半径=最远点距离+边距（刚好包住所有子聚落点）
    var pts=[];
    clu.forEach(function(it){
      var s2 = lbSettlementOf(it.grp[0]);
      if(!s2 || s2.scattered) return;
      var st2 = lbFindSettlementObj(s2);
      if(st2 && st2.center){
        var q = lbWorldToPx(st2.center.x, st2.center.y, main.map);
        pts.push({x:q.x, y:q.y});
      }
    });
    if(pts.length){
      var cx=0, cy=0;
      pts.forEach(function(p){ cx+=p.x; cy+=p.y; });
      cx/=pts.length; cy/=pts.length;
      var R=0;
      pts.forEach(function(p){ R = Math.max(R, Math.hypot(p.x-cx, p.y-cy)); });
      R += 1.8; // 边距
      var dia = R*2;
      h += '<div class="settle-map"><img src="'+LB_MAP_BASE+main.map.img+'.jpg" alt="" loading="lazy" onerror="this.parentNode.style.display=&quot;none&quot;"><div class="settle-dot cluster-zone" style="left:'+((cx-R).toFixed(2))+'%;top:'+((cy-R).toFixed(2))+'%;width:'+dia.toFixed(2)+'%;height:'+dia.toFixed(2)+'%"></div></div>';
    }
  }
  h += '</div>';
  // 右侧竖排各聚落独立按钮（可点击进入各自详情）
  h += '<div class="settle-cluster-side">';
  clu.forEach(function(it){
    var c2 = it.grp.filter(function(r){return !r.isEmpty && r.containerType==='released';}).length;
    var e2 = it.grp.filter(function(r){return !r.isEmpty && r.containerType!=='released';}).length;
    var sic = lbSettleCntIcons();
    // 0 值一侧不显示（数字+图标）
    var c2h = c2>0 ? sic.rel+c2 : '';
    var e2h = e2>0 ? sic.pod+e2 : '';
    h += '<div class="settle-btn side-btn" data-k="'+it.key+'" onclick="lbOpenSettle(this)">'
      + '<span class="settle-info">'+lbMdiSvg('mdi-tent', 12)
      + '<span class="settle-name">'+lbSettleNameOf(it.grp)+'</span>'
      + '<span class="settle-cnt">'+c2h+(c2h&&e2h?' ':'')+e2h+'</span></span></div>';
  });
  h += '</div></div>';
  return h;
}

// 聚落大按钮 HTML（圆角矩形，min/max-width）：名称+坐标+数量；scattered/无聚落特殊样式
function lbSettleBtnHtml(grp, key){
  var r0 = grp[0];

        cls = ' with-map';
      }
    }
  } else if(s && s.scattered){
    name = '离散'; cls = ' scattered';
    // 地图上标出所有离散点（离散容器坐标，橙色小点）
    var pts = [];
    grp.forEach(function(r){
      var X = Number(r.containerX), Y = Number(r.containerY);
      if(isFinite(X) && isFinite(Y) && (X!==0 || Y!==0)) pts.push({x:X, y:Y, z:Number(r.containerZ)});
    });
    if(pts.length){
      var zs = pts.map(function(p){return p.z;}).filter(function(v){return isFinite(v);}).sort(function(a,b){return a-b;});
      var zmed = zs.length ? zs[Math.floor(zs.length/2)] : undefined;
      var map = lbMapForServer(r0.server, zmed);
      if(map){
        var dots = pts.map(function(p){
          var q = lbWorldToPx(p.x, p.y, map);
          return '<div class="settle-dot scat" style="left:'+q.x.toFixed(2)+'%;top:'+q.y.toFixed(2)+'%"></div>';
        }).join('');
        mapHtml = '<div class="settle-map"><img src="'+LB_MAP_BASE+map.img+'.jpg" alt="" loading="lazy" onerror="this.parentNode.style.display=&quot;none&quot;">'+dots+'</div>';
        cls = ' with-map';
      }
    }
  } else {
    name = '无聚落'; cls = ' nosettle';
  }
  var cnt = grp.filter(function(r){return !r.isEmpty && r.containerType==='released';}).length;
  var ecnt = grp.filter(function(r){return !r.isEmpty && r.containerType!=='released';}).length;
  var sic = lbSettleCntIcons();
  // 0 值一侧不显示（数字+图标）
  var cntH = cnt>0 ? sic.rel+cnt : '';
  var ecntH = ecnt>0 ? sic.pod+ecnt : '';
  return '<div class="settle-btn'+cls+'" data-k="'+key+'" onclick="lbOpenSettle(this)">'
    + mapHtml
    + '<span class="settle-info">'+tent
    + '<span class="settle-name">'+name+'</span>'
    + '<span class="settle-cnt">'+cntH+(cntH&&ecntH?' ':'')+ecntH+'</span></span></div>';
}

// v138：基因数量统计（当前物种设备基因；我的=我的部落基因台/我的背包/我的部落容器，外部=其他）；{trait小写:{my,ext}}
function lbGeneCounts(){
  var out={};
  var curPid=lbCurPid();
  var data=LB._cache && LB._cache.data;
  var playerSet=curPid?lbPlayerTribes((data&&data.tribesByServer)||{},curPid):null;
  var curCls = LB.curClass ? String(LB.curClass).replace(/_C$/,'') : '';
  function add(tr,isMy){
    var k=String(tr||'').toLowerCase(); if(!k) return;
    if(!out[k]) out[k]={my:0,ext:0};
    if(isMy) out[k].my++; else out[k].ext++;
  }
  Object.keys(LB._geneDevices||{}).forEach(function(abbr){
    var ent=LB._geneDevices[abbr]; if(!ent) return;
    (ent.infusers||[]).forEach(function(d){
      var isMy = playerSet ? !!playerSet[abbr+':'+d.tribeId] : false;
      (d.slots||[]).forEach(function(s){ if(curCls && s.dinoClass!==curCls) return; add(s.trait,isMy); });
    });
    (ent.scanners||[]).forEach(function(d){
      var isMy=false;
      if(playerSet){
        if(d.containerType==='player') isMy = (String(d.containerOwnerPid)===String(curPid));
        else isMy = !!playerSet[abbr+':'+d.containerTribe];
      }
      (d.slots||[]).forEach(function(s){ if(curCls && s.dinoClass!==curCls) return; add(s.trait,isMy); });
    });
  });
  return out;
}

    var v6cnt=neArr.filter(function(r){ return r.cryoVersion===6 && lbIsNormalCreature(r) && (!r.statPoints || r.statPoints.reduce(function(a,b){return a+(Number(b)||0);},0)===0) && !lbSolveStats(r); }).length;

    // v134：容器内基因枪（containerId 同源匹配）
    var cid = cg[0].containerId;
    var cScanners = (gd && cid && gd.scanners) ? gd.scanners.filter(function(d){ return d.containerId===cid; }) : [];
    var scnHtml = cScanners.map(function(d){
      var sl=(d.slots||[]).filter(function(s){ return s.trait; });
      return '<div style="font-size:11px;padding:6px 8px;border-bottom:1px solid #23233a">'+lbGeneDevIcon('基因枪')+'<b style="color:#c4b5fd">基因枪</b>'

  });

  var infusers = gd && gd.infusers ? gd.infusers.filter(function(d){ return Number(d.tribeId)===Number(settleTribe); }) : [];

      // v138：实际图标 + 无需坐标
      return '<details class="acc"><summary><span class="acc-sum-name">'+lbGeneDevIcon('基因台')+'基因台</span><span class="acc-cnt">'+(sl.length?sl.length:'')+'</span></summary>'
        + (genes ? '<div style="padding:6px 8px">'+genes+'</div>' : '<div style="color:#666;font-size:11px;padding:4px 8px">无基因</div>')
        + '</details>';
    }).join('');
  }
  // v135：孤儿容器基因枪——containerTribe 匹配该聚落、containerId 无 rec 容器的 scanners（完全空的容器无球，基因枪暂无关联处）；技术验证，为未来关键设施（非装球）显示打基础
  // v136：空基因设施/枪也显示，参考空球显示模式（summary 半透明 🧬×N 对照空球 ◯N；展开虚线空行 🧬 ×N 对照空球 ×N 空行）
  var knownCids = {};
  grpKeys.forEach(function(k){ knownCids[contGroups[k][0].containerId]=1; });
  var orphanGroups = {};
  (gd && gd.scanners || []).forEach(function(d){

      var genes = sl.length ? sl.map(function(s){ return lbGeneTagHtml(s.trait,s.level,s.species); }).join('') : '';
      // 计数对照空球：有基因=实心 🧬+基因数；空基因=半透明 🧬+枪数（对照 ◯N）
      var cnt = sl.length
        ? '<span style="color:#a78bfa">'+lbGeneDevIcon('基因枪',11)+'</span>'+sl.length
        : '<span style="opacity:.5">'+lbGeneDevIcon('基因枪',11)+'</span>'+ds.length;
      // 空基因展开：虚线空行（对照空球 lbEmptyRowHtml 样式）
      var body = genes
        ? '<div style="padding:6px 8px">'+genes+'</div>'
        : '<div style="display:flex;align-items:center;background:#15151f;border:1px dashed #333;border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px;color:#888">🧬 ×'+ds.length+'</div>';
      return '<details class="acc"><summary><span class="acc-sum-name">'+lbGeneDevIcon('基因枪')+label+'</span><span class="acc-cnt">'+cnt+'</span></summary>'
        + body + '</details>';
    }).join('');
  }
  return h;
}

// tamed 刷新执行（从浮窗按钮调用）：多选服务器串行触发 RCON + 进度条
async function lbRefreshTamed(btn){
  var sel=lbSelectedServers();
  if(!sel.length){ alert('请至少选择一个服务器（tamed 刷新需要指定范围）'); return; }
  LB._tamedRefreshing = true; // 刷新进行中：锁定浮窗禁止关闭
  try{
    // 定位浮窗内进度区（lbProgBar 的父容器的父容器 = 进度外层 div）
    var all=btn.closest('.lb-confirm-overlay').querySelectorAll('div');
    var progEl=null;
    for(var i=0;i<all.length;i++){ if(all[i].id==='lbProgBar'){ progEl=all[i].parentElement.parentElement; break; } }
    if(progEl) progEl.style.display='block';
    var bar=document.getElementById('lbProgBar'), txt=document.getElementById('lbProgText'), legend=document.getElementById('lbProgLegend');
    var noToken = !(await lbHaTokenRefresh());
    btn.disabled=true;
    // 分段进度条：每台一格（进行中紫 / 成功绿 / 失败红 / 跳过橙）
    bar.innerHTML = sel.map(function(){ return '<div style="flex:1;border-radius:2px;background:#333;transition:background .3s"></div>'; }).join('');
    var segs = bar.children;
    if(legend) legend.innerHTML = '<span><span style="color:#7c3aed">■</span> 进行中</span><span><span style="color:#22c55e">■</span> 成功</span><span><span style="color:#ef4444">■</span> 失败</span><span><span style="color:#f59e0b">■</span> 跳过/冷却</span>';
    var ok=0, fail=0;
    for(var i=0;i<sel.length;i++){
      var abbr=sel[i];
      segs[i].style.background = '#7c3aed'; // 进行中
      txt.textContent='正在刷新 '+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）'+(noToken?' [webhook]':'');
      var oldMarker = await lbGetSavedAt(abbr);
      var r;
      try{ r = await lbTrigger(abbr); }catch(e){ r={ok:false,error:String(e)}; }
      var done = false, skipped = false;
      if(r && r.ok){
        if(r.cooldown){ skipped = true; }
        else { done = await lbWaitTamed(abbr, oldMarker); }
      }
      if(done){ ok++; segs[i].style.background='#22c55e'; }
      else if(skipped){ fail++; segs[i].style.background='#f59e0b'; }
      else { fail++; segs[i].style.background='#ef4444'; }
      txt.textContent=(done?'✅ ':(skipped?'⏭ ':'❌ '))+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）';
    }
    txt.textContent='✅ 已刷新 '+ok+' 台，失败/跳过 '+fail+' 台'+(noToken?'（webhook 模式）':'');
    btn.disabled=false;
    lbReloadIncremental(); // 增量重载（并行 + 未变化文件复用）
    setTimeout(function(){ if(progEl) progEl.style.display='none'; }, 4000);
  }finally{
    LB._tamedRefreshing = false; // 无论成功/异常，刷新结束都恢复可关闭浮窗
  }
}

// 更新「已放出数据时间」显示（刷新按钮左侧，低可视化）：取各服务器 tamed 文件 Last-Modified 的最大值
// _lm 格式：{ abbr:{cryo:'...', tamed:'...'}, ... }；不存在的文件为 LB_LM_404('__404__') 跳过
// 显示格式：今天 HH:MM / 之前 MM-DD HH:MM；无数据隐藏
function lbUpdateDataTime(){
  var data = LB._cache && LB._cache.data;
  var lm = (data && data._lm) ? data._lm : null;
  var maxTs = 0;
  if(lm){
    Object.keys(lm).forEach(function(abbr){
      var t = lm[abbr] && lm[abbr].tamed;
      if(!t || t === LB_LM_404) return;
      var ts = Date.parse(t);
      if(ts && ts > maxTs) maxTs = ts;
    });
  }
  if(!maxTs){ LB._dataTimeText=''; LB._dataTimeTitle=''; return; }
  var d = new Date(maxTs);
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours())+':'+pad(d.getMinutes());
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  LB._dataTimeText = sameDay ? hm : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
  LB._dataTimeTitle = '最近拉数据时间：' + d.toLocaleString();
  // 刷新浮窗内元素（如已打开）
  var rf = document.getElementById('lbDataTimeInModal');
  if(rf) rf.textContent = LB._dataTimeText;
  // 兼容旧 #lbDataTime（v109 已移除，保留防御）
  var el=document.getElementById('lbDataTime');
  if(el){ el.textContent=LB._dataTimeText; el.title=LB._dataTimeTitle; }
}
// 增量重载：读 IndexedDB 旧缓存 → lbLoad 并行+Last-Modified 判断（未变化文件复用旧数据）→ 更新缓存渲染
function lbReloadIncremental(){
  var list=document.getElementById('lbList');
  if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 加载数据中...</div>';
  var sel=LB.SERVERS.map(function(s){return s.abbr;});
  // 旧数据源：内存缓存优先，否则 IndexedDB
  var oldPromise = LB._cache && LB._cache.data
    ? Promise.resolve(LB._cache.data)
    : lbCacheGet().then(function(c){ return (c && c.data) ? c.data : null; });
  oldPromise.then(function(oldData){
    lbLoad(sel, oldData).then(function(data){
      LB._cache={ data:data, ts:Date.now() };
      lbCacheSet(data);
      lbRenderView(data, lbPlayer(), LB.curClass||'');
    }).catch(function(e){
      if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#f87171">❌ 加载失败：'+e+'</div>';
    });
  });
}

function lbIconForDinoClass(dinoClass){
  if(!dinoClass || !LB_ICON_BY_NAME) return '';
  var sp=findSpeciesByClass(dinoClass);
  var eng=(sp&&sp.name)?sp.name:dinoClass;
  // 特殊名（载具/新生物等显示名覆盖）：用特殊名里的英文匹配图标（如 Train_Character_C → Train → Train_Engine）
  if(LB_SPECIAL_NAMES[dinoClass]){
    var sm=LB_SPECIAL_NAMES[dinoClass].match(/\((.+)\)$/);
    if(sm) eng=sm[1];
  }
  // 拆前缀（提前计算，供特例表兼容基础名）
  var st=lbStripPrefix(eng);
  var base=st.base || eng;
  // 图标特例表（精确指定：火车头/木筏/摩托艇/碎石熊等；兼容剥离前缀后的基础名如 X-Woolly Rhino→Woolly Rhino）
  var spName=LB_ICON_SPECIAL[eng] || (base!==eng ? LB_ICON_SPECIAL[base] : '');
  if(spName && LB_ICON_BY_NAME[spName]) return LB_ICON_BY_NAME[spName];
  if(LB_ICON_BY_NAME[eng]) return LB_ICON_BY_NAME[eng];
  // biology 命名习惯：空格→下划线（Terror_Bird/Snow_Owl/Dung_Beetle）
  var engU=eng.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[engU]) return LB_ICON_BY_NAME[engU];
  // 主词（拆前缀后）匹配 + 下划线
  if(LB_ICON_BY_NAME[base]) return LB_ICON_BY_NAME[base];
  var baseU=base.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[baseU]) return LB_ICON_BY_NAME[baseU];
  // 括号主名（如 Drakeling (Spring) → Drakeling，避免包含匹配误配 Dragon）
  var baseMain=base.replace(/\s*\(.*\)$/,'');
  if(baseMain && baseMain!==base){

  var sp=findSpeciesByClass(dinoClass);

  if(!(sp.taming.violent || sp.taming.nonViolent)) return false;
  // VR 变体（blueprint 含 /VR/ 或 ExperimentG，或英文名以 VR 开头）实际不可驯服
  var bp=sp.blueprintPath||'';
  var nm=sp.name||'';
  if(/\/VR\//i.test(bp) || /ExperimentG/i.test(bp) || /^VR\s/i.test(nm)) return false;
  // Alpha 变体（英文名以 Alpha 开头，如 Alpha Raptor/Alpha Rex）实际不可驯服

  if(/\/Cave\//i.test(bp) || /_Cave/i.test(bp) || /^Cave\s/i.test(nm)) return false;
  return true;
}

// 读取 HA 前端 token（页面部署在 HA /local/ 同域时可用；HA 前端登录后存于 localStorage.hassTokens）
function lbHaToken(){
  try{
    var t = localStorage.getItem('hassTokens');
    if(!t) return null;
    var parsed = JSON.parse(t);
    // 兼容两种格式：数组 [{access_token}]（旧）与对象 {access_token}（新）
    if(Array.isArray(parsed) && parsed.length && parsed[0] && parsed[0].access_token) return parsed[0].access_token;
    if(parsed && parsed.access_token) return parsed.access_token;
    return null;
  }catch(e){ return null; }
}
// 手机 HA Companion App：通过官方 externalAuth bridge 获取 token（回调协议，非 Promise）
// V1: window.externalApp.getExternalAuth('{"callback":"externalAuthSetToken","force":false}') → 原生调 window.externalAuthSetToken(true, authJson)
// V2: window.externalAppV2.postMessage({type:'getExternalAuth', payload:{callback,force}}) → 同上回调
function lbAppToken(){
  return new Promise(function(resolve){
    // 关键：iframe 内（self!==top）bridge 消息必然被 V2 origin 校验丢弃（!isMainFrame），
    // 直接返回 null 跳过，避免白等 6s 超时（App 内 Lovelace iframe 场景 12s 无提示空窗的根因）
    try{ if(window.self !== window.top) return resolve(null); }catch(e){}
    try{
      var hasV1 = window.externalApp && typeof window.externalApp.getExternalAuth === 'function';
      var hasV2 = window.externalAppV2 && typeof window.externalAppV2.postMessage === 'function';
      if(!hasV1 && !hasV2) return resolve(null);
      // 安装回调：原生通过它返回 token（auth 可能是 JSON 字符串或对象）
      window.externalAuthSetToken = function(ok, auth){
        var t = null;
        if(ok && auth){
          if(typeof auth === 'string'){ try{ t = JSON.parse(auth); }catch(e){ t = null; } }
          else t = auth;
          resolve((t && t.access_token) || null);
        } else {
          resolve(null);
        }
        clearTimeout(lbAppToken._tm);
      };
      var cb = 'externalAuthSetToken';
      if(hasV2){
        window.externalAppV2.postMessage(JSON.stringify({ type:'getExternalAuth', payload:{ callback:cb, force:false } }));
      } else {
        window.externalApp.getExternalAuth(JSON.stringify({ callback:cb, force:false }));
      }
      // 超时兜底（原生无响应 → 继续 fallback）
      lbAppToken._tm = setTimeout(function(){ resolve(null); }, 6000);
    }catch(e){ resolve(null); }
  });
}
// 同源 iframe 读取父框架 token：页面若嵌入 Lovelace iframe（与顶层同源），
// 顶层 HA 前端在 App 内能通过 externalAuth 拿到 token（存在 window.hassConnection → {auth, conn}），
// 同源 iframe 可直接访问 window.parent.hassConnection 读取 auth.accessToken
// 作用域：仅本页被 iframe 嵌入时尝试；直接顶层打开时 window.parent===window 自动跳过
function lbParentToken(){
  return new Promise(function(resolve){
    try{
      var p = window.parent;
      if(!p || p === window || !p.hassConnection || typeof p.hassConnection.then !== 'function'){
        return resolve(null);
      }
      var done = false;
      var tm = setTimeout(function(){ if(!done){ done = true; resolve(null); } }, 5000);
      p.hassConnection.then(function(conn){
        if(done) return;
        done = true; clearTimeout(tm);
        var auth = conn && conn.auth;
        var t = (auth && auth.accessToken) || (auth && auth.data && auth.data.access_token) || null;
        resolve(t || null);
      }).catch(function(){
        if(done) return;
        done = true; clearTimeout(tm);
        resolve(null);
      });
    }catch(e){ resolve(null); }
  });
}
// 获取有效 HA token：手机 App 走 externalAuth bridge；iframe 嵌入读父框架 token；浏览器读 localStorage（access_token 过期则用 refresh_token 换新并写回）
async function lbHaTokenRefresh(){
  try{
    var appTok = await lbAppToken();
    if(appTok) return appTok;
  }catch(e){}
  try{
    var parentTok = await lbParentToken();
    if(parentTok) return parentTok;
  }catch(e){}
  try{
    var raw = localStorage.getItem('hassTokens');
    if(!raw) return null;
    var t = JSON.parse(raw);
    if(Array.isArray(t)){ t = t[0] || null; }
    if(!t || !t.access_token) return null;
    // 未过期直接返回（提前 60s 刷新）
    if(!t.expires || Date.now() < (Number(t.expires) - 60000)) return t.access_token;
    if(!t.refresh_token) return null;
    var form = new URLSearchParams();
    form.set('grant_type', 'refresh_token');
    form.set('refresh_token', t.refresh_token);
    if(t.clientId) form.set('client_id', t.clientId);
    var res = await fetch('/auth/token', { method: 'POST', body: form });
    if(!res.ok) return null;
    var nt = await res.json();
    if(!nt.access_token) return null;
    t.access_token = nt.access_token;
    t.token_type = nt.token_type || 'Bearer';
    if(nt.refresh_token) t.refresh_token = nt.refresh_token;
    t.expires_in = nt.expires_in || 1800;
    t.expires = Date.now() + (nt.expires_in || 1800) * 1000;
    localStorage.setItem('hassTokens', JSON.stringify(t));
    return t.access_token;
  }catch(e){ return null; }
}

// 解析静态状态文件内容（AppDaemon 经 shell_command 写入的是 base64 编码 JSON；兼容纯 JSON）
function lbParseStatusFile(text){
  try{
    var s = String(text||'').trim();
    if(!s) return null;
    // 尝试直接 JSON
    try{ return JSON.parse(s); }catch(e){}
    // base64 解码后再 JSON
    try{
      var dec = decodeURIComponent(escape(atob(s)));
      return JSON.parse(dec);
    }catch(e2){}

  }catch(e){ return null; }
}
// 免认证轮询 AppDaemon 写入的静态状态文件（手机 App 无 token 也能读）：精确判断 ok/cooldown/error
async function lbWaitStatusFile(abbr, oldTs){
  var deadline = Date.now() + 15000;
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, 800); });
    try{
      var sf = await fetch('/local/asa-data/refresh_status.json?cb=' + Date.now(), { cache: 'no-store' });
      if(sf.ok){
        var obj = lbParseStatusFile(await sf.text());
        if(!obj) continue;
        var attrs = obj.attributes || {};
        if(attrs.server === abbr && attrs.ts && attrs.ts !== oldTs){
          if(attrs.cooldown) return {cooldown:true, ok:false, ts:attrs.ts};
          if(attrs.ok) return {cooldown:false, ok:true, ts:attrs.ts};
          return {cooldown:false, ok:false, error: attrs.error || 'RCON failed', ts:attrs.ts};
        }
      }
    }catch(e){}
  }
  return {cooldown:false, ok:false, error:'timeout'};
}

    }
  }catch(e){}

}
// 触发：优先调 HA script.refresh_tamed（发事件）→ AppDaemon RCON；无 token（手机 App）走免认证 webhook

    var baseTs = null;
    try{
      var b = await fetch('/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
      if(b.ok){
        var bj = await b.json();
        var ba = bj.attributes || {};
        if(ba.server === abbr) baseTs = ba.ts;
      }
    }catch(e){}
    var res = await fetch(LB.SVC_REFRESH, {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({server: abbr})
    });
    if(!res.ok) return {ok:false, server:abbr, error:'HTTP '+res.status};
    // 轮询 AppDaemon 写入的 RCON 结果（含 cooldown），最长 15s；只接受 ts 变化的本次结果
    var deadline = Date.now() + 15000;
    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 800); });
      var st;
      try{
        st = await fetch('/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
        if(st.ok){
          var obj = await st.json();
          var attrs = obj.attributes || {};
          if(attrs.server === abbr && attrs.ts !== baseTs){
            if(attrs.cooldown) return {ok:true, server:abbr, cooldown:true};
            if(attrs.ok) return {ok:true, server:abbr};
            return {ok:false, server:abbr, error: attrs.error || 'RCON failed'};
          }
        }
      }catch(e){}
    }
    // 超时未获取到本次状态 → 按成功让 savedAt 轮询确认兜底
    return {ok:true, server:abbr};
  }catch(e){
    return {ok:false, server:abbr, error:String(e)};
  }
}
// 从 HA API 读取服务器主题（名称/图标直接用 apps.yaml server_themes → sensor.asa_server_themes 属性），失败回退硬编码
function lbLoadThemes(){
  return new Promise(function(resolve){
    // 复用 lbInitPlayer 已缓存的 token（避免重复 lbHaTokenRefresh 再次卡 6s 空窗）；无缓存才重新获取
    var tokenPromise = LB._tok
      ? Promise.resolve(LB._tok)
      : lbHaTokenRefresh();
    tokenPromise.then(function(token){
      if(!token){ resolve(false); return; }
      fetch('/api/states/sensor.asa_server_themes', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(s){
        var th = (s && s.attributes && s.attributes.server_themes) ? s.attributes.server_themes : null;
        if(!th) throw 0;
        var arr = [];
        Object.keys(th).forEach(function(k){
          var v = th[k] || {};
          arr.push({ abbr: k, name: v.name || k, icon: v.emoji || '' });
        });
        if(arr.length){
          LB.SERVERS = arr;
          // 链上 API 成功 → 自动更新内置兑底缓存（下次无 HA 环境时用最新数据）
          try{ localStorage.setItem('lbServerCache', JSON.stringify(arr)); }catch(e){}
          resolve(true);
        }
        else resolve(false);
      }).catch(function(){ resolve(false); });
    }, function(){ resolve(false); });
  });
}

async function lbWildSearch(btn){

    bar.innerHTML = sel.map(function(){ return '<div style="flex:1;border-radius:2px;background:#333;transition:background .3s"></div>'; }).join('');

    var wild = LB._wildCache = LB._wildCache || {};

    var ok=0, fail=0;
    for(var i=0;i<sel.length;i++){

      segs[i].style.background = '#7c3aed'; // 进行中
      txt.textContent = '正在搜索 '+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）'+(noToken?' [webhook]':'');

      return '玩家#'+(r.containerOwnerPid||'?');
    }

// 检查该物种哪些服务器缺野生缓存（筛选时自动补拉服务器上的 _wild 全图文件，仅读不触发 RCON）
function lbMissingWildServers(cls){
  var missing = [];
  LB.SERVERS.forEach(function(s){
    if(s.abbr==='Bob') return;
    var ent = (LB._wildCache && LB._wildCache[cls] && LB._wildCache[cls][s.abbr]);
    if(!ent || !Array.isArray(ent.dinos)) missing.push(s.abbr);
  });
  return missing;
}
// 拉取缺失服务器的 _wild 全图文件（存在且有数据才进库）
async function lbFetchWildFiles(cls, servers){
  var wild = LB._wildCache = LB._wildCache || {};
  if(!wild[cls]) wild[cls] = {};
  var species = cls.replace(/_C$/,'');
  var updated = false;
  for(var i=0;i<servers.length;i++){
    var abbr = servers[i];
    try{
      var j = await authFetch(DINO_JSON + abbr + '_wild_' + encodeURIComponent(species) + '.json?cb=' + Date.now(), {}).then(function(r){ return r.json(); });
      if(j && j.savedAt && Array.isArray(j.dinos) && j.dinos.length){
        wild[cls][abbr] = { savedAt: j.savedAt, dinos: j.dinos };
        updated = true;
      }
    }catch(e){}
  }
  return updated;
}
// v123：野生 json 时间戳格式化（毫秒 → HH:MM；非当天 → MM-DD HH:MM；无 → -）
function lbFmtTs(ts){
  if(!ts) return '-';
  var d = new Date(Number(ts));
  if(isNaN(d.getTime())) return '-';
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours())+':'+pad(d.getMinutes());
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  return sameDay ? hm : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
}

    if(!LB.breedResult) return;
    var t = e.target;
    if(!t || !t.closest) return;
    if(t.closest('#lbBreedBar') || t.closest('#lbBreedResult') || t.closest('#lbBreedOverlay') || t.closest('.lb-confirm-overlay')) return;
    lbBreedToggle(); // 等同取消（结果开启→关闭）
  });
}
lbRenderBreedBar();
lbBreedBindOutsideCancel();
</script>
<!-- 解析结果浮窗 -->
<div id="previewOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9)" onclick="if(event.target===this)closePreviewOverlay()">
  <div id="previewPopup" style="position:absolute;inset:16px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0">
      <h2 style="font-size:14px;color:#999;margin:0">📋 解析结果 <span id="parseStatus"></span> <span id="solverTag" style="font-size:11px;color:#7c3aed"></span></h2>
      <svg onclick="closePreviewOverlay()" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="cursor:pointer;flex-shrink:0"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <div id="previewPopupContent" style="flex:1;overflow-y:auto;padding:12px 16px 16px;font-size:13px"></div>
  </div>
</div>
<!-- 繁育结果遮罩：展开时覆盖其他区域（纯视觉），点击遮罩=取消（事件冒泡到 document 监听）；层级 996<结果997<繁育栏998<候选浮窗9999 -->
<div id="lbBreedMask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:996"></div>
<!-- 繁育栏：选中具体物种时显示（底部固定单行；6 属性顺序选种） -->
<div id="lbBreedBar" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#16161f;border-top:1px solid #2a2a3a;padding:10px 10px;z-index:998">
  <div style="display:flex;align-items:center;gap:8px">
    <span style="color:#7c3aed;font-size:13px;flex-shrink:0" title="繁育目标">🧬</span>
    <div id="lbBreedAttrs" style="display:flex;gap:4px;flex-shrink:0"></div>
    <span id="lbBreedGeneBtn" class="mut-chip" onclick="lbOpenGenePicker(event)" title="按基因筛选" style="font-size:11px;padding:4px 8px;cursor:pointer;flex-shrink:0">🧬基因</span>
    <span style="flex:1"></span>
    <button id="lbBreedWildBtn" onclick="lbOpenWildConfirm()" style="display:none;flex-shrink:0;background:#0e7490;color:#fff;border:none;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">刷新野生</button>
    <button id="lbBreedBtn" onclick="lbBreedToggle()" style="flex-shrink:0;background:#7c3aed;color:#fff;border:none;border-radius:6px;padding:4px 14px;font-size:12px;cursor:pointer">选种</button>
  </div>
</div>
<!-- 繁育结果浮层（繁育栏上方） -->
<div id="lbBreedResult" style="display:none;position:fixed;bottom:40px;left:0;right:0;max-height:60vh;overflow-y:auto;background:#16161f;border-top:1px solid #2a2a3a;z-index:997;padding:8px 12px"></div>
<!-- 繁育候选详情浮窗（点击繁育卡片弹出，只显示完整生物卡片本体；点卡片外自动关闭） -->
<div id="lbBreedOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.9);overflow-y:auto;padding:80px 20px 20px" onclick="lbBreedOverlayClick(event)">
  <div id="lbBreedOverlayBody" style="max-width:520px;margin:0 auto"></div>
</div>
</body>
</html>
