<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wikily 生物导入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f13;color:#e0e0e0;min-height:100vh;padding:16px}
.header{text-align:center;margin-bottom:16px}
.header h1{font-size:20px;color:#7c3aed;margin-bottom:4px}
.header p{font-size:12px;color:#666}
.card{background:#1a1a24;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #2a2a3a}
.card h2{font-size:14px;color:#999;margin-bottom:10px}
.file-list{max-height:250px;overflow-y:auto}
.file-item{display:flex;align-items:center;padding:10px 12px;margin:4px 0;border-radius:8px;cursor:pointer;background:#22223a;transition:all .15s}
.file-item:hover{background:#2d2d50}
.file-item.selected{background:#7c3aed;color:white}
.file-item .icon{font-size:18px;margin-right:10px}
.file-item .name{flex:1;font-size:13px;word-break:break-all}
.file-item .size{font-size:11px;color:#888;margin-left:8px}
.file-item.selected .size{color:#ccc}
.preview{font-size:13px}
.preview .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}
.preview .row:last-child{border:none}
.preview .label{color:#888}
.preview .value{color:#e0e0e0;font-weight:500}
.input-row{margin:6px 0}
.input-row input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#e0e0e0;font-size:13px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.btn-primary{background:#7c3aed;color:white;margin-top:12px}
.btn-primary:hover{background:#6d28d9}
.btn-primary:disabled{background:#444;cursor:not-allowed}
.status{padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px}
.status.info{background:#1a1a3a;color:#7c3aed}
.status.success{background:#1a3a1a;color:#4ade80}
.status.error{background:#3a1a1a;color:#f87171}
.hint{font-size:11px;color:#666;margin-top:4px}
</style>
</head>
<body>

<div class="header">
  <h1>🦖 Wikily 生物导入</h1>
  <p>NAS → DinoExports/imported/</p>
</div>

<!-- 登录卡片 -->
<div class="card" id="loginCard">
  <h2>🔐 NAS 认证</h2>
  <div class="input-row">
    <input type="text" id="nasUser" placeholder="用户名" autocomplete="username">
  </div>
  <div class="input-row">
    <input type="password" id="nasPass" placeholder="密码" autocomplete="current-password">
  </div>
  <button class="btn btn-primary" onclick="doLogin()">连接 NAS</button>
  <div id="loginStatus"></div>
</div>

<!-- 主界面 -->
<div id="mainUI" style="display:none">
  <div class="card">
    <h2>📂 可用文件 <button onclick="refreshFiles()" style="float:right;background:none;border:1px solid #333;color:#999;padding:2px 10px;border-radius:6px;cursor:pointer;font-size:12px">🔄 刷新</button></h2>
    <div class="file-list" id="fileList"><div style="text-align:center;padding:20px;color:#555">加载中...</div></div>
  </div>
  <div class="card" id="previewCard" style="display:none">
    <h2>📋 解析结果</h2>
    <div class="preview" id="preview"></div>
  </div>
  <div id="statusArea"></div>
  <button class="btn btn-primary" id="importBtn" disabled onclick="doImport()">🚀 导入到 Wikily</button>
  <div class="card" style="margin-top:12px">
    <h2>⚙️ Wikily 用户名</h2>
    <div class="input-row"><input type="text" id="wikiUser" placeholder="输入你的 Wikily 用户名" onchange="saveUser()"></div>
    <div class="hint">用于跳转到你的 profile 页面</div>
  </div>
</div>

<script>
var AUTH = null, selectedFile = null, parsedData = null;

// 尝试从 URL 自动提取凭据（http://user:pass@host/...）
(function(){
  try {
    var u = window.location.username || '';
    var p = window.location.password || '';
    if (u && p) {
      document.getElementById('nasUser').value = u;
      document.getElementById('nasPass').value = p;
      doLogin();
    }
  } catch(e) {}
})();

document.getElementById('wikiUser').value = localStorage.getItem('wikily_user') || '';

function saveUser() { localStorage.setItem('wikily_user', document.getElementById('wikiUser').value.trim()); }

function doLogin() {
  var u = document.getElementById('nasUser').value.trim();
  var p = document.getElementById('nasPass').value.trim();
  if (!u || !p) return showLogin('请输入用户名和密码', 'error');
  AUTH = 'Basic ' + btoa(u + ':' + p);
  showLogin('⏳ 验证中...', 'info');
  fetch('dino-import.html', { headers: { 'Authorization': AUTH } })
    .then(function(r) {
      if (r.ok) {
        sessionStorage.setItem('nas_auth', AUTH);
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('mainUI').style.display = 'block';
        refreshFiles();
      } else { AUTH = null; showLogin('❌ 认证失败 (HTTP ' + r.status + ')', 'error'); }
    })
    .catch(function(e) { AUTH = null; showLogin('❌ 连接失败：' + e.message, 'error'); });
}

function showLogin(m, t) { document.getElementById('loginStatus').innerHTML = '<div class="status ' + t + '">' + m + '</div>'; }

// 恢复 session
(function() {
  var s = sessionStorage.getItem('nas_auth');
  if (s) { AUTH = s; document.getElementById('loginCard').style.display = 'none'; document.getElementById('mainUI').style.display = 'block'; refreshFiles(); }
})();

function ah() { return AUTH ? { 'Authorization': AUTH } : {}; }

async function refreshFiles() {
  var list = document.getElementById('fileList');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">加载中...</div>';
  try {
    var body = '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:getcontentlength/><D:resourcetype/></D:prop></D:propfind>';
    var res = await fetch('.', { method: 'PROPFIND', headers: Object.assign({}, ah(), { 'Depth': '1' }), body: body });
    if (res.status === 401) { sessionStorage.removeItem('nas_auth'); AUTH = null; document.getElementById('mainUI').style.display = 'none'; document.getElementById('loginCard').style.display = 'block'; showLogin('⚠️ 认证过期，请重新登录', 'error'); return; }
    if (res.status !== 207) throw new Error('WebDAV ' + res.status);
    var xml = await res.text();
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    var resp = doc.getElementsByTagNameNS('DAV:', 'response');
    var files = [];
    for (var i = 0; i < resp.length; i++) {
      var r = resp[i];
      var href = (r.getElementsByTagNameNS('DAV:', 'href')[0] || {}).textContent || '';
      var size = (r.getElementsByTagNameNS('DAV:', 'getcontentlength')[0] || {}).textContent;
      var rt = r.getElementsByTagNameNS('DAV:', 'resourcetype')[0];
      var isCol = rt && rt.getElementsByTagNameNS('DAV:', 'collection').length > 0;
      var name = decodeURIComponent(href.split('/').filter(Boolean).pop() || '');
      if (!name || isCol || !name.toLowerCase().endsWith('.ini')) continue;
      files.push({ name: name, size: parseInt(size) || 0 });
    }
    if (files.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">😕 没有 .ini 文件</div>'; return; }
    files.sort(function(a, b) { return b.name.localeCompare(a.name); });
    list.innerHTML = files.map(function(f) { return '<div class="file-item" onclick="selectFile(\'' + escapeHtml(f.name) + '\',' + f.size + ')"><span class="icon">📄</span><span class="name">' + escapeHtml(f.name) + '</span><span class="size">' + formatSize(f.size) + '</span></div>'; }).join('');
  } catch (e) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171">❌ ' + escapeHtml(e.message) + '<br><small>请确认已连接 NAS 局域网</small></div>'; }
}

async function selectFile(name) {
  var items = document.querySelectorAll('.file-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
  selectedFile = name;
  showStatus('info', '⏳ 读取中...');
  try {
    var res = await fetch(name, { headers: ah() });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsedData = parseIni(await res.text(), name);
    showPreview(parsedData);
    document.getElementById('previewCard').style.display = 'block';
    document.getElementById('importBtn').disabled = false;
    showStatus('success', '✅ ' + (parsedData.blueprint || '解析完成'));
  } catch (e) { showStatus('error', '❌ ' + e.message); parsedData = null; document.getElementById('importBtn').disabled = true; }
}

function parseIni(t, fn) {
  var r = { stats: [], _filename: fn };
  t.split('\n').forEach(function(l) {
    l = l.trim(); if (!l || l[0] === ';') return;
    var m = l.match(/^(\w+(?:\[\d+\])?)\s*=\s*(.*)$/); if (!m) return;
    var k = m[1], v = m[2].trim();
    if (k === 'DinoClass') r.blueprint = v.split('.').pop().replace(/'/g, '');
    else if (k === 'DinoNameTag') r.name = v;
    else if (k === 'BaseLevel') r.level = parseInt(v) || 0;
    else if (k.startsWith('Stats[')) r.stats[parseInt(k.match(/\d+/)[0])] = parseFloat(v) || 0;
    else if (k === 'TamedEffectiveness') r.tameEff = parseFloat(v) || 0;
    else if (k === 'RandomMutationsFemale') r.matMutations = parseInt(v) || 0;
    else if (k === 'RandomMutationsMale') r.patMutations = parseInt(v) || 0;
  });
  return r;
}

function showPreview(d) {
  var n = ['生命','耐力','氧气','食物','重量','近战','速度'];
  var h = '<div class="row"><span class="label">文件</span><span class="value">' + escapeHtml(d._filename) + '</span></div>';
  h += '<div class="row"><span class="label">物种</span><span class="value">' + escapeHtml(d.blueprint||'?') + '</span></div>';
  h += '<div class="row"><span class="label">名称</span><span class="value">' + escapeHtml(d.name||'-') + '</span></div>';
  h += '<div class="row"><span class="label">等级</span><span class="value">' + (d.level||'?') + '</span></div>';
  for (var i = 0; i < 7; i++) if (d.stats[i] > 0) h += '<div class="row"><span class="label">' + n[i] + '</span><span class="value">' + d.stats[i].toFixed(1) + '</span></div>';
  if (d.tameEff) h += '<div class="row"><span class="label">驯服有效性</span><span class="value">' + (d.tameEff*100).toFixed(1) + '%</span></div>';
  if (d.matMutations||d.patMutations) h += '<div class="row"><span class="label">变异(母/父)</span><span class="value">' + d.matMutations + ' / ' + d.patMutations + '</span></div>';
  document.getElementById('preview').innerHTML = h;
}

function doImport() {
  if (!parsedData) return;
  var u = document.getElementById('wikiUser').value.trim();
  if (!u) { showStatus('error', '⚠️ 请输入 Wikily 用户名'); return; }
  saveUser();
  var p = { blueprint: parsedData.blueprint, name: parsedData.name||null, level: parsedData.level, stats: parsedData.stats, tameEff: parsedData.tameEff||null, matMutations: parsedData.matMutations||0, patMutations: parsedData.patMutations||0, _filename: parsedData._filename };
  var enc = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
  showStatus('info', '🚀 正在打开 Wikily...');
  window.open('https://wikily.gg/zh-cn/ark-survival-ascended/profile/' + encodeURIComponent(u) + '/#import=' + enc, '_blank');
}

function showStatus(t, m) { document.getElementById('statusArea').innerHTML = '<div class="status ' + t + '">' + m + '</div>'; }
function formatSize(b) { return b < 1024 ? b + ' B' : (b/1024).toFixed(1) + ' KB'; }
function escapeHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
