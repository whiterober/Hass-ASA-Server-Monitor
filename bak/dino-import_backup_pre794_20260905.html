<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="/manifest.webmanifest">

<style>
:root{
  --bg:#0f0f13;
  --card:#1a1a24;
  --text:#e0e0e0;
  --accent:#7c3aed;
  --border:#2a2a3a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f13;color:#e0e0e0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding:16px 16px 0}
.header{text-align:center;margin-bottom:16px;flex-shrink:0}
.header h1{font-size:20px;color:#7c3aed;margin-bottom:4px}
.header p{font-size:12px;color:#666}
.card{background:#1a1a24;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #2a2a3a}
.card h2{font-size:14px;color:#999;margin-bottom:10px}
#mainUI{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;gap:12px}
#leftCol,#rightCol{display:flex;flex-direction:column;min-height:0}
#leftCol{flex:1}
#fileCard{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;margin-bottom:0}
#rightCol{flex-shrink:0}
@media (min-width:768px){
  #mainUI{flex-direction:row}
  #leftCol{flex:1;min-width:0;padding-bottom:16px}
  #rightCol{flex:1;overflow-y:auto;min-width:0}
  #rightCol .card:last-of-type{margin-bottom:0}
  #rightPlaceholder{display:flex}
}
@media (max-width:767px){
  body{padding-bottom:4px}
}
.file-list{flex:1;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#333 transparent}
.file-list::-webkit-scrollbar{width:5px}
.file-list::-webkit-scrollbar-track{background:transparent}
.file-list::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
.file-list::-webkit-scrollbar-thumb:hover{background:#555}
html{scrollbar-width:thin;scrollbar-color:#333 transparent}
html::-webkit-scrollbar{width:5px}
html::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
html::-webkit-scrollbar-thumb:hover{background:#555}
/* 统一滚动条样式（所有可滚动容器，2026-08-12）：筛选列表/物种选择/浮窗等与主列表一致（scrollbar-width 非继承、::-webkit-scrollbar 不继承，需逐容器声明） */
#rightCol,#lbList,.file-list,.lb-picker-grid,.lb-confirm-overlay,.lb-modal-box,#previewPopupContent,#lbBreedResult,#lbBreedOverlay,.lb-modal-scroll{scrollbar-width:thin;scrollbar-color:#333 transparent}
#rightCol::-webkit-scrollbar,#lbList::-webkit-scrollbar,.file-list::-webkit-scrollbar,.lb-picker-grid::-webkit-scrollbar,.lb-confirm-overlay::-webkit-scrollbar,.lb-modal-box::-webkit-scrollbar,#previewPopupContent::-webkit-scrollbar,#lbBreedResult::-webkit-scrollbar,#lbBreedOverlay::-webkit-scrollbar,.lb-modal-scroll::-webkit-scrollbar{width:5px}
#rightCol::-webkit-scrollbar-track,#lbList::-webkit-scrollbar-track,.file-list::-webkit-scrollbar-track,.lb-picker-grid::-webkit-scrollbar-track,.lb-confirm-overlay::-webkit-scrollbar-track,.lb-modal-box::-webkit-scrollbar-track,#previewPopupContent::-webkit-scrollbar-track,#lbBreedResult::-webkit-scrollbar-track,#lbBreedOverlay::-webkit-scrollbar-track,.lb-modal-scroll::-webkit-scrollbar-track{background:transparent}
#rightCol::-webkit-scrollbar-thumb,#lbList::-webkit-scrollbar-thumb,.file-list::-webkit-scrollbar-thumb,.lb-picker-grid::-webkit-scrollbar-thumb,.lb-confirm-overlay::-webkit-scrollbar-thumb,.lb-modal-box::-webkit-scrollbar-thumb,#previewPopupContent::-webkit-scrollbar-thumb,#lbBreedResult::-webkit-scrollbar-thumb,#lbBreedOverlay::-webkit-scrollbar-thumb,.lb-modal-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:3px}
#rightCol::-webkit-scrollbar-thumb:hover,#lbList::-webkit-scrollbar-thumb:hover,.file-list::-webkit-scrollbar-thumb:hover,.lb-picker-grid::-webkit-scrollbar-thumb:hover,.lb-confirm-overlay::-webkit-scrollbar-thumb:hover,.lb-modal-box::-webkit-scrollbar-thumb:hover,#previewPopupContent::-webkit-scrollbar-thumb:hover,#lbBreedResult::-webkit-scrollbar-thumb:hover,#lbBreedOverlay::-webkit-scrollbar-thumb:hover{background:#555}
/* #lbList 隐藏原生滚动条（v363 方案B：滚动条不占内容宽度；overlay 已废弃回退 auto，故用隐藏方案） */
#lbList{scrollbar-width:none;-ms-overflow-style:none}
#lbList::-webkit-scrollbar{display:none}
@media (pointer:coarse){html::-webkit-scrollbar,.file-list::-webkit-scrollbar{width:0}}
.parse-btn{display:none;width:22px;height:22px;border-radius:6px;flex-shrink:0;cursor:pointer;align-items:center;justify-content:center;margin-left:auto}
.parse-btn.ok{display:inline-flex;background:#1a3a1a;border:1px solid #2a5a2a}
.parse-btn.err{display:inline-flex;background:#3a1a1a;border:1px solid #5a2a2a}
.file-item.selected .parse-btn.ok,.file-item.selected .parse-btn.err{background:transparent;border-color:#fff4}
#previewPopup .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222}
#previewPopup .row:last-child{border:none}
#previewPopup .label{color:#888}
#previewPopup .value{color:#e0e0e0;font-weight:500}
.file-group[open] > summary{border:1px solid #7c3aed}
.file-item{display:flex;flex-direction:column;cursor:pointer;border-radius:8px;padding:8px 10px;margin:3px 0;background:#22223a;transition:all .15s}
.file-item .fi-top{display:flex;align-items:center;font-size:13px}
.file-item:hover{background:#2d2d50}
.file-item.selected{background:#7c3aed;color:white}
.file-item.selected .fi-species,.file-item.selected .fi-name,.file-item.selected .fi-level,.file-item.selected .fi-size,.file-item.selected .file-name{color:#fff!important}
.file-item.selected .fi-sex{color:#fff!important}
.file-item.selected .fi-stage{background:#fff3!important;color:#fff!important;border-color:#fff6!important}
.file-item .icon{font-size:16px;margin-right:8px;flex-shrink:0}
.file-name{flex:1;font-size:12px;word-break:break-all;min-width:0}
.file-info{font-size:10px;color:#777;margin-top:2px}
.fi-species{color:#a78bfa;font-weight:600;margin-right:6px}
.fi-name{color:#ccc;margin-right:6px}
.fi-level{color:#ccc;margin-right:6px}
.fi-date{color:#666;margin-left:auto}
.fi-size{color:#888;margin-left:4px}
.fi-sep{color:#333;font-size:inherit}
.input-row{margin:6px 0}
.input-row input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#e0e0e0;font-size:13px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s}
.btn-primary{background:#7c3aed;color:white;margin:12px 0 16px;flex-shrink:0}
@media (min-width:768px){.btn-primary{margin-top:auto}}
.btn-primary:hover{background:#6d28d9}
.btn-primary:disabled{background:#444;cursor:not-allowed}
.status{padding:10px;border-radius:8px;font-size:13px;text-align:center;margin-top:10px}
.status.info{background:#1a1a3a;color:#7c3aed}
.status.success{background:#1a3a1a;color:#4ade80}
.status.error{background:#3a1a1a;color:#f87171}
.hint{font-size:11px;color:#666;margin-top:4px}
.cand-row{display:flex;align-items:center;padding:6px 8px;margin:2px 0;border-radius:6px;cursor:pointer;background:#1a1a2e;font-size:11px;gap:4px}
.cand-row:hover{background:#2a2a4e}
.cand-row.selected{background:#7c3aed;color:white}
.cand-row .cand-num{width:20px;text-align:center;color:#666;font-weight:600}
.cand-row.selected .cand-num{color:#ccc}
.cand-row .cand-stat{text-align:center;min-width:20px}
.cand-row .cand-stat .cw{color:#a78bfa;font-weight:600}
.cand-row .cand-stat .cm{font-weight:600;text-shadow:0 0 6px #f59e0b,0 0 12px #f59e0b40}
.cand-row.selected .cand-stat .cw{color:#fff}
.cand-row.selected .cand-stat .cm{text-shadow:0 0 6px #fbbf24,0 0 12px #fbbf2440}
.cand-row .cand-stat .cd{color:#666;font-size:10px}
.cand-row.selected .cand-stat .cd{color:#ccc}
.cand-row .cand-score{color:#555;font-size:10px;text-align:right;min-width:20px}
.cand-row.selected .cand-score{color:#ccc}
.cand-row.selected .cand-info{color:#ccc!important}
.mut-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;background:#1a1a2e;border:1px solid #2a2a3a;cursor:pointer;font-size:11px;color:#888;transition:all .15s;user-select:none}
.mut-chip:hover{background:#2a2a4e;color:#ccc}
.mut-chip.has-val{color:#c4b5fd;border-color:#7c3aed;background:#2e1065;font-weight:600} // v165：选中增强——深紫底+实色紫边框+淡紫加粗（原来边框 33 透明度几乎不可见）
.mut-chip.editing{flex:1 0 100%;gap:8px;padding:8px 12px;background:#111;border:1px solid #7c3aed;color:#e0e0e0;cursor:default}
.mut-chip.editing input{flex:1;background:none;border:none;color:#e0e0e0;font-size:14px;outline:none;text-align:right;min-width:0}
.mut-chip.editing input::-webkit-outer-spin-button,.mut-chip.editing input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* v166：移动端繁育栏两行布局——行1=属性+基因按钮（居中），行2=操作按钮（刷新野生+取消，居中）；桌面端不受影响 */
@media (max-width: 560px){
  #lbBreedBar > div{flex-wrap:wrap;justify-content:center;row-gap:6px}
  #lbBreedAttrs{flex-wrap:wrap;justify-content:center}
  #lbBreedGeneBtn{margin-left:4px}
  #lbBreedActions{flex:1 1 100%;justify-content:center}
  #lbBreedBar > div > span[style*="flex:1"]{display:none}
  /* v326：移动端刷新野生内联区——确认搜索按钮和进度条另起一行（父容器 flex-wrap:wrap 下 flex-basis:100% 换行）；按钮整行居中 */
  /* v328：进度条 flex-basis 加 !important（内联 flex:1 shorthand 含 flex-basis:0%，优先级高于外部 CSS，导致换行失效） */
  /* v439：移动端——服务器多选独占一行（flex-basis:100%），分布地图+刷新野生共享下一行（flex:1 平分），进度条再另起一行 */
  #lbWildInline #lbServersWild{flex-basis:100%!important;flex-grow:0!important}
  #lbWildInline #lbWildGoBtn{flex:1;display:flex;justify-content:center;align-items:center}
  #lbWildInline #lbWildDistBtn{flex:1;display:flex;justify-content:center;align-items:center}
  #lbWildInline #lbWildProgWrap{flex-basis:100%!important;flex-grow:0!important}
}
/* v329：刷新野生按钮与进度条占位高度对齐（按钮原 29px、进度条 35px 高度差导致切换抖动；通用规则 PC+移动端都生效） */
#lbWildInline #lbWildGoBtn{height:35px}
#lbWildInline #lbWildDistBtn{height:35px} /* v419：分布地图按钮与刷新野生等高 */
#lbWildInline #lbWildProgWrap{min-height:35px}
/* v560：联盟位置查询 loading 改屏幕中间滚动圈（无需文字） */
@keyframes lbSpin{to{transform:rotate(360deg)}}
.lb-spin{width:38px;height:38px;border:4px solid rgba(124,58,237,.18);border-top-color:#7c3aed;border-radius:50%;animation:lbSpin .7s linear infinite;display:inline-block}
/* v421：分布地图滚动容器——隐藏横向滚动条（Firefox scrollbar-width + Webkit 伪元素） */
.lb-wild-dist-scroll{scrollbar-width:none;-ms-overflow-style:none}
.lb-wild-dist-scroll::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<!-- 登录引导条（无 token 无法自动识别账号时显示） -->
<div id="lbLoginBar" style="display:none;margin-bottom:10px;padding:8px 12px;border-radius:8px;background:#1a1a24;border:1px solid #7c3aed55;color:#ccc;font-size:12px;align-items:center;flex-wrap:wrap"></div>
<style>
.tabbar{display:flex;gap:8px;margin-bottom:12px;flex-shrink:0}
.tab{flex:1;text-align:center;padding:10px 0;border-radius:10px;background:#1a1a24;border:1px solid #2a2a3a;color:#999;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s;user-select:none}
.tab:hover{background:#22223a;color:#ccc}
.tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tab .mdi{font-size:16px;vertical-align:-2px;margin-right:4px}
.lb-tab{font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid #333;background:#1a1a24;color:#999;cursor:pointer;user-select:none;transition:all .15s}
.lb-tab:hover{background:#22223a;color:#ccc}
.lb-tab-on{background:#7c3aed22;border-color:#7c3aed;color:#a78bfa;font-weight:600}
/* 服务器 TAB（ASA 后台 server-tab 同款：纯图标 + active 紫高亮 + 数量角标；与选物种按钮统一高度 28px） */
.server-tab{padding:4px 8px;border-radius:6px;border:1px solid #333;cursor:pointer;font-size:14px;background:#1a1a24;color:#ccc;display:inline-flex;align-items:center;justify-content:center;transition:all .15s;user-select:none;position:relative;height:28px}
.server-tab:hover{background:#22223a;color:#fff}
.server-tab.active{background:#7c3aed;color:#fff;border-color:#7c3aed}
.server-tab .mdi{font-size:15px;line-height:1}
.server-tab-cnt{position:absolute;top:-5px;right:-5px;background:#7c3aed;color:#fff;font-size:9px;border-radius:8px;padding:0 3px;line-height:13px;min-width:13px;text-align:center;font-style:normal;pointer-events:none;white-space:nowrap}
.server-tab.active .server-tab-cnt{background:#fff;color:#7c3aed}
/* v178：胶囊内基因字符图标（✦ 四角星，略小不撑高） */
.server-tab-cnt .gene-ic{font-size:9px;line-height:1;font-style:normal}
/* 物种选择按钮（更像按钮：hover 紫色高亮 + 下拉箭头） */
.lb-class-btn{display:inline-flex;align-items:center;gap:6px;background:#1a1a24;border:1px solid #333;border-radius:8px;color:#ccc;font-size:12px;padding:5px 24px 5px 12px;max-width:280px;min-width:120px;cursor:pointer;text-align:left;overflow:visible;transition:all .15s;user-select:none;position:relative;margin-right:12px;height:28px;flex-shrink:0}
.lb-class-btn:hover{background:#22223a;border-color:#7c3aed;color:#fff}
.lb-class-btn:active{transform:scale(.97)}
.lb-class-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:#a78bfa}
.lb-class-ic{position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:36px;height:36px;object-fit:contain;flex-shrink:0}
/* 生物卡片右侧高透物种图标（绝对定位，右缘超出被 overflow:hidden 裁切；filter 用 style 属性注入避免与定位样式冲突） */
.lb-card-ic{position:absolute;right:8px;top:10px;width:64px;height:64px;object-fit:contain;opacity:.14;pointer-events:none;z-index:0}
/* 生物卡片：PC 手型 + hover 紫色描边（可选中）；移动端禁选字 */
.lb-card{cursor:pointer}
.lb-card:hover{border-color:#7c3aed!important}
/* v519：自动命名模板说明折叠——三角形箭头（展开旋转90°）+ 表格化可读排版 */
.lb-tpl-details > summary{list-style:none;cursor:pointer;user-select:none;font-size:12px;color:#a78bfa;font-weight:600}
.lb-tpl-details > summary::-webkit-details-marker{display:none}
.lb-tpl-details > summary::before{content:'';display:inline-block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:6px solid #a78bfa;transition:transform .15s;margin-right:6px;vertical-align:1px}
.lb-tpl-details[open] > summary::before{transform:rotate(90deg)}
.lb-tpl-details table{width:100%;border-collapse:collapse;margin-top:6px;font-size:11px}
.lb-tpl-details th{text-align:left;color:#a78bfa;font-weight:600;padding:3px 8px;border-bottom:1px solid #444}
.lb-tpl-details td{padding:3px 8px;color:#bbb;border-bottom:1px solid #2a2a3a}
.lb-tpl-details code{background:#22223a;border:1px solid #333;border-radius:3px;padding:0 4px;color:#e0e0e0}
.lb-tpl-details .fn{color:#22d3ee;font-weight:600}
/* ID 小按钮：卡片右上角绝对定位，圆角描边低可视化，点击 toggle 显示 ID 浮窗（双端统一） */
.lb-id-btn{position:absolute;top:14px;right:8px;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:2px;border:1px solid #444;background:rgba(255,255,255,.05);color:#777;opacity:.6;cursor:pointer;z-index:2;flex-shrink:0;line-height:1;padding:0}
.lb-id-btn:hover{opacity:1;color:#a78bfa;border-color:#7c3aed}
.lb-id-btn.lb-active{opacity:1;color:#a78bfa;border-color:#7c3aed;background:rgba(124,58,237,.15)}
.lb-id-btn.lb-watch-on{opacity:1;color:#f59e0b;border-color:#f59e0b88;background:rgba(245,158,11,.14)} /* v623：已关注=金色（与入口数字一致） */
.lb-id-btn.lb-watch-on:hover{color:#fbbf24;border-color:#f59e0b}
.lb-id-btn .mdi{font-size:12px}
/* v644：性别符号 iOS 基线修正（♂/♀ Unicode 在 iOS 字体下坠，仅 iOS 上移微调） */
.lb-sex{display:inline-block}
html.ios .lb-sex{transform:translateY(-0.08em)}
/* 繁育结果卡片：容器图标固定尺寸（防崩，不依赖 .acc summary img） */
.lb-breed-card .lb-sum-ic{width:16px;height:16px;vertical-align:-3px;margin-right:3px;border-radius:3px;object-fit:contain}
#lbBreedOverlayBody .lb-sum-ic{width:16px;height:16px;vertical-align:-3px;border-radius:3px;object-fit:contain}
.acc{border-radius:8px;margin-bottom:6px;background:transparent;overflow:hidden}
.acc summary{padding:8px 12px;cursor:pointer;font-size:13px;color:#ccc;user-select:none;display:flex;justify-content:space-between;align-items:center;transition:all .15s}
.acc summary .acc-sum-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.acc summary:hover{background:#1d1d29;color:#fff}
.acc[open] summary{color:#fff;margin-bottom:6px;border-radius:8px;background:#7c3aed}
.acc-cnt{color:#666;font-size:11px}
.acc[open] summary .acc-cnt{color:#fff}
/* 聚落视图：圆角矩形大按钮（min/max-width）+ 点击展开容器手风琴 */
.settle-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.settle-btn{display:inline-flex;align-items:center;gap:6px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:10px;padding:10px 14px;cursor:pointer;min-width:170px;max-width:320px;font-size:13px;color:#ccc;user-select:none;transition:all .15s;box-sizing:border-box}
.settle-btn:hover{background:#1d1d29;color:#fff;border-color:#a78bfa88}
.settle-btn.active{background:#2a2340;border-color:#a78bfa;color:#fff}
.settle-btn .settle-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.settle-btn .settle-coord{opacity:.6;font-size:11px;white-space:nowrap}
.settle-btn .settle-cnt{font-size:11px;color:#666;white-space:nowrap}
.settle-btn.active .settle-cnt{color:#fff}
.settle-btn.scattered{opacity:.75}
.settle-btn.nosettle{opacity:.6}
.settle-cluster{display:flex;gap:0;align-items:flex-start;vertical-align:top;border:1px solid #2a2a3a;border-radius:10px;overflow:hidden;background:#1a1a24;flex:1 1 400px;max-width:598px;min-width:0}
.settle-cluster-main{position:relative;display:flex;flex-direction:column;align-items:stretch;flex:0 0 50%;min-width:0;padding:6px}
.settle-cluster-main .settle-map{position:relative;border-radius:6px;overflow:hidden;line-height:0;background:#0f0f16}
.settle-cluster-main .settle-map img{width:100%;height:auto;display:block}
.settle-cluster-main .settle-map .settle-dot.cluster-zone{position:absolute;border-radius:50%;background:rgba(248,113,113,.28);border:2px solid rgba(248,113,113,.85);box-shadow:0 0 6px rgba(0,0,0,.8);pointer-events:none}
.settle-cluster-side{display:flex;flex-direction:column;gap:4px;padding:6px 6px 6px 0;flex:1 1 auto;min-width:0}

<script>

// 旧架构行为完全不变（LB_ASA='/local/asa-data'、LB_API='' 相对路径）；新架构自动切 data 子域
(function(){try{if(/iPhone|iPad|iPod/i.test(navigator.userAgent||''))document.documentElement.classList.add('ios');}catch(e){}})(); // v644：iOS 性别基线标记
var LB_ARCH = (location.hostname || '').indexOf('whiterober.ccwu.cc') >= 0 ? 'new' : 'old';
// 静态资源（汉化/图标/颜色 6 个 JSON，平铺于 CF Pages 根目录）：新架构走 CF Pages 同域（dino.whiterober.ccwu.cc），全国边缘缓存；旧架构走 HA /local/asa-data
var LB_ASA = LB_ARCH === 'new' ? 'https://dino.whiterober.ccwu.cc' : '/local/asa-data';
// 状态文件（refresh_status/wild_status，后端动态写入）：新架构走 data 域后端；旧架构走 HA /local/asa-data
var LB_STATUS = LB_ARCH === 'new' ? 'https://data.whiterober.ccwu.cc/asa-data' : '/local/asa-data';
var LB_API = LB_ARCH === 'new' ? 'https://data.whiterober.ccwu.cc' : '';
// 页面版本号：每次部署递增（静态资源缓存参数 ?v= 用；打包脚本据此生成 dino-import.version 供版本自检对比）
// 2026-08-28 v351：递增版本号触发全玩家更新（洞穴种过滤等旧版用户强制刷新）；同时作为静态 JSON ?v= 缓存失效键
var LB_VERSION = 'v20260905-793';

if ('serviceWorker' in navigator) {

var selectedFile = null, parsedData = null;
var ASB_DB = null;

var ZH_READY = authFetch(LB_ASA + '/icon_zh_map.json?v='+LB_VERSION, {}).then(function(r){return r.json();}).then(function(d){ ZH_MAP = d; }).catch(function(e){ console.log('ZH fail:', e); });

var LB_GENE_ZH = {};
var GENE_ZH_READY = authFetch(LB_ASA + '/gene_traits_zh.json?v='+LB_VERSION, {}).then(function(r){return r.json();}).then(function(d){ LB_GENE_ZH = d||{}; }).catch(function(e){ console.log('GENE ZH fail:', e); });
// v134：基因词条统一翻译（生物 PascalCase / 设备小写，同一字典；同源翻译原则）
function geneCn(trait){
  if(!trait) return '未知基因';
  return LB_GENE_ZH[trait] || LB_GENE_ZH[trait.toLowerCase()] || trait;

// v134：基因来源物种翻译（后端 species 英文 → zhName 中文；未命中返回英文）
// v209：基因物种中文——dinoClass（蓝图类名）优先 → species 英文名 lbSpName（选物种方法）→ lbZhDeep 深度翻译（汉化 JSON 词条）
function geneSpeciesCn(species, dinoClass){
  if(dinoClass){
    var nm0 = lbSpName(dinoClass);
    if(nm0 && nm0.zh) return nm0.zh;
  }
  if(species){
    var nm = lbSpName(species);
    if(nm && nm.zh) return nm.zh;
    var deep = lbZhWithPrefix(species) || lbZhDeep(species);
    if(deep) return deep;
  }
  return species || '';

// ====== 加载 ASB 物种数据库（合并 values.json + ASA-values.json） ======
function loadASB() {
  return Promise.all([
    authFetch(LB_ASA + '/values.json?v='+LB_VERSION, {}).then(function(r){return r.json();}),
    authFetch(LB_ASA + '/ASA-values.json?v='+LB_VERSION, {}).then(function(r){return r.json();}).catch(function(){ return null; })

    return ASB_DB;

function findSpecies(bp) {
  if (!ASB_DB || !ASB_DB._byBp) return null;
  return ASB_DB._byBp[bp] || ASB_DB._byBp[bp.replace(/_C$/, '')] || null;
}
// 速查页按短类名匹配物种（blueprintPath 是完整路径，dinoClass 是短名）
// v598：加缓存——lbSpeciesMatch 对 6776 recs 每条调用 findSpeciesByClass 两次，无缓存时每次遍历数千 key×4 循环 → 切换属性按钮巨卡
var LB_FSBC_CACHE = {};
function findSpeciesByClass(dinoClass){
  if(!ASB_DB || !ASB_DB._byBp || !dinoClass) return null;
  if(LB_FSBC_CACHE[dinoClass] !== undefined) return LB_FSBC_CACHE[dinoClass];
  var c = dinoClass.replace(/_C$/, '');
  var direct = ASB_DB._byBp[dinoClass] || ASB_DB._byBp[c];
  var out = direct || null;
  if(!out){
    // 第一优先：精确蓝图节点（路径段 `/名.` 后跟点号，排除 _Gauntlet/_Aberrant/_Corrupt 等变体路径）
    // 修复：Bigfoot_Character_BP_C 实为 Gigantopithecus（巨猿），之前被 .Bigfoot_Character_BP 前缀误配到 Gauntlet→Yeti
    for (var key0 in ASB_DB._byBp) {
      if (key0.indexOf('/' + c + '.') >= 0){ out = ASB_DB._byBp[key0]; break; }
    }
    if(!out){
      for (var key in ASB_DB._byBp) {
        if (key.indexOf('.' + c) >= 0){ out = ASB_DB._byBp[key]; break; }
      }
    }
    if(!out){
      for (var key2 in ASB_DB._byBp) {
        if (key2.indexOf('/' + c) >= 0 || key2.indexOf(c) >= 0){ out = ASB_DB._byBp[key2]; break; }
      }
    }
  }
  LB_FSBC_CACHE[dinoClass] = out;
  return out;
}

// v575：物种筛选统一匹配——恐龙 dinoClass=蓝图类名（如 Rex_Character_BP_C），蛋/胚胎 dinoClass=物种英文短名（如 Rex）
// v576：ASB name 是完整名（如 Carcharodontosaurus）而蛋 dinoClass 是短名（Carcha）——改用 findSpeciesByClass 归一为同一 ASB 物种对象比较
function lbSpeciesMatch(r, cls){
  if(!cls) return true;
  if(r.dinoClass === cls) return true;
  // v756-P1b2：条件放宽含 _isEgg —— 恐爪龙等 Val/Gen 巢蛋走 source='wild' 通道（v755 只认 egg/embryo 漏 27 只）；成年野生 dinoClass 含 _Character_BP 被正则排除，零回归
  if((r._isEgg || r.source==='egg' || r.source==='embryo') && !/Character_BP|Char_BP/.test(String(r.dinoClass||''))){
    var _c1 = String(r.dinoClass).split('_Character_BP')[0].toLowerCase();
    var _c2 = String(cls).split('_Character_BP')[0].toLowerCase();
    if(_c1 && _c2 && (_c1===_c2 || _c2.indexOf(_c1)>=0 || _c1.indexOf(_c2)>=0)) return true;
  }
  var a = findSpeciesByClass(r.dinoClass);
  if(!a && (r.source==='egg'||r.source==='embryo') && /_(XSmall|Small|Medium|Large)$/.test(r.dinoClass||'')){
    // v593：蛋品质变体（风行蜥 Maelizard_Small 等）→ 去品质后缀再查（兜底）
    a = findSpeciesByClass(String(r.dinoClass).replace(/_(XSmall|Small|Medium|Large)$/,''));
  }
  var b = findSpeciesByClass(cls);
  return !!(a && b && a === b);
}

// 查中文名：蓝图代码 → 中文名（提取括号前部分），无映射返回 null
function zhName(engCode) {
  if (!engCode) return null;
  var v = ZH_MAP[engCode.toLowerCase()] || '';
  if (!v) return null;
  var m = v.match(/^(.+?)[\[\(（]/);
  return m ? m[1] : v;
}

// 深度中文查询：同义词→原样→括号剥离→key 变体（去空格/连字符/下划线）→次词剥离（覆盖 ZH_MAP key 格式差异）
function lbZhDeep(eng){
  if(!eng) return '';
  if(LB_ZH_SYNONYM[eng]){ var sv=zhName(LB_ZH_SYNONYM[eng]); if(sv) return sv; }
  var v=zhName(eng); if(v) return v;
  var noBr=eng.replace(/\s*\(.*\)$/,'');
  if(noBr!==eng){ v=zhName(noBr); if(v) return v; }
  var norm=eng.replace(/[_\s-]/g,'');
  if(norm!==eng){ v=zhName(norm); if(v) return v; }
  var normBr=noBr.replace(/[_\s-]/g,'');
  if(normBr!==noBr && normBr!==norm){ v=zhName(normBr); if(v) return v; }
  var parts=eng.split(/\s+/);
  if(parts.length>1){
    var drop=parts.slice(0,-1).join(' ');
    v=zhName(drop); if(v) return v;
    var dropN=drop.replace(/[_\s-]/g,'');
    if(dropN!==drop){ v=zhName(dropN); if(v) return v; }
  }
  return '';
}

      var opts = allOptions[si];
      var ndp = {};
      for (var sStr in dp) {
        var s = parseInt(sStr);
        var prev = dp[sStr];
        for (var oi = 0; oi < opts.length; oi++) {
          var opt = opts[oi];
          var ns = s + opt.w;
          if (ns > MAX_S) continue;
          var nd = prev.diff + opt.diff;
          var nk = String(ns);
          if (!(nk in ndp) || nd < ndp[nk].diff) {
            var nwl={};for(var kk in prev.wl)nwl[kk]=prev.wl[kk];
            var ndl={};for(var kk in prev.dl)ndl[kk]=prev.dl[kk];
            nwl[k]=opt.w; ndl[k]=opt.d;
            ndp[nk]={wl:nwl,dl:ndl,diff:nd};
          }
        }
      }
      dp = ndp;
    }
    
    // 收集候选
    var avgW = tw / 6;
    var candidates = [];
    for (var sStr in dp) {
      var s = parseInt(sStr);
      var cur = dp[sStr];
      var cand = {wildLevels:{},domLevels:{},sumW:s,diff:cur.diff};
      for (var ki = 0; ki < dpKeys.length; ki++) {
        var k = dpKeys[ki];
        cand.wildLevels[k]=cur.wl[k]||0;
        cand.domLevels[k]=cur.dl[k]||0;
      }
      cand.wildLevels.food = Math.max(0, tw - s);
      cand.domLevels.food = 0;
      var knownDom = 0;
      for (var ki = 0; ki < dpKeys.length; ki++) knownDom += (cur.dl[dpKeys[ki]]||0);
      if (td > knownDom) cand.domLevels.food = td - knownDom;
      cand.wildLevels.torpidity=0; cand.domLevels.torpidity=0;
      cand.wildLevels.speed_multiplier=0; cand.domLevels.speed_multiplier=0;
      var balance=0, domStats=0, totalDomCand=0;
      var ak = dpKeys.concat(['food']);
      for (var kj=0;kj<ak.length;kj++){
        balance += Math.abs((cand.wildLevels[ak[kj]]||0)-avgW);
        if ((cand.domLevels[ak[kj]]||0)>0) domStats++;
        totalDomCand += (cand.domLevels[ak[kj]]||0);
      }
      // 食物值校验：不匹配则丢弃候选
      if (statsByName.food != null && fsr[4]) {
        var fv = calcStatValue(species, 4, cand.wildLevels.food, 0, cand.domLevels.food, dom, TE_max, imprint||0);
        var ftol = Math.max(1.0, statsByName.food * 0.0006);
        if (Math.abs(fv - statsByName.food) > ftol) continue;
      }
      cand.score = balance*0.3 + totalDomCand*4 + domStats*16 + cand.diff;
      candidates.push(cand);
    }
    candidates.sort(function(a,b){return a.score-b.score;});
    return candidates.slice(0,10);
  }
  
  // 主流程：遍历 totalW 候选，取最优有解
  var topCandidates = [];
  var best = null, bestTw = 0, bestTd = 0;
  for (var ci = 0; ci < totalWCands.length; ci++) {
    var cands = runDP(totalWCands[ci].tw, totalWCands[ci].td);
    if (cands && cands.length && cands[0].diff < 1000) { // diff<1000 才视为真解（拒绝无匹配假解）
      if (!best || cands[0].score < best.score) {
        best = cands[0];
        bestTw = totalWCands[ci].tw;
        bestTd = totalWCands[ci].td;
        topCandidates = cands;
      }
    }
  }
  var result = best || {wildLevels:{},domLevels:{},sumW:0,diff:0};
  result.candidates = topCandidates;
  result._totalFromTorp = baseTotalW;  // torpidity 反推的总等级（含驯服奖励）
  result._totalDom = baseTotalDom;
  result._fallback = (baseTotalW > (charLevel||0) - 1); // 是否走了眩晕矛盾枚举
  return result;
}

// 统一 fetch 包装：绕过 Chrome 对 URL 凭据的 fetch() 限制
// ① 解析 URL 内嵌凭据（user:pass@）→ 生成 Authorization: Basic 头
// ② 剥离 URL 中的凭据（Chrome 禁止 fetch/XHR 携带 URL 凭据，会剥离导致 401）
function authFetch(url, opts) {
  opts = opts || {};
  var m = url.match(/^([a-z]+:\/\/)([^@\/]+)@/i);
  if (m) {
    var b64;
    try { b64 = btoa(decodeURIComponent(m[2])); } catch (e2) { b64 = btoa(m[2]); }
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = 'Basic ' + b64;
    url = m[1] + url.slice(m[0].length);
  }
  opts.credentials = 'include';
  return fetch(url, opts).catch(function(e) {
    // Chrome 禁止从含凭据的 URL 构造 fetch 请求 → 降级到 XHR
    if (e.message && e.message.indexOf('credentials') !== -1) {
      return new Promise(function(resolve, reject) {
        var xhr = new XMLHttpRequest();
        xhr.open(opts.method || 'GET', url, true);
        xhr.withCredentials = true;
        if (opts.headers) {
          for (var k in opts.headers) { if (opts.headers.hasOwnProperty(k)) xhr.setRequestHeader(k, opts.headers[k]); }
        }
        xhr.responseType = opts._responseType || '';
        xhr.onload = function() {
          resolve({ status: xhr.status, ok: xhr.status>=200 && xhr.status<300,
            text: function(){ return Promise.resolve(xhr.responseText); },
            json: function(){ return Promise.resolve(JSON.parse(xhr.responseText)); },
            _xhr: xhr });
        };
        xhr.onerror = function(){ reject(new Error('XHR failed')); };
        xhr.send(opts.body || null);
      });
    }
    throw e;
  });
}

async function refreshFiles() {
  var list = document.getElementById('fileList');
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">加载中...</div>';
  try {
    var body = '<?xml version="1.0"?><D:propfind xmlns:D="DAV:"><D:prop><D:getcontentlength/><D:getlastmodified/><D:resourcetype/></D:prop></D:propfind>';
    var res = await authFetch(DINO_DATA, { method: 'PROPFIND', headers: { 'Depth': '1' }, body: body });
    if (res.status === 401) { document.getElementById('fileList').innerHTML = '<div style="text-align:center;padding:20px;color:#f87171">🔐 认证失败<br><small>请取消并刷新页面重新登录</small></div>'; return; }
    if (res.status !== 207) throw new Error('WebDAV ' + res.status);
    var xml = await res.text();
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    var resp = doc.getElementsByTagNameNS('DAV:', 'response');
    var files = [];
    for (var i = 0; i < resp.length; i++) {
      var r = resp[i];
      var href = (r.getElementsByTagNameNS('DAV:', 'href')[0] || {}).textContent || '';
      var size = (r.getElementsByTagNameNS('DAV:', 'getcontentlength')[0] || {}).textContent;
      var date = (r.getElementsByTagNameNS('DAV:', 'getlastmodified')[0] || {}).textContent;
      var rt = r.getElementsByTagNameNS('DAV:', 'resourcetype')[0];
      var isCol = rt && rt.getElementsByTagNameNS('DAV:', 'collection').length > 0;
      var name = decodeURIComponent(href.split('/').filter(Boolean).pop() || '');
      if (!name || isCol || !name.toLowerCase().endsWith('.ini')) continue;
      files.push({ name: name, size: parseInt(size) || 0, date: date || '' });
    }
    if (files.length === 0) { list.innerHTML = '<div style="text-align:center;padding:20px;color:#555">😕 没有 .ini 文件</div>'; return; }
    // 解析日期并排序（按时间倒序）
    files.forEach(function(f) {
      f._ts = f.date ? new Date(f.date).getTime() : 0;
    });
    files.sort(function(a, b) { return b._ts - a._ts; });
    // 按时间间隔分组（>10 分钟切新组）
    var groups = [];
    var cur = null;
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!cur || (cur._lastTs && cur._lastTs - f._ts > 600000)) {
        cur = { files: [], _lastTs: 0 };
        groups.push(cur);
      }
      cur.files.push(f);
      cur._lastTs = Math.max(cur._lastTs, f._ts);
    }
    // 渲染分组
    var html = '';
    // 存储分组数据供删除使用
    window._fileGroups = groups;
    for (var gi = 0; gi < groups.length; gi++) {
      var g = groups[gi];
      var first = g.files[0], last = g.files[g.files.length-1];
      var fmt = function(ts) { var d=new Date(ts); return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); };
      var timeLabel = fmt(first._ts) + ' ~ ' + fmt(last._ts);
      var isLatest = gi === 0;
      var delBtn = isLatest ? '' : ' <button onclick="event.stopPropagation();deleteGroup(' + gi + ')" style="float:right;background:none;border:none;color:#ef4444;padding:2px 4px;border-radius:4px;font-size:10px;cursor:pointer;line-height:1" title="删除本组全部文件"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14"/></svg></button>';
      html += '<details class="file-group" id="fg-' + gi + '"' + (isLatest ? ' open' : '') + ' ontoggle="if(this.open)closeOtherGroups(' + gi + ')"' + '>'
        + '<summary style="cursor:pointer;padding:6px 10px;background:#1e1e32;border-radius:8px;margin:6px 0;font-size:12px;color:#999;list-style:disc">'
        + timeLabel + ' <span style="opacity:.5">|</span> ' + g.files.length + ' 个文件' + delBtn + '</summary>';
      for (var fi = 0; fi < g.files.length; fi++) {
        var f = g.files[fi];
        var shortDate = f.date ? f.date.replace(/ GMT.*/, '').replace(/^\w+, /, '') : '';
        html += '<div class="file-item" id="fi-' + encodeURIComponent(f.name) + '" onclick="selectFile(\'' + escapeHtml(f.name) + '\',' + f.size + ')">'

          + '<span class="fi-level" style="color:#7c3aed;font-weight:600"></span>  '

          + '<span class="fi-stage" style="font-size:10px;padding:1px 5px;border-radius:3px;vertical-align:middle;margin-left:4px"></span>'
          + '</div>'

}

// 删除分组内所有文件
async function deleteGroup(gi) {
  var g = window._fileGroups && window._fileGroups[gi];
  if (!g || !g.files || g.files.length === 0) return;
  if (!confirm('确认删除 ' + g.files.length + ' 个文件？\n此操作不可撤销。')) return;
  var ok = 0, fail = 0;
  for (var i = 0; i < g.files.length; i++) {
    try {
      var res = await authFetch(DINO_DATA + g.files[i].name, { method: 'DELETE' });
      if (res.ok || res.status === 204) ok++; else fail++;
    } catch(e) { fail++; }
  }
  // 移除 DOM
  var el = document.getElementById('fg-' + gi);
  if (el) el.remove();
  // 清理选中状态
  if (selectedFile && g.files.some(function(f){return f.name===selectedFile;})) {
    selectedFile = null; parsedData = null;
    document.getElementById('previewCard').style.display = 'none';
    showRightPlaceholder(true);
  }
  showStatus('info', '🗑 已删除 ' + ok + ' 个文件' + (fail > 0 ? '，' + fail + ' 个失败' : ''));
  setTimeout(function(){ showStatus('', ''); }, 3000);
}

// 异步加载文件头部元数据（物种/名称/等级）
async function loadFileMeta(filename) {
  try {
    var res = await authFetch(DINO_DATA + filename, {});
    if (!res.ok) return;
    var text = await res.text();
    var lines = text.split(/\r?\n/);
    var species = '', dinoBp = '', dinoName = '', level = '', sex = '', babyAge = -1, section = '';
    for (var i = 0; i < lines.length && i < 30; i++) {
      var l = lines[i].trim();
      var sec = l.match(/^\[(.+)\]$/);
      if (sec) { section = sec[1]; continue; }
      var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
      if (!m) continue;
      var k = m[1].trim(), v = m[2].trim();
      if (section === 'Dino Data') {
        if (k === 'DinoClass') { dinoBp = v; species = v.split('/').pop().split('.')[0].split('_')[0]; }
        else if (k === 'DinoNameTag' && v) dinoName = v;
        else if (k === 'TamedName' && v) dinoName = v;
        else if (k === 'CharacterLevel') level = v;
        else if (k === 'bIsFemale') sex = (v === 'True') ? 'F' : 'M';
        else if (k === 'BabyAge') babyAge = parseFloat(v);
        if (species && dinoName && level) break;
      }
    }
    var el = document.getElementById('fi-' + encodeURIComponent(filename));
    if (el) {
      var sp = el.querySelector('.fi-species');
      var nm = el.querySelector('.fi-name');
      var lv = el.querySelector('.fi-level');
      var sx = el.querySelector('.fi-sex');
      var sg = el.querySelector('.fi-stage');
      if (sp) {
        await ZH_READY;
        // 用 ASB 真实物种名替代蓝图代号
        var engName = species;
        if (dinoBp) { var asbSp = findSpecies(dinoBp); if (asbSp && asbSp.name) engName = asbSp.name; }
        var zh = zhName(species) || zhName(engName);
        sp.textContent = zh ? zh + ' (' + engName + ')' : engName;
      }
      if (nm) nm.textContent = dinoName || '-';
      if (lv) lv.textContent = level ? 'Lv.' + level : '';
      if (sx) {
        sx.textContent = sex === 'F' ? '♀' : (sex === 'M' ? '♂' : '');
        sx.style.color = sex === 'F' ? '#f472b6' : '#60a5fa';
      }
      if (sg && babyAge >= 0) {
        var stage, sc;
        if (babyAge < 0.1) { stage = '婴儿'; sc = '#4ade80'; }
        else if (babyAge < 0.5) { stage = '幼崽'; sc = '#facc15'; }
        else if (babyAge < 1.0) { stage = '青年'; sc = '#fb923c'; }
        else { stage = ''; sc = ''; }
        if (stage) { sg.textContent = stage; sg.style.background = sc+'22'; sg.style.color = sc; sg.style.border = '1px solid '+sc+'44'; }
        else { sg.style.display = 'none'; }
      }
    }
  } catch(e) { /* skip */ }
}

function findColorId(r, g, b) {
  var best = 0, bestD = Infinity;
  for (var i = 0; i < ARK_COLORS.length; i++) {
    var c = ARK_COLORS[i];
    var dr = r - c[1], dg = g - c[2], db = b - c[3];
    var d = dr*dr + dg*dg + db*db;
    if (d < bestD) { bestD = d; best = c[0]; }
  }
  return best;
}

async function selectFile(name) {
  // 点击已选中项 → 取消选中
  if (selectedFile === name) {
    var items = document.querySelectorAll('.file-item');
    for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
    setParseBtn(selectedFile, null); // 隐藏按钮
    selectedFile = null; parsedData = null;
    document.getElementById('teCard').style.display = 'none';
    document.getElementById('mutCard').style.display = 'none';
    document.getElementById('candCard').style.display = 'none';
    showRightPlaceholder(true);
    document.getElementById('statusArea').style.display = 'none';
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    closePreviewOverlay();
    return;
  }
  var items = document.querySelectorAll('.file-item');
  for (var i = 0; i < items.length; i++) items[i].classList.remove('selected');
  // 隐藏上一个文件的按钮
  if (selectedFile) setParseBtn(selectedFile, null);
  var el = document.getElementById('fi-' + encodeURIComponent(name));
  if (el) el.classList.add('selected');
  selectedFile = name;
  
  // 显示加载态按钮
  setParseBtn(name, 'loading');
  showStatus('info', '');
  try {
    var res = await authFetch(DINO_DATA + name, {});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    parsedData = parseIni(await res.text(), name);
    showRightPlaceholder(false);
    var matched = parsedData.blueprint ? true : false;
    setParseBtn(name, matched ? 'ok' : 'err');
    // 自动判断训/繁
    var isBred = isBredDino(parsedData);
    setBioType(isBred ? 'bred' : 'tamed');
    _mutValues = {health:0, stamina:0, oxygen:0, food:0, weight:0, melee_damage_multiplier:0};
    _editingKey = null;
    renderMutGrid();
    // 更新变异标题
    var totalMut = (parsedData.matMutations||0) + (parsedData.patMutations||0);
    var mutTitle = document.getElementById('mutTitle');
    if (mutTitle) {
      mutTitle.innerHTML = '🧬 变异 (Mutations)';
      if (totalMut > 0) mutTitle.innerHTML += ' <span style="font-size:11px;color:#888">母' + (parsedData.matMutations||0) + '/父' + (parsedData.patMutations||0) + '=Σ' + totalMut + '</span>';
    }
    // 重置 TE 输入框
    document.getElementById('teMin').value = isBred ? '100' : '95';
    document.getElementById('teMax').value = '100';
    showStatus('info', '');
    document.getElementById('statusArea').style.display = 'none';
    showCandidates(parsedData);
  } catch (e) {
    setParseBtn(name, 'err');
    document.getElementById('statusArea').style.display = '';
    showStatus('error', '❌ ' + e.message); parsedData = null; showRightPlaceholder(true); }
}

function parseIni(t, fn) {
  var r = { stats: [], _filename: fn, colors: [], ancestors: [] };
  var section = '';
  var statMap = {
    '生命值':'health', '耐力':'stamina', '氧气':'oxygen', '氧氣':'oxygen',
    '食物':'food', '负重':'weight', '重量':'weight',
    '近战伤害':'melee_damage_multiplier', '移动速度':'speed_multiplier',
    '眩暈':'torpidity', '眩晕':'torpidity',
    '水':'water', '溫度':'temperature', '温度':'temperature',
    '抗性':'fortitude', '制作技能':'crafting'
  };
  
  t.split(/\r?\n/).forEach(function(l) {
    l = l.trim();
    if (!l || l[0] === ';') return;
    
    var sec = l.match(/^\[(.+)\]$/);
    if (sec) { section = sec[1]; return; }
    
    var m = l.match(/^([^=]+?)\s*=\s*(.*)$/);
    if (!m) return;
    var k = m[1].trim(), v = m[2].trim();
    
    if (section === 'Dino Data') {
      if (k === 'DinoID1') r.dinoId1 = v;
      else if (k === 'DinoID2') r.dinoId2 = v;
      else if (k === 'DinoClass') { r.dinoClassFull = v; var parts = v.split('/').pop().split('.'); r.blueprint = parts.length > 1 ? parts[1] : parts[0]; }
      else if (k === 'DinoNameTag') r.nameTag = v;
      else if (k === 'CharacterLevel') r.level = parseInt(v) || 0;
      else if (k === 'bIsFemale') r.sex = (v === 'True') ? 'female' : 'male';
      else if (k === 'bNeutered') r.isNeutered = (v === 'True');
      else if (k === 'TamerString') r.tamer = v || null;
      else if (k === 'TamedName' && v) r.name = v;
      else if (k === 'ImprinterName' && v) r.imprinter = v;
      else if (k === 'RandomMutationsMale') r.patMutations = parseInt(v) || 0;
      else if (k === 'RandomMutationsFemale') r.matMutations = parseInt(v) || 0;
      else if (k === 'DinoImprintingQuality') r.imprint = parseFloat(v);
      else if (k === 'BabyAge') r.babyAge = parseFloat(v);
    }
    
    if (section === 'Max Character Status Values') {
      var mapped = statMap[k];
      if (mapped) {
        r.statsByName = r.statsByName || {};
        var val = parseFloat(v) || 0;
        if (mapped === 'melee_damage_multiplier') val = val * 100;
        r.statsByName[mapped] = val;
      }
    }
    
    if (section === 'Colorization') {
      var cm = k.match(/^ColorSet\[(\d+)\]$/);
      if (cm) {
        var cv = v.match(/R=([\d.]+).*?G=([\d.]+).*?B=([\d.]+).*?A=([\d.]+)/);
        if (cv) r.colors[parseInt(cm[1])] = { r:parseFloat(cv[1]), g:parseFloat(cv[2]), b:parseFloat(cv[3]), a:parseFloat(cv[4]) };
      }
    }
    
    if (section === 'Dino Ancestry') {
      if (k === 'DinoAncestorsCount') r.ancestorCount = parseInt(v) || 0;
      else if (k === 'DinoAncestorsMale') r.ancestorMale = parseInt(v) || 0;
    }
    
    if (section === 'DinoAncestors' || section === 'DinoAncestorsMale') {
      if (v) r.ancestors.push({ type: section, data: v });
    }
  });
  
  if (r.statsByName) {
    var sv = ['health','stamina','oxygen','food','weight','melee_damage_multiplier','speed_multiplier'];
    for (var i = 0; i < sv.length; i++) r.stats[i] = r.statsByName[sv[i]] || 0;
  }
  return r;
}

function showCandidates(d) {
  if (!ASB_DB || !d.dinoClassFull || !d.statsByName) { document.getElementById('candCard').style.display = 'none'; return; }
  var bp = d.dinoClassFull.replace(/_C$/,'');
  var sp = findSpecies(bp);
  if (!sp || !sp.fullStatsRaw) { document.getElementById('candCard').style.display = 'none'; return; }
  var ctype = d.imprinter ? 'bred' : (d.tamer ? 'tamed' : 'tamed');
  var teMin = 100, teMax = 100;
  if (ctype === 'tamed') {
    teMin = parseFloat(document.getElementById('teMin').value)||95;
    teMax = parseFloat(document.getElementById('teMax').value)||100;
  }
  var lvls = solveLevels(sp, d.statsByName, teMin/100, teMax/100, ctype, d.level, d.imprint);
  if (!lvls || !lvls.candidates) { document.getElementById('candCard').style.display = 'none'; return; }
  
  var cands = lvls.candidates;
  var totalFromTorp = lvls._totalFromTorp || 0;
  var isBred = _bioType === 'bred';
  // 按 TE 拆分：野 = total/(1+TE/2), 奖 = total-野, 加 = charLevel-1-total
  var teSplit = (teMax/100) / 2;
  var wildBase = Math.round(totalFromTorp / (1 + teSplit));
  var bonusBase = totalFromTorp - wildBase;
  var xpBase = Math.max(0, (d.level||1) - 1 - totalFromTorp);
  var keys = ['health','stamina','oxygen','food','weight','melee_damage_multiplier'];
  var abbr = ['血','耐','氧','食','重','攻'];
  var h = '<div class="cand-row" style="background:#111;color:#666;font-size:10px;cursor:default">';
  h += '<span class="cand-num">#</span>';
  for (var ki = 0; ki < keys.length; ki++) h += '<span class="cand-stat">' + abbr[ki] + '</span>';
  if (isBred) {
    h += '<span style="display:inline-flex;gap:4px;margin-left:auto"><span class="cand-score">Σ承</span><span class="cand-score">Σ加</span></span><span style="width:13px;margin-left:2px"></span></div>';
  } else {
    h += '<span style="display:inline-flex;gap:4px;margin-left:auto"><span class="cand-score">Σ野</span><span class="cand-score">Σ奖</span><span class="cand-score">Σ加</span></span><span style="width:13px;margin-left:2px"></span></div>';
  }
  for (var ci = 0; ci < cands.length; ci++) {
    var c = cands[ci];
    h += '<div class="cand-row" onclick="selectCandidate(' + ci + ')" id="candRow' + ci + '">';
    h += '<span class="cand-num">#' + (ci+1) + '</span>';
    for (var kj = 0; kj < keys.length; kj++) {
      var k = keys[kj];
      var mutCls = (_mutValues[k] > 0) ? 'cm' : 'cw';
      h += '<span class="cand-stat"><span class="' + mutCls + '">' + (c.wildLevels[k]||0) + '</span>';
      if (c.domLevels[k]) h += '<span class="cd">+' + c.domLevels[k] + '</span>';
      h += '</span>';
    }
    if (isBred) {
      h += '<span style="display:inline-flex;gap:4px;margin-left:auto">'
        + '<span class="cand-score">Σ' + (totalFromTorp+1) + '</span>'
        + '<span class="cand-score">Σ' + xpBase + '</span></span>'
        + '<span class="cand-info" onclick="event.stopPropagation();toggleLevelInfo(event,' + (d.level||0) + ',1,' + totalFromTorp + ',0,' + xpBase + ',true)" style="cursor:pointer;color:#666;line-height:0;margin-left:2px" title="等级构成"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg></span></div>';
    } else {
      h += '<span style="display:inline-flex;gap:4px;margin-left:auto">'
        + '<span class="cand-score">Σ' + (wildBase+1) + '</span>'
        + '<span class="cand-score">Σ' + bonusBase + '</span>'
        + '<span class="cand-score">Σ' + xpBase + '</span></span>'
        + '<span class="cand-info" onclick="event.stopPropagation();toggleLevelInfo(event,' + (d.level||0) + ',1,' + wildBase + ',' + bonusBase + ',' + xpBase + ',false)" style="cursor:pointer;color:#666;line-height:0;margin-left:2px" title="等级构成"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 118 2.83M22 12A10 10 0 0012 2v10z"/></svg></span></div>';
    }
  }
  document.getElementById('candList').innerHTML = h;
  document.getElementById('candCount').textContent = '(' + cands.length + '个)';
  document.getElementById('candCard').style.display = '';
  parsedData._candidates = cands;
  selectedCandidate = cands[0];
  selectCandidate(0);
}

var _mutLabels = {health:'血',stamina:'耐',oxygen:'氧',food:'食',weight:'重',melee_damage_multiplier:'攻'};
var _editingKey = null;

function renderMutGrid() {
  var grid = document.getElementById('mutGrid');
  if (!grid) return;
  var keys = ['health','stamina','oxygen','food','weight','melee_damage_multiplier'];
  var h = '';
  if (_editingKey) {
    // 编辑态：只显示正在编辑的那个输入框
    var v = _mutValues[_editingKey] || 0;
    h += '<span class="mut-chip editing">'
      + '<span style="font-size:11px;color:#888;flex-shrink:0">' + _mutLabels[_editingKey] + '</span>'
      + '<input type="number" id="mutEditInp" value="' + v + '" min="0" max="255" onkeydown="if(event.key===\'Enter\')confirmMutEdit(\'' + _editingKey + '\')">'
      + '<svg onclick="confirmMutEdit(\'' + _editingKey + '\')" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" style="cursor:pointer;flex-shrink:0"><path d="M5 13l4 4L19 7"/></svg>'
      + '<svg onclick="cancelMutEdit()" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="3" style="cursor:pointer;flex-shrink:0"><path d="M18 6L6 18M6 6l12 12"/></svg>'
      + '</span>';
  } else {
    // 普通态：显示所有标签
    for (var ki = 0; ki < keys.length; ki++) {
      var k = keys[ki];
      var v = _mutValues[k] || 0;
      var cls = v > 0 ? 'mut-chip has-val' : 'mut-chip';
      h += '<span class="' + cls + '" onclick="startMutEdit(\'' + k + '\')" title="' + (v>0?'当前 '+v+' 点':'点击输入') + '">'
        + _mutLabels[k]
        + (v > 0 ? ' <b style="font-size:12px">' + v + '</b>' : '')
        + '</span>';
    }
  }
  grid.innerHTML = h;
  if (_editingKey) {
    var inp = document.getElementById('mutEditInp');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function startMutEdit(key) {
  _editingKey = key;
  renderMutGrid();
}

function confirmMutEdit(key) {
  var inp = document.getElementById('mutEditInp');
  if (inp) {
    var v = parseInt(inp.value) || 0;
    _mutValues[key] = Math.max(0, Math.min(255, v));
  }
  _editingKey = null;
  renderMutGrid();
  if (parsedData) showCandidates(parsedData);
}

function cancelMutEdit() {
  _editingKey = null;
  renderMutGrid();
}

function renderPreviewContent(d) {
  var statLabels = {
    'health':'生命','stamina':'耐力','oxygen':'氧气','food':'食物','weight':'负重',
    'melee_damage_multiplier':'近战伤害','speed_multiplier':'移动速度','torpidity':'眩晕','water':'水',
    'temperature':'温度','fortitude':'抗性','crafting':'制作技能'
  };
  var h = '';
  var rows = [];
  rows.push(['文件', d._filename]);
  rows.push(['物种', d.blueprint||'?']);
  rows.push(['名称', d.name||d.nameTag||'-']);
  rows.push(['等级', d.level||'?']);
  rows.push(['性别', d.sex==='female'?'♀':'♂' + (d.isNeutered?' (已绝育)':'')]);
  if (d.imprinter) rows.push(['留痕人', d.imprinter]);
  if (typeof d.imprint === 'number') rows.push(['留痕度', (d.imprint*100).toFixed(1) + '%']);
  if (typeof d.babyAge === 'number') rows.push(['幼崽成长', (d.babyAge*100).toFixed(1) + '%']);
  if (d.tamer) rows.push(['驯服人', d.tamer]);
  rows.push(['突变(母/父)', (d.matMutations||0) + ' / ' + (d.patMutations||0)]);
  if (d.dinoId1 || d.dinoId2) rows.push(['Dino ID', (d.dinoId1||'?') + '/' + (d.dinoId2||'?')]);
  
  if (d.statsByName) {
    rows.push(['── 属性值 ──', '']);
    var order = ['health','stamina','torpidity','oxygen','food','water','temperature','weight','melee_damage_multiplier','speed_multiplier','fortitude','crafting'];
    for (var i = 0; i < order.length; i++) {
      var v = d.statsByName[order[i]];
      if (typeof v === 'number') rows.push([statLabels[order[i]]||order[i], v.toFixed(1)]);
    }
  }
  
  if (d.colors && d.colors.length > 0) {
    rows.push(['── 颜色区域 ──', '']);
    for (var i = 0; i < d.colors.length; i++) {
      if (d.colors[i]) {
        var c = d.colors[i];
        var cid = findColorId(c.r, c.g, c.b);
        rows.push(['Region ' + i, 'R:'+(c.r*255).toFixed(0)+' G:'+(c.g*255).toFixed(0)+' B:'+(c.b*255).toFixed(0)+' → ID:'+cid]);
      }
    }
  }
  
  if (d.ancestorCount > 0) {
    rows.push(['── 祖先 ──', '数量:' + d.ancestorCount + ' 雄性:' + (d.ancestorMale||0)]);
    for (var i = 0; i < d.ancestors.length; i++) {
      rows.push(['', d.ancestors[i].data]);
    }
  }
  
  for (var i = 0; i < rows.length; i++) {
    h += '<div class="row"><span class="label">' + escapeHtml(String(rows[i][0])) + '</span><span class="value">' + escapeHtml(String(rows[i][1])) + '</span></div>';
  }
  
  var isBred = isBredDino(d);
  setBioType(isBred ? 'bred' : 'tamed');
  
  var tag = document.getElementById('solverTag');
  if (ASB_DB && d.dinoClassFull) {
      var bp = d.dinoClassFull.replace(/_C$/,'');
      var sp = findSpecies(bp);
      tag.textContent = (sp && sp.name) ? ' [' + sp.name + ']' : ' [未匹配]';
  } else { tag.textContent = ''; }
  
  var matched = d.blueprint ? true : false;
  document.getElementById('parseStatus').innerHTML = matched
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="3" style="vertical-align:middle"><path d="M5 13l4 4L19 7"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="3" style="vertical-align:middle"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  document.getElementById('previewPopupContent').innerHTML = h;
  
  // 刷新变异显示
  renderMutGrid();
  
  var totalMut = (parsedData.matMutations||0) + (parsedData.patMutations||0);
  var mutTitle = document.getElementById('mutTitle');
  if (mutTitle) {
    mutTitle.innerHTML = '🧬 变异 (Mutations)';
    if (totalMut > 0) mutTitle.innerHTML += ' <span style="font-size:11px;color:#888">母' + (parsedData.matMutations||0) + '/父' + (parsedData.patMutations||0) + '=Σ' + totalMut + '</span>';
  }

function lbPrefetchOne(url){

    var _done = false;

      im.src = url;
    }catch(e){ clearTimeout(_timer); _fin(false); }
  });

function _lbPrefetchBody(){

      if(m.oceanImg) urls[LB_MAP_BASE + m.oceanImg + LB_MAP_EXT] = 1;
    });
  }

  return iconP.then(function(by){

    // 2026-08-28 提速：常用 GUI 优先（先下载先就绪，用户感知快）
    var priKeys = ['HubTameIcon','Cryopod','HubInventoryIcon','Feeding_Trough','Cryofridge','Gene_Storage','Gene_Scanner','Tek_Sleeping_Pod','Tek_Replicator','RW_wants_to_cuddle','RW_Tracking_dino','Display_Case','TEK_Icon','Egg_Incubator','Pet_Display','Vault'];
    var priUrls = {};
    if(by){ priKeys.forEach(function(n){ if(by[n] && urls[by[n]]){ priUrls[by[n]] = 1; } }); }
    var list = Object.keys(priUrls).concat(Object.keys(urls).filter(function(u){ return !priUrls[u]; }));
    var total = list.length, done = 0, idx = 0, shown = false;
    var CONC = 16; // v20260828：HTTP/2 多路复用下并发 16 提速（原 8，近 2 倍）
    // 延迟 300ms 显示进度条：全缓存瞬间完成则不打扰
    var showTimer = setTimeout(function(){ if(done < total){ shown = true; lbAssetProgShow(done, total); } }, 300);
    function maybeFinish(){
      if(shown) lbAssetProgShow(done, total);
      if(done >= total){
        if(showTimer) clearTimeout(showTimer);
        lbAssetProgHide();
        lbUpgradeAssets();
      }
    }
    function worker(){
      if(idx >= total) return; // 无任务，worker 结束
      var u = list[idx]; idx++;
      // 2026-08-28 省流：Cache Storage 持久缓存命中 → 跳过（不重复下载）
      lbAssetCache().then(function(cache){
        if(cache && cache.match){
          cache.match(u).then(function(hit){
            if(hit){ done++; maybeFinish(); worker(); return; }
            lbPrefetchOne(u).then(function(){ done++; maybeFinish(); worker(); });
          }).catch(function(){ lbPrefetchOne(u).then(function(){ done++; maybeFinish(); worker(); }); });
        } else {
          lbPrefetchOne(u).then(function(){ done++; maybeFinish(); worker(); });
        }
      }).catch(function(){
        lbPrefetchOne(u).then(function(){ done++; maybeFinish(); worker(); });

    for(var w=0; w<CONC && w<total; w++) worker();

// UE 坐标 → 地图像素百分比（clamp 0-100；按图片实际坐标范围归一化，无配置默认 0~100 全图）
// 2026-08-12：y 方向北在下；图片范围（lon/lat 边界）由 LB_MAP_INFO 配置（点击地标实测）
function lbWorldToPx(x, y, map){
  var lon = Number(x)/map.multLon + map.shiftLon;
  var lat = Number(y)/map.multLat + map.shiftLat;
  var lo0 = (map.lonMin!==undefined?map.lonMin:0), lo1 = (map.lonMax!==undefined?map.lonMax:100);
  var la0 = (map.latMin!==undefined?map.latMin:0), la1 = (map.latMax!==undefined?map.latMax:100);
  var px = Math.max(0, Math.min(100, (lon-lo0)/(lo1-lo0)*100));
  var py = Math.max(0, Math.min(100, (lat-la0)/(la1-la0)*100));
  return {x:px, y:py};
}

// v472：结构化返回集成解读——后端 result 为 JSON，逐字段转成玩家可读中文（不显示原始 JSON）
function lbSrvInterpret(r){
  if(!r || typeof r !== 'object') return '';
  var parts = [];
  if(r.tribeMode) parts.push('部落为单位');
  if(r.target !== undefined && r.target !== null && r.target !== '') parts.push('目标 ' + r.target);
  // 死亡包/尸体/墓碑（MoveDeathBag 类）
  var found = [];
  if(r.bagCount !== undefined) found.push('死亡包 ' + r.bagCount + ' 个');
  if(r.corpseCount !== undefined) found.push('尸体 ' + r.corpseCount + ' 具');
  if(r.tombCount !== undefined) found.push('墓碑 ' + r.tombCount + ' 座');
  if(found.length) parts.push('找到：' + found.join('、'));
  var proc = [];
  if(r.bagsMoved !== undefined) proc.push('转移死亡包 ' + r.bagsMoved + ' 个');
  if(r.corpsesMoved !== undefined) proc.push('转移尸体 ' + r.corpsesMoved + ' 具');
  if(r.refreshedInPlace !== undefined) proc.push('原地刷新 ' + r.refreshedInPlace + ' 个');
  if(r.skippedNearTomb !== undefined) proc.push('墓碑旁跳过 ' + r.skippedNearTomb + ' 个');
  if(r.emptySkipped !== undefined) proc.push('空包跳过 ' + r.emptySkipped + ' 个');
  if(proc.length) parts.push('处理：' + proc.join('、'));
  // 低温仓 pending（MoveAllPendings 类）
  var pen = [];
  if(r.pendingConsumed !== undefined) pen.push('已恢复低温仓 ' + r.pendingConsumed + ' 个');
  if(r.remaining !== undefined) pen.push('剩余 ' + r.remaining + ' 个');
  if(pen.length) parts.push('恢复：' + pen.join('、'));
  if(r.failed !== undefined && Number(r.failed) > 0) parts.push('失败 ' + r.failed + ' 个');
  if(Array.isArray(r.moved) && r.moved.length) parts.push('已转移明细 ' + r.moved.length + ' 项');
  return parts.join('；');
}

// PID/EOSID 身份解析（唯一允许用 name 的一次）：用 hass 登录名匹配 playersByEos[].name → 得 eosId → 角色 pid 列表
// 登录名匹配失败 → 先尝试强制刷新重试一次（旧缓存可能缺部分服务器 players）→ 仍失败才报错
// 强制刷新：清 IndexedDB 缓存 + 全量重拉所有服务器（解决旧缓存缺部分服务器 players）
function lbForceReload(){
  LB._cache = null;
  var list = document.getElementById('lbList');
  if(list) list.innerHTML = '<div style="text-align:center;padding:30px;color:#555">⏳ 数据不完整，正在强制刷新...</div>';
  return new Promise(function(resolve){
    lbCacheOpen().then(function(db){
      return new Promise(function(res2){
        try{
          var tx = db.transaction(LB_IDB_STORE, 'readwrite');
          tx.objectStore(LB_IDB_STORE).delete('latest');
          tx.oncomplete = res2; tx.onerror = res2;
        }catch(e){ res2(); }
      });
    }).catch(function(){}).then(function(){
      var sel = LB.SERVERS.map(function(s){ return s.abbr; });
      return lbLoad(sel).then(function(data){
        if(!data){ resolve(false); return; } // v215：被新下载取代
        LB._cache = { data: data, ts: Date.now() };
        lbCacheSet(data);
        resolve(true);
      }).catch(function(){ resolve(false); });
    });
  });
}
// 身份匹配失败报错（数据完整但仍未匹配到 → 明确提示）
function lbIdentityError(name){
  var el = document.getElementById('lbLoginBar');
  if(el){ el.style.display='block';
    el.innerHTML = '<span style="color:#f87171">⚠️ 账号「'+name+'」未关联任何游戏角色（players.name 未匹配），请联系管理员检查后端数据</span>'; }
  console.error('[PID] 登录名未匹配到玩家:', name);
  LB._identityResolved = true;
  LB.curPid = null;
}
function lbResolveIdentity(){
  if(!LB.autoPlayer || LB._needLogin) return true; // 未登录，无身份可解析
  var data = LB._cache && LB._cache.data;
  if(!data || !Array.isArray(data.players)) return false; // 数据未就绪
  var name = LB.autoPlayer.trim();
  var found = null;
  for(var i=0;i<data.players.length;i++){
    var ent = data.players[i];
    if(ent.name === name){ found = ent; break; }
  }
  if(!found){
    // 匹配失败：先判断是否数据不完整（players 未覆盖全部有 cryo 的服务器），若是则强制刷新重试一次
    if(!LB._identityRetried){
      LB._identityRetried = true;
      lbForceReload().then(function(ok){
        if(!ok){
          // 2026-08-28 修复：强制刷新被新下载取代（数据仍在下载中）→ 不立即弹错，
          // 等 3s 后重新解析（此时新下载大概率已完成并更新 LB._cache；若仍无该玩家名则数据完整后才弹错）
          setTimeout(function(){ lbResolveIdentity(); }, 3000);
          return;
        }
        else {
          // 重新解析（lbForceReload 已更新缓存）
          var d2 = LB._cache && LB._cache.data;
          if(d2 && Array.isArray(d2.players)){
            var f2 = null;
            for(var j=0;j<d2.players.length;j++){ if(d2.players[j].name === name){ f2=d2.players[j]; break; } }
            if(!f2) lbIdentityError(name);
            else {
              lbResolveIdentity(); // 走正常匹配分支
              lbView(); // 刷新视图到玩家视角
            }
          } else lbIdentityError(name);
        }
      });
      return true;
    }
    lbIdentityError(name);
    return true;
  }
  LB.playerEos = found.eosId;
  LB.playerRoles = Object.keys(found.roles||{}).map(function(pid){ return {pid: Number(pid)}; });
  // v316：防复现——名字匹配成功但 roles 为空（旧缓存 players 缺角色）→ 强制刷新重试一次
  if(LB.playerRoles.length === 0 && !LB._identityRetried){
    LB._identityRetried = true;
    lbForceReload().then(function(ok){
      if(!ok){
        // 2026-08-28 修复：同「匹配失败」——强制刷新被新下载取代时不立即弹错，等数据下载完再判断
        setTimeout(function(){ lbResolveIdentity(); }, 3000);
        return;
      }
      var d2 = LB._cache && LB._cache.data;
      if(d2 && Array.isArray(d2.players)){
        var f2 = null;
        for(var j=0;j<d2.players.length;j++){ if(d2.players[j].name === name){ f2=d2.players[j]; break; } }
        if(!f2 || !Object.keys(f2.roles||{}).length){ lbIdentityError(name); }
        else { lbResolveIdentity(); lbView(); }
      } else lbIdentityError(name);
    });
    return true;
  }
  // 恢复上次选择（localStorage），否则默认第一个（characterName 非空优先，仅排序/默认）
  var saved = null;
  try{ var sv = localStorage.getItem('lbCurPid'); if(sv) saved = Number(sv); }catch(e){}
  var picked = saved;
  // v317：修复 indexOf bug——LB.playerRoles 是对象数组 [{pid}]，indexOf(数字) 恒 -1 → 保存角色永远被判无效重置默认；改用 some 按 pid 校验
  if(picked === null || !LB.playerRoles.some(function(r){ return Number(r.pid) === picked; })){
    // 清理无效残留（保存的角色 pid 不属于当前登录账号，如其他账号角色）
    if(saved !== null){ try{ localStorage.removeItem('lbCurPid'); }catch(e){} }
    // 按 characterName 非空优先选默认
    var nonEmpty = LB.playerRoles.filter(function(r){ var cn=lbCharName(r.pid); return cn && cn !== ''; });
    picked = (nonEmpty.length ? nonEmpty : LB.playerRoles)[0] ? (nonEmpty.length ? nonEmpty : LB.playerRoles)[0].pid : null;
  }
  LB.curPid = picked;
  LB._identityResolved = true;
  // 2026-08-28 修复：身份匹配成功后隐藏/清空登录警告条（此前 lbIdentityError 显示过警告后，
  // 后续匹配成功也不清除，导致页面残留「未关联游戏角色」红条）
  try{
    var _bar = document.getElementById('lbLoginBar');
    if(_bar){ _bar.style.display = 'none'; _bar.innerHTML = ''; }
  }catch(e){}
  lbRenderRoleSel();
  return true;
}
// 启动时异步获取当前登录 HA 账号的显示名（作为 player），存入 LB.autoPlayer；失败/未登录则留空
function lbInitPlayer(){
  return new Promise(function(resolve){
    // 双架构：新架构（dino.whiterober.ccwu.cc 独立后端）→ 用独立登录（localStorage.dinoAuth），不再连 HA websocket
    if(LB_ARCH === 'new'){
      var auth = null;
      try{ auth = JSON.parse(localStorage.getItem('dinoAuth') || 'null'); }catch(e){}
      if(auth && auth.nick){
        LB.autoPlayer = auth.nick;   // 昵称（匹配 players[].name → eosId）
        resolve(); return;
      }
      LB._needLogin = true;
      resolve(); return;
    }
    try{
      lbHaTokenRefresh().then(function(token){
        if(!token){
          // 无 token（无法自动识别账号）：标记需要登录，显示登录引导
          LB._needLogin = true;
          resolve(); return;
        }
        LB._tok = token; // 缓存 token 供 lbLoadThemes 等复用（避免重复 lbHaTokenRefresh 再次卡 6s）
        var proto = (location.protocol === 'https:') ? 'wss://' : 'ws://';
        var ws;
        try{ ws = new WebSocket(proto + location.host + '/api/websocket'); }
        catch(e){ LB._needLogin = true; resolve(); return; }
        var done = false;
        var tm = setTimeout(function(){ if(!done){ done = true; try{ ws.close(); }catch(e){} resolve(); } }, 6000);
        ws.onmessage = function(ev){
          try{
            var msg = JSON.parse(ev.data);
            if(msg.type === 'auth_required'){ ws.send(JSON.stringify({type:'auth', access_token: token})); }
            else if(msg.type === 'auth_ok'){ ws.send(JSON.stringify({id: 1, type: 'auth/current_user'})); }
            else if(msg.id === 1 && msg.result && msg.result.name){
              done = true; clearTimeout(tm);
              LB.autoPlayer = msg.result.name;
              try{ ws.close(); }catch(e){}
              resolve();
            }
          }catch(e){}
        };
        ws.onerror = function(){ if(!done){ done = true; clearTimeout(tm); try{ ws.close(); }catch(e){} resolve(); } };
        ws.onclose = function(){ if(!done){ done = true; clearTimeout(tm); resolve(); } };
      }).catch(function(){ LB._needLogin = true; resolve(); });
    }catch(e){ LB._needLogin = true; resolve(); }
  });
}

// 登录：统一走 lbHaTokenRefresh（内部已含 App externalAuth bridge + 浏览器 localStorage + 过期换新）
// 拿到 token → 刷新页面自动识别账号；拿不到 → App 内轻提示（跳转被禁）/ 浏览器跳转登录页写 token
// 双架构：新架构 → 弹独立登录表单（/api/login → localStorage.dinoAuth）
async function lbGoLogin(){
  if(LB_ARCH === 'new'){ lbOpenLoginModal(); return; }
  try{
    var token = await lbHaTokenRefresh();
    if(token){ location.reload(); return; }
  }catch(e){}
  var isApp = (window.externalApp && typeof window.externalApp.getExternalAuth === 'function')
    || (window.externalAppV2 && typeof window.externalAppV2.postMessage === 'function');
  if(isApp){ lbToast('请先在 HA App 中登录账号'); return; }
  try{
    window.open('/?storeToken=true', '_blank');
  }catch(e){
    location.href = '/?storeToken=true';
  }
}

// 提交独立登录
function lbDoLogin(){
  var u = document.getElementById('lbLoginUser');
  var p = document.getElementById('lbLoginPwd');
  var msg = document.getElementById('lbLoginMsg');
  if(!u || !p || !msg) return;
  var username = (u.value||'').trim();
  var password = (p.value||'').trim();
  if(!username || !password){ msg.textContent='请输入账号和密码'; return; }
  var btn = null;
  var btns = document.querySelectorAll('.lb-picker-overlay button');
  for(var i=0;i<btns.length;i++){ if(btns[i].textContent==='登录'){ btn=btns[i]; break; } }
  if(btn){ btn.disabled=true; btn.textContent='登录中…'; }
  fetch(LB_API + '/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ username: username, password: password })
  }).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok){
      try{ localStorage.setItem('dinoAuth', JSON.stringify({ user: username, nick: j.nick, at: Date.now() })); }catch(e){}
      location.reload();
    } else {
      if(msg) msg.textContent = '登录失败：账号或密码错误';
      if(btn){ btn.disabled=false; btn.textContent='登录'; }
    }
  }).catch(function(){
    if(msg) msg.textContent = '登录失败：网络错误';
    if(btn){ btn.disabled=false; btn.textContent='登录'; }
  });
}

  out.textContent=L.join('\n');

// 获取文件 Last-Modified（HEAD 轻量请求，毫秒级；失败返回 null，文件不存在(404)返回 '__404__'）
// 用 XHR 直接实现（fetch HEAD 并发易 ERR_ABORTED）；Basic Auth 从 URL 内嵌凭据取
var LB_LM_404 = '__404__';
function lbHeadLm(url){
  return new Promise(function(resolve){
    var m = url.match(/^([a-z]+:\/\/)([^@\/]+)@/i);
    var cleanUrl = url;
    var auth = null;
    if(m){
      var b64;
      try{ b64 = btoa(decodeURIComponent(m[2])); }catch(e2){ b64 = btoa(m[2]); }
      auth = 'Basic ' + b64;
      cleanUrl = m[1] + url.slice(m[0].length);
    }
    var xhr = new XMLHttpRequest();
    xhr.open('HEAD', cleanUrl, true);
    if(auth) xhr.setRequestHeader('Authorization', auth);
    xhr.timeout = 8000;
    xhr.onload = function(){
      var lm = null;
      try{ lm = xhr.getResponseHeader('Last-Modified') || null; }catch(e){}
      if(xhr.status === 404) lm = LB_LM_404; // 文件不存在（如非 Isl 的 tamed.json）
      resolve(lm);
    };
    xhr.onerror = function(){ resolve(null); };
    xhr.ontimeout = function(){ resolve(null); };
    try{ xhr.send(null); }catch(e){ resolve(null); }
  });
}

// v208：数据下载——优先静态 .json.gz（预压缩，nginx 从 WebDAV 拉小文件），404 回退 .json
// 自动解压：gzip magic 检测 → DecompressionStream('gzip')；nginx 动态 gzip 由浏览器自动解压
function lbFetchDataJson(base, gzUrl){
  return authFetch(gzUrl, {}).then(function(res){
    if(res.ok){
      return res.arrayBuffer().then(function(buf){
        var u8 = new Uint8Array(buf);
        if(u8.length>2 && u8[0]===0x1f && u8[1]===0x8b){ // gzip magic
          if(typeof DecompressionStream !== 'undefined'){
            var stream = new Response(buf).body.pipeThrough(new DecompressionStream('gzip'));
            return new Response(stream).text().then(function(t){ return JSON.parse(t); });
          }
          // 极老浏览器无 DecompressionStream → 回退请求 .json（nginx 动态 gzip）
          return authFetch(base, {}).then(function(r2){ return r2.ok ? r2.json() : null; });
        }
        return JSON.parse(new TextDecoder().decode(buf));
      });
    }
    if(res.status === 404){
      // 回退 .json
      return authFetch(base, {}).then(function(r2){
        if(!r2.ok) return null;
        var enc = (r2.headers.get('content-encoding')||'').toLowerCase();
        if(enc.indexOf('gzip')>=0) return r2.json(); // nginx 动态 gzip，浏览器自动解压
        return r2.arrayBuffer().then(function(b2){ return JSON.parse(new TextDecoder().decode(b2)); });
      });
    }
    return null;
  }).catch(function(){ return null; });
}

// v211：HEAD 探测 .gz 优先（后端 zlib 改造后可能只输出 .json.gz 不保留明文 .json），404 回退 .json；返回 {lm, ext}
function lbHeadPick(base){
  return lbHeadLm(base+'.gz?cb='+Date.now()).then(function(lm){
    if(lm !== LB_LM_404) return { lm: lm, ext: '.gz' };
    return lbHeadLm(base+'?cb='+Date.now()).then(function(lm2){
      return { lm: lm2, ext: (lm2===LB_LM_404) ? null : '' };
    });
  });
}

// 严格按《前端对接_JSON规范与聚落算法.md》§6-§8：
//  容器聚合 → 排除背包/无坐标 → 按部落 → DBSCAN(eps=6000) → 冠名(印痕者反查pid→本部落过滤→前3名)

var LB_SPLIT_EPS = 6000;  // 大簇切割阈值（独立保持 6000：radius>6000 的桥接簇仍切割，防 released 桥接分离基地）
// 聚落成立判定（2026-08-12）：簇内有床/棺材/睡眠舱建筑（同部落，距簇内任一容器 ≤eps）→ 成聚落；不再校验容器数量

  var tid = clu[0].tribeId;
  var beds = sts.filter(function(s){
    return Number(s.tribeId)===Number(tid) && /SimpleBed|ModernBed|TekBed|CompanionBed|Coffin|SleepingPod/i.test(s.class||'');

  if(!beds.length) return false;

    });

    settlements.forEach(function(s){
      (s.containers||[]).forEach(function(c){

    });
    scatteredCtn.forEach(function(c){
      if(c.id && c.id.indexOf('noid_')!==0 && c.id.indexOf('rel_')!==0){
        byContainer[abbr+'_'+c.id] = { setId:'scattered', scattered:true, server:abbr, tribeId:c.tribeId };
      }
    });
    byServer[abbr] = { settlements:settlements, scattered:scatteredCtn.length };
  });

}
function tidOf(s){ return s && s.tribeId; }
// 簇半径：到簇中心（均值）的最大距离
function lbClusterRadius(pts){
  if(!pts || !pts.length) return 0;
  var cx=0, cy=0;
  pts.forEach(function(p){ cx+=Number(p.x); cy+=Number(p.y); });
  cx/=pts.length; cy/=pts.length;
  var mr=0;
  pts.forEach(function(p){
    var d=Math.sqrt(Math.pow(Number(p.x)-cx,2)+Math.pow(Number(p.y)-cy,2));
    if(d>mr) mr=d;
  });
  return mr;
}
// 大簇后处理拆分：radius>eps 的簇按单链接最大间隙（MST 最长边）递归切断，直到子簇 radius<=eps
function lbSplitOversize(pts, eps){
  function split(arr){
    if(arr.length<=1) return [arr];
    if(lbClusterRadius(arr) <= eps) return [arr];
    var n=arr.length;
    // Prim 求 MST
    var key=new Array(n), parentArr=new Array(n), mstSet=new Array(n);
    for(var i=0;i<n;i++){ key[i]=Infinity; mstSet[i]=false; }
    key[0]=0; parentArr[0]=-1;
    for(var c=0;c<n-1;c++){
      var u=-1, minK=Infinity;
      for(var j=0;j<n;j++){ if(!mstSet[j] && key[j]<minK){ minK=key[j]; u=j; } }
      if(u<0) break;
      mstSet[u]=true;
      for(var v=0;v<n;v++){
        if(!mstSet[v]){
          var d=Math.sqrt(Math.pow(Number(arr[u].x)-Number(arr[v].x),2)+Math.pow(Number(arr[u].y)-Number(arr[v].y),2));
          if(d<key[v]){ key[v]=d; parentArr[v]=u; }
        }
      }
    }
    // 找 MST 最长边（最可能的桥接）
    var maxE=-1, uu=-1, vv=-1;
    for(var v=1;v<n;v++){
      var u=parentArr[v];
      if(u<0) continue;
      var d=Math.sqrt(Math.pow(Number(arr[u].x)-Number(arr[v].x),2)+Math.pow(Number(arr[u].y)-Number(arr[v].y),2));
      if(d>maxE){ maxE=d; uu=u; vv=v; }
    }
    if(uu<0 || vv<0) return [arr];

    for(var v=1;v<n;v++){
      var u=parentArr[v];
      if(u<0) continue;
      if((u===uu&&v===vv)||(u===vv&&v===uu)) continue;
      (adj[u]=adj[u]||[]).push(v);
      (adj[v]=adj[v]||[]).push(u);
    }
    var visited={};
    function collect(start){
      var out=[], stack=[start];
      visited[start]=1;
      while(stack.length){
        var cur=stack.pop(); out.push(arr[cur]);
        (adj[cur]||[]).forEach(function(nb){ if(!visited[nb]){ visited[nb]=1; stack.push(nb); } });
      }
      return out;
    }
    var c1=collect(0), c2=[];
    for(var i=0;i<n;i++){ if(!visited[i]){ c2=collect(i); break; } }
    var res=[];
    if(c1.length) split(c1).forEach(function(x){ res.push(x); });
    if(c2.length) split(c2).forEach(function(x){ res.push(x); });

  }

}
// DBSCAN（eps 距离阈值，minPts=1 即单点也成簇；按 x/y 平面距离；标准密度可达递归扩展）
// v201 性能修复（切换地图卡 8.6s 根因）：空间网格索引（cell=eps）——邻域查询只查 3×3 格
// 数学保证不漏点：两点距离 ≤eps 必在同一或相邻 cell（3×3 覆盖对角线 2.83eps）；复杂度 O(n²) → O(n)
// queue 用头指针替代 shift()（避免数组头部移除 O(n)）；语义与原实现完全一致
function lbDbscan(pts, eps, minPts){
  var clusters = [], visited = {};
  var n = pts.length;
  var cellSize = eps > 0 ? eps : 1;
  var cell = {};
  for(var i=0;i<n;i++){
    var k = Math.floor(Number(pts[i].x)/cellSize)+','+Math.floor(Number(pts[i].y)/cellSize);
    (cell[k]=cell[k]||[]).push(i);
  }
  var eps2 = eps*eps;
  function regionIdx(i){
    var out=[];
    var gx = Math.floor(Number(pts[i].x)/cellSize), gy = Math.floor(Number(pts[i].y)/cellSize);
    for(var dx=-1;dx<=1;dx++){
      for(var dy=-1;dy<=1;dy++){
        var c = cell[(gx+dx)+','+(gy+dy)];
        if(!c) continue;
        for(var m=0;m<c.length;m++){
          var j=c[m];
          if(j===i) continue;
          var dx2=Number(pts[i].x)-Number(pts[j].x), dy2=Number(pts[i].y)-Number(pts[j].y);
          if(dx2*dx2+dy2*dy2 <= eps2) out.push(j);
        }
      }
    }
    return out;
  }
  for(var i=0;i<n;i++){
    if(visited[i]) continue;
    visited[i]=1;
    var clu=[i], queue=regionIdx(i), head=0;
    while(head<queue.length){

      if(visited[q]) continue;
      visited[q]=1;
      clu.push(q);
      regionIdx(q).forEach(function(j){ if(!visited[j]) queue.push(j); });
    }
    clusters.push(clu.map(function(idx){ return pts[idx]; }));
  }
  return clusters;
}
// 取数组中距中心最近的建筑（返回其 name）
function lbNearestStructure(arr, cx, cy){
  var best=null, bd=Infinity;
  arr.forEach(function(s){
    var d = Math.sqrt(Math.pow(Number(s.x)-cx,2)+Math.pow(Number(s.y)-cy,2));
    if(d < bd){ bd=d; best=s; }
  });
  return best ? best.name : null;
}
// 聚落建筑命名优先级（2026-08-12）：①墓碑/木牌/金属牌(Gravestone/WoodSign_Large/MetalSign_Large)自定义名(同组取距center最近) → ②床/棺材/睡眠舱 name 以大写 M 结尾(取最近) → ③床/棺材/睡眠舱最近带名字；无则 null
function lbSettlementBuildingName(data, abbr, tid, cx, cy){
  var sts = (data && Array.isArray(data.structures)) ? data.structures : [];
  if(!sts.length) return null;
  var cands = sts.filter(function(s){ return Number(s.tribeId) === Number(tid) && s.name; });
  if(!cands.length) return null;
  var sign = cands.filter(function(s){ return /Gravestone|WoodSign_Large|MetalSign_Large/i.test(s.class||''); });
  if(sign.length) return lbNearestStructure(sign, cx, cy);
  var mEnd = cands.filter(function(s){ return /M$/.test(s.name.trim()); });
  if(mEnd.length) return lbNearestStructure(mEnd, cx, cy);
  return lbNearestStructure(cands, cx, cy);
}
// 聚落收尾：计算 center/radius/容器数/球数 + 冠名（§8）

// §8.1 印痕者反查 pid：imprinterName 匹配 players.characterName（+EosId 区分重名）；未反查到用部落成员名兜底
function lbResolveImprinterPid(data, name, abbr, memberPids, memberNames){

  var candidates = pl.filter(function(ent){ return ent.roles && Object.keys(ent.roles).some(function(pid){ return ent.roles[pid]===name; }); });
  for(var i=0;i<candidates.length;i++){
    var ent = candidates[i];
    var pids = Object.keys(ent.roles).filter(function(pid){ return ent.roles[pid]===name; });

      if(memberPids[pids[j]]!==undefined) return Number(pids[j]); // 命中本部落成员 pid

//  (1) 精确关联：facility rec 的 containerClass 存真实结构路径（含真实ID），蛋 containerId 与之相等 →
//      反查哈希 containerId → byContainer 精确命中（培养器/孵化器/冰箱/储物箱等结构容器）
//  (2) 坐标兜底：无 facility 匹配（窃蛋龙等生物背包容器）→ 按容器坐标匹配最近同部落聚落（≤ LB_EGG_SETTLE_EPS）
var LB_EGG_SETTLE_EPS = 20000; // 蛋容器坐标归属阈值（对齐离散吸收 20000；蛋容器一般就在聚落设施内）
function lbSettlementOf(r){
  var data = LB._cache && LB._cache.data;
  if(!data || !data._settlements) return null;
  // 非空球：按 dinoId 查
  if(!r.isEmpty && (r.dinoId1 || r.dinoId2)){
    var k = r.server + '_' + String(r.dinoId1||'') + '_' + String(r.dinoId2||'');
    var v = data._settlements.byDinoKey[k];
    if(v) return v;
  }
  // 空球/无 dinoId：按容器坐标归属聚落（byContainer，空球无法建 dinoKey）
  if(r.containerId){
    var ck = r.server + '_' + r.containerId;
    if(data._settlements.byContainer){
      var cv = data._settlements.byContainer[ck];
      if(cv) return cv;
    }
    // v607 蛋/胚胎：byContainer 未命中 → ①精确关联 facility（containerClass 含真实ID 反查哈希）
    if((r.source==='egg' || r.source==='embryo' || r._isEgg) && data._settlements.byContainer){
      if(!data._settlements._facByClass && Array.isArray(data.recs)){
        var _idx = {};
        data.recs.forEach(function(fr){ if(fr.src==='facility' && fr.containerClass && fr.containerId) _idx[fr.server+'|'+fr.containerClass]=fr.containerId; });
        data._settlements._facByClass = _idx; // 惰性建立 facility 反向索引（containerClass真实路径→哈希containerId）
      }
      var _hash = data._settlements._facByClass && data._settlements._facByClass[r.server+'|'+r.containerId];
      if(_hash){
        var _cv2 = data._settlements.byContainer[r.server+'_'+_hash];
        if(_cv2) return _cv2;
      }
      // ②坐标兜底：窃蛋龙等生物背包容器无 facility → 容器坐标匹配最近同部落聚落
      var cx = Number(r.containerX||0), cy = Number(r.containerY||0);
      if(cx || cy){
        var sv = data._settlements.byServer && data._settlements.byServer[r.server];
        var best = null, bd = Infinity;
        if(sv && Array.isArray(sv.settlements)){
          for(var i=0;i<sv.settlements.length;i++){
            var s0 = sv.settlements[i];

            var d = Math.sqrt(Math.pow(Number(s0.center.x)-cx,2)+Math.pow(Number(s0.center.y)-cy,2));

          }

        if(best && bd <= LB_EGG_SETTLE_EPS){
          return { setId:best.id, dist:Math.round(bd), server:r.server, tribeId:Number(best.tribeId), scattered:false };
        }
      }
    }
    return null;
  }
  return null;
}

// 核心归属：非离散看聚落冠名成员（owners[].pid 含 curPid）；离散看部落成员（playerSet）
function lbIsMyBySettlement(r, playerSet, curPid){
  if(!playerSet || !curPid) return false;
  var s = lbSettlementOf(r);
  var tribeKey = r.server + ':' + String(r.ownerTribeId||0);
  if(s){
    if(s.scattered){
      // 离散：仅限无留痕者（imprinterName 空）的生物归属全部落成员；有留痕者的按留痕者本人判定（§8.1 反查）

        var dt = LB._cache && LB._cache.data;
        var tr = (dt && dt.tribesByServer && dt.tribesByServer[r.server] && dt.tribesByServer[r.server][r.ownerTribeId]) || null;
        var mps={}, mns={};
        if(tr && Array.isArray(tr.members)){
          tr.members.forEach(function(m){ if(m && m.pid!==undefined){ mps[String(m.pid)]=m.name||''; mns[m.name]=String(m.pid); } });
        }
        // v318：优先 eosId 反查（重名安全）；无 eosId 才 name 兜底
        var ip = (r.imprinterEosId) ? lbResolveImprinterPidByEos(dt, r.imprinterEosId, mps) : null;
        if(ip===null && r.imprinterName) ip = lbResolveImprinterPid(dt, r.imprinterName, r.server, mps, mns);
        if(ip !== null) return String(ip) === String(curPid);
        return false; // 有留痕者但反查不到 → 非我的
      }
      return !!playerSet[tribeKey];
    }
    // 非离散：聚落冠名成员含 curPid → 我的
    var st = lbFindSettlementObj(s);
    if(st && Array.isArray(st.owners) && st.owners.length){
      for(var i=0;i<st.owners.length;i++){
        if(String(st.owners[i].pid) === String(curPid)) return true;
      }
      // 冠名即归属：聚落有冠名成员但不含我 → 不是我的（不回退部落，避免他人聚落误判为我的）
      return false;
    }
    // 聚落无冠名成员（回退 S 编号）：回退部落判定
    return !!playerSet[tribeKey];
  }
  // 无聚落数据：回退部落判定
  return !!playerSet[tribeKey];
}
// 从 settlements 结果查找聚落对象（byServer[server].settlements[] 按 id）
function lbFindSettlementObj(s){
  var data = LB._cache && LB._cache.data;

  var sv = data._settlements.byServer[s.server];

// 时间分组：0=最近30天 1=更早 2=时间未知
// 规则：球内按收纳时间(packedAtWorldSec)、放出按下载/驯养时间(downloadedAtWorldSec||tamedAtWorldSec)，均为世界秒
//  有 worldSecondsNow(wn) 且 sortWorldSec>0 → 世界秒差值 ≤ 30 游戏天
//  无 wn 但有 sortWorldSec>0 → fallback 墙钟 absMs ≤ 30 墙钟天
//  sortWorldSec=0（收纳/驯养时间未知）→ 未知组
function lbTimeGroup(rec, worldNowByServer){
  var wn = worldNowByServer[rec.server] || 0;
  if(rec.sortWorldSec>0 && wn>0){
    var diff = wn - rec.sortWorldSec;
    if(diff<0) return 2;                       // 回档/异常
    return diff<=LB.DAY30 ? 0 : 1;
  }
  if(rec.sortWorldSec>0 && rec.absMs >= LB.ASA_LAUNCH_MS){
    return (Date.now()-rec.absMs <= LB.DAY30*1000) ? 0 : 1;
  }
  return 2;  // 收纳/驯养时间未知
}

  var species = findSpeciesByClass(r.dinoClass);

  // 注（2026-08-13 后端新规则）：statValues[8] 统一为加成值（不含基础100%，如 0.56=加成56%）；solveLevels 近战需「加点百分比」= sv[8]*100（56）
  for(var ii=0; ii<imprints.length; ii++){
    for(var ti=0; ti<tes.length; ti++){
