function lbIsEggIncubator(r){
  if(!r) return false;
  var c = String(r.containerClass||'') + '|' + String(r.containerName||'');
  return /EggIncubator/i.test(c) || /Egg Incubator/i.test(c) || /EmbryoIncubator/i.test(c) || /Embryo Incubator/i.test(c);
}
// v500：蛋记录图标——eggs 分类图标（<物种英文名>_Egg，如 Brontosaurus_Egg）；无则兜底生物头像
// v600：优先用 dinoClass 生成候选——ASB 里 BogSpider 的 name 是 Bloodstalker（命名歧义），
//      用 dinoClass（BogSpider）才能命中 Item_BogSpiderEgg_Icon；sp.name 仅作补充候选
function lbEggIcon(r){
  if(!LB_ICON_BY_NAME) return '';
  var dc = String(r.dinoClass||'');
  var sp = findSpeciesByClass(r.dinoClass);
  var nm = (sp && sp.name) ? sp.name : r.dinoClass;
  var cands = [];
  // ① dinoClass 派生（如 BogSpider → Item_BogSpiderEgg_Icon / BogSpider_Egg）
  cands.push('Item_' + dc.replace(/[ _]/g,'') + 'Egg_Icon', dc + '_Egg', dc.replace(/ /g,'_') + '_Egg');
  // ② name 派生（补充；name 可能与 dinoClass 不同导致歧义，放后面）
  if(nm !== dc){
    var base = String(nm).replace(/_Fertilized/g,'');
    cands.push('Item_' + nm.replace(/ /g,'') + 'Egg_Icon', nm + '_Egg', nm.replace(/ /g,'_') + '_Egg');
    if(base!==nm){ cands.push('Item_' + base.replace(/ /g,'') + 'Egg_Icon', base + '_Egg', base.replace(/ /g,'_') + '_Egg'); }
  }
  for(var i=0;i<cands.length;i++){
    if(LB_ICON_BY_NAME[cands[i]]) return LB_ICON_BY_NAME[cands[i]];
  }
  return lbIconForDinoClass(r.dinoClass) || '';
}
// v500：加载各服蛋数据（<server>_eggs.json.gz，gzip 解压）→ 转换 rec 兼容结构（source:'egg'），存 LB._eggCache
// v527：蛋 IndexedDB 持久缓存（key 'eggs'，对齐 tamed 模式——刷新秒开 + HEAD 增量，不再每次全量下载）
function lbEggCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('eggs');
      get.onsuccess = function(){ resolve(get.result || null); };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbEggCacheSet(cache, lm){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ cache: cache, lm: lm||{}, ts: Date.now() }, 'eggs');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
// v527：后台 HEAD 增量检查——对比缓存 Last-Modified，有变化的服才重拉
async function lbEggHeadCheck(servers, oldLm){
  var changed = [];
  try{
    await Promise.all(servers.map(function(abbr){
      return fetch(DINO_JSON + abbr + '_eggs.json.gz', { method:'HEAD', cache:'no-store' })
        .then(function(r){
          var lm = (r.headers.get('Last-Modified') || '').trim();
          if(lm && (!oldLm[abbr] || String(oldLm[abbr]).trim() !== lm)) changed.push(abbr);
          return lm;
        }).catch(function(){ return ''; });
    }));
  }catch(e){}
  if(changed.length) lbLoadEggs(changed, true); // 变化服强制重拉
}
async function lbLoadEggs(servers, force){
  if(!servers || !servers.length) return {};
  // v527：非强制时优先 IndexedDB 蛋缓存（刷新秒开），后台 HEAD 增量检查（未变化不重拉，对齐 tamed）
  if(!force && !LB._eggCache){
    try{
      var _idb = await lbEggCacheGet();
      if(_idb && _idb.cache && Object.keys(_idb.cache).length){
        LB._eggCache = _idb.cache;
        LB._eggLm = LB._eggLm || (_idb.lm||{}); // v656：Last-Modified 表跨会话保留（供 HEAD 增量对比）
        lbEggMergeToView();
        setTimeout(function(){ lbEggHeadCheck(servers, LB._eggLm||{}); }, 300);
        return LB._eggCache;
      }
    }catch(e){}
  }
  var lm = {};
  // v528：首次/强制拉取提示（避免「干等初始化」无反馈）
  try{ lbToast('正在下载蛋数据…'); }catch(e){}
  return Promise.all(servers.map(function(abbr){
    return authFetch(DINO_JSON + abbr + '_eggs.json.gz?cb=' + Date.now(), {}).then(function(r){
      try{ lm[abbr] = (r.headers.get('Last-Modified') || '').trim(); }catch(e){}
      if(!r.ok) return {server:abbr, eggs:[]};
      return r.arrayBuffer();
    }).then(function(buf){
      if(!buf || !buf.byteLength) return {server:abbr, eggs:[]};
      var u8 = new Uint8Array(buf);
      var parse = (u8[0]===0x1f && u8[1]===0x8b)
        ? new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer().then(function(d){
            return JSON.parse(lbJsonFix(new TextDecoder().decode(d)));
          })
        : Promise.resolve(JSON.parse(lbJsonFix(new TextDecoder().decode(u8))));
      return parse.then(function(j){
        var list = (j && Array.isArray(j.eggs)) ? j.eggs : [];
        // v586：记录文件级 worldSecondsNow（248M 基准，与 nextSpoilingTime/creationTime 同基准）——真实腐化剩余 = nextSpoilingTime − worldSecondsNow
        if(!LB._eggWorldByServer) LB._eggWorldByServer = {};
        LB._eggWorldByServer[abbr] = (j && typeof j.worldSecondsNow==='number' && isFinite(j.worldSecondsNow)) ? j.worldSecondsNow : null;
        return {server:abbr, eggs: list.map(function(e){ return lbEggToRec(e, abbr); })};
      });
    }).catch(function(){ return {server:abbr, eggs:[]}; });
  })).then(function(results){
    // v656：部分服强制重拉（HEAD 增量/单服刷新）时合并进现有缓存，禁止整体覆盖——否则其余服的蛋被清空，
    //      recs 蛋层按 eggCache 重建（v646）→ 该服野生蛋/巢蛋消失（如熔岩龙 Gen 蛋丢失）。首次全量拉时 cache 为空等效全量。
    var cache = LB._eggCache || {};
    var merged = LB._eggLm || {};
    results.forEach(function(r){ cache[r.server] = r.eggs; if(lm[r.server]!==undefined) merged[r.server] = lm[r.server]; });
    LB._eggCache = cache;
    LB._eggLm = merged;
    // v501：并入 recs 并无感重渲染（聚落详情/容器即可看到蛋与胚胎）
    lbEggMergeToView();
    lbEggCacheSet(cache, merged); // v527：写入 IndexedDB 持久缓存
    return cache;
  });
}
// v501：把已缓存的蛋/胚胎并入 data.recs（按 key 去重），无感重渲染
// v587：合并时更新已有蛋 rec 的实时字段（后端/eggprobe 刷新后腐化/孵化值变化不再被固化旧值）
function lbEggMergeToView(){
  var data = LB._cache && LB._cache.data;
  if(!data || !data.recs || !LB._eggCache) return;
  // v646：先移除 recs 中全部旧蛋（含历史重复残留：此前多轮并入累积的 source='wild' 重复），再按 eggCache 去重全量重建蛋层
  var removed = 0;
  var _oldRecs = data.recs;
  data.recs = _oldRecs.filter(function(r){ if(r && (r._isEgg || r.source==='egg'||r.source==='embryo')){ removed++; return false; } return true; });
  var byId = {};
  var added = 0;
  Object.keys(LB._eggCache).forEach(function(abbr){
    (LB._eggCache[abbr]||[]).forEach(function(e){
      if(e && e.dinoId1 && !byId[e.dinoId1]) byId[e.dinoId1] = e;
    });
  });
  Object.keys(byId).forEach(function(k){ data.recs.push(byId[k]); added++; });
  if(!added && !removed) return;
  // v550 蛋变化不重建 + v551：仅当聚落构建未含蛋容器（蛋后到，如手动刷新页面）才重建一次（data 级）；
  // v607：蛋/胚胎永不触发聚落全量重建——蛋容器真实ID(eggprobe) 与设施哈希ID(facility) 本就两套体系，
  //      重建对蛋容器归属无效却造成全服重建风暴（Ast 543 蛋实测 204s 卡死→请求超时误报 RangeError）。
  //      蛋/胚胎归属改由 lbSettlementOf 容器坐标动态匹配（新增蛋 rec 直接并入，无需重建）。
  if(!data._eggInSettles && !data._eggBuiltOnce){
    data._eggBuiltOnce = true;
    if(data._settlements) delete data._settlements;
    if(typeof lbRenderKeepView==='function') lbRenderKeepView();
  } else if(added || removed){
    // 蛋并入后轻量重渲染（不重建聚落；新增蛋经 lbSettlementOf 坐标回退显示在对应聚落/容器）
    if(typeof lbRenderKeepView==='function') lbRenderKeepView();
  }
}
// v645：蛋原始基因字符串 ["Trait[n]"] → rec 对象 [{trait,stacks}]（与龙对象格式统一；兼容已是对象）
function lbEggGeneNorm(gt){
  if(!gt) return [];
  if(!Array.isArray(gt)) gt = [gt];
  var out = [];
  for(var i=0;i<gt.length;i++){
    var g = gt[i];
    if(g && typeof g === 'object'){ out.push({trait:String(g.trait||'').replace(/\[\d+\]$/,''), stacks:Number(g.stacks)||1}); continue; }
    var s = String(g||'');
    var m = s.match(/^(.*)\[(\d+)\]$/);
    if(m) out.push({trait:m[1], stacks:Number(m[2])||1});
    else if(s) out.push({trait:s, stacks:1});
  }
  return out;
}
// v500：egg 记录 → rec 兼容结构（lbDinoHTML 可直接渲染；无自身等级/最终值，用 parentLevel 为等级、属性点直读）
// v501：支持 source='embryo'（胚胎，species=Base，物种从双亲描述提取中文）
// v754-P1：可偷蛋龙蛋物种变体还原——EggProbe 把飞龙火/毒/电/冰巢蛋折叠成短名 Wyvern（变体仅在 parentDesc 父名），据此还原完整蓝图 dinoClass（修复基因筛选/野生蛋不反映蛋基因）
var LB_EGG_WYVERN_MAP = {
  'Wyvern_Character_BP_Fire_C':['Fire Wyvern','火飞龙','火焰飞龙','火龍','火飞龙'],
  'Wyvern_Character_BP_Poison_C':['Poison Wyvern','剧毒飞龙','劇毒飞龙','毒飞龙','劇毒飛龍','剧毒飛龍'],
  'Wyvern_Character_BP_Lightning_C':['Lightning Wyvern','闪电飞龙','閃電飛龍','闪电龍','闪电龙','雷电飞龙','雷飞龙'],
  'Wyvern_Character_BP_Ice_C':['Ice Wyvern','冰飞龙','冰飛龍','冰龍','冰龙']
};
function lbEggParentClass(e){
  var pd = String((e && e.parentDesc) || '');
  if(!pd) return '';
  for(var dcl in LB_EGG_WYVERN_MAP){
    var al = LB_EGG_WYVERN_MAP[dcl];
    for(var i=0;i<al.length;i++){ if(pd.indexOf(al[i]) >= 0) return dcl; }
  }
  return '';
}
function lbEggToRec(e, abbr){
  var isEmb = (e.source==='embryo');
  var spRaw = String(e.species||'');
  var sp = spRaw.replace(/_Fertilized$/,'');
  var dinoClass = sp;
  var _pc = lbEggParentClass(e); // v754-P1：parentDesc 父名还原飞龙变体
  if(_pc) dinoClass = _pc;
  else if(isEmb && (!sp || sp==='Base')){
    var es = lbEmbryoSpecies(e.parentDesc);
    if(es) dinoClass = es;
  }
  // v593：蛋品质变体（如 Maelizard_Small/Medium/Large/XSmall——风行蜥不同品质的蛋）→ 归一到基础物种类名（可查/可翻译中文）
  if(!findSpeciesByClass(dinoClass) && /_(XSmall|Small|Medium|Large)$/.test(dinoClass)){
    var _base = dinoClass.replace(/_(XSmall|Small|Medium|Large)$/,'');
    var _bs = findSpeciesByClass(_base);
    if(_bs && _bs.blueprintPath){
      dinoClass = String(_bs.blueprintPath).split('/').pop().replace(/^(.+)\.(.+)$/,'$1'); // Maelizard_Small → Maelizard_Character_BP
    }

// v573：秒 → HH:MM:SS（孵化剩余/腐化倒计时）
function lbFmtDuration(sec){
  sec = Math.max(0, Math.floor(Number(sec)||0));
  function p2(n){ return (n<10?'0':'')+n; }
  return p2(Math.floor(sec/3600))+':'+p2(Math.floor((sec%3600)/60))+':'+p2(sec%60);
}
// v582：倒计时精确到分钟（d/h/m 简写；孵化/腐化剩余用）
function lbFmtDurationMin(sec){
  sec = Math.max(0, Math.floor(Number(sec)||0));
  var d = Math.floor(sec/86400), h = Math.floor((sec%86400)/3600), m = Math.floor((sec%3600)/60);
  if(d>0) return d+'d '+h+'h';
  if(h>0) return h+'h '+m+'m';
  if(m>0) return m+'m';
  return '0m';
}
// v540：容错 JSON——exe 侧蛋输出 inf/-inf/NaN（非法 JSON），替换为 null 保证 JSON.parse 不炸（蛋数据全量加载依赖）

// v478：最高 3 个属性缩写+点数（statPoints 12 项，点数最高 3 个）
function lbTopStats(d){

// 语法示例：mut(a) ? <a>.<代数>.<编号>.<属性值> : max(a) ? <a>.<属性值> : zero(a) ? z.<a>.<编号> : kill.<编号>

// max(a)=当前角色拥有的该物种中该属性最高（含自己）；min(a)=最低；mut(a)=该属性有变异；zero(a)=该属性0点

// v520：{no} 物种内序号——当前角色拥有的该物种中按 DinoID1 升序的第几只

function lbSplitTernary(s){ // 链式三元解析（支持有无空格）：返回 {cond,then,els} 或 null（无 '?'）
  var qi = s.indexOf('?');
  if(qi < 0) return null;
  var cond = s.slice(0, qi).trim();
  var rest = s.slice(qi+1);
  var depth = 0, colon = -1;
  for(var i=0;i<rest.length;i++){
    if(rest[i]==='?'){ depth++; }
    else if(rest[i]===':'){
      if(depth===0){ colon=i; break; }
      depth--;
    }
  }
  if(colon<0) return null;
  return {cond:cond, then:rest.slice(0,colon).trim(), els:rest.slice(colon+1).trim()};
}
function lbEvalCond(d, cond){

  var p = (d.st && d.st[idx]!==undefined) ? (Number(d.st[idx])||0) : 0;
  var sm = (d.sm && d.sm[idx]!==undefined) ? (Number(d.sm[idx])||0) : 0;
  if(fn==='mut') return sm > 0;
  if(fn==='zero') return p === 0;
  if(fn==='max'){ var mx=lbMyStatsBest(d.cls||'','max'); var base=(mx[idx]!==undefined)?mx[idx]:0; return p>0 && p>=base; }
  if(fn==='min'){ var mn=lbMyStatsBest(d.cls||'','min'); var base2=(mn[idx]!==undefined)?mn[idx]:0; return p>0 && p<=base2; }
  return false;
}
function lbFillLeaf(d, s, ch){ // 叶子：占位符替换（含函数属性字母上下文）
  var zh = ''; try{ zh = (lbSpName(d.cls||'').zh) || ''; }catch(e){}
  var sex = (String(d.g||'').toUpperCase()==='FEMALE') ? '♀' : '♂';
  var id = String(d.id1||'').slice(-4); // v481：{id} 只取 DinoID1 的后四位
  var top3 = lbTopStats(d);
  var idx = (ch!==undefined && LB_ATTR_CH[ch]!==undefined) ? LB_ATTR_CH[ch] : -1;
  var av = ch||'';
  var gen = (idx>=0 && d.sm && d.sm[idx]!==undefined) ? Math.round((Number(d.sm[idx])||0)/2) : '';
  var val = (idx>=0 && d.st && d.st[idx]!==undefined) ? (Number(d.st[idx])||0) : '';
  return String(s)
    .replace(/\{a\}|<a>/g, av)
    .replace(/\{代数\}|<代数>|\{gen\}/g, gen)
    .replace(/\{编号\}|<编号>/g, id)
    .replace(/\{no\}|<序号>/g, lbNoInSpecies(d)) // v520：{no} 物种内序号（该角色该物种按 ID 升序第几只）
    .replace(/\{属性值\}|<属性值>|\{v\}/g, val)
    .replace(/\{zh\}/g, zh)
    .replace(/\{lv\}/g, d.lv)
    .replace(/\{sex\}/g, sex)
    .replace(/\{cn\}/g, d.cn||'')
    .replace(/\{id\}/g, id)
    .replace(/\{top3\}/g, top3);
}
function lbEvalTpl(d, s, curCh){
  var t = lbSplitTernary(s);
  if(!t) return lbFillLeaf(d, s, curCh);
  var m = /\(([hswofat])\)/.exec(t.cond);
  var ch = m ? m[1] : curCh;
  return lbEvalCond(d, t.cond) ? lbEvalTpl(d, t.then, ch) : lbEvalTpl(d, t.els, ch);
}

// IndexedDB 速查缓存持久化（刷新页面后秒开，避免重新加载 10 台 JSON）
var LB_IDB_NAME = 'dinoImportDB', LB_IDB_STORE = 'lbCache';
function lbCacheOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
    var req = indexedDB.open(LB_IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(LB_IDB_STORE)) db.createObjectStore(LB_IDB_STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
function lbCacheGet(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readonly');
      var get = tx.objectStore(LB_IDB_STORE).get('latest');
      get.onsuccess = function(){
        var v = get.result || null;
        // 版本校验：旧结构（无 _schemaVer===3 / 无 players / rec 无 containerOwnerPid）→ 判失效
        if(v && v.data){
          var d = v.data;
          // 派生数据不持久化：剔除 _settlements，每次加载用当前算法重建
          if(d._settlements) delete d._settlements;
          var okVer = d._schemaVer === 10; // v10：facilities 空容器接入，旧缓存(9)判失效强制重拉
          var okPlayers = Array.isArray(d.players);
          var okPid = true;
          var okRoles = true;
          if(okPlayers && Array.isArray(d.recs)){
            var pc = d.recs.filter(function(r){ return lbContainerTypeOf(r)==='player' && !r.isEmpty; })[0];
            if(pc && pc.containerOwnerPid === undefined && pc.containerOwnerPid === null) okPid = false;
          }
          // v212：缓存数据自愈——players 全无角色映射（roles 空，旧格式缓存）→ 判失效自动重下
          if(okPlayers && d.players.length){
            okRoles = d.players.some(function(pl){ return pl && pl.roles && Object.keys(pl.roles).length; });
          }
          if(!okVer || !okPlayers || !okPid || !okRoles){ resolve(null); return; }
        }
        resolve(v);
      };
      get.onerror = function(){ resolve(null); };
    });
  }).catch(function(){ return null; });
}
function lbCacheSet(data){
  // 派生数据不持久化：剔除 _settlements；v548：_eggBuiltOnce 也剔除（缓存恢复后新 data 首次蛋合并仍触发重建，否则蛋容器不进聚落）
  if(data && data._settlements) delete data._settlements;
  if(data && data._eggBuiltOnce) delete data._eggBuiltOnce;
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).put({ data: data, ts: Date.now() }, 'latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}
function lbCacheClear(){
  return lbCacheOpen().then(function(db){
    return new Promise(function(resolve){
      var tx = db.transaction(LB_IDB_STORE, 'readwrite');
      tx.objectStore(LB_IDB_STORE).delete('latest');
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ resolve(); };
    });
  }).catch(function(){});
}

// 聚落聚合：中心地图距离 <3% 的聚落合并为一组（聚合大框），返回簇数组
// v183 阶段2：删除 lbSettleGeneMatch（基因成员已统一归属到 LB._geneGroups，按钮 hasGene 直接查成员）
function lbClusterSettles(settleGroups, cls){
  var curPid = lbCurPid();
  var data = LB._cache && LB._cache.data;
  var playerSet = curPid ? lbPlayerTribes((data&&data.tribesByServer)||{}, curPid) : null;
  function my(m){ return playerSet ? lbMemberIsMy(m, playerSet, curPid) : true; }
  var items = [];
  Object.keys(settleGroups).forEach(function(key){
    var grp = settleGroups[key]; // 生物数组（纯基因聚落为空数组）
    var garr = (LB._geneGroups && LB._geneGroups[key]) || []; // v183：基因成员（统一归属）
    // v177：匹配子集（聚落按钮结构不变，内容按物种过滤）
    // v575：lbSpeciesMatch 同时匹配该物种的蛋/胚胎（蛋 dinoClass=物种英文名）
    var fgrp = cls ? grp.filter(function(r){ return lbSpeciesMatch(r, cls); }) : grp;
    // v183 匹配基因成员（统一过滤 my+lbMemberMatch），替代 lbSettleGeneMatch
    var fgenes = garr.filter(function(m){ return my(m) && (cls ? lbMemberMatch(m, cls) : true); });
    var hasGene = fgenes.length>0;
    // v194：纯基因聚落（无生物）——有我的基因设备（含床支撑的基因实验室/主宅）即显示；全部物种也显示（替代 v184 仅选物种规则）
    if(!fgrp.length && !hasGene) return;
    // v183：聚落归属——优先生物 rec，纯基因聚落用基因成员 settle
    var base = fgrp[0] || grp[0];
    var s = base ? lbSettlementOf(base) : (garr[0] ? garr[0].settle : null);
    var center = null, map = null;
    if(s && !s.scattered){
      var st = lbFindSettlementObj(s);
      if(st && st.center){
        map = lbMapForServer(s.server, st.center.z);
        if(map){
          var p = lbWorldToPx(st.center.x, st.center.y, map);
          center = {x:p.x, y:p.y};
        }
      }
    }
    var mRel = fgrp.filter(function(r){return !r.isEmpty && lbContainerTypeOf(r)==='released';}).length;
    var mPod = fgrp.filter(function(r){return !r.isEmpty && lbContainerTypeOf(r)!=='released';}).length;
    var cnt = mRel + mPod;
    // v183：grp 用全量（名称/地图/离散点），genes 携带基因成员；计数用匹配子集（mRel/mPod）
    items.push({key:key, grp:grp, genes:garr, fgenes:fgenes, settle:s, center:center, map:map, cnt:cnt, mRel:mRel, mPod:mPod, hasGene:hasGene});
  });
  // 贪心聚类：与簇内首个聚落中心地图距离 <3（0~100 坐标）合并
  var clusters = [];
  items.forEach(function(item){
    if(!item.center){ clusters.push([item]); return; }
    var placed = false;
    for(var i=0;i<clusters.length;i++){
      var ref = clusters[i][0].center;
      if(ref && Math.hypot(item.center.x-ref.x, item.center.y-ref.y) < 3){
        clusters[i].push(item); placed = true; break;
      }
    }
    if(!placed) clusters.push([item]);
  });
  clusters.forEach(function(c){ c.sort(function(a,b){ return b.cnt-a.cnt; }); });
  clusters.sort(function(a,b){
    var am = a[0].map?1:0, bm = b[0].map?1:0;
    if(am!==bm) return bm-am;
    return b[0].cnt - a[0].cnt;
  });
  return clusters;
}

// 聚合块 HTML：单聚落 → 原按钮；多聚落 → 整体外框（共享地图+圆形区域+信息 | 右侧竖排各聚落按钮）
function lbSettleClusterHtml(clu){
  if(clu.length === 1) return lbSettleBtnHtml(clu[0]);
  var main = clu[0];
  var h = '<div class="settle-cluster">';
  h += '<div class="settle-cluster-main">';
  if(main.map && main.center){
    // 圈动态计算：中心=各子聚落单点(共享图换算)平均，半径=最远点距离+边距（刚好包住所有子聚落点）
    var pts=[];
    clu.forEach(function(it){
      var s2 = it.settle; // v183：统一聚落归属
      if(!s2 || s2.scattered) return;
      var st2 = lbFindSettlementObj(s2);
      if(st2 && st2.center){
        var q = lbWorldToPx(st2.center.x, st2.center.y, main.map);
        pts.push({x:q.x, y:q.y});
      }
    });
    if(pts.length){
      var cx=0, cy=0;
      pts.forEach(function(p){ cx+=p.x; cy+=p.y; });
      cx/=pts.length; cy/=pts.length;
      var R=0;
      pts.forEach(function(p){ R = Math.max(R, Math.hypot(p.x-cx, p.y-cy)); });
      R += 1.8; // 边距
      var dia = R*2;
      h += '<div class="settle-map"><img src="'+LB_MAP_BASE+main.map.img+LB_MAP_EXT+'" data-lbasset="'+LB_MAP_BASE+main.map.img+LB_MAP_EXT+'" alt="" loading="lazy" onerror="this.parentNode.style.display=&quot;none&quot;"><div class="settle-dot cluster-zone" style="left:'+((cx-R).toFixed(2))+'%;top:'+((cy-R).toFixed(2))+'%;width:'+dia.toFixed(2)+'%;height:'+dia.toFixed(2)+'%"></div></div>';
    }
  }
  h += '</div>';
  // 右侧竖排各聚落独立按钮（可点击进入各自详情）
  h += '<div class="settle-cluster-side">';
  clu.forEach(function(it){
    var c2 = it.mRel; // v181：匹配数
    var e2 = it.mPod;
    var sic = lbSettleCntIcons();
    // 0 值一侧不显示（数字+图标）
    var c2h = c2>0 ? sic.rel+c2 : '';
    var e2h = e2>0 ? sic.pod+e2 : '';
    // v181+v229：无匹配生物但该聚落有匹配基因——显示 ✦ 标记（统一星星，与 tab 基因角标一致）
    var g2h = (it.hasGene && !c2 && !e2) ? '<span style="color:#a78bfa">✦</span>' : '';
    h += '<div class="settle-btn side-btn" data-k="'+it.key+'" onclick="lbOpenSettle(this)">'
      + '<span class="settle-info">'+lbMdiSvg('mdi-tent', 12)
      + '<span class="settle-name">'+lbSettleName(it.settle)+'</span>' // v183：统一归属名称
      + '<span class="settle-cnt">'+c2h+(c2h&&e2h?' ':'')+e2h+(e2h&&g2h?' ':'')+g2h+'</span></span></div>';
  });
  h += '</div></div>';
  return h;
}

// 聚落大按钮 HTML（圆角矩形，min/max-width）：名称+坐标+数量；scattered/无聚落特殊样式
// v774：聚落海拔带（该服全部带有效 z 坐标的 rec min~max，容器/离散通用；缓存）——v769 依赖 settle.center.z 常缺失导致无色

function lbFoodName(cls){ // 2026-09-04 v747：肉只分 生肉/熟肉；其余果/蔬/蛋按映射

// v623：浮窗 = 自动列出所有我的未成年（默认全部不关注），每张卡右上角点眼睛=关注/取消；已关注卡随 ArkGetDino 实时覆盖成长/属性
function lbWatchCandidates(){
  var d = LB._cache && LB._cache.data;
  if(!d || !Array.isArray(d.recs)) return [];
  if(!LB.curPid) return []; // 身份未识别不列出（隐私）
  var curPid = lbCurPid();
  var playerSet = curPid ? lbPlayerTribes(d.tribesByServer||{}, curPid) : null;
  var out = [];
  for(var i=0;i<d.recs.length;i++){
    var r = d.recs[i];
    if(!r) continue;
    if(r.source==='egg'||r.source==='embryo') continue;
    if(!(r.dinoId1||r.dinoId2)) continue;
    // v639：仅未成年 + 已关注（未取消）即使已成年也保留显示（用户 2026-09-03）
    if(!lbGrowthStage(r) && !lbWatchHas(r.server, r.dinoId1||r.dinoId2)) continue;
    if(lbContainerTypeOf(r)!=='released') continue; // v625：只显示放出的未成年（用户 2026-09-02；可 get_dino 实时查成长）
    if(playerSet && !lbIsPlayerRec(r, playerSet, curPid)) continue;
    if(LB.curClass && !lbSpeciesMatch(r, LB.curClass)) continue; // v640：关注浮窗按当前选物种过滤（用户 2026-09-03）
    out.push(r);
  }
  if(!LB._watchList) LB._watchList = lbWatchLoad();
  out.sort(function(a,b){ // 已关注在前，其余按等级降序
    var _a = lbWatchHas(a.server, a.dinoId1||a.dinoId2) ? 1 : 0;
    var _b = lbWatchHas(b.server, b.dinoId1||b.dinoId2) ? 1 : 0;
    if(_a!==_b) return _b-_a;
    return (Number(b.level)||0)-(Number(a.level)||0);
  });
  return out;
}

async function lbWatchTick(){
  var list = LB._watchList || [];
  if(!list.length || !LB._watchOpen || LB._watchBusy) return;
  LB._watchBusy = true;
  try{
    for(var i=0;i<list.length;i++){
      if(!LB._watchOpen) break;
      var x = list[i];
      try{
        var resp = await fetch(LB_API + '/api/get_dino', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({server:x.sv, dino1:x.d1, dino2:x.d2}) });
        var j = await resp.json();
        var live = { found: !!(j && j.ok && j.found), ts: Date.now() };
        if(j && typeof j.babyAge === 'number') live.ba = j.babyAge;
        if(j && j.level !== undefined && j.level !== null) live.level = j.level;
        if(j && j.name !== undefined) live.name = j.name;
        if(j && typeof j.statValues === 'object' && j.statValues !== null){
          live.arr = { sv: lbWatchDictToArr(j.statValues), csv: lbWatchDictToArr(j.currentStatValues), sp: lbWatchDictToArr(j.statPoints), sm: lbWatchDictToArr(j.statMutations) };
        }
        LB._watchLive[lbWatchKey(x.sv, x.d1)] = live;
        lbWatchPatchRec(x, j); // v621：写回缓存 rec（主列表卡随刷新更新数据）
      }catch(e){}
    }
  }catch(e){}
  LB._watchBusy = false;
  // v623：只写回缓存 rec（主列表下次自然渲染时用新数据），不再轻量重渲染主视图（用户 2026-09-02）
  if(LB._watchOpen) lbWatchRender();
}

function lbCollectUnnamedReleased(settleKey){
  var out = [];
  var data = (LB._cache && LB._cache.data) || null;
  if(!data || !Array.isArray(data.recs) || !settleKey) return out;
  var sep = settleKey.indexOf('|');
  if(sep < 0) return out;
  var srv = settleKey.slice(0, sep), sub = settleKey.slice(sep+1);
  data.recs.forEach(function(r){
    if(lbContainerTypeOf(r)!=='released') return;
    if(!r.dinoId1 || !r.dinoId2) return;
    if(!lbIsUnnamed(r)) return;
    var s = lbSettlementOf(r);
    if(!s || s.server!==srv) return;
    var m = s.scattered ? 'scattered' : s.setId;
    if(m!==sub) return;
    out.push(r);
  });
  return out;
}

function lbCryoBaseUrl(abbr){ return DINO_JSON + abbr + '_cryo.json'; }

async function lbTriggerSaveWorld(abbr){
  try{
    var ac = new AbortController();
    var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 20000);
    var r;
    try{ r = await fetch(LB_API + '/api/save_world?server=' + encodeURIComponent(abbr), { method: 'POST', signal: ac.signal }); }

    finally{ clearTimeout(_t); }
    return !!(r && r.ok);

// 等 cryo.json.gz Last-Modified 变化（相对触发前基线）；超时 40s（最慢 Isl ≤30s）
async function lbWaitCryoUpdated(abbr, oldLm){
  var deadline = Date.now() + 40000;
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, (LB.POLL_MS || 400)); });
    var now = await lbCryoLM(abbr);
    if(now && now !== LB_LM_404 && now !== oldLm) return true;
    if(oldLm === LB_LM_404 && now && now !== LB_LM_404) return true; // 之前文件缺失→现在出现
  }
  return false;
}
// 单台增量加载并合并进缓存（先到先加载）：lbLoad([abbr]) 只返回该台 recs → 与旧缓存合并替换该台
async function lbLoadOneServer(abbr){
  try{
    var oldData = (LB._cache && LB._cache.data) || null;
    if(!oldData || !Array.isArray(oldData.recs)) return;
    var d = await lbLoad([abbr], oldData, null);
    if(!d || !Array.isArray(d.recs)) return; // 被新下载取代
    var out = {
      recs: oldData.recs.filter(function(r){ return r.server !== abbr; }).concat(d.recs),
      tribesByServer: Object.assign({}, oldData.tribesByServer || {}),
      worldNowByServer: Object.assign({}, oldData.worldNowByServer || {}),
      players: oldData.players || [],
      structures: oldData.structures || [],
      geneDevices: oldData.geneDevices || {},
      _schemaVer: oldData._schemaVer || 10
    };
    if(d.tribesByServer && d.tribesByServer[abbr]) out.tribesByServer[abbr] = d.tribesByServer[abbr];
    if(d.worldNowByServer && d.worldNowByServer[abbr] !== undefined) out.worldNowByServer[abbr] = d.worldNowByServer[abbr];
    var pm = {};
    (oldData.players || []).forEach(function(p){ if(p && p.eosId) pm[p.eosId] = p; });
    (d.players || []).forEach(function(p){ if(p && p.eosId) pm[p.eosId] = p; });
    out.players = Object.keys(pm).map(function(k){ return pm[k]; });
    if(d.structures && d.structures.length) out.structures = (oldData.structures || []).filter(function(s){ return s.server !== abbr; }).concat(d.structures);
    if(d.geneDevices && d.geneDevices[abbr]) out.geneDevices[abbr] = d.geneDevices[abbr];
    out._lm = Object.assign({}, oldData._lm || {});
    if(d._lm && d._lm[abbr]) out._lm[abbr] = d._lm[abbr];
    LB._cache = { data: out, ts: Date.now() };
    try{ lbCacheSet(out); }catch(e){}
    lbRenderView(out, lbPlayer(), LB.curClass || '');
  }catch(e){}
}

      var cryoLm = {};
      await Promise.all(sel.map(function(abbr){
        return lbCryoLM(abbr).then(function(lm){ cryoLm[abbr] = lm; }).catch(function(){ cryoLm[abbr] = null; });
      }));
      // 0b. 并行触发 SaveWorld
      await Promise.all(sel.map(function(abbr){ return lbTriggerSaveWorld(abbr); }));
      // 0c. 逐台等 cryo 更新（40s 超时）；哪台先更新就先加载哪台（串行队列，防 lbLoad _seq 互斥作废）
      var loadChain = Promise.resolve();
      var _svDone = 0;
      await Promise.all(sel.map(function(abbr, i){
        return lbWaitCryoUpdated(abbr, cryoLm[abbr] || null).then(function(done){
          if(done){
            segs[i].style.background = '#38bdf8'; // 存档已落盘
            _svDone++;
            txt.textContent = LB.servName(abbr)+' 存档已落盘，加载数据中…';
            loadChain = loadChain.then(function(){ return lbLoadOneServer(abbr); });
          } else {
            segs[i].style.background = '#f59e0b'; // cryo 超时未更新：标记跳过，继续原流程
            txt.textContent = LB.servName(abbr)+' cryo 超时未更新，继续刷新…';
          }
        });
      }));
      await loadChain;
      if(_svDone) txt.textContent = '✅ 存档完成（'+_svDone+'/'+sel.length+'），开始刷新已放出…';
    }
    // 2026-08-28 优化：恢复并行刷新——后端已改为每台写独立状态文件 refresh_status_{abbr}.json，
    // 彻底解决单文件 refresh_status.json 并发覆盖根因（之前并行全失败）。并行触发所有服务器
    // （后端线程池 6 并发 RCON），各自等待独立状态文件 + tamed savedAt，总耗时 ≈ 单台而非 4×。
    // 2026-08-28 修复：savedAt 基线必须在「触发前」读取——RCON 触发快（实测 3.2s 内 tamed 已更新），
    // 若触发后才读基线，基线已是新值 → lbWaitTamed 永远等不到变化 → 30s 超时全失败（实测 4 台全红）。
    // ① 先并行读取各台 savedAt 基线（触发前）
    var markers = {};
    await Promise.all(sel.map(function(abbr){
      return lbGetSavedAt(abbr).then(function(m){ markers[abbr] = m; })
        .catch(function(){ markers[abbr] = ''; });
    }));
    // ② 并行触发所有服务器（各自拿独立状态文件基线 ts + 触发 + 等 status）
    var results = await Promise.all(sel.map(function(abbr, i){
      segs[i].style.background = '#7c3aed'; // 进行中
      txt.textContent = '正在刷新 '+LB.servName(abbr)+'（'+(i+1)+'/'+sel.length+'）'+(noToken?' [webhook]':'');
      return lbTrigger(abbr).then(function(r){ return {abbr:abbr, idx:i, r:r}; })
        .catch(function(e){ return {abbr:abbr, idx:i, r:{ok:false, error:String(e)}}; });
    }));
    // ③ 并行等待各自 tamed savedAt 确认（用触发前基线，互不干扰）
    var waits = await Promise.all(results.map(function(item){
      var abbr = item.abbr, r = item.r || {};
      if(r.cooldown){ return {abbr:abbr, idx:item.idx, skipped:true, done:false}; }
      if(!r.ok){ return {abbr:abbr, idx:item.idx, skipped:false, done:false}; }
      var oldMarker = markers[abbr] || '';
      return lbWaitTamed(abbr, oldMarker).then(function(done){ return {abbr:abbr, idx:item.idx, skipped:false, done:done}; });
    }));
    // ④ 汇总更新进度条
    for(var i=0;i<waits.length;i++){
      var w = waits[i];
      if(w.done){ ok++; segs[w.idx].style.background='#22c55e'; }
      else if(w.skipped){ fail++; segs[w.idx].style.background='#f59e0b'; }
      else { fail++; segs[w.idx].style.background='#ef4444'; }
      txt.textContent=(w.done?'✅ ':(w.skipped?'⏭ ':'❌ '))+LB.servName(w.abbr)+'（'+(w.idx+1)+'/'+sel.length+'）';
    }
    txt.textContent='✅ 已刷新 '+ok+' 台，失败/跳过 '+fail+' 台'+(noToken?'（webhook 模式）':'');
    btn.disabled=false;
    // v602：全部成功后 1s 直接关闭浮窗——不再依赖蛋刷新 finally（后端 EggProbe 可能卡，finally 迟迟不触发导致浮窗残留）
    if(ok === sel.length && fail === 0){
      setTimeout(function(){
        var o=document.querySelector('.lb-confirm-overlay');
        if(o) o.remove();
      }, 1000);
    }
    lbReloadIncremental(); // 增量重载（并行 + 未变化文件复用）
    // v525：选中服务器同步刷新蛋信息（后端 EggProbe 实时刷全图蛋 → 重拉 egg 数据）
    // v542：EggProbe 必须延迟——同服 ArkTamedDinos 导出 tamed.json 期间并发 EggProbe RCON 会竞争游戏存档，
    // 打断导出导致 tamed.json 只生成部分数据（Ext 实测 150/557）→ 前端重载后放出生物骤减 → 小聚落消失
    try{
      await new Promise(function(res){ setTimeout(res, 5000); }); // 等 tamed 导出/重载稳定
      await lbEggProbe(sel);
    }catch(e){}
    setTimeout(function(){ if(progEl) progEl.style.display='none'; }, 4000);
  }finally{
    LB._tamedRefreshing = false; // 无论成功/异常，刷新结束都恢复可关闭浮窗
    // v602：蛋刷新（lbEggProbe）可能在后端卡住，不在此处依赖 finally 自动关闭（浮窗已由上方成功后 1s 调度关闭）
  }
}
// v525：选中服务器实时刷新蛋信息——后端 EggProbe（TransferIdentityFix.EggProbe）刷全图蛋 → 重拉 egg 数据
async function lbEggProbe(sel){
  if(!sel || !sel.length) return;
  try{
    // ① 并行触发后端 EggProbe（独立状态文件 egg_probe_status_{abbr}.json）
    await Promise.all(sel.map(function(abbr){
      return fetch(LB_API + '/api/refresh_eggs?server=' + encodeURIComponent(abbr), { method:'POST' })
        .then(function(){ return true; }).catch(function(){ return false; });
    }));
    // ② 等 exe 生成/更新蛋文件（3s 兜底）
    await new Promise(function(res){ setTimeout(res, 3000); });
    // ③ 强制重拉 egg 数据并入视图（v527：force=true 绕过 IndexedDB 缓存）
    await lbLoadEggs(sel, true);
  }catch(e){}
}

// 更新「已放出数据时间」显示（刷新按钮左侧，低可视化）：取各服务器 tamed 文件 Last-Modified 的最大值
// _lm 格式：{ abbr:{cryo:'...', tamed:'...'}, ... }；不存在的文件为 LB_LM_404('__404__') 跳过
// 显示格式：今天 HH:MM / 之前 MM-DD HH:MM；无数据隐藏
function lbUpdateDataTime(){
  var data = LB._cache && LB._cache.data;
  var lm = (data && data._lm) ? data._lm : null;
  var maxTs = 0;
  if(lm){
    Object.keys(lm).forEach(function(abbr){
      var t = lm[abbr] && lm[abbr].tamed;
      if(!t || t === LB_LM_404) return;
      var ts = Date.parse(t);
      if(ts && ts > maxTs) maxTs = ts;
    });
  }
  if(!maxTs){ LB._dataTimeText=''; LB._dataTimeTitle=''; return; }
  var d = new Date(maxTs);
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours())+':'+pad(d.getMinutes());
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  LB._dataTimeText = sameDay ? hm : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
  LB._dataTimeTitle = '最近拉数据时间：' + d.toLocaleString();
  // 刷新浮窗内元素（如已打开）
  var rf = document.getElementById('lbDataTimeInModal');
  if(rf) rf.textContent = LB._dataTimeText;
  // 兼容旧 #lbDataTime（v109 已移除，保留防御）
  var el=document.getElementById('lbDataTime');
  if(el){ el.textContent=LB._dataTimeText; el.title=LB._dataTimeTitle; }
}
// 静默增量检查（启动后后台，2026-08-28）：HEAD 对比数据文件 Last-Modified，变化才重拉更新缓存渲染
// 解决「清缓存不清 IndexedDB」导致旧数据永不刷新的问题；无进度条不打扰，未变化零开销
function lbSilentRefresh(){
  if(LB._silentBusy) return;
  LB._silentBusy = true;
  var oldData = (LB._cache && LB._cache.data) ? LB._cache.data : null;
  var sel = LB.SERVERS.map(function(s){ return s.abbr; });
  lbLoad(sel, oldData, function(){}).then(function(data){
    if(!data) return;
    // v549：静默刷新同样并入已有蛋缓存（聚落构建含蛋容器，避免蛋后到触发重建卡顿）
    if(LB._eggCache){
      var _existE = {};
      data.recs.forEach(function(r){ if(r._isEgg || r.source==='egg'||r.source==='embryo') _existE[r.dinoId1]=1; }); // v645：识别补 _isEgg（wild 蛋去重）
      Object.keys(LB._eggCache).forEach(function(abbr){
        (LB._eggCache[abbr]||[]).forEach(function(e){
          if(e.dinoId1 && !_existE[e.dinoId1]){ data.recs.push(e); _existE[e.dinoId1]=1; }
        });
      });
    }
    var oldLm = (oldData && oldData._lm) ? oldData._lm : {};
    var newLm = data._lm || {};
    var changed = JSON.stringify(oldLm) !== JSON.stringify(newLm);
    if(changed){
      LB._cache = { data: data, ts: Date.now() };
      lbCacheSet(data);
      lbResolveIdentity();
      lbRenderView(data, lbPlayer(), LB.curClass||'');
      // v500：后台加载蛋数据（阶段一：仅缓存，展示 tab 后续接入）
      lbLoadEggs(LB.SERVERS.map(function(s){ return s.abbr; })).catch(function(){});
    }
  }).catch(function(){}).then(function(){ LB._silentBusy = false; });
}
// 增量重载：读 IndexedDB 旧缓存 → lbLoad 并行+Last-Modified 判断（未变化文件复用旧数据）→ 更新缓存渲染
function lbReloadIncremental(){
  var list=document.getElementById('lbList');
  if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 加载数据中...</div>';
  var sel=LB.SERVERS.map(function(s){return s.abbr;});
  // 旧数据源：内存缓存优先，否则 IndexedDB
  var oldPromise = LB._cache && LB._cache.data
    ? Promise.resolve(LB._cache.data)
    : lbCacheGet().then(function(c){ return (c && c.data) ? c.data : null; });
  oldPromise.then(function(oldData){
    lbLoad(sel, oldData, function(p){ // v207：刷新也显示下载进度（分段条）
      if(list){
        if(p.phase==='head') list.innerHTML='<div style="text-align:center;padding:30px;color:#555">⏳ 检查数据更新...</div>';
        else { if(!document.getElementById('lbDlBar')) list.innerHTML=lbDlProgHtml(p.total); lbDlProgUpdate(p.done,p.total,p.active); }
      }
    }).then(function(data){
      if(!data) return; // v215：被新下载取代，跳过
      // v549：重载时先并入已有蛋缓存——聚落构建直接含蛋容器（避免蛋后到触发全量重建卡顿；刷新不再卡）
      if(LB._eggCache){
        var _existE = {};
        data.recs.forEach(function(r){ if(r._isEgg || r.source==='egg'||r.source==='embryo') _existE[r.dinoId1]=1; }); // v645：识别补 _isEgg（wild 蛋去重）
        Object.keys(LB._eggCache).forEach(function(abbr){
          (LB._eggCache[abbr]||[]).forEach(function(e){
            if(e.dinoId1 && !_existE[e.dinoId1]){ data.recs.push(e); _existE[e.dinoId1]=1; }
          });
        });
      }
      LB._cache={ data:data, ts:Date.now() };
      lbCacheSet(data);
      lbRenderView(data, lbPlayer(), LB.curClass||'');
      // v500：后台加载蛋数据（阶段一：仅缓存，展示 tab 后续接入）
      lbLoadEggs(LB.SERVERS.map(function(s){ return s.abbr; })).catch(function(){});
    }).catch(function(e){
      if(list) list.innerHTML='<div style="text-align:center;padding:30px;color:#f87171">❌ 加载失败：'+e+'</div>';
    });
  });
}

function lbIconForDinoClass(dinoClass){
  if(!dinoClass || !LB_ICON_BY_NAME) return '';
  // v231：Ghost 系列映射基础生物图标（Ghost_Rex_Character_BP_C → Rex_Character_BP_C → 霸王龙图标）
  if(/^Ghost_/.test(dinoClass)){
    var _g = lbIconForDinoClass(dinoClass.replace(/^Ghost_/,''));
    if(_g) return _g;
  }
  var sp=findSpeciesByClass(dinoClass);
  var eng=(sp&&sp.name)?sp.name:dinoClass;
  // 特殊名（载具/新生物等显示名覆盖）：用特殊名里的英文匹配图标（如 Train_Character_C → Train → Train_Engine）
  if(LB_SPECIAL_NAMES[dinoClass]){
    var sm=LB_SPECIAL_NAMES[dinoClass].match(/\((.+)\)$/);
    if(sm) eng=sm[1];
  }
  // 拆前缀（提前计算，供特例表兼容基础名）
  var st=lbStripPrefix(eng);
  var base=st.base || eng;
  // 图标特例表（精确指定：火车头/木筏/摩托艇/碎石熊等；兼容剥离前缀后的基础名如 X-Woolly Rhino→Woolly Rhino）
  var spName=LB_ICON_SPECIAL[eng] || (base!==eng ? LB_ICON_SPECIAL[base] : '');
  if(spName && LB_ICON_BY_NAME[spName]) return LB_ICON_BY_NAME[spName];
  if(LB_ICON_BY_NAME[eng]) return LB_ICON_BY_NAME[eng];
  // biology 命名习惯：空格→下划线（Terror_Bird/Snow_Owl/Dung_Beetle）
  var engU=eng.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[engU]) return LB_ICON_BY_NAME[engU];
  // 主词（拆前缀后）匹配 + 下划线
  if(LB_ICON_BY_NAME[base]) return LB_ICON_BY_NAME[base];
  var baseU=base.replace(/ /g,'_');
  if(LB_ICON_BY_NAME[baseU]) return LB_ICON_BY_NAME[baseU];
  // 括号主名（如 Drakeling (Spring) → Drakeling，避免包含匹配误配 Dragon）
  var baseMain=base.replace(/\s*\(.*\)$/,'');
  if(baseMain && baseMain!==base){
    if(LB_ICON_BY_NAME[baseMain]) return LB_ICON_BY_NAME[baseMain];
    var mainU=baseMain.replace(/ /g,'_');
    if(LB_ICON_BY_NAME[mainU]) return LB_ICON_BY_NAME[mainU];
  }
  // 头图兜底（biology 命名：RaptorHead/DodoHead/KairukuHead；Rex 特殊 TRexHead；GigantoraptorHead_Icon）
  var heads=[baseU+'Head', 'T'+baseU+'Head', baseU+'Head_Icon'];
  for(var hi=0; hi<heads.length; hi++){
    if(LB_ICON_BY_NAME[heads[hi]]) return LB_ICON_BY_NAME[heads[hi]];
  }
  var c=dinoClass.replace(/_C$/,'');
  for(var k in LB_ICON_BY_NAME){
    if(k.indexOf(c)>=0 || c.indexOf(k)>=0) return LB_ICON_BY_NAME[k];
  }
  // 规范化匹配：去下划线/连字符/空格小写（SIR-5rM8→Unassembled_Sir_5rM8、Reaper King→Reaper、Train→Train_Engine、Sloop→HUD_TOF_Sloop_Icon）
  var engNorm=(eng||'').replace(/[_\-\s]/g,'').toLowerCase();
  if(engNorm){
    for(var k2 in LB_ICON_BY_NAME){
      var kNorm=k2.replace(/[_\-\s]/g,'').toLowerCase();
      if(kNorm.indexOf(engNorm)>=0 || engNorm.indexOf(kNorm)>=0) return LB_ICON_BY_NAME[k2];
    }
  }
  return '';
}
function lbBuildClassMap(){

  if(!LB._cache || !LB._cache.data || !LB._cache.data.recs) return map;
  var curPid=lbCurPid();
  var playerSet=curPid?lbPlayerTribes(LB._cache.data.tribesByServer,curPid):null;
  LB._cache.data.recs.forEach(function(r){

// 读取 HA 前端 token（页面部署在 HA /local/ 同域时可用；HA 前端登录后存于 localStorage.hassTokens）
function lbHaToken(){
  try{
    var t = localStorage.getItem('hassTokens');
    if(!t) return null;
    var parsed = JSON.parse(t);
    // 兼容两种格式：数组 [{access_token}]（旧）与对象 {access_token}（新）
    if(Array.isArray(parsed) && parsed.length && parsed[0] && parsed[0].access_token) return parsed[0].access_token;
    if(parsed && parsed.access_token) return parsed.access_token;
    return null;
  }catch(e){ return null; }
}
// 手机 HA Companion App：通过官方 externalAuth bridge 获取 token（回调协议，非 Promise）
// V1: window.externalApp.getExternalAuth('{"callback":"externalAuthSetToken","force":false}') → 原生调 window.externalAuthSetToken(true, authJson)
// V2: window.externalAppV2.postMessage({type:'getExternalAuth', payload:{callback,force}}) → 同上回调
function lbAppToken(){
  return new Promise(function(resolve){
    // 关键：iframe 内（self!==top）bridge 消息必然被 V2 origin 校验丢弃（!isMainFrame），
    // 直接返回 null 跳过，避免白等 6s 超时（App 内 Lovelace iframe 场景 12s 无提示空窗的根因）
    try{ if(window.self !== window.top) return resolve(null); }catch(e){}
    try{
      var hasV1 = window.externalApp && typeof window.externalApp.getExternalAuth === 'function';
      var hasV2 = window.externalAppV2 && typeof window.externalAppV2.postMessage === 'function';
      if(!hasV1 && !hasV2) return resolve(null);
      // 安装回调：原生通过它返回 token（auth 可能是 JSON 字符串或对象）
      window.externalAuthSetToken = function(ok, auth){
        var t = null;
        if(ok && auth){
          if(typeof auth === 'string'){ try{ t = JSON.parse(auth); }catch(e){ t = null; } }
          else t = auth;
          resolve((t && t.access_token) || null);
        } else {
          resolve(null);
        }
        clearTimeout(lbAppToken._tm);
      };
      var cb = 'externalAuthSetToken';
      if(hasV2){
        window.externalAppV2.postMessage(JSON.stringify({ type:'getExternalAuth', payload:{ callback:cb, force:false } }));
      } else {
        window.externalApp.getExternalAuth(JSON.stringify({ callback:cb, force:false }));
      }
      // 超时兜底（原生无响应 → 继续 fallback）
      lbAppToken._tm = setTimeout(function(){ resolve(null); }, 6000);
    }catch(e){ resolve(null); }
  });
}
// 同源 iframe 读取父框架 token：页面若嵌入 Lovelace iframe（与顶层同源），
// 顶层 HA 前端在 App 内能通过 externalAuth 拿到 token（存在 window.hassConnection → {auth, conn}），
// 同源 iframe 可直接访问 window.parent.hassConnection 读取 auth.accessToken
// 作用域：仅本页被 iframe 嵌入时尝试；直接顶层打开时 window.parent===window 自动跳过
function lbParentToken(){
  return new Promise(function(resolve){
    try{
      var p = window.parent;
      if(!p || p === window || !p.hassConnection || typeof p.hassConnection.then !== 'function'){
        return resolve(null);
      }
      var done = false;
      var tm = setTimeout(function(){ if(!done){ done = true; resolve(null); } }, 5000);
      p.hassConnection.then(function(conn){
        if(done) return;
        done = true; clearTimeout(tm);
        var auth = conn && conn.auth;
        var t = (auth && auth.accessToken) || (auth && auth.data && auth.data.access_token) || null;
        resolve(t || null);
      }).catch(function(){
        if(done) return;
        done = true; clearTimeout(tm);
        resolve(null);
      });
    }catch(e){ resolve(null); }
  });
}
// 获取有效 HA token：手机 App 走 externalAuth bridge；iframe 嵌入读父框架 token；浏览器读 localStorage（access_token 过期则用 refresh_token 换新并写回）
async function lbHaTokenRefresh(){
  try{
    var appTok = await lbAppToken();
    if(appTok) return appTok;
  }catch(e){}
  try{
    var parentTok = await lbParentToken();
    if(parentTok) return parentTok;
  }catch(e){}
  try{
    var raw = localStorage.getItem('hassTokens');
    if(!raw) return null;
    var t = JSON.parse(raw);
    if(Array.isArray(t)){ t = t[0] || null; }
    if(!t || !t.access_token) return null;
    // 未过期直接返回（提前 60s 刷新）
    if(!t.expires || Date.now() < (Number(t.expires) - 60000)) return t.access_token;
    if(!t.refresh_token) return null;
    var form = new URLSearchParams();
    form.set('grant_type', 'refresh_token');
    form.set('refresh_token', t.refresh_token);
    if(t.clientId) form.set('client_id', t.clientId);
    var res = await fetch('/auth/token', { method: 'POST', body: form });
    if(!res.ok) return null;
    var nt = await res.json();
    if(!nt.access_token) return null;
    t.access_token = nt.access_token;
    t.token_type = nt.token_type || 'Bearer';
    if(nt.refresh_token) t.refresh_token = nt.refresh_token;
    t.expires_in = nt.expires_in || 1800;
    t.expires = Date.now() + (nt.expires_in || 1800) * 1000;
    localStorage.setItem('hassTokens', JSON.stringify(t));
    return t.access_token;
  }catch(e){ return null; }
}

// 解析静态状态文件内容（AppDaemon 经 shell_command 写入的是 base64 编码 JSON；兼容纯 JSON）
function lbParseStatusFile(text){
  try{
    var s = String(text||'').trim();
    if(!s) return null;
    // 尝试直接 JSON
    try{ return JSON.parse(s); }catch(e){}
    // base64 解码后再 JSON
    try{
      var dec = decodeURIComponent(escape(atob(s)));
      return JSON.parse(dec);
    }catch(e2){}
    return null;
  }catch(e){ return null; }
}
// 免认证轮询 AppDaemon 写入的静态状态文件（手机 App 无 token 也能读）：精确判断 ok/cooldown/error
// 2026-08-28 优化：新架构读每台独立状态文件 refresh_status_{abbr}.json（后端同时写单文件+独立文件，
// 独立文件保证多台并行时互不覆盖——单文件并发覆盖是之前并行全失败的根因）
async function lbWaitStatusFile(abbr, oldTs){
  var deadline = Date.now() + 15000;
  // 新架构：独立文件路径；旧架构：单文件（兼容）
  var sfPath = (LB_ARCH === 'new')
    ? (LB_STATUS + '/refresh_status_' + abbr + '.json?cb=' + Date.now())
    : (LB_STATUS + '/refresh_status.json?cb=' + Date.now());
  while(Date.now() < deadline){
    await new Promise(function(r){ setTimeout(r, 300); }); // 2026-08-28 提速：800ms→300ms，后端 RCON 已修复快返回，减少前端等待
    try{
      var sf = await fetch(sfPath, { cache: 'no-store' });
      if(sf.ok){
        var obj = lbParseStatusFile(await sf.text());
        if(!obj) continue;
        var attrs = obj.attributes || {};
        if(attrs.server === abbr && attrs.ts && attrs.ts !== oldTs){
          if(attrs.cooldown) return {cooldown:true, ok:false, ts:attrs.ts};
          if(attrs.ok) return {cooldown:false, ok:true, ts:attrs.ts};
          return {cooldown:false, ok:false, error: attrs.error || 'RCON failed', ts:attrs.ts};
        }
      }
    }catch(e){}
  }
  return {cooldown:false, ok:false, error:'timeout'};
}
// 读取静态状态文件当前值（触发前基线 ts 用）
async function lbGetStatusFile(abbr){

    }
  }catch(e){}
  return null;
}
// 触发：优先调 HA script.refresh_tamed（发事件）→ AppDaemon RCON；无 token（手机 App）走免认证 webhook
// 2026-08-28 修复：新架构（LB_ARCH==='new'）完全脱离 HA，无 HA token → 直接走 webhook 接口（后端无需认证）；fetch 加 AbortController 超时防永久卡
async function lbTrigger(abbr){
  if(LB_ARCH === 'new'){
    // 新架构：直接走免认证 webhook（data.whiterober.ccwu.cc/api/webhook/refresh_tamed，无需 token）
    try{
      var baseTs = await lbGetStatusFile(abbr);
      var ac = new AbortController();
      var _t = setTimeout(function(){ try{ ac.abort(); }catch(e){} }, 20000); // 20s 超时：后端 RCON 同步阻塞时不再永久挂起
      var hw;
      try{ hw = await fetch(LB_API + '/api/webhook/refresh_tamed?server=' + encodeURIComponent(abbr), { method: 'POST', signal: ac.signal }); }
      catch(e){ return {ok:false, server:abbr, error:'timeout'}; }
      finally{ clearTimeout(_t); }
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      var st = await lbWaitStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 静态文件超时/无结果 → 仍按触发成功返回，交给 savedAt 兜底确认
      return {ok:true, server:abbr, webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  var token = await lbHaTokenRefresh();
  if(!token){
    // 无 token（手机 App / 未登录浏览器）：走免认证 webhook → 事件 refresh_tamed_request → AppDaemon RCON
    try{
      // 触发前记录静态状态文件基线 ts（时效判断：只接受本次触发后的新结果）
      var baseTs = await lbGetStatusFile(abbr);
      var hw = await fetch(LB_API + '/api/webhook/refresh_tamed?server=' + encodeURIComponent(abbr), { method: 'POST' });
      if(!hw.ok) return {ok:false, server:abbr, error:'webhook HTTP '+hw.status};
      // 轮询免认证静态状态文件（AppDaemon 写入）：精确判断 ok/cooldown/error
      var st = await lbWaitStatusFile(abbr, baseTs);
      if(st.cooldown) return {ok:true, server:abbr, cooldown:true, webhook:true};
      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 静态文件超时/无结果 → 仍按触发成功返回，交给 savedAt 兜底确认
      return {ok:true, server:abbr, webhook:true};
    }catch(e){ return {ok:false, server:abbr, error:String(e)}; }
  }
  try{
    // 触发前记录 sensor 基线 ts（时效判断：只接受本次触发后的新结果）
    var baseTs = null;
    try{
      var b = await fetch(LB_API + '/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
      if(b.ok){
        var bj = await b.json();
        var ba = bj.attributes || {};
        if(ba.server === abbr) baseTs = ba.ts;
      }
    }catch(e){}
    var res = await fetch(LB.SVC_REFRESH, {
      method:'POST',
      headers:{'Authorization':'Bearer '+token, 'Content-Type':'application/json'},
      body: JSON.stringify({server: abbr})
    });
    if(!res.ok) return {ok:false, server:abbr, error:'HTTP '+res.status};
    // 轮询 AppDaemon 写入的 RCON 结果（含 cooldown），最长 15s；只接受 ts 变化的本次结果
    var deadline = Date.now() + 15000;
    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 800); });
      var st;
      try{
        st = await fetch(LB_API + '/api/states/sensor.refresh_tamed_status', { headers: { 'Authorization': 'Bearer ' + token } });
        if(st.ok){
          var obj = await st.json();
          var attrs = obj.attributes || {};
          if(attrs.server === abbr && attrs.ts !== baseTs){
            if(attrs.cooldown) return {ok:true, server:abbr, cooldown:true};
            if(attrs.ok) return {ok:true, server:abbr};
            return {ok:false, server:abbr, error: attrs.error || 'RCON failed'};
          }
        }
      }catch(e){}
    }
    // 超时未获取到本次状态 → 按成功让 savedAt 轮询确认兜底
    return {ok:true, server:abbr};
  }catch(e){
    return {ok:false, server:abbr, error:String(e)};
  }
}
// 从 HA API 读取服务器主题（名称/图标直接用 apps.yaml server_themes → sensor.asa_server_themes 属性），失败回退硬编码
// 2026-08-28 修复：新架构（LB_ARCH==='new'）直连后端免认证 /api/themes（data.whiterober.ccwu.cc，无需 token）；旧架构保留 HA sensor API
function lbLoadThemes(){
  return new Promise(function(resolve){

      ? fetch(LB_API + '/api/themes', { method: 'GET' })
      : new Promise(function(res){
          var tokenPromise = LB._tok ? Promise.resolve(LB._tok) : lbHaTokenRefresh();
          tokenPromise.then(function(token){
            if(!token){ res(Promise.resolve({ok:false})); return; }
            res(fetch(LB_API + '/api/states/sensor.asa_server_themes', { headers: { 'Authorization': 'Bearer ' + token } }));
          }, function(){ res(Promise.resolve({ok:false})); });
        });
    fetchUrl.then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(s){
      // 新架构 /api/themes 返回 {ok, server_themes:{}}；旧架构 sensor 返回 {attributes:{server_themes:{}}}
      var th = (s && s.server_themes) ? s.server_themes : ((s && s.attributes && s.attributes.server_themes) ? s.attributes.server_themes : null);
      if(!th) throw 0;
      var arr = [];
      Object.keys(th).forEach(function(k){
        var v = th[k] || {};
        arr.push({ abbr: k, name: v.name || k, icon: v.emoji || '' });
      });

      if(st.ok) return {ok:true, server:abbr, webhook:true};
      // 状态超时/无结果：直接跳过该服（不再乐观等文件 30s；2026-08-12 用户确认，服务器重启时快速跳过）

    while(Date.now() < deadline){
      await new Promise(function(r){ setTimeout(r, 300); }); // 2026-08-28 提速：800ms→300ms（对齐 tamed）
      var st;

        st = await fetch(LB_API + '/api/states/sensor.search_wild_status', { headers: { 'Authorization': 'Bearer ' + token } });

async function lbWaitWild(abbr, species, oldMarker){

// 找距离玩家最近的野生龙（欧氏距离 x/y/z；服务器维度加权：玩家所在服优先）
async function lbNearestWild(pos, excludeId){
  var cls = LB.curClass;
  var wc = (LB._wildCache && LB._wildCache[cls]) || null;
  if(!wc) return null;
  var species = cls.replace(/_C$/,'');
  var best = null, bestDist = Infinity;
  var servers = [pos.server].concat(LB.SERVERS.map(function(s){ return s.abbr; }));
  var tried = {};
  for(var i=0;i<servers.length;i++){
    var abbr = servers[i];
    if(abbr==='Bob' || tried[abbr]) continue;
    tried[abbr] = true;
    var ent = wc[abbr];
    if(!ent || !Array.isArray(ent.dinos)) continue;
    // 玩家不在该服时，该服候选仅用于兜底（权重放大：非所在服距离 +1e9）
    var off = (abbr === pos.server) ? 0 : 1e9;
    for(var j=0;j<ent.dinos.length;j++){
      var w = ent.dinos[j];
      if(w.dinoClass !== cls) continue;
      if(!w.id1 && !w.id2) continue;
      if(excludeId && String(w.id1)+'_'+String(w.id2) === excludeId) continue; // v315：排除已死/当前目标（旧缓存仍含死目标）
      if(!lbTrackableWild(w)) continue; // v782：剔除未成年/无坐标（追踪最近不应选中分布地图上没有的幼龙）
      var dx = Number(w.x||0) - pos.x, dy = Number(w.y||0) - pos.y, dz = Number(w.z||0) - pos.z;
      var d = Math.sqrt(dx*dx + dy*dy + dz*dz) + off;
      if(d < bestDist){ bestDist = d; best = w; }
    }
  }
  return best;
}

async function lbHandleTrackLost(st, reason){

  } else lbDiag('LOST pos 一次查到 srv='+pos.server); // v781 埋点

    lbTrackStop(true);
    return;
  }

    return;

  if(String(dino.id1)+'_'+String(dino.id2) === st.dinoId) return; // 同一条（无其他候选）

  if(ok2){
    LB._trackState = { tracking:true, server: st.server, dinoId: String(dino.id1)+'_'+String(dino.id2), dino: dino, player: st.player, pos: pos, from: st.from||'nearest' }; // v331：自动切换保持来源
    LB._trackMiss = 0; LB._trackSwitchAt = Date.now(); // v780：自动切换成功同样重置计数+开宽容窗口
    lbDiag('AUTO 切到 did='+String(dino.id1)+'_'+String(dino.id2)+' lv='+dino.level); // v781 埋点

// ===== v754-P4：追踪顺路 route —— 启动/首次切换时从起点对该服全部同物种候选做最近邻+2-opt 近似 TSP，停止前固定不重排 =====
LB._trackRoute = null; // {server, arr:[dino...]} 顺路访问序列（按访问序；死亡/已访问从 arr 剔除）

function lbBuildTrackRoute(st){

  var wc = (LB._wildCache && LB._wildCache[cls] && LB._wildCache[cls][st.server]) || null;

// 检查该物种哪些服务器缺野生缓存（筛选时自动补拉服务器上的 _wild 全图文件，仅读不触发 RCON）

  LB.SERVERS.forEach(function(s){
    if(s.abbr==='Bob') return;

  });
  return missing;

// 拉取缺失服务器的 _wild 全图文件（存在且有数据才进库）
async function lbFetchWildFiles(cls, servers){
  var wild = LB._wildCache = LB._wildCache || {};
  if(!wild[cls]) wild[cls] = {};
  var species = cls.replace(/_C$/,'');
  var updated = false;
  for(var i=0;i<servers.length;i++){
    var abbr = servers[i];
    try{
      var j = await authFetch(DINO_JSON + abbr + '_wild_' + encodeURIComponent(species) + '.json?cb=' + Date.now(), {}).then(function(r){ return r.json(); });
      if(j && j.savedAt && Array.isArray(j.dinos) && j.dinos.length){
        wild[cls][abbr] = { savedAt: j.savedAt, dinos: j.dinos };
        updated = true;
      }
    }catch(e){}
  }
  return updated;
}
// v123：野生 json 时间戳格式化（毫秒 → HH:MM；非当天 → MM-DD HH:MM；无 → -）
function lbFmtTs(ts){
  if(!ts) return '-';
  var d = new Date(Number(ts));
  if(isNaN(d.getTime())) return '-';
  var now = new Date();
  var pad = function(n){ return (n<10?'0':'')+n; };
  var hm = pad(d.getHours())+':'+pad(d.getMinutes());
  var sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  return sameDay ? hm : pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+hm;
}

    segs += '<line x1="'+pts[i].x.toFixed(2)+'%" y1="'+pts[i].y.toFixed(2)+'%" x2="'+pts[i+1].x.toFixed(2)+'%" y2="'+pts[i+1].y.toFixed(2)+'%" stroke="rgba(255,255,255,.95)" stroke-width="3"/>';

    if(p.cur){ marks += '<circle cx="'+_cx+'%" cy="'+_cy+'%" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>'; } // v776：白 ring 细点 + 组 filter 黑淡影（浅色地图可辨）
    if(!p.start && p.seq){ txts += '<text x="'+_cx+'%" y="'+_cy+'%" dx="7" dy="-7" fill="#fff" font-size="11" font-weight="bold" text-anchor="middle" style="paint-order:stroke" stroke="rgba(0,0,0,.9)" stroke-width="3">'+p.seq+'</text>'; } // v758：paint-order:stroke=先描边后填白字（修复黑描边盖字难看清）；dx/dy 偏移到点右上方不压点

  // v428：分布遮罩模式（LB._wildDistOpen）——点遮罩不关闭（只右上角关闭图标可关），不影响其它遮罩
  // v617：联盟地图模态（LB._alliModal：地图信息/成员分布）——同分布遮罩，点遮罩不关闭（点关闭按钮才关）
  if(LB._wildDistOpen || LB._alliModal || LB._routeHelpOpen) return;
  if(!e.target || !e.target.closest || !e.target.closest('.lb-card')){
    document.getElementById('lbBreedOverlay').style.display = 'none';

// v637：联盟黑名单（隐藏不想显示的联盟，页面维护；按联盟 id 字符串，需要时追加）
var LB_ALLI_BLOCK = ['640573105'];
function lbAlliBlocked(a){ return !!(a && LB_ALLI_BLOCK.indexOf(String(a.id)) >= 0); }
// ===== 联盟成员位置（2026-08-31，v531）=====
// 数据源：{abbr}_alliances.json（后端输出，members=部落id）；部落角色在 data.tribesByServer[abbr][tid].members
LB._alliancesByServer = null; // {abbr:{generatedMs,alliances:[{id,name,members,admins}]}}
LB._alliCancel = false;       // 查询取消标志
LB._onlineByServer = null;    // v532：{abbr:{players:[{eosId,name}],count,ts}}（ListPlayers 在线列表）

// 拉取所有服联盟文件（缓存；force 强制重拉——地图信息刷新按钮用，补回拉取失败/缺失的服）
async function lbLoadAlliances(force){
  if(LB._alliancesByServer && !force) return LB._alliancesByServer;
  var map = {};
  var tasks = (LB.SERVERS||[]).filter(function(s){ return s.abbr!=='Bob'; }).map(function(s){
    return fetch(DINO_JSON + s.abbr + '_alliances.json?cb=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && Array.isArray(j.alliances)) map[s.abbr] = j; })
      .catch(function(){});
  });
  await Promise.all(tasks);
  LB._alliancesByServer = map;
  return map;
}

// v532：触发所有服 ListPlayers（原生 RCON 在线玩家）→ 拉 {abbr}_online.json
async function lbLoadOnline(force){
  if(LB._onlineByServer && !force) return LB._onlineByServer;
  var tasks = (LB.SERVERS||[]).filter(function(s){ return s.abbr!=='Bob'; }).map(function(s){
    return fetch(LB_API + '/api/list_players?server=' + s.abbr + '&cb=' + Date.now(), {method:'POST'})
      .then(function(r){ return r.ok; }).catch(function(){ return false; });
  });
  await Promise.all(tasks);
  await new Promise(function(r){ setTimeout(r, 2000); }); // 等后端 RCON 写完状态文件
  var map = {};
  var gets = (LB.SERVERS||[]).filter(function(s){ return s.abbr!=='Bob'; }).map(function(s){
    return fetch(LB_STATUS + '/' + s.abbr + '_online.json?cb=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ if(j && j.attributes) map[s.abbr] = j.attributes; })
      .catch(function(){});
  });
  await Promise.all(gets);
  LB._onlineByServer = map;
  return map;
}

// 当前角色所在联盟（默认选中）
function lbMyAlliance(){
  var data = LB._cache && LB._cache.data;
  if(!data || !data.tribesByServer) return null;
  var mine = lbPlayerTribes(data.tribesByServer, LB.curPid);
  var keys = Object.keys(mine);
  for(var i=0;i<keys.length;i++){
    var k = keys[i]; var p = k.indexOf(':'); if(p<0) continue;
    var t = data.tribesByServer[k.slice(0,p)] && data.tribesByServer[k.slice(0,p)][k.slice(p+1)];
    if(t && Array.isArray(t.alliances) && t.alliances.length) return t.alliances[0];
  }
  return null;
}

// 收集联盟成员（联盟id → 各服部落 members 角色，按 pid 去重）
function lbCollectAllianceMembers(alliId){
  var data = LB._cache && LB._cache.data;
  var out = {};
  var map = LB._alliancesByServer || {};
  Object.keys(map).forEach(function(abbr){
    var j = map[abbr];
    (j.alliances||[]).forEach(function(a){
      if(String(a.id)!==String(alliId)) return;
      (a.members||[]).forEach(function(tid){
        var t = data && data.tribesByServer && data.tribesByServer[abbr] && data.tribesByServer[abbr][String(tid)];
        if(!t || !Array.isArray(t.members)) return;
        t.members.forEach(function(m){
          if(!m || m.pid===undefined || m.pid===null) return;
          var key = String(m.pid);
          if(!out[key]) out[key] = { pid:m.pid, name:m.name||'', eosId:m.eosId||'', tribes:[], alliName:a.name||'' }; // v566：记录成员来源联盟名（跨服收集时每页显示各自联盟）
          if(out[key].tribes.indexOf(abbr+':'+tid)<0) out[key].tribes.push(abbr+':'+tid);
        });
      });
    });
  });
  return Object.keys(out).map(function(k){ return out[k]; });
}

// pid → eosId（data.players roles 反查）
function lbPidToEos(pid){
  var data = LB._cache && LB._cache.data;
  if(!data || !Array.isArray(data.players)) return null;
  var s = String(pid);
  for(var i=0;i<data.players.length;i++){
    var pl = data.players[i];
    if(pl && pl.roles && typeof pl.roles==='object' && pl.roles[s]!==undefined) return pl.eosId;
  }
  return null;
}

// v532：只查在线成员——ListPlayers 已给出每成员所在服，仅对该服查 1 次 PlayerPos；离线直接跳过
async function lbAlliancePosQuery(members, online, token, onProgress){
  var eosToSrv = {};
  Object.keys(online).forEach(function(abbr){
    (online[abbr].players||[]).forEach(function(p){
      if(p && p.eosId && !eosToSrv[p.eosId]) eosToSrv[p.eosId] = abbr;
    });
  });
  var results = [];
  for(var i=0;i<members.length;i++){
    if(LB._alliCancel) break;
    var m = members[i];
    if(onProgress) onProgress({done:i, total:members.length, cur:m.name||('#'+m.pid)});
    var eos = m.eosId || lbPidToEos(m.pid);
    if(!eos){ results.push({pid:m.pid, name:m.name, pos:null, reason:'no_eos', alliName:m.alliName||''}); continue; }
    var srv = eosToSrv[eos];
    if(!srv){ results.push({pid:m.pid, name:m.name, pos:null, reason:'offline', alliName:m.alliName||''}); continue; } // 不在线：跳过
    var pos = await lbQueryPlayerPos(srv, token, eos);
    results.push({pid:m.pid, name:m.name, pos:pos, reason: pos?'found':'offline', alliName:m.alliName||''});
  }
  return results;
}

  // v537：eosId → 所在服（一个角色只可能在一个服在线，跨服取首个）
  var eosToSrv = {};
  Object.keys(online).forEach(function(abbr){

// v556：单服地图——该服全部在线成员批量查位置，标在同一张图（复用 lbAlliancePosRender 多成员渲染）
async function lbAllianceServerMap(abbr, alliId, alliName){
  var ov = document.getElementById('lbBreedOverlay');
  var body = document.getElementById('lbBreedOverlayBody');
  if(!ov || !body) return;
  var token = (LB_ARCH === 'new') ? 'new' : await lbHaTokenRefresh();
  if(!token){ lbToast('未登录'); return; }
  LB._alliCancel = false;
  var online = LB._onlineByServer || {};
  var eosToSrv = {};
  Object.keys(online).forEach(function(a){
    (online[a].players||[]).forEach(function(p){ if(p && p.eosId && !eosToSrv[p.eosId]) eosToSrv[p.eosId]=a; });
  });
  // v567：收集当前玩家所有联盟的在线成员（跨服去重）——点任一服按钮都能翻页查看全部在线成员分布
  var _d = LB._cache && LB._cache.data;
  var _mine = _d ? lbPlayerTribes(_d.tribesByServer, LB.curPid) : {};
  var _alliIds = {};
  Object.keys(_mine).forEach(function(k){
    var _sp = k.split(':');
    var _t = _d.tribesByServer[_sp[0]] && _d.tribesByServer[_sp[0]][_sp[1]];
    // v635：多联盟（A 方案）——收集当前玩家全部部落所属全部联盟，不再只取 alliances[0]
    if(_t && Array.isArray(_t.alliances)) _t.alliances.forEach(function(a){ if(a && a.id!==undefined && a.id!==null && !lbAlliBlocked(a)) _alliIds[String(a.id)]=1; }); // v637：联盟黑名单过滤
  });
  var members = [];
  Object.keys(_alliIds).forEach(function(aid){
    lbCollectAllianceMembers(aid).forEach(function(m){
      if(!members.some(function(x){ return String(x.pid)===String(m.pid); })) members.push(m);
    });
  });
  members = members.filter(function(m){
    var eos = m.eosId || lbPidToEos(m.pid);

  });

  members.forEach(function(m){

    if(!srv) return;
    var _tbs = _d && _d.tribesByServer && _d.tribesByServer[srv];
    if(!_tbs) return;
    Object.keys(_tbs).forEach(function(tid){
      var _t = _tbs[tid];
      if(!_t || !Array.isArray(_t.members)) return;
      var _has = _t.members.some(function(mm){ return String(mm.pid)===String(m.pid); });
      if(_has && Array.isArray(_t.alliances) && _t.alliances.length) m.alliName = _t.alliances[0].name || m.alliName;
    });
  });

  lbAlliancePosRender({id:alliId, name:alliName}, results, abbr); // v568：focusAbbr 进入自动滚到点击服页
  // v558：成员分布 1s 实时更新（每成员所在服查 1 次 PlayerPos，busy 防并发）
  lbAllianceMapTrackStop(); // v559：修正调用名（原 LB._alliMapTrackStop 未定义抛错 → 轮询未启动）
  var eosById = {};
  members.forEach(function(m){ eosById[String(m.pid)] = m.eosId || lbPidToEos(m.pid); });
  LB._alliMapTrack = { abbr:abbr, token:token, eosById:eosById, results:results, busy:false, timer:null, pages:(LB._alliLastPageMeta||null) };

// v558：成员分布 1s 实时轮询——并行查所有在线成员位置（各所在服 1 次），更新点元素 left/top
// v565：只刷当前可见页成员（翻到哪页刷哪页），其余页不查询；关闭时 lbAllianceClose → lbAllianceMapTrackStop 清 timer 绝对停止
function lbAllianceMapTick(){
  var t = LB._alliMapTrack;
  if(!t || t.busy) return;
  t.busy = true;
  var curPids = null;
  if(t.pages && t.pages.length){
    var _s = document.getElementById('lbWildDistScroll');
    if(_s){
      var _idx = Math.round(_s.scrollLeft / _s.clientWidth);
      if(_idx < 0) _idx = 0;
      if(_idx >= t.pages.length) _idx = t.pages.length - 1;
      var _pg = t.pages[_idx];
      if(_pg && _pg.pids){ curPids = {}; _pg.pids.forEach(function(pid){ curPids[pid]=1; }); }
    }
  }
  var tasks = [];
  (t.results||[]).forEach(function(r){
    if(!r.pos) return;
    var eos = t.eosById[String(r.pid)];
    if(!eos) return;
    if(curPids && !curPids[String(r.pid)]) return; // v565：只刷当前页成员
    tasks.push(lbQueryPlayerPos(r.pos.server, t.token, eos).then(function(pos){
      var dot = document.getElementById('lbAlliDot_'+r.pid);
      if(!pos){
        // v568：下线/传图 → 标记置灰 + 名字标签标 ⏻（恢复后自动还原）
        if(dot){
          dot.style.opacity = '0.3';
          dot.style.filter = 'grayscale(1)';
          var _nt = dot.querySelector('.lb-alli-ntag');
          if(_nt && _nt.getAttribute('data-off')!=='1'){ _nt.setAttribute('data-off','1'); _nt.textContent = _nt.textContent.replace(/\s*⏻\s*$/,'') + ' ⏻'; }
        }
        return;
      }
      if(dot){
        dot.style.opacity = '';
        dot.style.filter = '';
        var _nt2 = dot.querySelector('.lb-alli-ntag');
        if(_nt2){ _nt2.removeAttribute('data-off'); _nt2.textContent = _nt2.textContent.replace(/\s*⏻\s*$/,''); }
      }
      var map = lbMapForServer(pos.server, pos.z);
      if(!map) return;
      var p = lbWorldToPx(Number(pos.x), Number(pos.y), map);
      dot.style.left = p.x.toFixed(2)+'%';
      dot.style.top = p.y.toFixed(2)+'%';
    }).catch(function(){}));
  });
  Promise.all(tasks).then(function(){ t.busy = false; });
}

function lbFindMemberEos(pid){

  if(data && data.tribesByServer){
    Object.keys(data.tribesByServer).forEach(function(abbr){

  return lbPidToEos(pid);

/* ---------- F 颜色繁育：逐部位选色（按物种记忆） ---------- */
function lbRouteColorHtml(recs){

  var regionSets = [];

      }).join('');

        function sw(id, isHalf){

        }

        return '<div style="margin-top:'+(pi?4:0)+'px;font-size:11px;color:#ddd;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'+tagH+lbRouteNameLink(p.m,'')+' × '+lbRouteNameLink(p.f,'')+' '+txt+swHtml+'</div>';
      }).join('');

      match = '<div id="lbColorMatch" style="font-size:11px;color:#ddd;margin-top:4px">'+pmHtml+'</div>' + repNote + warn;
    } else {

    }
  }
  var col = '#fbbf24';
  return '<div style="margin-top:5px;background:#17171f66;border:1px solid '+col+'55;border-radius:8px;padding:8px 10px">'
    + '<div style="font-size:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
    + '<span style="color:'+col+';border:1px solid '+col+'88;background:'+col+'18;border-radius:6px;padding:0 5px;font-weight:bold;font-size:10px">可选</span>'

    + '<div style="margin-top:4px">'+rows+'</div>' + match
    + '</div>';

  ];
