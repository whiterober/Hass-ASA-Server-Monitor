<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>孤岛地图锚点预览</title>
<style>
body{background:#111;color:#ccc;font-family:sans-serif;padding:16px}
h2{font-size:15px;color:#fff}
.mapbox{position:relative;width:640px;height:640px;border:1px solid #444;background:#000;cursor:crosshair}
.mapbox img{position:absolute;left:0;top:0;width:640px;height:640px}
.dot{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 8px #000}
.lab{position:absolute;transform:translate(-50%,16px);font-size:12px;color:#fff;text-shadow:0 0 4px #000;white-space:nowrap}
.tip{font-size:13px;color:#ffd;line-height:1.7;max-width:640px}
.cursor-mark{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0ff;background:rgba(0,255,255,.25);pointer-events:none}
.cursor-lab{position:absolute;transform:translate(-50%,-26px);font-size:12px;color:#0ff;text-shadow:0 0 4px #000;white-space:nowrap;pointer-events:none}
</style></head>
<body>
<h2>孤岛 isl_s.jpg 方尖碑锚点（已校准）</h2>
<div class="mapbox" id="mapbox">
  <img src="file:///b:/项目/Hass%20ASA%20Server%20Monitor/tmp/_isl_test2.jpg">
  <div class="dot" style="left:11.8%;top:85.1%;background:#f87171"></div>
  <div class="lab" style="left:11.8%;top:85.1%">红方尖碑(校准 11.8%,85.1%)</div>
  <div class="dot" style="left:76.0%;top:60.6%;background:#4ade80"></div>
  <div class="lab" style="left:76.0%;top:60.6%">绿方尖碑(校准 76.0%,60.6%)</div>
  <div class="dot" style="left:21.4%;top:21.4%;background:#60a5fa"></div>
  <div class="lab" style="left:21.4%;top:21.4%">蓝方尖碑(校准 21.4%,21.4%)</div>
  <div class="cursor-mark" id="cm" style="display:none"></div>
  <div class="cursor-lab" id="cl" style="display:none"></div>
</div>
<p class="tip" id="out">✅ 已按实测图片范围（lon 7.33~92.79 / lat 7.17~92.50）校准。
三座方尖碑标注：红(11.8%,85.1%)、绿(76.0%,60.6%)、蓝(21.4%,21.4%)——应与图上实际位置重合。</p>
<script>
var box=document.getElementById('mapbox');
var cm=document.getElementById('cm');var cl=document.getElementById('cl');var out=document.getElementById('out');
var log=[];
box.addEventListener('click',function(e){
  var r=box.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  cm.style.display='block';cm.style.left=x+'%';cm.style.top=y+'%';
  cl.style.display='block';cl.style.left=x+'%';cl.style.top=y+'%';
  cl.textContent='点击: '+x.toFixed(1)+'%, '+y.toFixed(1)+'%';
  log.push(x.toFixed(1)+'% , '+y.toFixed(1)+'%');
  out.innerHTML='已点击 '+log.length+' 次：<br>'+log.map(function(s,i){return (i+1)+'. '+s;}).join('<br>')+'<br>请把上面数字发给我。';
});
</script>
</body></html>
