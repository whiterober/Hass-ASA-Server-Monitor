<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>创世海洋图新参数打点</title>
<style>
body{background:#111;color:#ccc;font-family:sans-serif;padding:16px}
h2{font-size:15px;color:#fff}
.mapbox{position:relative;width:640px;height:640px;border:1px solid #444;background:#000;cursor:crosshair}
.mapbox img{position:absolute;left:0;top:0;width:640px;height:640px}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 0 8px #000}
.lab{position:absolute;transform:translate(-50%,16px);font-size:11px;color:#fff;text-shadow:0 0 4px #000;white-space:nowrap}
.tip{font-size:13px;color:#ffd;line-height:1.7;max-width:640px}
.cursor-mark{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0ff;background:rgba(0,255,255,.25);pointer-events:none}
.cursor-lab{position:absolute;transform:translate(-50%,-26px);font-size:12px;color:#0ff;text-shadow:0 0 4px #000;white-space:nowrap;pointer-events:none}
</style></head>
<body>
<h2>创世海洋图 gen_ocean_s.jpg 新参数打点（multLat26145/46.10, multLon17962/49.97）</h2>
<div class="mapbox" id="mapbox">
  <img src="file:///b:/项目/Hass%20ASA%20Server%20Monitor/tmp/_gen_ocean_s.jpg">
  <div class="dot" style="left:49.0%;top:43.0%;background:#f87171"></div>
  <div class="lab" style="left:49.0%;top:43.0%">海潮厅主宅(49.0,43.0)</div>
  <div class="dot" style="left:6.2%;top:51.8%;background:#fb923c"></div>
  <div class="lab" style="left:6.2%;top:51.8%">炮艇(6.2,51.8)</div>
  <div class="dot" style="left:49.6%;top:42.3%;background:#60a5fa"></div>
  <div class="lab" style="left:49.6%;top:42.3%">莫德尔(49.6,42.3)</div>
  <div class="dot" style="left:9.0%;top:39.1%;background:#4ade80"></div>
  <div class="lab" style="left:9.0%;top:39.1%">任务(9.0,39.1)</div>
  <div class="dot" style="left:17.5%;top:48.0%;background:#4ade80"></div>
  <div class="lab" style="left:17.5%;top:48.0%">任务(17.5,48.0)</div>
  <div class="dot" style="left:91.6%;top:30.4%;background:#4ade80"></div>
  <div class="lab" style="left:91.6%;top:30.4%">任务(91.6,30.4)</div>
  <div class="dot" style="left:13.8%;top:17.5%;background:#4ade80"></div>
  <div class="lab" style="left:13.8%;top:17.5%">任务(13.8,17.5)</div>
  <div class="dot" style="left:49.8%;top:53.2%;background:#4ade80"></div>
  <div class="lab" style="left:49.8%;top:53.2%">任务(49.8,53.2)</div>
  <div class="dot" style="left:47.9%;top:50.4%;background:#4ade80"></div>
  <div class="lab" style="left:47.9%;top:50.4%">任务(47.9,50.4)</div>
  <div class="cursor-mark" id="cm" style="display:none"></div>
  <div class="cursor-lab" id="cl" style="display:none"></div>
</div>
<p class="tip" id="out">🟥 红点=海潮厅主宅(板板基地) 🟧=炮艇 🔵=莫德尔 🟩=海洋任务点（均用新参数映射存档坐标）。<br>
请核对：板板基地红点是否对准海图实际位置？其余点是否合理分布？</p>
<script>
var box=document.getElementById('mapbox');
var cm=document.getElementById('cm');var cl=document.getElementById('cl');var out=document.getElementById('out');
var log=[];
box.addEventListener('click',function(e){
  var r=box.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
  cm.style.display='block';cm.style.left=x+'%';cm.style.top=y+'%';
  cl.style.display='block';cl.style.left=x+'%';cl.style.top=y+'%';
  cl.textContent='点击: '+x.toFixed(1)+'%, '+y.toFixed(1)+'%';
  log.push(x.toFixed(1)+'% , '+y.toFixed(1)+'%');
  out.innerHTML='已点击 '+log.length+' 次：<br>'+log.map(function(s,i){return (i+1)+'. '+s;}).join('<br>');
});
</script>
</body></html>
