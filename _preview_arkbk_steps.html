<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安全回档 · 步骤自动拼接（规则驱动）</title>
<style>
:root{--bg:#0f0f16;--panel:#16161f;--panel2:#1a1a24;--line:#2a2a3a;--tx:#e5e5ee;--dim:#8b8b9e;--pu:#7c3aed;--pu2:#c4b5fd;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:18px 20px 90px}
h1{font-size:16px;font-weight:700}
h2{font-size:12.5px;font-weight:700;color:var(--pu2);margin-bottom:10px}
.sub{color:var(--dim);font-size:11.5px;margin-top:4px}
header{border-bottom:1px solid var(--line);padding-bottom:14px}
.tbar{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button{background:transparent;border:1px solid var(--line);color:var(--dim);font:inherit;font-size:11.5px;padding:5px 11px;border-radius:7px;cursor:pointer;transition:.12s}
button:hover{background:rgba(124,58,237,.16);color:var(--pu2);border-color:var(--pu)}
button.pri{background:rgba(124,58,237,.2);border-color:var(--pu);color:var(--pu2);font-weight:600}
.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.facts{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.fnote{font-size:9.5px;color:#6b7280;margin-top:2px}
.sinp{background:#0d0d14;border:1px solid #2a2a3a;border-radius:6px;color:var(--tx);font:inherit;font-size:11px;padding:2px 7px;width:74px}
.sinp:focus{border-color:var(--pu);outline:none}
.sarw{color:#6b7280;font-size:11px;margin:0 3px}
.fgroup{margin-bottom:13px}
.fl{font-size:11px;font-weight:700;color:var(--dim);margin-bottom:6px}
.fo{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:5px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);font-size:11.5px;cursor:pointer;user-select:none;transition:.12s}
.opt:hover{border-color:var(--pu);color:var(--pu2)}
.opt.on{background:rgba(124,58,237,.22);border-color:var(--pu);color:var(--pu2);font-weight:700}
.opt.on.warn{background:rgba(251,191,36,.2);border-color:var(--warn);color:var(--warn)}
.opt.dis{opacity:.35;cursor:not-allowed}
.result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-height:120px}
.flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px}
.stp-wrap{display:inline-flex;flex-direction:column;align-items:flex-start;gap:4px;max-width:100%}
.stp{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;height:30px;overflow:hidden;border-radius:8px;font-size:11px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#d5dae6;max-width:100%;cursor:pointer}
.stp b{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;font-size:9.5px;background:var(--warn);color:#1a1a24;flex:none}
.stp.done b{background:var(--ok)}
.stp .tag{font-size:9.5px;font-weight:700;padding:0 5px;border-radius:4px;background:rgba(124,58,237,.25);color:var(--pu2);flex:none}
.stp.warn{border-color:#ef4444}
.stp.warn b{background:#ef4444}
.alt-toggle{font-size:9.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--pu);background:rgba(124,58,237,.22);color:var(--pu2);cursor:pointer;user-select:none;white-space:nowrap;flex:none}
.alt-toggle:hover{background:rgba(124,58,237,.34)}
.alt-txt{display:inline-flex;align-items:stretch;gap:0;height:30px;margin:-5px 0;padding:0 2px;color:#c4b5fd;overflow:hidden}
.alt-txt i{font-style:normal;font-size:10px;padding:0;background:none;border:0;color:#e3e9f7;white-space:normal;word-break:break-word;line-height:1.15;display:flex;align-items:center;justify-content:flex-start;text-align:left;flex:0 1 auto;max-width:32px;overflow:hidden}
.alt-sep{display:inline-flex;align-items:center;flex:none;color:#7c8496;padding:0 4px}
.alt-sep svg{width:5px;height:8px;display:block}
.alt-br{color:#8b8ba3;padding:0 3px;font-size:10px}
.tip-alt{display:block;margin-top:6px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.09)}
.tip-alt-lbl{display:block;font-size:10px;color:#8b8ba3;margin-bottom:3px}
.tip-alt .alt-txt{display:flex;align-items:center;flex-wrap:wrap;row-gap:4px;height:auto;margin:0;padding:0;overflow:visible}
.tip-alt .alt-txt i{max-width:none;white-space:nowrap;overflow:visible}
.stp-tip{display:none;font-size:11px;font-weight:400;color:#a9a9bd;background:#12121a;border:1px dashed var(--line);border-radius:7px;padding:7px 10px;max-width:360px;line-height:1.78;white-space:pre-line}
.stp-tip .tip-act{color:#d7dbe6}
.stp-tip .tip-key{color:#c4b5fd}
.stp-tip .tip-warn{color:#f87171}
.stp-wrap.open .stp-tip{display:block}
.stp-wrap.open .stp{border-color:var(--pu)}
.stp .txt{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.stp .ico-srv{display:inline-flex;align-items:center;flex:none;color:#c4b5fd}
.stp .ico-srv svg{display:block;width:14px;height:14px;fill:currentColor}
.stp img.ico-ark{display:block;width:14px;height:14px;object-fit:contain;border-radius:3px;flex:none}
.arw{color:var(--dim);flex:none;margin-top:4px}
.arbk-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.arbk-chip{display:inline-flex;align-items:center;gap:4px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;padding:3px 7px;font-size:12px}
.arbk-ico{position:relative;display:inline-flex;flex:none;width:16px;height:16px;align-items:center;justify-content:center}
.arbk-ico img{display:block;width:16px;height:16px;object-fit:contain;border-radius:4px}
.arbk-ico svg{display:none;width:14px;height:14px;fill:currentColor}
.arbk-ico.ico-miss img{display:none}
.arbk-ico.ico-miss svg{display:block}
.chip-note{font-size:10px;color:#5b5b6e;margin-top:5px;max-width:340px;line-height:1.5}
.aff-wrap{margin-top:8px;max-width:360px}
.aff-h{font-size:10.5px;color:#fbbf24;font-weight:700;margin-bottom:5px}
.aff-row{display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap}
.aff-chip{display:inline-flex;align-items:baseline;gap:5px;background:#1a1a24;border:1px solid #2a2a3a;border-radius:8px;padding:2px 8px;font-size:11.5px;color:#cbd5e1}
.aff-chip em{font-style:normal;font-size:10px;color:#64748b}
.aff-t{font-size:10.5px;color:#94a3b8}
.aff-on{font-size:9.5px;padding:1px 6px;border-radius:4px;background:rgba(74,222,128,.16);border:1px solid rgba(74,222,128,.5);color:#4ade80}
.rules{margin-top:26px}
table{width:100%;border-collapse:collapse;font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;vertical-align:top;text-align:left}
th{background:var(--panel2);color:var(--dim);font-weight:600;font-size:10.5px;white-space:nowrap}
td:last-child,th:last-child{border-right:0}
tr:last-child td{border-bottom:0}
td.rid{color:var(--pu2);font-weight:700;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
td.when{color:#94a3b8;font-size:10.5px}
tr.on td{background:rgba(124,58,237,.09)}
textarea{width:100%;height:260px;margin-top:10px;background:#0d0d14;border:1px solid var(--line);border-radius:8px;color:#c9c9d6;font:11.5px/1.6 ui-monospace,Consolas,monospace;padding:10px;resize:vertical}
.hint{color:var(--dim);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>安全回档 · 步骤自动拼接（规则驱动）</h1>
  <div class="sub">已去掉「情况」层：左边改<b>事实</b> → 右边按规则表自动拼出步骤。规则表在底部，是唯一逻辑真相源。</div>
  <div class="tbar">
    <button onclick="EXP.tipAll(true)">展开全部说明</button>
    <button onclick="EXP.tipAll(false)">收起全部说明</button>
    <button onclick="EXP.reset()">恢复默认事实</button>
    <button class="pri" onclick="EXP.export()">导出结论</button>
  </div>
</header>
<div class="wrap">
  <section class="facts">
    <h2>① 事实（改这里）</h2>
    <div class="fgroup">
      <div class="fl">服务器 / 角色</div>
      <div class="fo" id="fSrv"></div>
    </div>
    <div class="fgroup">
      <div class="fl">角色位置</div>
      <div class="fo" id="fPos"></div>
    </div>
    <div class="fgroup">
      <div class="fl">其他玩家此刻在线人数</div>
      <div class="fnote">不含选中角色本身</div>
      <div class="fo" id="fOnline"></div>
    </div>
    <div class="fgroup">
      <div class="fl">其他玩家进出记录</div>
      <div class="fnote">不含选中角色本身</div>
      <div class="fo" id="fMove"></div>
    </div>
    <div class="fgroup">
      <div class="fl">会丢失物品</div>
      <div class="fo" id="fLoss"></div>
    </div>
    <div class="fgroup" style="margin-bottom:0">
      <div class="fl">回档目的（可多选 · 至少一个）</div>
      <div class="fo" id="fGoals"></div>
    </div>
  </section>
  <section class="result">
    <h2>② 自动拼接出的步骤（<span id="nStep">0</span> 步）</h2>
    <div class="flow" id="flow"></div>
    <div class="hint" id="flowNote" style="margin-top:10px"></div>
  </section>
</div>
<section class="rules">
  <h2>③ 规则表（唯一逻辑真相源 · 高亮行 = 本次命中）</h2>
  <table id="ruleTable"></table>
  <div class="hint" style="margin-top:8px">加一步 = 表里加一行；改条件 = 改该行 <code>when</code>。渲染、矩阵、导出全部调用同一个 <code>arkbkBuildSteps()</code>。</div>
</section>
<section id="outWrap" style="margin-top:22px">
  <h2>④ 导出结论</h2>
  <button onclick="EXP.copy()">复制全文</button>
  <textarea id="out" readonly placeholder="点右上「导出结论」生成…"></textarea>
</section>
<script>
/* ================= 示例数据（线上由真实接口填充） ================= */
/* 图标一律走项目压好的 webp 缩略图（tmp/webp_map.json，96px 足够） */
var ICO_WEBP = 'https://dino.whiterober.ccwu.cc/thumbs/webp96/';
var SAMPLE_BAG = [
  { name: '铁锭', qty: 1200, groups: 3, icon: ICO_WEBP + '5d18d1d2dee1_w96.webp' },
  { name: '水泥', qty: 400, groups: 1, icon: ICO_WEBP + 'c1ee6f81a9b4_w96.webp' },
  { name: '聚合物', qty: 260, groups: 2, icon: ICO_WEBP + '9f82f5e176d6_w96.webp' },
  { name: '火箭燃料', qty: 90, groups: 1, icon: ICO_WEBP + '9f4829f3c625_w96.webp' }
];
var SAMPLE_CRYO = [
  { name: '霸王龙', lv: 295, g: '♂', icon: ICO_WEBP + '684bd214651e_w96.webp' },
  { name: '南方巨兽龙', lv: 240, g: '♀', icon: ICO_WEBP + 'cd20cce31daa_w96.webp' },
  { name: '狮鹫', lv: 180, g: '♂', baby: true, icon: ICO_WEBP + '78a84df6e02e_w96.webp' }
];
var SAMPLE_AFFECTED = [
  { role: '嘎巴丸', acc: '嘎巴菜', from: '11-10 20:29', to: '11-11 07:32', dur: '11 小时 3 分', online: false },
  { role: '人类', acc: 'whiter.rober', from: '11-10 22:00', to: '至今', dur: '进行中', online: true }
];
/* ================= 规则层：唯一逻辑真相源 ================= */
/* ================= v33 重构：就位状态机（3 条不变量） =================
   I1 数据唯一：回档 = 整档替换世界 ⇒ 执行回档那一刻，角色数据源必须唯一
        · curOnly（目标档没他）  → 回档前必须传图离开，否则他那份数据被覆盖掉
        · tgtOnly（目标档有他、人却在别的服）→ 回档前必须传图来，否则旧数据 + 本人 = 角色重复
   I2 在场：任何「要角色在场」的动作（上传 / 取回）之前，角色必须在 {cur}
   I3 静止：回档、撤销都只换世界档，不移动角色；只有「传图」改变位置
   ⇒ 就位只由 pos 决定，与「是否撤销」无关（旧版把 canUndo 混进就位条件是根因）
*/
function arkbkNeedRole(f) { return !!(f.goals.dino || (f.goals.items && arkbkCanUndo(f))); }  /* 是否有必须角色在场才能做的动作 */
/* 回档前必须先离开 {cur}：他在当前档，但目标档里没有他 */
function arkbkLeaveBefore(f) { return f.pos === 'curOnly'; }
/* 需要一次「传图来{cur}」：除了「两档都有」（他本来就在），
   以及「两档都没他且不需要他做事」以外，都要把他弄进 {cur} */
function arkbkEnterWhen(f) { return f.pos !== 'both' && (f.pos !== 'none' || arkbkNeedRole(f)); }
/* 时机：tgtOnly 必须回档前（否则目标档旧数据 + 本人 = 角色重复）；其余回档后 */
function arkbkEnterOrder(f) { return f.pos === 'tgtOnly' ? 25 : 45; }
/* 撤销前也必须离开：撤销 = 整档换成「回档前」那份，而那份档里没有他
   （curOnly 他回档前已被传图离开；tgtOnly 他本来只在目标档；none 两档都没他）
   ⇒ 只要撤销时他在服里，就会被抹掉 */
function arkbkUndoLeaves(f) {
  /* 备选（低温仓 / 传图寄存）已经把人带去别的服并在线：撤销只换本服存档，
     不影响在别服的他 ⇒ 既不用再「离开本服」，也不用「上线取回」 */
  if (arkbkAltLeaves(f)) return false;
  return arkbkCanUndo(f) && f.pos !== 'both' && (f.pos === 'tgtOnly' || arkbkNeedRole(f));
}
/* 备选方案（低温仓 / 传图寄存）会把角色带去别的服 ⇒ 需要额外一次「传图来」（同一动作，只是多一次）
   守卫：该备选对应的步骤必须真的在链上，避免 ALTOPEN 残留开关误触发 */
function arkbkAltLeaves(f) {
  var liveDino = !!f.goals.dino;
  var liveItems = (f.pos === 'both' && !!f.lossN && !arkbkCanUndo(f));
  var liveItemsGoal = (!!f.goals.items && arkbkCanUndo(f));
  return !!((ALTOPEN['upDino'] && liveDino) || (ALTOPEN['upItems'] && liveItems) || (ALTOPEN['upItemsGoal'] && liveItemsGoal));
}
function arkbkCanUndo(f) {
  var affected = !!(f.onlineN || f.moveN);
  var keepResult = !!(f.goals.build || f.goals.tame);
  return affected && !keepResult;
}
/* ---- 「传图来{cur}」这个动作的唯一定义（多处复用，禁止再另写一份文案） ---- */
var ARKBK_DEF_ENTER = {
  tag: '就位',
  text: '传图来{cur}',
  tip: '角色要进{cur}：目标档有他 → 回档前传；没他 → 回档后传。\n<span class="tip-act">→ 备选带走的，用他时再传。</span>'
};
/* 用同一份定义生成一条就位规则：id + 触发条件 + 位置(order / orderIf) + 可选补充字段 */
function arkbkEnterRule(id, whenFn, extra) {
  var o = { id: id, when: whenFn };
  for (var k in ARKBK_DEF_ENTER) o[k] = ARKBK_DEF_ENTER[k];
  for (var k2 in extra) o[k2] = extra[k2];
  return o;
}
var ARKBK_RULES = [
  { id: 'notify', order: 12, tag: '波及',
    when: function (f) { return !!f.onlineN; },
    whenText: '此刻有其他玩家在线（不含选中角色；回档瞬间世界跳变，会掉线 / 死亡 / 掉装备）',
    text: '请其他玩家下线',
    tip: '回档瞬间世界跳变，在线玩家<span class="tip-warn">会掉线 / 死亡 / 掉装备</span>。\n<span class="tip-act">→ 先让他们下线，或传图离开{cur}。</span>' },
  { id: 'ask', order: 10, tag: '波及',
    when: function (f) { return !!(f.onlineN || f.moveN) && !arkbkCanUndo(f); },
    whenText: '不撤销回档 且（其他玩家在线>0 或 其他玩家进出记录>0）',
    text: '征得波及玩家同意',
    warn: true,
    tip: '本次不能撤销，他们的进度<span class="tip-warn">会真的退回目标档</span>。\n<span class="tip-act">→ 先征得这些玩家同意。</span>', aff: true },
  arkbkEnterRule('roleEnter', null, {
    whenText: '上传必须在本服做：tgtOnly 回档前传过来；其余回档后传过来',
    slots: [
      { when: arkbkEnterWhen, orderIf: arkbkEnterOrder }    /* 只需这一次：为了在本服上传 */
    ]
  }),
  { id: 'roleOnline', order: 82, tag: '就位',
    when: function (f) { return arkbkUndoLeaves(f); },
    whenText: '撤销前他为避抹除离开了本服（人在集群里），取回前得登入任意一个服',
    text: '上线取回',
    tip: '<span class="tip-key">方尖碑跨存档</span>，任意服都能取。\n<span class="tip-act">→ 登入任意服取出来，不必回{cur}。</span>' },
  { id: 'roleLeaveBefore', tag: '就位前',
    whenText: '换档会整档覆盖服存档，而角色数据挂在服存档上：回档（目标档没他）/ 撤销（回档前档没他）前都必须先离开',
    slots: [
      { when: arkbkLeaveBefore, order: 25, altStops: true,
        text: '传图离开{cur}',
        altShort: '改用含此角色的回档点',
        altTip: '目标档里没有这个角色。\n<span class="tip-act">→ 换成含他的回档点，等于整套流程重走。</span>',
        altSteps: function (f) { return arkbkNeedRole(f) ? null : ['换含此角色的回档点（流程重走）']; },
        tip: '回档是<span class="tip-key">整档替换</span>，他的数据会被覆盖<span class="tip-warn">（等级/背包/恐龙全丢）</span>。\n<span class="tip-act">→ 先让他传图离开{cur}，回档后再传回。</span>' },
      { when: arkbkUndoLeaves, order: 65,
        text: '传图离开{cur}',
        tip: '撤销=换回「回档前」的存档，那份没他；他人正服里会被<span class="tip-warn">一起抹掉</span>。\n<span class="tip-act">→ 撤销前先传图离开{cur}。</span>' }
    ] },
  { id: 'upload', tag: '上传', verb: '上传',
    whenText: '要保住的东西会被回档带走：回档前有物品会丢 / 生物死了 / 拿回物品且会撤销',
    slots: [
      { altKey: 'upItems',
        when: function (f) { return f.pos === 'both' && !!f.lossN && !arkbkCanUndo(f); },
        order: 35, text: '上传物品', obj: '物品', chips: 'bag',
        altShort: '传图寄存到别服',
        altTip: '不用方尖碑。\n<span class="tip-act">→ 带物品传图去别服放箱子，回档后取回。</span>',
        altSteps: ['带物品传图', '放别服箱'],
        tip: '回档会<span class="tip-warn">带走</span>这些物品。\n<span class="tip-act">→ 回档前把物品上传方尖碑（留 24 小时），回档后取回。</span>' },
      { altKey: 'upDino',
        when: function (f) { return !!f.goals.dino; },

function affHtml() {

function renderFlow() {
  var steps = arkbkBuildSteps(FACTS);
  var h = '';
  steps.forEach(function (s, i) {
    var alts = (typeof s.altSteps === 'function') ? s.altSteps(FACTS) : s.altSteps;
    var akey = s.altKey || s.id;                       /* 备选开关的稳定键；合并步骤为多键用 | 连接 */
    var akeys = String(akey).split('|');
    var isAlt = !!(alts && alts.length && akeys.every(function (k) { return !!ALTOPEN[k]; }));
    var cls = 'stp' + (s.done ? ' done' : '') + (s.warn ? ' warn' : '');
    /* 说明按当前方案二选一：主选只出主选 tip，备选只出备选 tip */
    var tipBase = isAlt ? (s.altTip || s.tip || '') : (s.tip || '');
    h += '<span class="stp-wrap' + (TIPALL ? ' open' : '') + '">';
    h += '<span class="' + cls + '" onclick="EXP.tip(event,this)">';
    h += '<b>' + s.n + '</b>';
    if (alts && alts.length) {
      h += '<span class="alt-toggle' + (isAlt ? ' on' : '') + '"'
        + ' title="当前：' + (isAlt ? '备选方案' : '主选方案') + '（点击切换）"'
        + ' onclick="EXP.alt(\'' + akey + '\',event)">'
        + (isAlt ? '备选' : '主选') + '</span>';
    }
    h += '<span class="txt">' + stpIcoText(isAlt ? (s.altShort || alts.join('、')) : s.text, FACTS) + '</span>';
    h += '</span>';
    var altBlock = '';
    if (alts && alts.length && isAlt) {   /* 备选步骤子链只在备选态出现 */
      altBlock = '<span class="tip-alt"><span class="tip-alt-lbl">备选步骤</span>'
        + '<span class="alt-txt">'
        + alts.map(function (t) { return (t === '__BR__') ? ARKBK_ALT_BR : ('<i>' + t + '</i>'); }).join(ARKBK_ALT_SEP)
        + '</span></span>';
    }
    h += '<span class="stp-tip">' + (tipBase || '（无详细说明）') + altBlock + (s.aff ? affHtml() : '') + chipsHtml(s.chips) + '</span>';
    h += '</span>';
  });

  document.getElementById('nStep').textContent = steps.length;
  var hit = {};
  steps.forEach(function (s) { hit[s.ruleId || s.id] = true; });
  var ids = steps.map(function (s) { return s.ruleId || s.id; }).join(' → ');
  var diag = '步骤链：' + (ids || '（空）');
  if (steps.arkbkStopped) diag += '\n⚠ 备选「改用含此角色的回档点」= 换档点整套流程重走，故到这一步为止（后续步骤作废）';
  if (!hit['undo']) {

    diag += '\n没有「撤销回档」：' + missReason(undoRule, FACTS);

  if (!hit['upload'] && FACTS.lossN) {
    var uiRule = ARKBK_RULES.filter(function (r) { return r.id === 'upload'; })[0];

}
function missReason(r, f) {
  if (r.id === 'undo') {
    var affected = !!(f.onlineN || f.moveN);
    if (!affected) return '需先有波及：把「其他玩家此刻在线人数」或「其他玩家进出记录」调成 ≥1';
    if (f.goals.build || f.goals.tame) return '已被回档目的锁定（建筑塌了 / 驯龙重训 不允许撤销）';
    return '需「' + r.whenText + '」';
  }
  if (r.id === 'roleOnline') {
    if (arkbkAltLeaves(f)) return '备选已把人带去别的服并在线，无需再上线';
    if (!arkbkCanUndo(f)) return '本次不撤销回档，无需为撤销先离开、也就不用再上线';
    if (f.pos === 'both') return '两档都有他，撤销不会抹掉他，无需离开';
    return '需「撤销前他必须在本服」的那种情况（tgtOnly / 需在本服上传）';
  }
  if (r.id === 'upload') {
    var why = [];
    if (!(f.pos === 'both' && !!f.lossN && !arkbkCanUndo(f))) why.push('「两档都有 + 有物品会丢 + 不撤销」不成立');
    if (!f.goals.dino) why.push('没勾「生物死了」');
    if (!(!!f.goals.items && arkbkCanUndo(f))) why.push('「拿回物品 + 会撤销」不成立');
    return '三个触发点都不满足：' + why.join('、');
  }
  if (r.id === 'roleEnter') {
    var why = [];
    if (f.pos === 'both') why.push('两档都有他，本来就在{cur}');
    if (f.pos === 'none' && !arkbkNeedRole(f)) why.push('两档都没他且不需要他做事');
    if (!arkbkAltLeaves(f)) why.push('未开备选，不会被带去别的服');
    if (why.length) return why.join('；') + ' ⇒ 无需传图';
    return '需「' + r.whenText + '」';
  }
  if (r.id === 'retrieve') {
    var upI = (f.pos === 'both' && !!f.lossN && !arkbkCanUndo(f));
    var upG = (!!f.goals.items && arkbkCanUndo(f));
    if (!upI && !upG && !f.goals.dino) return '本次没有东西被上传（物品需「两档都有+有物品会丢+不撤销」或「拿回物品+会撤销」；生物需勾「生物死了」）';
    return '需「' + r.whenText + '」';
  }
  if (r.id === 'roleLeaveBefore') {
    var why = [];
    if (!arkbkLeaveBefore(f)) why.push('回档前：不是「只在当前档」');
    if (!arkbkUndoLeaves(f)) why.push('撤销前：无撤销 / 两档都有他 / 他不在服里');
    return '两个触发点都不满足（' + why.join('；') + '）';
  }
  if (r.id === 'notify') {
    if (!f.onlineN) return '此刻没有其他玩家在线（只有进出记录，不需要请人下线）';
    return '需「' + r.whenText + '」';
  }
  if (r.id === 'ask') {
    if (arkbkCanUndo(f)) return '本次会撤销回档，影响自动还原，无需征求同意';
    return '需先有波及（其他玩家在线 ≥1 或 其他玩家进出 ≥1）';
  }
  return '需「' + r.whenText + '」';
}
function renderRuleTable(steps) {
  var cnt = {};
  (steps || []).forEach(function (s) { var k = s.ruleId || s.id; cnt[k] = (cnt[k] || 0) + 1; });
  /* 终止型备选把链条截断后，后面那些规则不是"条件不满足"，而是"已作废" */

  var h = '<tr><th>#</th><th>规则</th><th>触发条件</th><th>步骤文案</th><th>标签</th><th>本次</th></tr>';

    var n = cnt[r.id] || 0;
    h += '<tr' + (n ? ' class="on"' : '') + '>'
      + '<td>' + arkbkOrdList(r, FACTS) + '</td>'
      + '<td class="rid">' + r.id + '</td>'
      + '<td class="when">' + r.whenText + '</td>'
      + '<td>' + arkbkTextList(r) + '</td>'
      + '<td>' + (r.tag ? '<span style="color:#fbbf24">' + r.tag + '</span>' : '—') + '</td>'
      + '<td>' + (n ? '<span style="color:#4ade80;font-weight:700">命中' + (n > 1 ? ' ×' + n : '') + '</span>'
        : (truncAt != null && arkbkOrdMin(r, FACTS) > truncAt
            ? '<span style="color:#fbbf24">已截断</span><br><span style="color:#7c7c90;font-size:10px">前序备选=换档点流程重走，此步作废</span>'
            : '<span style="color:#6b7280">未命中</span><br><span style="color:#7c7c90;font-size:10px">'
              + missReason(r, FACTS) + '</span>')) + '</td></tr>';
  });

function renderFacts() {
  document.getElementById('fSrv').innerHTML =
    '<input class="sinp" value="' + escAttr(FACTS.curSrvCn) + '" oninput="EXP.txt(\'curSrvCn\',this.value)" placeholder="当前服" title="当前服务器地图名">'

  }).join('')
    + (lossOK ? '' : '<div style="color:#7c7c90;font-size:10px;margin-top:5px">仅「两档都有」时才谈得上物品丢失（单边无法对比背包差异）</div>');
  var G = [['items', '拿回物品'], ['tame', '驯龙重训'], ['dino', '生物死了'], ['build', '建筑塌了']];
  document.getElementById('fGoals').innerHTML = G.map(function (g) {
    var on = !!FACTS.goals[g[0]];

    + (GOALBLOCK ? '<div style="color:#f87171;font-size:10.5px;margin-top:6px">至少选一个目的（不能全部取消）</div>' : '');
}
var EXP = {
  set: function (k, v) {
    FACTS[k] = v;
    if (k === 'pos' && v !== 'both') FACTS.lossN = 0;   /* 单边位置没有可比对的背包差异 */
    renderAll();
  },
  txt: function (k, v) { FACTS[k] = String(v == null ? '' : v); renderFlow(); },
  goal: function (id) {
    var sel = Object.keys(FACTS.goals).filter(function (k) { return FACTS.goals[k]; });
    if (FACTS.goals[id]) {
      if (sel.length <= 1) { GOALBLOCK = true; renderAll(); return; }
      delete FACTS.goals[id];

  reset: function () { FACTS = JSON.parse(JSON.stringify(DEFAULT_FACTS)); ALTOPEN = {}; renderAll(); },
  alt: function (id, e) {   /* id 可为 a|b|c 组键：整组一起切换 */
    if (e) { e.stopPropagation(); e.preventDefault(); }

     · 其它情况（含「展开全部」之后点某步）→ 只保留被点的那一项 */
  tip: function (e, el) {
    if (e) { e.stopPropagation(); e.preventDefault(); }
    var w = el.parentNode;
    var wasOpen = w.classList.contains('open');
    var openCnt = document.querySelectorAll('.stp-wrap.open').length;
    Array.prototype.forEach.call(document.querySelectorAll('.stp-wrap.open'), function (o) {
      o.classList.remove('open');
    });
    if (!wasOpen || openCnt > 1) w.classList.add('open');
    TIPALL = false;
  },
  tipAll: function (on) {
    TIPALL = on;
    Array.prototype.forEach.call(document.querySelectorAll('.stp-wrap'), function (w) {
      if (on) w.classList.add('open'); else w.classList.remove('open');
    });
  },
  export: function () {
    var steps = arkbkBuildSteps(FACTS);
    var L = ['安全回档 · 步骤裁决单（规则驱动）', '生成时间: ' + new Date().toLocaleString(), ''];
    L.push('【事实】');
    L.push('  角色位置: ' + FACTS.pos + ' · 其他玩家在线: ' + FACTS.onlineN + ' · 其他玩家进出: ' + FACTS.moveN
      + ' · 会丢物品: ' + (FACTS.lossN ? '有' : '无'));
    var gs = Object.keys(FACTS.goals).filter(function (k) { return FACTS.goals[k]; });
    L.push('  目的: ' + gs.join(' / '));
    L.push('');
    L.push('【自动拼出的步骤 ' + steps.length + ' 步】');
    steps.forEach(function (s) {
      L.push('  ' + s.n + '. (' + s.id + ') ' + s.text);
    });
    document.getElementById('outWrap').hidden = false;
    document.getElementById('out').value = L.join('\n');
    document.getElementById('outWrap').scrollIntoView({ behavior: 'smooth' });
  },
  copy: function () {
    var t = document.getElementById('out');
    t.removeAttribute('readonly'); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    t.setAttribute('readonly', 'readonly');
  }
};
function renderAll() { renderFacts(); renderFlow(); }
renderAll();
